    ['Manija sin juego','Vuelve sola. Sin juego flojo.'],
    ['Golpeador alineado','Pestillo entra centrado.'],
    ['Placas al ras','Frente y golpeador al ras de la madera.']
  ]
},
{ n:16, cat:"MURO", titulo:"Pintar barandales de herrería",
  kw:"barandal herreria fierro metal esmalte lija oxido raspado brochas tiner thinner exterior",
  generalidades:"Van a pintar un barandal de fierro o herrería (escalera, balcón, ventana). El paso más importante es la preparación: si no se lija bien el óxido y la pintura vieja, la mano nueva se descarapela en pocos meses. Se raspa, se lija, se aplica esmalte y al terminar las brochas SE DEJAN EN TINER — no se lavan con agua porque el esmalte no sale con agua, y si las dejan secar se echan a perder. El resultado es un barandal parejo, sin escurrimientos y sin manchas de pintura en el piso ni en las paredes.",
  tiempo:[["Barandal chico (< 3 m lineales)","1 día (2 manos con secado)"],["Barandal mediano (3–8 m)","1.5 – 2 días"],["Secado entre manos","3 – 4 h"]],
  mat:[["Esmalte anticorrosivo (color a definir)","Litro","1-2"],["Tiner o aguarrás","Litro","0.5"],["Lija grano 80 (raspar óxido)","Pliego","3"],["Lija grano 120 (afinar)","Pliego","2"],["Estopa o trapo","Pieza","4"],["Cartón o periódico (proteger piso)","Pliego","varios"],["Masking tape (bordes)","Rollo","1"]],
  herr:["Cepillo de alambre","Espátula rígida","Taco de lijar","Brocha 2\" (barrotes)","Brocha 3\" (superficies planas)","Bote pequeño para vaciar tiner","Escalera (si aplica)"],
  epp:["Guantes de nitrilo","Lentes de seguridad","Cubrebocas N95","Ropa vieja / overol","Calzado cerrado"],
  fases:[
    {f:"Preparación del área",pasos:["Cubrir el piso debajo del barandal con cartón o periódico, sobrepasando 50 cm a los lados.","Masking tape en muros o pisos que colinden con el barandal para no manchar.","Sacar todo lo que esté cerca (macetas, muebles) o cubrirlo."]},
    {f:"Raspado y lijado",pasos:["Con la espátula rígida y el cepillo de alambre: raspar toda la pintura suelta, escamas y óxido visible. No dejar nada que se pueda desprender con la uña.","Lijar todo el barandal con grano 80 hasta que el metal quede parejo. Prestar atención a esquinas y uniones donde acumula óxido.","Segunda pasada con grano 120 para afinar la superficie.","Limpiar el polvo del lijado con estopa seca. No usar agua."]},
    {f:"Aplicación del esmalte",pasos:["Vaciar el esmalte al bote pequeño (nunca meter la brocha directo a la lata grande).","Aplicar 1ª mano con brocha 2\" en los barrotes verticales, de arriba hacia abajo, en trazos largos.","Con brocha 3\" cubrir pasamanos y superficies planas.","No cargar mucha pintura en la brocha para evitar escurrimientos. Si escurre, pasar la brocha de inmediato para emparejar.","Dejar secar 3–4 h (o al tacto).","Aplicar 2ª mano igual que la primera. Verificar cobertura pareja sin zonas transparentes."]},
    {f:"Cierre y limpieza — MUY IMPORTANTE",pasos:["Retirar el masking tape mientras la pintura esté ligeramente húmeda (bordes limpios).","LAS BROCHAS: NO se lavan con agua. Vaciar tiner en un bote y meter las brochas hasta cubrir las cerdas. Dejarlas ahí — se limpian al día siguiente exprimiendo el tiner y secando con estopa.","Cerrar el bote de esmalte y el de tiner. Guardar en lugar ventilado, lejos del sol.","Recoger los cartones y periódicos manchados. Meterlos en bolsa negra y sacar la bolsa a la basura.","Barrer el área bajo el barandal. Si cayeron gotas de esmalte en el piso, limpiarlas con estopa mojada en tiner ANTES de que sequen.","Guardar la escalera, los botes, las brochas (en el tiner) y las herramientas en su lugar."]}
  ],
  crit:["El barandal queda con color uniforme, sin zonas transparentes ni escurrimientos.","Sin manchas de esmalte en piso, paredes ni macetas cercanas.","Las brochas quedan sumergidas en tiner, no tiradas ni con esmalte seco.","El área queda barrida y sin cartones ni bolsas.","La escalera, botes y herramientas guardados en su lugar."],
  eval:[
    ['Cobertura contraluz','Sin ver color anterior ni metal por debajo del pasamanos.'],
    ['Sin escurrimientos','Barrotes sin gotas colgadas.'],
    ['Piso limpio','Sin gotas de esmalte.'],
    ['Brochas EN TINER','CRÍTICO: sumergidas en tiner, no lavadas con agua. Tiesas = se echaron a perder.']
  ]
},
{ n:17, cat:"BODE", titulo:"Limpieza y mantenimiento de bodega",
  kw:"bodega almacen orden guardar cajas anaqueles humedad plaga inventario mantenimiento",
  generalidades:"Van a hacer la limpieza y el mantenimiento preventivo de una bodega — no es solo barrer, es dejar el espacio ordenado, sin humedad, sin plagas y con todo en su lugar para que la próxima vez que se necesite algo, se encuentre rápido. El orden es: sacar, barrer, revisar problemas (goteras, plagas, humedad), acomodar por categorías, y al final trapear. Si detectan humedad, plaga o daño en el techo, TIENEN QUE REPORTAR con foto antes de acomodar todo — no lo tapen.",
  tiempo:[["Bodega chica (< 10 m²)","2 – 3 h"],["Bodega mediana (10–25 m²)","4 – 6 h"],["Con reacomodo completo","1 día entero"]],
  mat:[["Multiusos desinfectante","Litro","1"],["Jabón / detergente","Cda","3-4"],["Bolsas de basura negras (grandes)","Pieza","5-8"],["Etiquetas o cinta masking","Rollo","1"],["Marcador permanente negro","Pieza","1"],["Trapos de microfibra o estopa","Pieza","4"],["Insecticida (si aplica, previa autorización)","Bote","1"]],
  herr:["Escoba de raíz","Recogedor","Trapeador","Cubeta 10 L","Escalera (para partes altas)","Franela para sacudir"],
  epp:["Guantes gruesos (cartón y cosas viejas cortan)","Cubrebocas (mucho polvo)","Lentes de seguridad","Ropa vieja / overol","Calzado cerrado"],
  fases:[
    {f:"Antes de empezar — reportar el estado",pasos:["Tomar fotos del estado inicial de la bodega (2–3 fotos generales) y mandarlas por WhatsApp antes de mover cosas.","Preguntar si hay algo en específico que NO se debe mover o tirar. Anotar."]},
    {f:"Sacar y clasificar",pasos:["Sacar todo lo que se pueda a un área despejada afuera de la bodega. Si es mucho, trabajar por zonas (mitad y mitad).","Ir separando en tres montones: (1) SE QUEDA — cosas útiles, (2) DUDA — reportar por foto antes de decidir, (3) BASURA — cosas rotas o inservibles.","NO tirar nada del montón DUDA sin autorización. Sacar foto y esperar respuesta."]},
    {f:"Barrer, revisar y desinfectar",pasos:["Barrer techo a piso: primero telarañas de las esquinas altas, después paredes, al final el piso.","Revisar TODO el techo y las paredes buscando manchas de humedad, goteras, rastros de plaga (excremento de rata, cucarachas, avispas). Si hay, foto y reportar.","Revisar el piso: si hay grietas grandes o mojado sin razón, reportar.","Barrer del fondo hacia la salida. Sacar basura en bolsas negras.","Sacudir anaqueles y repisas con franela. Si hay mucha mugre, limpiar con multiusos y trapo.","Si la instrucción incluye desinfectar contra plaga: aplicar insecticida siguiendo el bote (nunca sin permiso previo)."]},
    {f:"Acomodar y etiquetar",pasos:["Regresar las cosas SE QUEDA agrupadas por categoría: eléctrico junto, plomería junto, albañilería junta, pintura junta, limpieza junta.","Lo pesado abajo (cubetas de pintura, herramientas grandes) y lo ligero arriba (cajas de cartón, textiles).","Cosas frágiles: NO poner peso encima. Ponerlas arriba o en repisa aparte.","Etiqueta a cada zona con masking y marcador: 'ELÉCTRICO', 'PLOMERÍA', 'ALBAÑILERÍA', 'PINTURA', 'LIMPIEZA'.","No apilar contra pared si hay humedad — dejar 10 cm de separación."]},
    {f:"Trapear y cerrar",pasos:["Cubeta con agua + desinfectante. Trapear del fondo hacia la salida.","Segunda pasada con agua limpia si quedó residuo.","Dejar los trapos y franela LIMPIOS y colgados en el área de secado — no tirados ni mojados en el piso.","Vaciar cubeta y guardar escoba, trapeador, recogedor y cubeta en su lugar.","Cerrar bolsas de basura y sacarlas.","Tomar fotos finales (2–3) y mandarlas por WhatsApp.","Cerrar la bodega con llave si aplica y entregar la llave."]}
  ],
  crit:["El piso barrido y trapeado, sin polvo, mugre, ni humedad visible.","Todo agrupado por categoría y etiquetado.","Nada apilado contra pared con humedad.","Sin telarañas ni rastros de plaga visibles.","Herramientas de limpieza guardadas en su lugar.","Fotos de antes y después enviadas.","Cualquier problema (humedad, plaga, goteras) reportado con foto y NO tapado."],
  eval:[
    ['Categorías físicas','Cada material en su zona.'],
    ['Etiquetas visibles','Legibles desde 2 m.'],
    ['Sin apilar contra pared','10 cm de separación en zonas húmedas.'],
    ['Fotos antes/después','Deben llegar ambos juegos.'],
    ['Reporte de hallazgos','Humedad, plaga o daño reportados con foto, no tapados.']
  ]
},
{ n:18, cat:"AUTO", titulo:"Lavado express de auto (con encerado de llantas)",
  kw:"auto carro coche lavado express llantas encerar shampoo cajuela kit",
  generalidades:"Van a hacer el lavado EXPRESS de un auto — no es lavado detallado, es un lavado rápido pero completo: exterior enjabonado y enjuagado, llantas encerado con brillo, interior aspirado y superficies limpias, y la cajuela COMPLETAMENTE VACIADA excepto el kit de emergencia. El kit se queda: gato, llave de cruz, cables pasa-corriente, triángulo reflejante y llanta de refacción. Todo lo demás sale de la cajuela — bolsas, cajas, herramientas sueltas, ropa, basura. El objetivo es entregar el auto limpio por dentro y por fuera, con las llantas brillantes, y la cajuela lista solo con lo indispensable.",
  tiempo:[["Auto chico (sedán, hatchback)","45 – 60 min"],["Auto mediano (SUV, pickup)","1 – 1.5 h"],["Con motor sucio o exceso de tierra","+20 min"]],
  mat:[["Shampoo para auto","ml","100"],["Cera / abrillantador para llantas","ml","150"],["Limpiador de tablero (silicón)","Spray","1"],["Limpiavidrios","Spray","1"],["Agua","Cubeta 10L","2-3"],["Bolsas de basura","Pieza","2-3"],["Aromatizante para auto","Pieza","1"]],
  herr:["Cubeta grande","Esponja o guante de lavado","Trapo de microfibra (carrocería)","Trapo de microfibra (vidrios)","Trapo aparte para llantas","Manguera (si hay toma) o cubeta con agua limpia","Aspiradora","Escoba pequeña o cepillo interior"],
  epp:["Guantes de hule","Calzado que se pueda mojar"],
  fases:[
    {f:"Preparar el auto",pasos:["Estacionar en sombra si es posible (el sol seca el jabón y deja manchas).","Cerrar todas las ventanas y verificar que estén cerradas.","Abrir cajuela para inspección inicial. Tomar foto del contenido antes de sacar nada."]},
    {f:"Vaciar la cajuela — dejar SOLO el kit",pasos:["Sacar TODO de la cajuela y ponerlo sobre una lona o en un área limpia.","Lo que se queda (KIT DE EMERGENCIA): gato, llave de cruz, cables pasa-corriente, triángulo o señalización reflejante, llanta de refacción (con su tuerca de seguridad).","Todo lo demás — bolsas, cajas, herramientas sueltas, ropa, papeles, basura — se saca y se separa: BASURA a bolsa negra; PERTENENCIAS a bolsa aparte para entregarme.","Barrer o aspirar el interior de la cajuela vacía. Limpiar con trapo húmedo si hay manchas.","Regresar SOLO el kit acomodado en su lugar. Verificar que la llanta de refacción esté bien sujeta."]},
    {f:"Exterior — enjabonado y enjuague",pasos:["Enjuagar toda la carrocería con agua limpia para quitar polvo suelto (evita rayar la pintura al tallar).","Preparar cubeta con agua + shampoo (según indique el bote).","Con esponja o guante: enjabonar de arriba hacia abajo — techo, cofre, cajuela, puertas y por último la parte baja (que es la más sucia). NO usar la misma esponja para llantas.","Enjuagar completamente con agua limpia hasta que no salga espuma.","Secar la carrocería con microfibra grande en movimientos rectos, no circulares."]},
    {f:"Llantas — lavado y encerado",pasos:["Con trapo aparte (nunca el de la carrocería): tallar cada llanta con agua y jabón para quitar tierra y grasa. Enjuagar.","Cuando la llanta esté SECA: aplicar cera / abrillantador con esponja o trapo dedicado, cubriendo todo el costado de hule.","Dejar que la cera absorba 2–3 minutos. Si queda blancuzco, pasar trapo seco para uniformar.","Verificar que las 4 llantas queden con el mismo brillo."]},
    {f:"Vidrios",pasos:["Aplicar limpiavidrios y frotar con microfibra dedicada a vidrios (nunca la de carrocería).","Vidrios exteriores primero, luego interiores. Espejos laterales y retrovisor.","Revisar de lado buscando marcas; si quedan, repetir localmente."]},
    {f:"Interior — aspirado y limpieza",pasos:["Sacar tapetes y sacudirlos afuera del auto. Aspirarlos aparte.","Aspirar asientos, respaldos, entre asientos, alfombra del piso, y la cajuela si sobró polvo.","Con limpiador de tablero (silicón): aplicar en microfibra (no rociar directo en el tablero) y limpiar tablero, volante, palanca, puertas y consola.","Vaciar el cenicero y las cavidades porta-vasos.","Regresar los tapetes limpios en su lugar.","Aplicar aromatizante — colgarlo en el retrovisor o en la ranura de ventilación."]},
    {f:"Cierre y entrega",pasos:["Revisar por fuera con luz que no queden manchas de jabón, agua o gotas.","Revisar por dentro que no quede polvo en asientos, tablero ni alfombra.","Meter la BASURA en bolsa negra y sacarla al bote correspondiente.","Entregarme la bolsa con las PERTENENCIAS que salieron de la cajuela.","Enrollar la manguera y guardar cubeta, aspiradora, trapos y todo lo usado.","Colgar los trapos húmedos en el área de secado — no dejarlos hechos bola ni en el piso.","Tomar foto del auto terminado (frente, cajuela abierta con solo el kit, e interior) y mandarla."]}
  ],
  crit:["La carrocería queda sin manchas de agua ni de jabón visibles.","Las 4 llantas quedan con brillo parejo, sin exceso blancuzco.","Vidrios sin marcas ni huellas por dentro y por fuera.","Interior aspirado — sin polvo en asientos, alfombra ni tablero.","La cajuela queda VACÍA excepto el kit de emergencia acomodado.","Las pertenencias que salieron de la cajuela entregadas en bolsa aparte.","Trapos colgados en área de secado, no tirados."],
  eval:[
    ['Cajuela solo con el kit','Solo gato, llave de cruz, cables, triángulo y refacción.'],
    ['Pertenencias entregadas','Bolsa aparte con lo que sacaron.'],
    ['Llantas parejas','Las 4 con brillo igual.'],
    ['Vidrios sin marcas','Adentro y afuera con luz lateral.'],
    ['Tablero mate','Limpio pero mate, no como espejo.']
  ]
},
{ n:19, cat:"BODE", titulo:"Crear inventario de bodega (5 categorías)",
  kw:"inventario bodega listado material electrico plomeria albanileria pintura limpieza conteo",
  generalidades:"Van a hacer el inventario COMPLETO de una bodega dividido en 5 categorías: ELÉCTRICO, PLOMERÍA, ALBAÑILERÍA, PINTURA y LIMPIEZA. No es solo contar cosas — es dejar un documento (hoja o WhatsApp) donde yo sepa cuánto hay de cada material, con qué unidad, y en el caso de pinturas con qué COLOR y cuántos litros o cubetas. Este inventario me sirve para saber qué comprar y qué no, y para detectar cosas perdidas o robadas. El resultado es una lista clara por categoría que se pueda leer en 2 minutos.",
  tiempo:[["Bodega chica (< 10 m²)","1.5 – 2 h"],["Bodega mediana (10–25 m²)","2.5 – 4 h"],["Con reacomodo por categoría","+1 h"]],
  mat:[["Libreta o cuaderno para anotar","Pieza","1"],["Bolígrafo negro o azul","Pieza","2"],["Etiquetas o cinta masking","Rollo","1"],["Marcador permanente negro","Pieza","1"],["Cinta métrica (medir sobrantes de pintura)","Pieza","1"]],
  herr:["Celular con cámara (fotos de cada categoría)","Escalera (para revisar partes altas)","Franela para sacudir cajas mientras cuentan"],
  epp:["Guantes gruesos","Cubrebocas (mucho polvo en cajas viejas)"],
  fases:[
    {f:"Antes de empezar — preparar",pasos:["Avísame por WhatsApp cuando empieces.","Tomar foto general de la bodega ANTES de mover nada.","Sacar libreta, bolígrafo y marcador. Encabezar 5 páginas o secciones: ELÉCTRICO, PLOMERÍA, ALBAÑILERÍA, PINTURA, LIMPIEZA."]},
    {f:"ELÉCTRICO — anotar y contar",pasos:["Revisar toda la bodega y separar en una zona los materiales eléctricos.","Contar y anotar cada tipo. Ejemplos de lo que va aquí:","• Focos LED (por watts: 9W, 12W, etc.) — anotar cantidad.","• Focos ahorradores o incandescentes viejos — cantidad.","• Contactos y apagadores (nuevos y usados) — cantidad.","• Cable eléctrico (por calibre si es posible: #12, #14) — anotar metros aproximados.","• Cinta aislante — cantidad de rollos y color.","• Extensiones y multicontactos — cantidad y estado (buena / rota).","• Foquitos de decoración, series navideñas — cantidad.","• Portafocos, plafones, pantallas — cantidad.","Tomar foto de la zona de material eléctrico ya acomodado."]},
    {f:"PLOMERÍA — anotar y contar",pasos:["Separar todo lo de plomería en otra zona. Anotar:","• Tubos de PVC (por medida: 1/2\", 3/4\", 1\") — cantidad y metros aproximados.","• Codos, coples, tees, tapones de PVC — contar por tipo.","• Llaves de paso — cantidad y medida.","• Mezcladoras completas o piezas sueltas — cantidad.","• Flexibles (fría/caliente) — cantidad y largo.","• Sapos, empaques, teflón — cantidad de piezas o rollos.","• Regaderas o cabezales — cantidad.","• Sellador, pegamento PVC — cantidad de botes y si están cerrados o abiertos.","• Guía / serpiente, émbolo — anotar si hay y en qué estado.","Tomar foto de la zona de plomería acomodada."]},
    {f:"ALBAÑILERÍA — anotar y contar",pasos:["Separar todo material de construcción. Anotar:","• Cemento — número de bultos y si están completos o abiertos.","• Cal — bultos completos o abiertos.","• Yeso — bultos o kilos aproximados.","• Mortero, pegazulejo — bultos y de qué tipo.","• Grava, arena — cubetas o costales aproximados.","• Ladrillo, tabique, block — cantidad de piezas.","• Varilla — número de piezas y calibre.","• Alambre recocido, clavos, tornillos — kilos o botes aproximados.","• Malla, cimbra o tabla — cantidad.","Tomar foto de la zona de albañilería."]},
    {f:"PINTURA — anotar CON COLORES Y CANTIDADES (crítico)",pasos:["Separar todos los botes de pintura, esmalte, sellador, tiner e impermeabilizante.","Por CADA cubeta o bote anotar EN ESTE ORDEN:","1. TIPO: vinílica, esmalte, sellador, impermeabilizante, tiner, aguarrás, pasta.","2. COLOR EXACTO: blanco, blanco hueso, hueso, arena, gris claro, negro, etc. Si tiene etiqueta con nombre y código, anotar el código también.","3. TAMAÑO: cubeta 19L, galón 4L, litro, cuarto, o kg (para pasta).","4. CUÁNTO QUEDA: llena, 3/4, 1/2, 1/4, casi vacía. Estimar visualmente destapándola.","5. MARCA: Comex, Berel, Sherwin, Prisa, Vinci, etc.","6. ESTADO: sellada / abierta / con nata / seca (no sirve).","Ejemplo de anotación: 'Vinílica · Blanco hueso · Comex 100 · Cubeta 19L · 1/2 llena · Abierta · OK'.","Separar aparte las cubetas SECAS o INSERVIBLES para mostrarme y ver si se tiran.","Contar brochas, rodillos y charolas — anotar cuántos hay y en qué estado.","Contar lija (por grano: 80, 120, 220) — cantidad de pliegos.","Tomar foto CLARA de todas las cubetas alineadas."]},
    {f:"LIMPIEZA — anotar y contar",pasos:["Separar todo lo de limpieza. Anotar:","• Escobas — cantidad y estado (nueva / usada / gastada).","• Trapeadores — cantidad y estado.","• Jaladores de agua — cantidad.","• Cubetas — cantidad y tamaño (10L, 20L).","• Franelas y microfibras — cantidad aproximada.","• Detergente en polvo — cantidad de bolsas o kilos.","• Cloro, pino, multiusos, desengrasante — cuántas botellas y si están cerradas o abiertas.","• Fibras (verde, de acero, suave) — cantidad.","• Bolsas de basura — rollos o piezas.","• Aromatizantes — cantidad.","• Guantes, cubrebocas, otro EPP — cantidad.","Tomar foto de la zona de limpieza."]},
    {f:"Cierre — entregar el inventario",pasos:["Pasar en limpio la libreta. Que cada categoría tenga su encabezado y sus renglones claros.","Sacar foto de CADA PÁGINA de la libreta y mandarlas por WhatsApp en orden.","O — mejor — copiar el inventario a mensaje de WhatsApp por categoría (más fácil de leer para mí).","Mandar aparte la lista de FALTANTES o cosas por comprar (lo que se acabó o casi se acaba).","Mandar aparte la lista de COSAS INSERVIBLES para autorización de tirar.","Etiquetar las 5 zonas de la bodega con masking y marcador.","Barrer y guardar herramientas. Cerrar la bodega."]}
  ],
  crit:["Las 5 categorías están anotadas por separado — no revueltas.","Cada categoría tiene lista clara con cantidades y unidades.","La categoría de PINTURA incluye tipo, color, tamaño, cuánto queda, marca y estado de cada bote.","Fotos de cada zona de la bodega enviadas.","Lista aparte de faltantes y de cosas inservibles.","Las 5 zonas quedan etiquetadas físicamente en la bodega.","Bodega barrida y cerrada al terminar."],
  eval:[
    ["Estructura del inventario","Las 5 categorías separadas y con encabezado. Sin materiales revueltos entre categorías. Si veo pintura anotada bajo 'eléctrico' o falta una categoría entera, el inventario no sirve."],
    ["Detalle de la categoría PINTURA","Cada bote debe tener los 6 datos: tipo, color, tamaño, cuánto queda, marca, estado. Contar cuántas líneas de pintura vienen COMPLETAS con los 6 datos y cuántas incompletas. Si más del 20% están incompletas, se rehace esa categoría."],
    ["Fotos entregadas","Contar: 1 foto general antes + 5 fotos de cada zona acomodada + fotos de las páginas de la libreta (o mensajes con el texto). Menos de eso, incompleto."],
    ["Listas anexas","Verificar que llegaron 2 listas aparte: FALTANTES (para comprar) e INSERVIBLES (para autorizar tiro). Si falta alguna de las dos, el inventario está incompleto."],
    ["Etiquetado físico","Ir a la bodega y verificar que las 5 zonas tienen etiqueta visible con masking y marcador. Si las etiquetas no se ven o están mal pegadas, no cuenta."],
    ["Estado de la bodega al cerrar","Debe estar barrida, sin cosas en el piso central de tránsito, herramientas guardadas. Un inventario bueno con la bodega hecha un desastre no es un trabajo completo."]
  ]
},
{ n:20, cat:"LIMP", titulo:"Limpieza profunda de baño (con antisarro)",
  kw:"bano wc taza inodoro lavabo regadera azulejo antisarro cloro sarro moho jaboncillo mampara",
  generalidades:"Van a hacer la limpieza PROFUNDA de un baño — tasa, lavabo y área de regadera con antisarro y tallado a fondo. No es limpieza rápida: es tallar el sarro que se acumula en la regadera y en las llaves, quitar el jaboncillo pegado a los azulejos, y desinfectar tasa y lavabo. El antisarro necesita TIEMPO DE REPOSO para actuar — no se aplica y se talla de inmediato, se deja actuar 10 minutos. El resultado es un baño donde los azulejos quedan sin manchas blancas de sarro ni negras de moho, la tasa por dentro y por fuera sin marcas, y la mampara/vidrio de la regadera transparente.",
  tiempo:[["Baño chico (medio baño, solo tasa y lavabo)","45 – 60 min"],["Baño completo (con regadera)","1.5 – 2 h"],["Con mampara de vidrio y sarro fuerte","2 – 2.5 h"]],
  mat:[
    ["Antisarro líquido (para regadera y llaves)","ml","250"],
    ["Cloro","ml","150"],
    ["Desinfectante para tasa (Harpic o similar)","Bote","1"],
    ["Multiusos desinfectante","Spray","1"],
    ["Limpiavidrios (mampara y espejo)","Spray","1"],
    ["Jabón en polvo o líquido","Cda","3"],
    ["Bolsas de basura chicas","Pieza","2"],
    ["Aromatizante","Pieza","1"],
    ["Franelas o microfibra","Pieza","4"],
    ["Papel absorbente","Rollo","1"]
  ],
  herr:["Cepillo dental viejo (juntas de azulejo)","Cepillo de mano de cerdas medias","Fibra verde (una para tasa, otra para lavabo, otra para regadera — NO SE MEZCLAN)","Escobillón de tasa","Cubeta 10 L","Jalador de agua","Papel periódico o cartón (proteger piso fuera del área húmeda)","Guantes de repuesto"],
  epp:["Guantes de hule GRUESOS (el antisarro y el cloro son muy fuertes)","Lentes de seguridad (obligatorios con antisarro — salpica)","Cubrebocas (los vapores de cloro y antisarro no se deben respirar)","Ropa vieja / overol (el cloro decolora)","Calzado cerrado antiderrapante","VENTANA ABIERTA O EXTRACTOR ENCENDIDO — nunca trabajar con el baño cerrado usando estos químicos"],
  fases:[
    {f:"Preparar el área — PROTECCIÓN antes de empezar",pasos:[
      "Abrir la ventana del baño de par en par o encender el extractor. Si no hay ventana ni extractor, dejar la puerta abierta y poner un ventilador en el pasillo apuntando hacia adentro. NO empezar sin ventilación.",
      "Sacar TODO lo que está sobre las repisas, la tarja del lavabo y los bordes de la regadera: shampoos, jabones, cepillos, toallas, tapetes, cortina de baño, cepillos de dientes, maquillaje, decoraciones. Ponerlo en una bolsa o caja fuera del baño.",
      "Si la cortina de baño es de tela y se puede lavar, meterla a la lavadora aparte. Si es de plástico y tiene moho, tallarla con cloro dentro de la regadera al final.",
      "Cubrir el piso EXTERIOR del baño (el pasillo o cuarto de junto) con papel periódico o cartón por si sale agua o salpica al caminar con trapo mojado.",
      "Sacar el tapete del baño y sacudirlo afuera. Meterlo a lavar si está sucio.",
      "Ponerse el EPP completo ANTES de abrir los químicos: guantes gruesos, lentes, cubrebocas."
    ]},
    {f:"Aplicar antisarro y desinfectante — dejar actuar mientras se hace lo demás",pasos:[
      "REGADERA: aplicar antisarro con spray o esponja sobre azulejos, llaves, cabezal de regadera y piso de la regadera. Cubrir bien las zonas con manchas blancas de sarro. NO enjuagar todavía.",
      "TASA: verter desinfectante (Harpic o similar) por todo el borde interior de la tasa, cubriendo el agua. Dejar que escurra por las paredes internas.",
      "LAVABO: aplicar antisarro alrededor de la llave, coladera y en las manchas blancas visibles.",
      "IMPORTANTE: NO MEZCLAR cloro con antisarro en la misma superficie al mismo tiempo — genera gas tóxico. Si se va a usar cloro, es al final, después de enjuagar el antisarro.",
      "Dejar actuar los químicos MÍNIMO 10 MINUTOS. Durante ese tiempo hacer la Fase 3 (tallar azulejos altos y espejo, donde no hay antisarro)."
    ]},
    {f:"Mientras actúa el antisarro — azulejos altos, espejo y superficies secas",pasos:[
      "Con multiusos y franela: limpiar azulejos de la parte alta de la regadera y muros que no llevan antisarro.",
      "Limpiar el espejo con limpiavidrios y microfibra dedicada a vidrios.",
      "Limpiar la parte externa de la tasa: tapa, asiento (por arriba y por abajo), tanque, base y detrás. Usar multiusos y franela.",
      "Limpiar la puerta del baño por dentro (donde acumula polvo y salpicaduras)."
    ]},
    {f:"Tallar la tasa por dentro",pasos:[
      "Con el escobillón: tallar TODO el interior de la tasa, incluyendo debajo del borde donde no se ve. Prestar atención a las manchas negras o amarillas de la línea del agua.",
      "Con cepillo viejo de dientes: tallar la unión de la tasa con el piso, los tornillos de la base y las bisagras del asiento — ahí acumula mucha suciedad.",
      "Jalar la palanca para enjuagar. Si quedaron manchas de línea de agua, repetir la aplicación del desinfectante y volver a tallar."
    ]},
    {f:"Tallar y enjuagar el lavabo",pasos:[
      "Con fibra verde DEDICADA AL LAVABO (no usar la de tasa ni la de regadera): tallar el interior del lavabo con movimiento circular.",
      "Tallar alrededor de la llave, la coladera y el rebosadero (el agujerito pequeño arriba).",
      "Con cepillo de dientes viejo: tallar la unión del lavabo con la meseta y la base de la llave.",
      "Enjuagar bien con agua abundante hasta que no quede resto de antisarro.",
      "Secar con franela — el lavabo se seca porque si queda mojado deja manchas nuevas de agua."

const FICHAS_CAT_NOMBRES={LIMP:'Limpieza',MURO:'Muros y pintura',ELEC:'Eléctrico',PLOM:'Plomería',VICE:'Vidrios y cerraduras',BODE:'Bodega',HERR:'Herrería',AUTO:'Automóvil'};

// Sugerir fichas para un texto de incidente (match por keywords/título)
function sugerirFichas(texto){
  const q=(texto||'').toLowerCase();
  if(!q.trim())return [];
  const scored=FICHAS_MANT.map(f=>{
    let score=0;
    const kws=(f.kw||'').toLowerCase().split(/\s+/);
    kws.forEach(k=>{if(k&&q.includes(k))score+=2;});
    // título palabras
    (f.titulo||'').toLowerCase().split(/\s+/).forEach(w=>{if(w.length>3&&q.includes(w))score+=1;});
    return {f,score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
  return scored.slice(0,5).map(x=>x.f);
}

// ── Persistencia: CRONO vive en DB.cronograma_estado[0] ──
function cronoLoad(){
  const rec=DB.cronograma_estado&&DB.cronograma_estado[0];
  if(rec&&rec.data){try{CRONO=Object.assign(CRONO,typeof rec.data==='string'?JSON.parse(rec.data):rec.data);}catch(e){}}
  if(!CRONO.tareas_inm)CRONO.tareas_inm=JSON.parse(JSON.stringify(TAREAS_CRONO_INM));
  if(!CRONO.tareas_auto)CRONO.tareas_auto=JSON.parse(JSON.stringify(TAREAS_CRONO_AUTO));

}
function cronoSave(){
  if(!DB.cronograma_estado)DB.cronograma_estado=[];

  saveDB('cronograma_estado');
}

// ── Helpers de fecha para cronograma ──
function cIso(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`;}
function cParse(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function cAdd(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function cDiff(a,b){return Math.round((cParse(a)-cParse(b))/86400000);}
function cMonthKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function cWd(d){return (d.getDay()+6)%7;} // 0=Lun..6=Dom
function cFinde(d){return cWd(d)>=5;}
function cLigero(d){const w=cWd(d);return w===0||w===6;} // lunes o domingo

// ── Hoy No Circula ──
function cFindeOrd(d){
  if(!cFinde(d))return null;
  const sat=cWd(d)===5?new Date(d):cAdd(d,-1);
  let count=0,dd=new Date(sat.getFullYear(),sat.getMonth(),1);
  while(dd<=sat){if(cWd(dd)===5)count++;dd=cAdd(dd,1);}
  return count;
}
function cFindesMes(y,m){let c=0,dd=new Date(y,m,1);while(dd.getMonth()===m){if(cWd(dd)===5)c++;dd=cAdd(dd,1);}return c;}
function cCircula(auto,d){
  const w=cWd(d),fo=cFindeOrd(d),tot=cFindesMes(d.getFullYear(),d.getMonth());
  if(fo===5&&tot>=5)return true;
  const impar=fo!==null&&fo%2===1,par=fo!==null&&fo%2===0;
  if(auto==='Ford')return true;
  if(auto==='Vectra'){if(w===3)return false;if(impar)return false;return true;}
  if(auto==='Monza'){if(w===2)return false;if(par)return false;return true;}
  if(auto==='Windstar'){if(w===0)return false;if(impar)return false;return true;}
  return true;
}

// ── Inmuebles con zona, agrupados ──
function cInmueblesConZona(){return DB.inmuebles.filter(i=>i.zona&&ZONAS_CRONO[i.zona]);}
function cDiasCobro(inm){
  // Días de cobro reales desde los inquilinos de ese inmueble
  const dias=new Set();
  DB.inquilinos.filter(t=>t.estado!=='inactivo'&&(t.inmuebleId===inm.id||t.inmueble===inm.nombre)).forEach(t=>{
    const d=parseInt(t.dia);if(d>=1&&d<=31)dias.add(d);
  });
  return[...dias];
}

// ── MOTOR DE AGENDADO ──
function cGenerar(y,m){
  cronoLoad();
  const mk=`${y}-${String(m+1).padStart(2,'0')}`;
  const cron={};
  const uv=Object.assign({},CRONO.ultimaVez);
  const setUV=(k,d)=>{uv[k]=cIso(d);};
  const venc=(k,freq,f)=>{const u=uv[k];if(!u)return 999;return cDiff(cIso(f),u)-freq;};
  const primero=new Date(y,m,1),ultimo=new Date(y,m+1,0);
  const zonasList=Object.keys(ZONAS_CRONO);
  const inmsZona=cInmueblesConZona();
  const inmPorZona={};
  zonasList.forEach(z=>inmPorZona[z]=inmsZona.filter(i=>i.zona===z));

  // Incidentes activos de la app (DB.incidentes) + extra del cronograma
  const incidentesApp=DB.incidentes.filter(i=>!i.resuelto).map(i=>{
    // ubicar zona por el lugar/inmueble
    const inm=DB.inmuebles.find(x=>{const l=(i.lugar||'').toLowerCase(),n=(x.nombre||'').toLowerCase();return l&&n&&(l.includes(n)||n.includes(l));});
    const urgente=(i.nivel==='alto'||i.nivel==='urgente');
    // Agendar automáticamente si cae en este mes y no tiene fecha
    let fAg=i._cronoFecha||null;
    if(!fAg){
      const base=i.fecha&&cParse(i.fecha)>=primero?cParse(i.fecha):primero;
      // urgente: primer día no-ligero desde base; normal: primer día laboral
      let dd=new Date(base);
      for(let k=0;k<20;k++){if(!cLigero(dd)&&dd>=primero&&dd<=ultimo){fAg=cIso(dd);break;}dd=cAdd(dd,1);}
      if(!fAg)fAg=cIso(primero);
    }
    return{titulo:i.descripcion||i.numero||'Incidente',inmueble:inm?inm.nombre:(i.lugar||''),zona:inm?inm.zona:null,fecha_agendada:fAg,urgente,src:'app',id:i.id};
  });

  for(let dd=new Date(primero);dd<=ultimo;dd=cAdd(dd,1)){
    const fecha=cIso(dd);
    const tareasHoy=[];
    const ligero=cLigero(dd);

    // 1. Incidentes agendados hoy
    incidentesApp.filter(i=>i.fecha_agendada===fecha).forEach(i=>{
      tareasHoy.push({tipo:'incidente',zona:i.zona||'inc',titulo:'🚨 '+i.titulo,detalle:i.inmueble||'',incId:i.id});
    });
    (CRONO.incidentes_extra||[]).filter(i=>!i.resuelto&&i.fecha_agendada===fecha).forEach(i=>{
      tareasHoy.push({tipo:'incidente',zona:i.zona||'inc',titulo:'🚨 '+i.titulo,detalle:i.inmueble||'',incId:i.id});
    });

    // 2. Autos (en base)
    const autoTasks=[];
    CRONO.tareas_auto.forEach(t=>{
      AUTOS_CRONO.forEach(a=>{
        const k=`auto|${a}|${t.id}`;
        const v=venc(k,t.freq,dd);
        const umbral=ligero?1:0;
        if(v>=umbral)autoTasks.push({tipo:'auto',zona:'autos',titulo:`${t.icon} ${t.nombre}: ${a}`,detalle:cCircula(a,dd)?'circula':'en base',auto:a,tarea:t.id,venc:v,k});
      });
    });
    autoTasks.sort((a,b)=>b.venc-a.venc);
    const maxAutos=ligero?2:4;
    autoTasks.slice(0,maxAutos).forEach(t=>{tareasHoy.push(t);setUV(t.k,dd);});

    // 3. Mantenimiento por zona (agrupado)
    const zonaFijada=CRONO.zonasFijadas[fecha];
    const calcZona=(forzar)=>{
      const sz={};
      zonasList.forEach(z=>{
        let score=0,detalle=[];
        inmPorZona[z].forEach(inm=>{
          CRONO.tareas_inm.forEach(t=>{
            const freqAj=Math.round(t.freq/(ZONAS_CRONO[z].freq||1));
            const k=`${inm.nombre}|${t.id}`;
            const v=venc(k,freqAj,dd);
            const umbralV=forzar===z?-3:-1;
            if(v>=umbralV){score+=(v+2);detalle.push({inm:inm.nombre,tarea:t,k,v});}
          });
        });
        const diaMes=dd.getDate();
        const cobrosHoy=inmPorZona[z].filter(inm=>cDiasCobro(inm).includes(diaMes));
        if(cobrosHoy.length)score+=cobrosHoy.length*1.5;
        sz[z]={score,detalle,cobros:cobrosHoy};
      });
      return sz;
    };
    let presup=ligero?3:10;
    if(zonaFijada&&ZONAS_CRONO[zonaFijada]){
      const sz=calcZona(zonaFijada),sel=sz[zonaFijada];
      sel.detalle.sort((a,b)=>b.v-a.v).forEach(d2=>{
        tareasHoy.push({tipo:'mant',zona:zonaFijada,titulo:`${d2.tarea.icon} ${d2.tarea.nombre}`,detalle:d2.inm,inm:d2.inm,tarea:d2.tarea.id,fijada:true});
        setUV(d2.k,dd);
      });
      sel.cobros.forEach(inm=>tareasHoy.push({tipo:'cobro',zona:zonaFijada,titulo:`💵 Cobranza ${inm.nombre}`,detalle:'día de cobro',inm:inm.nombre}));
    }else if(!ligero){
      const sz=calcZona(null);
      const mejor=zonasList.map(z=>({z,...sz[z]})).filter(x=>x.score>=3).sort((a,b)=>b.score-a.score)[0];
      if(mejor){
        mejor.detalle.sort((a,b)=>b.v-a.v).forEach(d2=>{
          if(presup<=0)return;
          tareasHoy.push({tipo:'mant',zona:mejor.z,titulo:`${d2.tarea.icon} ${d2.tarea.nombre}`,detalle:d2.inm,inm:d2.inm,tarea:d2.tarea.id});
          setUV(d2.k,dd);presup-=1.2;
        });
        mejor.cobros.forEach(inm=>tareasHoy.push({tipo:'cobro',zona:mejor.z,titulo:`💵 Cobranza ${inm.nombre}`,detalle:'día de cobro',inm:inm.nombre}));
      }
    }else{
      const diaMes=dd.getDate();
      zonasList.forEach(z=>{
        inmPorZona[z].filter(inm=>cDiasCobro(inm).includes(diaMes)).forEach(inm=>{
          tareasHoy.push({tipo:'cobro',zona:z,titulo:`💵 Cobranza ${inm.nombre}`,detalle:'día de cobro (ligero)',inm:inm.nombre});
        });
      });
    }

    // 4. Cobros de otras zonas (recordatorio, solo días normales)
    if(!ligero){
      const zonasConTareas=new Set(tareasHoy.filter(t=>t.tipo==='mant').map(t=>t.zona));
      const diaMes=dd.getDate();
      zonasList.forEach(z=>{
        if(zonasConTareas.has(z))return;
        inmPorZona[z].filter(inm=>cDiasCobro(inm).includes(diaMes)).forEach(inm=>{
          if(tareasHoy.some(t=>t.inm===inm.nombre&&t.tipo==='cobro'))return;
          tareasHoy.push({tipo:'cobro',zona:z,titulo:`💵 Cobranza ${inm.nombre}`,detalle:'día de cobro',inm:inm.nombre});
        });
      });
    }

    if(tareasHoy.length)cron[fecha]=tareasHoy;
  }


  // Recordatorios al dueño: días 1–5 del mes (lista inquilinaria + presupuesto)
  for(let dnum=1;dnum<=5;dnum++){
    const dd=new Date(y,m,dnum);const f=cIso(dd);
    if(!cron[f])cron[f]=[];
    cron[f].push({tipo:'recordatorio',zona:'recordatorio',titulo:'📑 Reporte al dueño',detalle:dnum===1?'Generar lista inquilinaria y capturar presupuesto del mes':'Pendiente: lista inquilinaria / presupuesto'});
  }
  CRONO.cronograma[mk]=cron;
  cronoSave();
  return cron;
}

// ── RENDER: vista principal cronograma dentro de Gestión ──

  cronoLoad();
  const cont=document.getElementById('crono-body');

  let sub=`<div class="cr" style="margin-bottom:10px">
    <span class="chip${cronoSub==='cal'?' on':''}" onclick="cronoSub='cal';renderCrono()">🗓️ Calendario</span>
    <span class="chip${cronoSub==='autos'?' on':''}" onclick="cronoSub='autos';renderCrono()">🚗 Autos</span>
    <span class="chip${cronoSub==='config'?' on':''}" onclick="cronoSub='config';renderCrono()">⚙️ Config</span>
  </div>`;
  if(conZona===0){
    cont.innerHTML=sub+`<div class="es"><div class="ei">🗺️</div><div class="et">Ningún inmueble tiene zona asignada</div>
      <div style="font-size:12px;color:var(--dim);margin:10px 0">Para usar el cronograma, asigna una zona a cada inmueble desde Propietarios → editar inmueble (⚙️).</div>

  }

  else if(cronoSub==='autos')cont.innerHTML=sub+renderCronoAutos();

function renderCronoCal(){
  const y=cronoDate.getFullYear(),m=cronoDate.getMonth();
  const mk=cMonthKey(cronoDate);
  let cron=CRONO.cronograma[mk];
  if(!cron)cron=cGenerar(y,m);
  const primero=new Date(y,m,1),ultimo=new Date(y,m+1,0);
  const startPad=cWd(primero);
  const hoy=cIso(new Date());
  const MESES_C=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  let html=`<div style="display:flex;justify-content:center;align-items:center;gap:10px;margin:6px 0 12px">
    <button class="btn bo bsm" onclick="cronoChMonth(-1)">‹</button>
    <div style="font-weight:700;font-size:15px;text-transform:capitalize;min-width:140px;text-align:center">${MESES_C[m]} ${y}</div>
    <button class="btn bo bsm" onclick="cronoChMonth(1)">›</button>
    <button class="btn bs bsm" onclick="cronoHoy()">Hoy</button>
  </div>
  <button class="btn bg bfu" style="margin-bottom:10px" onclick="cronoRegen()">🔄 Recalcular mes</button>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px">${DIAS_SEM_C.map(d=>`<div style="text-align:center;font-size:9px;color:var(--dim);font-weight:700;padding:2px 0">${d}</div>`).join('')}</div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">`;
  for(let i=0;i<startPad;i++)html+='<div></div>';
  for(let dd=new Date(primero);dd<=ultimo;dd=cAdd(dd,1)){
    const f=cIso(dd);
    const tareas=cron[f]||[];
    const ligero=cLigero(dd);
    const isToday=f===hoy;
    const zColor=t=>t.tipo==='incidente'?'#E05C5C':t.tipo==='cobro'?'transparent':t.zona==='autos'?'#16A2B8':(ZONAS_CRONO[t.zona]?ZONAS_CRONO[t.zona].color:'#6B7A8D');
    let dots='';
    const zonasDia=[...new Set(tareas.filter(t=>t.tipo==='mant').map(t=>t.zona))];
    zonasDia.slice(0,3).forEach(z=>{dots+=`<span style="width:6px;height:6px;border-radius:2px;background:${ZONAS_CRONO[z]?ZONAS_CRONO[z].color:'#6B7A8D'};display:inline-block"></span>`;});
    if(tareas.some(t=>t.tipo==='auto'))dots+=`<span style="width:6px;height:6px;border-radius:50%;background:#16A2B8;display:inline-block"></span>`;
    if(tareas.some(t=>t.tipo==='cobro'))dots+=`<span style="width:6px;height:6px;border-radius:50%;border:1px solid #E05C5C;display:inline-block"></span>`;
    if(tareas.some(t=>t.tipo==='incidente'))dots+=`<span style="width:6px;height:6px;border-radius:50%;background:#E05C5C;display:inline-block"></span>`;
    if(Object.keys(CRONO.estadosAct||{}).some(k=>{const e=CRONO.estadosAct[k];return e&&e.moved&&e.movidaA===f;}))dots+=`<span style="width:6px;height:6px;border-radius:50%;background:#2F7CC2;display:inline-block" title="actividad reprogramada"></span>`;
    const nMant=tareas.filter(t=>t.tipo==='mant').length;
    html+=`<div onclick="cronoOpenDay('${f}')" style="background:${isToday?'#0059A922':'var(--s1)'};border:1px solid ${isToday?'var(--gold,#C9A227)':'#E4E9EF'};border-radius:7px;min-height:62px;padding:4px;cursor:pointer;display:flex;flex-direction:column;${ligero?'background-image:repeating-linear-gradient(45deg,transparent,transparent 5px,#0000000A 5px,#0000000A 10px)':''}">
      <div style="font-size:11px;font-weight:700;display:flex;justify-content:space-between">${dd.getDate()}${CRONO.zonasFijadas[f]?'<span style="font-size:8px">📌</span>':''}</div>
      <div style="display:flex;flex-wrap:wrap;gap:2px;margin-top:3px">${dots}</div>
      ${nMant>0?`<div style="font-size:8px;color:var(--dim);margin-top:auto">${nMant} tareas</div>`:''}
    </div>`;
  }
  html+='</div>';
  // Leyenda
  html+='<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">';
  Object.entries(ZONAS_CRONO).forEach(([k,z])=>{
    if(!DB.inmuebles.some(i=>i.zona===k))return;
    html+=`<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim)"><span style="width:9px;height:9px;border-radius:2px;background:${z.color}"></span>${z.nombre}</div>`;
  });
  html+=`<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim)"><span style="width:9px;height:9px;border-radius:50%;background:#16A2B8"></span>Autos</div>`;
  html+=`<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim)"><span style="width:9px;height:9px;border-radius:50%;border:1px solid #E05C5C"></span>Cobranza</div></div>`;
  return html;
}

function cronoChMonth(n){cronoDate=new Date(cronoDate.getFullYear(),cronoDate.getMonth()+n,1);renderCrono();}
function cronoHoy(){cronoDate=new Date();renderCrono();}
function cronoRegen(){cGenerar(cronoDate.getFullYear(),cronoDate.getMonth());renderCrono();snack('✓ Cronograma recalculado');}

function cronoOpenDay(f){
  const d=cParse(f);
  const mk=cMonthKey(d);
  const cron=CRONO.cronograma[mk]||{};
  const tareas=cron[f]||[];
  const ligero=cLigero(d);
  const MESES_C=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const nombreDia=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'][cWd(d)];
  const zonaFijada=CRONO.zonasFijadas[f];
  const autoPills=AUTOS_CRONO.map(a=>`<span class="pill" style="padding:3px 8px;border-radius:12px;background:var(--s2);border:1px solid #CBD5DF;font-size:10px;${cCircula(a,d)?'':'opacity:.4;text-decoration:line-through'}">${a}</span>`).join(' ');
  const zonaOpts=Object.entries(ZONAS_CRONO).map(([k,z])=>`<option value="${k}"${zonaFijada===k?' selected':''}>${z.nombre}</option>`).join('');
  let body=`<div class="ms"><div class="mh"></div>
    <div class="mt2">${nombreDia} ${d.getDate()} de ${MESES_C[d.getMonth()]}</div>
    <div style="font-size:11px;color:var(--dim);margin-bottom:12px">${ligero?'🟡 Día ligero (dom/lun) — carga reducida':'🟢 Día normal (Freddy)'}${zonaFijada?' · 📌 zona fijada':''}</div>
    <div style="font-size:11px;margin-bottom:12px">🚗 Circulan: ${autoPills}</div>
    <div class="fg" style="background:var(--s1);padding:10px 12px;border-radius:9px">
      <label class="fl">📌 ¿En qué zona estarás este día?</label>
      <div style="display:flex;gap:8px">
        <select class="fi" id="crono-zona-manual" style="flex:1"><option value="">— Automático —</option>${zonaOpts}</select>
        <button class="btn bg bsm" onclick="cronoFijarZona('${f}')">Aplicar</button>
      </div>
      ${zonaFijada?`<button class="btn bo bsm" style="width:100%;margin-top:8px" onclick="cronoQuitarZona('${f}')">Quitar zona fija</button>`:''}
    </div>`;
  // Lista de actividades: base del día + reprogramadas que ENTRAN a este día, con su estado
  const EA=CRONO.estadosAct||{};
  const display=[];
  (tareas||[]).forEach(t=>{const k=aKey(f,t);display.push({t,k,e:EA[k],originF:f,injected:false});});
  Object.keys(EA).forEach(k=>{const e=EA[k];if(e&&e.moved&&e.movidaA===f&&e.task){display.push({t:e.task,k,e,originF:e.movidaDe,injected:true});}});
  cronoDayItems=display.map(x=>({k:x.k,originF:x.originF,t:x.t}));
  cronoDayF=f;
  if(display.length===0){
    body+=`<div class="es"><div class="ei">🌤️</div><div class="et">Sin tareas este día</div></div>`;
  }else{
    display.forEach((it,idx)=>{
      const t=it.t,e=it.e;
      const c=t.tipo==='incidente'?'#E05C5C':t.tipo==='cobro'?'#E05C5C':t.zona==='autos'?'#16A2B8':(ZONAS_CRONO[t.zona]?ZONAS_CRONO[t.zona].color:'#6B7A8D');
      const movedAway=e&&e.moved&&e.movidaDe===f&&!it.injected;
      const estado=e?e.estado:null;
      let badge='',opacity='',strike='';
      if(movedAway){badge=`<span style="font-size:10px;color:#2F7CC2;font-weight:600">⏰ Reprogramada → ${aFechaCorta(e.movidaA)}</span>`;opacity='opacity:.55';}
      else if(estado==='aceptada'){badge=`<span style="font-size:10px;color:var(--g);font-weight:600">✓ Aceptada</span>`;}
      else if(estado==='denegada'){badge=`<span style="font-size:10px;color:var(--r);font-weight:600">✗ Denegada</span>`;opacity='opacity:.5';strike='text-decoration:line-through';}
      let botones;
      if(movedAway||estado){
        botones=`<button class="btn bo bsm" style="flex:1" onclick="actDeshacer(${idx})">↩︎ Deshacer</button>`;
      }else{
        botones=`<button class="btn bsm" style="flex:1;background:#E8F5EC;color:#2E7D46;border:1px solid #BFE3CC;font-size:15px" onclick="actAceptar(${idx})">✓</button>
          <button class="btn bsm" style="flex:1;background:#FBEAEA;color:#C0392B;border:1px solid #F1C9C9;font-size:15px" onclick="actDenegar(${idx})">✗</button>
          <button class="btn bsm" style="flex:1;background:#E7F0FA;color:#2F7CC2;border:1px solid #C3DBF2;font-size:15px" onclick="actReprogramar(${idx})">⏰</button>`;
      }
      body+=`<div style="background:var(--s1);border-radius:9px;padding:10px 12px;margin-bottom:6px;border-left:3px solid ${c};${opacity}">
        <div style="font-weight:600;font-size:13px;${strike}">${t.titulo}${t.fijada?' 📌':''}${it.injected?' <span style="font-size:9px;color:#2F7CC2">(reprogramada aquí)</span>':''}</div>
        <div style="font-size:11px;color:var(--dim);margin-top:2px">${t.detalle||''}${t.zona&&ZONAS_CRONO[t.zona]?' · '+ZONAS_CRONO[t.zona].nombre:''}</div>
        ${badge?`<div style="margin-top:4px">${badge}</div>`:''}
        <div style="display:flex;gap:6px;margin-top:8px">${botones}</div>
      </div>`;
    });
  }
  body+=`<div style="display:flex;gap:8px;margin-top:12px">
    <button class="btn bg" style="flex:1" onclick="cronoExportWA('${f}')">📱 WhatsApp</button>
    <button class="btn bo" onclick="closeM()">Cerrar</button>
  </div></div>`;
  modal(body);
}

function cronoFijarZona(f){
  const z=document.getElementById('crono-zona-manual').value;
  if(!z){cronoQuitarZona(f);return;}
  CRONO.zonasFijadas[f]=z;
  const d=cParse(f);cGenerar(d.getFullYear(),d.getMonth());cronoSave();
  snack('📌 Zona fijada: '+ZONAS_CRONO[z].nombre);cronoOpenDay(f);
}
function cronoQuitarZona(f){
  delete CRONO.zonasFijadas[f];
  const d=cParse(f);cGenerar(d.getFullYear(),d.getMonth());cronoSave();
  snack('Volviendo a automático');cronoOpenDay(f);
}

function cronoExportWA(f){
  const d=cParse(f);const mk=cMonthKey(d);const cron=CRONO.cronograma[mk]||{};const tareas=cron[f]||[];
  const nombreDia=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'][cWd(d)];
  const circulan=AUTOS_CRONO.filter(a=>cCircula(a,d));
  let txt=`🗓️ *AGENDA ${nombreDia.toUpperCase()} ${d.getDate()}/${d.getMonth()+1}*\n_Inmobiliaria_\n\n`;
  const mant=tareas.filter(t=>t.tipo==='mant'),autos=tareas.filter(t=>t.tipo==='auto'),cobros=tareas.filter(t=>t.tipo==='cobro'),incs=tareas.filter(t=>t.tipo==='incidente');
  if(incs.length){txt+=`🚨 *INCIDENTES*\n`;incs.forEach(t=>txt+=`• ${t.titulo.replace('🚨 ','')}${t.detalle?' ('+t.detalle+')':''}\n`);txt+=`\n`;}
  if(mant.length){
    const porZona={};mant.forEach(t=>{porZona[t.zona]=porZona[t.zona]||[];porZona[t.zona].push(t);});
    Object.entries(porZona).forEach(([z,ts])=>{
      txt+=`📍 *${(ZONAS_CRONO[z]?ZONAS_CRONO[z].nombre:z).toUpperCase()}*\n`;
      const porInm={};ts.forEach(t=>{porInm[t.inm]=porInm[t.inm]||[];porInm[t.inm].push(t.titulo.replace(/^\S+\s/,''));});
      Object.entries(porInm).forEach(([inm,tt])=>txt+=`  🏠 ${inm}: ${tt.join(', ')}\n`);
      txt+=`\n`;
    });
  }
  if(cobros.length){
    const zonasVis=new Set(mant.map(t=>t.zona));
    const enZona=cobros.filter(t=>{const inm=DB.inmuebles.find(i=>i.nombre===t.inm);return inm&&zonasVis.has(inm.zona);});
    const otras=cobros.filter(t=>!enZona.includes(t));
    txt+=`💵 *COBRANZA*\n`;
    enZona.forEach(t=>txt+=`• ${t.inm}\n`);
    if(otras.length){txt+=`_(otras zonas, si te queda de paso):_\n`;otras.forEach(t=>{const inm=DB.inmuebles.find(i=>i.nombre===t.inm);const zn=inm&&ZONAS_CRONO[inm.zona]?ZONAS_CRONO[inm.zona].nombre:'';txt+=`• ${t.inm} ${zn?'('+zn+')':''}\n`;});}
    txt+=`\n`;
  }
  if(autos.length){txt+=`🚗 *AUTOS* (en base)\n`;autos.forEach(t=>txt+=`• ${t.titulo.replace(/^\S+\s/,'')}\n`);txt+=`\n`;}
  txt+=`🚙 _Circulan hoy: ${circulan.join(', ')}_`;
  if(tareas.length===0)txt=`🗓️ *${nombreDia} ${d.getDate()}/${d.getMonth()+1}*\n\nSin tareas programadas.`;
  const enc=encodeURIComponent(txt);
  modal(`<div class="ms"><div class="mh"></div><div class="mt2">📱 Agenda para WhatsApp</div>
    <textarea class="fi" id="crono-wa" style="height:260px;font-size:12px;font-family:monospace;white-space:pre-wrap" readonly>${txt.replace(/</g,'&lt;')}</textarea>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn bg" style="flex:1" onclick="cronoCopiarWA()">📋 Copiar</button>
      <a class="btn bs" style="flex:1;text-align:center;text-decoration:none;line-height:1.8" href="https://wa.me/?text=${enc}" target="_blank">📱 WhatsApp</a>
    </div>
    <button class="btn bo bfu" style="margin-top:8px" onclick="cronoOpenDay('${f}')">‹ Volver</button></div>`);
}
function cronoCopiarWA(){
  const ta=document.getElementById('crono-wa');ta.select();
  try{navigator.clipboard.writeText(ta.value).then(()=>snack('✓ Copiado'));}catch(e){document.execCommand('copy');snack('✓ Copiado');}
}

// ── Estado de actividades del calendario (aceptar / denegar / reprogramar) ──
function aKey(f,t){return f+'|'+t.tipo+'|'+(t.titulo||'')+'|'+(t.inm||t.detalle||'');}
function aFechaCorta(f){const d=cParse(f);return d.getDate()+'/'+(d.getMonth()+1);}
function actAceptar(idx){const it=cronoDayItems[idx];if(!it)return;const e=CRONO.estadosAct[it.k]||{};e.estado='aceptada';CRONO.estadosAct[it.k]=e;cronoSave();snack('✓ Aceptada');cronoOpenDay(cronoDayF);}
function actDenegar(idx){const it=cronoDayItems[idx];if(!it)return;const e=CRONO.estadosAct[it.k]||{};e.estado='denegada';CRONO.estadosAct[it.k]=e;cronoSave();snack('✗ Denegada');cronoOpenDay(cronoDayF);}
function actDeshacer(idx){const it=cronoDayItems[idx];if(!it)return;delete CRONO.estadosAct[it.k];cronoSave();snack('↩︎ Restablecida');cronoOpenDay(cronoDayF);}
function actReprogramar(idx){
  const it=cronoDayItems[idx];if(!it)return;
  const d1=aProxDiaZona(it.originF,it.t.zona,'esta'),d2=aProxDiaZona(it.originF,it.t.zona,'prox');
  modal(`<div class="ms"><div class="mh"></div><div class="mt2">⏰ Reprogramar actividad</div>
    <div style="font-size:12px;color:var(--dim);margin-bottom:16px">${it.t.titulo}${it.t.zona&&ZONAS_CRONO[it.t.zona]?' · '+ZONAS_CRONO[it.t.zona].nombre:''}</div>
    <button class="btn bg bfu" onclick="actMover(${idx},'esta')">📅 Más tarde esta semana<div style="font-size:10px;opacity:.85;font-weight:400">→ ${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'][cWd(cParse(d1))]} ${aFechaCorta(d1)}</div></button>
    <button class="btn bg bfu" style="margin-top:8px" onclick="actMover(${idx},'prox')">📆 La próxima semana<div style="font-size:10px;opacity:.85;font-weight:400">→ ${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'][cWd(cParse(d2))]} ${aFechaCorta(d2)}</div></button>
    <button class="btn bo bfu" style="margin-top:10px" onclick="cronoOpenDay('${cronoDayF}')">‹ Cancelar</button></div>`);
}
function actMover(idx,scope){
  const it=cronoDayItems[idx];if(!it)return;
  const dest=aProxDiaZona(it.originF,it.t.zona,scope);
  const e=CRONO.estadosAct[it.k]||{};
  e.moved=true;e.movidaDe=it.originF;e.movidaA=dest;e.estado=null;
  e.task=JSON.parse(JSON.stringify(it.t));
  CRONO.estadosAct[it.k]=e;cronoSave();
  snack('⏰ Reprogramada al '+aFechaCorta(dest));
  cronoOpenDay(cronoDayF);
}
// Próximo día en que "toca" la zona: esta semana (hasta el domingo) o la próxima
function aProxDiaZona(f,zona,scope){
  const d=cParse(f),wd=cWd(d);
  let start,end;
  if(scope==='esta'){start=1;end=6-wd;}
  else{const toMon=7-wd;start=toMon;end=toMon+6;}
  let fallback=null;
  for(let i=start;i<=end;i++){
    const cand=cAdd(d,i),cf=cIso(cand);
    if(fallback===null)fallback=cf;
    const cc=CRONO.cronograma[cMonthKey(cand)]||{};
    if(zona&&(cc[cf]||[]).some(x=>x.zona===zona))return cf;
  }
  if(scope==='esta'&&end<start)return aProxDiaZona(f,zona,'prox');
  return fallback||cIso(cAdd(d,scope==='esta'?1:7));
}

function buildPropietarioReporte(propId,rango){
  const prop=getPropietario(propId);
  if(!prop)return null;
  const r=rango||getRange('semana');
  const inRango=(f)=>{if(!f)return false;const d=new Date(f);if(isNaN(d))return false;return d>=r.ini&&d<=r.fin;};
  const inmuebles=DB.inmuebles.filter(i=>i.propietarioId===propId).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));
  const norm=t=>t==='cfe'?'luz':t;

  // Datos por inmueble
  const porInmueble=inmuebles.map(inm=>{
    const tenants=DB.inquilinos.filter(t=>(t.inmuebleId===inm.id||t.inmueble===inm.nombre)&&t.estado==='activo');
    const totalRenta=tenants.reduce((s,t)=>s+Number(t.renta||0),0);
    // Cobrado en el período (pagos con fecha_pago en rango)
    const inqIds=tenants.map(t=>t.id);
    const pagosPeriodo=DB.pagos.filter(p=>p.pagado&&inqIds.includes(p.iid)&&inRango(p.fecha_pago));
    const cobradoPeriodo=pagosPeriodo.reduce((s,p)=>s+Number(p.monto||0),0);
    // Detalle de cobros: quién pagó y cuánto (para la lista en la diapositiva)
    const cobrosDetalle=pagosPeriodo.map(p=>{
      const t=DB.inquilinos.find(x=>x.id===p.iid);
      return{nombre:t?.nombre||'?',interior:t?.interior||'',monto:Number(p.monto||0),fecha:new Date(p.fecha_pago)};
    }).sort((a,b)=>b.monto-a.monto);
    // Cobrado del mes actual (para % esperado mensual)
    const pagosMes=DB.pagos.filter(p=>p.pagado&&inqIds.includes(p.iid)&&p.mes===HM&&p.anio===HA);
    const cobradoMes=pagosMes.reduce((s,p)=>s+Number(p.monto||0),0);
    const pendienteMes=Math.max(0,totalRenta-cobradoMes);
    // Vacancia
    const totalDepas=inm.total_depas||tenants.length;
    const ocupados=tenants.length;
    const pctOcup=totalDepas>0?Math.round(ocupados/totalDepas*100):0;
    // Atrasados (vencidos este mes)
    const atrasados=tenants.filter(t=>isLate(t.id,HM,HA)).map(t=>({nombre:t.nombre,interior:t.interior,renta:Number(t.renta||0)}));
    // Trabajos (obras del período)
    const obras=DB.obras.filter(o=>(o.inmueble===inm.nombre)&&inRango(o.fecha)).map(o=>({tipo:(TIPOS_OBRA[o.tipo]||TIPOS_OBRA.otros).n,costo:Number(o.costo||0),desc:o.descripcion||''}));
    // Incidentes del período
    const incidentes=DB.incidentes.filter(i=>{
      const lugarLow=(i.lugar||'').toLowerCase();const inmLow=inm.nombre.toLowerCase();
      return (lugarLow.includes(inmLow)||inmLow.includes(lugarLow))&&inRango(i.fecha);
    }).map(i=>({numero:i.numero,desc:i.descripcion||'',resuelto:i.resuelto,nivel:i.nivel}));
    // Deudas de servicios
    const svcs=DB.servicios.filter(s=>s.inmueble===inm.nombre);
    const deudaLuzArr=svcs.filter(s=>norm(s.tipo)==='luz').map(s=>({alias:s.alias||'',monto:Math.max(0,getServicioBalance(s.id))})).filter(x=>x.monto>0);
    const deudaLuz=deudaLuzArr.reduce((s,x)=>s+x.monto,0);
    const deudaAgua=svcs.filter(s=>norm(s.tipo)==='agua').reduce((s,sv)=>s+Math.max(0,getServicioBalance(sv.id)),0);
    const deudaPredial=svcs.filter(s=>norm(s.tipo)==='predial').reduce((s,sv)=>s+Math.max(0,getServicioBalance(sv.id)),0);
    return{inm,tenants,totalRenta,cobradoPeriodo,cobrosDetalle,cobradoMes,pendienteMes,totalDepas,ocupados,pctOcup,atrasados,obras,incidentes,deudaLuz,deudaLuzArr,deudaAgua,deudaPredial};
  });

  // OPEX (gastos del período por categoría)
  const gastosPeriodo=DB.gastos.filter(g=>g.propietarioId===propId&&inRango(g.fecha));
  const opex={mano_obra:0,carros:0,mantenimiento:0,servicios:0,otros:0};
  const opexDetalle={mano_obra:[],carros:[],mantenimiento:[],servicios:[],otros:[]};
  gastosPeriodo.forEach(g=>{
    const c=g.categoria||'otros';
    opex[c]=(opex[c]||0)+Number(g.monto||0);
    if(!opexDetalle[c])opexDetalle[c]=[];
    // Etiqueta: descripción (y notas si aportan), inmueble
    const label=(g.descripcion||'').trim()||(g.notas||'').trim()||'(sin descripción)';
    opexDetalle[c].push({label,inmueble:g.inmueble||'',monto:Number(g.monto||0),notas:(g.notas||'').trim()});
  });
  // Agrupar detalle por descripción para no repetir (ej: "Freddy" varias veces -> suma)
  Object.keys(opexDetalle).forEach(c=>{
    const agr={};
    opexDetalle[c].forEach(it=>{
      const key=it.label.toLowerCase();
      if(!agr[key])agr[key]={label:it.label,monto:0,count:0};
      agr[key].monto+=it.monto;agr[key].count++;
    });
    opexDetalle[c]=Object.values(agr).sort((a,b)=>b.monto-a.monto);
  });

  return{prop,rango:r,porInmueble,opex,opexDetalle,gastosPeriodo};
}

// Carga PptxGenJS bajo demanda con varios CDN de respaldo
let _pptxLoading=null;
function ensurePptxGenJS(){
  if(typeof PptxGenJS!=='undefined')return Promise.resolve(true);
  if(_pptxLoading)return _pptxLoading;
  const urls=[
    'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js',
    'https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js',
    'https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.min.js'
  ];
  _pptxLoading=new Promise((resolve)=>{
    let idx=0;
    const tryNext=()=>{
      if(typeof PptxGenJS!=='undefined'){resolve(true);return;}
      if(idx>=urls.length){resolve(false);return;}
      const url=urls[idx++];
      const sc=document.createElement('script');
      sc.src=url;
      sc.onload=()=>{
        setTimeout(()=>{
          if(typeof PptxGenJS!=='undefined')resolve(true);
          else tryNext();
        },100);
      };
      sc.onerror=()=>{tryNext();};
      document.head.appendChild(sc);
    };
    tryNext();
  });
  return _pptxLoading;
}

function exportCuentasExcel(){
  try{
    const wb=XLSX.utils.book_new();
    const header=['PROPIETARIO','INMUEBLE','TIPO','ALIAS','MEDIDOR','NO. CUENTA','NOMBRE RECIBO','DEUDA ACTUAL','DEUDA AL CORTE (IMP.)','NOTA INQUILINO','NOTA INMUEBLE','INQUILINO VINCULADO','FECHA ACTUALIZACIÓN'];
    const S=v=>v===null||v===undefined?'':String(v);
    const buildRow=(sv)=>{
      const propObj=getPropietario(sv.propietarioId);
      const tipoN=(TIPOS_SVC[sv.tipo]||TIPOS_SVC.otro).n;
      const bal=getServicioBalance(sv.id);
      const inqVinc=(sv.tipo==='luz'||sv.tipo==='cfe')?DB.inquilinos.find(t=>t.cuentaLuzId===sv.id):null;
      return[S(propObj?.nombre),S(sv.inmueble),tipoN,S(sv.alias),S(sv.medidor),S(sv.cuenta),S(sv.nombre_recibo),bal,Number(sv.deuda_corte||0),S(sv.nota_inquilino),S(sv.nota_inmueble),inqVinc?S(inqVinc.nombre):'',S(sv.fecha_actualizacion)];
    };
    const ordenTipo={predial:0,agua:1,luz:2,cfe:2,gas:3,otro:4};
    const svcsSorted=DB.servicios.slice().sort((a,b)=>(a.inmueble||'').localeCompare(b.inmueble||'')||(ordenTipo[a.tipo]??9)-(ordenTipo[b.tipo]??9)||(a.alias||'').localeCompare(b.alias||''));
    // Hoja global
    const rows=[header,...svcsSorted.map(buildRow)];
    const totalDeuda=svcsSorted.reduce((s,sv)=>s+Math.max(0,getServicioBalance(sv.id)),0);
    rows.push([]);rows.push(['','','','','','','TOTAL DEUDA:',totalDeuda,'','','','','']);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:12},{wch:14},{wch:12},{wch:24},{wch:10},{wch:18},{wch:24},{wch:12},{wch:14},{wch:20},{wch:16},{wch:22},{wch:12}];
    XLSX.utils.book_append_sheet(wb,ws,'Todas');
    // Hoja por inmueble
    const inmuebles=[...new Set(svcsSorted.map(sv=>sv.inmueble).filter(Boolean))];
    inmuebles.forEach(inmN=>{
      const svcsInm=svcsSorted.filter(sv=>sv.inmueble===inmN);
      const r2=[header,...svcsInm.map(buildRow)];
      const dt=svcsInm.reduce((s,sv)=>s+Math.max(0,getServicioBalance(sv.id)),0);
      r2.push([]);r2.push(['','','','','','','TOTAL:',dt,'','','','','']);
      const ws2=XLSX.utils.aoa_to_sheet(r2);
      ws2['!cols']=ws['!cols'];
      XLSX.utils.book_append_sheet(wb,ws2,inmN.slice(0,28).replace(/[/\\?*:\[\]]/g,'_'));
    });
    XLSX.writeFile(wb,`cuentas_servicios_${todayISO()}.xlsx`);
    snack(`✓ Excel con ${svcsSorted.length} cuentas descargado`);
  }catch(e){console.error(e);snack('Error: '+e.message);}
}

// ── Cargador html2pdf (PDFs con formato, Segoe UI) ──
let _h2pLoading=null;
function ensureHtml2pdf(){
  if(typeof html2pdf!=='undefined')return Promise.resolve(true);
  if(_h2pLoading)return _h2pLoading;
  const urls=[
    'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js',
    'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js',
    'https://unpkg.com/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js'
  ];
  _h2pLoading=new Promise((resolve)=>{
    let idx=0;
    const tryNext=()=>{
      if(typeof html2pdf!=='undefined'){resolve(true);return;}
      if(idx>=urls.length){resolve(false);return;}
      const sc=document.createElement('script');sc.src=urls[idx++];
      sc.onload=()=>setTimeout(()=>{typeof html2pdf!=='undefined'?resolve(true):tryNext();},80);
      sc.onerror=tryNext;document.head.appendChild(sc);
    };
    tryNext();
  });
  return _h2pLoading;
}
// Genera PDF a partir de HTML interno, con hoja Segoe UI
async function pdfDesdeHTML(innerHTML, filename){
  snack('⏳ Generando PDF...');
  const ok=await ensureHtml2pdf();
  if(!ok){snack('⚠️ No se pudo cargar el generador de PDF (revisa tu conexión)');return;}
  const wrap=document.createElement('div');
  wrap.style.cssText='position:fixed;left:-9999px;top:0;width:794px;background:#fff';
  wrap.innerHTML=`<div style="font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#1a1a1a;padding:34px 38px;font-size:13px;line-height:1.5">${innerHTML}</div>`;
  document.body.appendChild(wrap);
  try{
    await html2pdf().set({
      margin:[8,0,10,0],filename,
      image:{type:'jpeg',quality:0.95},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
      pagebreak:{mode:['css','legacy']}
    }).from(wrap.firstChild).save();
    snack('✓ PDF descargado');
  }catch(e){console.error(e);snack('Error PDF: '+e.message);}
  finally{document.body.removeChild(wrap);}
}

function gastoRealLinea(propId,anio,mes,lineKey){
  return DB.gastos.filter(g=>g.propietarioId===propId&&g.subcat===lineKey&&(()=>{const d=new Date(g.fecha);return d.getMonth()===mes&&d.getFullYear()===anio;})()).reduce((s,g)=>s+Number(g.monto||0),0);
}
function calcPresup(d){
  const ing=presupIngresos(d.propId||presupCtx.propId);
  const L=d.lineas;const v=k=>Number(L[k]||0);
  const opexKeys=PRESUP_SECCIONES[1].lineas.filter(x=>x.tipo==='edit').map(x=>x.k);
  const opex=opexKeys.reduce((s,k)=>s+v(k),0);
  const ger=['ger_super','ger_temu','ger_amenidades_irma','ger_comida'].reduce((s,k)=>s+v(k),0);
  const pers=v('gastos_personales');
  const ingreso=ing.renta;
  return{deptos:ing.deptos,ingreso,opex,ger,pers,
    ganancia_op:ingreso-opex,ganancia_bruta:ingreso-opex,ganancia_final:ingreso-opex-ger-pers};
}

function openPresupuesto(propId,anio,mes){
  presupCtx={propId,anio,mes};
  const d=getPresupuesto(propId,anio,mes);d.propId=propId;
  const prop=getPropietario(propId);
  const ing=presupIngresos(propId);
  const calc=calcPresup(d);
  const pct=(n)=>ing.renta>0?(n/ing.renta*100).toFixed(1)+'%':'—';
  const row=(lin)=>{
    if(lin.tipo==='auto'){
      const val=lin.k==='num_deptos'?ing.deptos:ing.renta;
      return `<tr><td style="padding:7px 6px;font-size:11px">${lin.l}</td>
        <td style="text-align:right;font-size:12px;font-weight:600;padding:7px 4px">${lin.k==='num_deptos'?ing.deptos:fmt(ing.renta)}</td>
        <td style="text-align:right;font-size:10px;color:var(--dim);padding:7px 4px">—</td>
        <td style="text-align:right;font-size:10px;color:var(--dim);padding:7px 4px">${lin.k==='num_deptos'?'':'100%'}</td></tr>`;
    }
    if(lin.tipo==='calc'){
      const m={ingreso_estimado:ing.renta,opex_subtotal:calc.opex,ganancia_op:calc.ganancia_op,ger_subtotal:calc.ger,ganancia_bruta:calc.ganancia_bruta,ganancia_final:calc.ganancia_final}[lin.k]||0;
      return `<tr style="background:#EDF1F6"><td style="padding:8px 6px;font-size:11.5px;font-weight:700">${lin.l}</td>
        <td style="text-align:right;font-size:13px;font-weight:700;color:${m<0?'#E05C5C':'#0059A9'};padding:8px 4px">${fmt(m)}</td>
        <td style="text-align:right;font-size:10px;color:var(--dim);padding:8px 4px"></td>
        <td style="text-align:right;font-size:10px;color:var(--dim);padding:8px 4px">${pct(m)}</td></tr>`;
    }
    const real=gastoRealLinea(propId,anio,mes,lin.k);
    const presupVal=Number(d.lineas[lin.k]||0);
    return `<tr><td style="padding:5px 6px;font-size:11px">${lin.l}</td>
      <td style="padding:4px 4px"><input type="number" inputmode="decimal" value="${presupVal||''}" placeholder="0" onchange="setPresupLinea('${lin.k}',this.value)" style="width:78px;text-align:right;background:var(--s2);border:1px solid #CBD5DF;border-radius:6px;padding:5px 6px;font-size:12px;color:var(--txt)"></td>
      <td style="text-align:right;font-size:11px;padding:5px 4px;color:${real>0?(real>presupVal&&presupVal>0?'#E05C5C':'#426A54'):'var(--dim)'}">${real>0?fmt(real):'—'}</td>
      <td style="text-align:right;font-size:10px;color:var(--dim);padding:5px 4px">${presupVal>0?pct(presupVal):''}</td></tr>`;
  };
  let tabla='';
  PRESUP_SECCIONES.forEach(s=>{
    tabla+=`<tr><td colspan="4" style="background:${s.color};color:#fff;font-size:10px;font-weight:700;letter-spacing:.5px;padding:6px 8px">${s.sec}</td></tr>`;
    s.lineas.forEach(l=>tabla+=row(l));
  });
  modal(`<div class="ms" style="max-height:94vh"><div class="mh"></div>
    <div class="mt2">📋 Presupuesto · ${prop?.nombre||''}</div>
    <div style="font-size:11px;color:var(--dim);margin-bottom:10px">${MF[mes]} ${anio} · columna <b>Real</b> se llena sola con los gastos del mes que tengan subcategoría.</div>
    <div style="overflow-x:auto;border:1px solid #E4E9EF;border-radius:9px">
    <table style="width:100%;border-collapse:collapse">
      <thead><tr style="background:var(--s2)">
        <th style="text-align:left;padding:7px 6px;font-size:9px;color:var(--dim);text-transform:uppercase">Concepto</th>
        <th style="text-align:right;padding:7px 4px;font-size:9px;color:var(--dim);text-transform:uppercase">Presupuesto</th>
        <th style="text-align:right;padding:7px 4px;font-size:9px;color:var(--dim);text-transform:uppercase">Real</th>
        <th style="text-align:right;padding:7px 4px;font-size:9px;color:var(--dim);text-transform:uppercase">% ing.</th>
      </tr></thead><tbody>${tabla}</tbody></table></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn bg" style="flex:1" onclick="exportPresupuestoPDF('${propId}',${anio},${mes})">📄 PDF</button>
      <button class="btn bo" onclick="closeM()">Cerrar</button>
    </div><div style="height:14px"></div></div>`);
}
function setPresupLinea(k,val){
  const d=getPresupuesto(presupCtx.propId,presupCtx.anio,presupCtx.mes);
  d.lineas[k]=Number(val)||0;
  saveDB('presupuestos');
  // refrescar totales sin cerrar
  openPresupuesto(presupCtx.propId,presupCtx.anio,presupCtx.mes);
}
async function exportPresupuestoPDF(propId,anio,mes){
  const d=getPresupuesto(propId,anio,mes);d.propId=propId;
  const prop=getPropietario(propId);const ing=presupIngresos(propId);const calc=calcPresup(d);
  const pct=(n)=>ing.renta>0?(n/ing.renta*100).toFixed(1)+'%':'';
  let rows='';
  PRESUP_SECCIONES.forEach(s=>{
    rows+=`<tr><td colspan="4" style="background:${s.color};color:#fff;font-weight:700;font-size:11px;padding:6px 8px">${s.sec}</td></tr>`;
    s.lineas.forEach(l=>{
      let val,realCol='';
      if(l.tipo==='auto')val=l.k==='num_deptos'?ing.deptos:fmt(ing.renta);
      else if(l.tipo==='calc'){const m={ingreso_estimado:ing.renta,opex_subtotal:calc.opex,ganancia_op:calc.ganancia_op,ger_subtotal:calc.ger,ganancia_bruta:calc.ganancia_bruta,ganancia_final:calc.ganancia_final}[l.k]||0;val='<b>'+fmt(m)+'</b>';}
      else{const pv=Number(d.lineas[l.k]||0);val=pv?fmt(pv):'—';const rl=gastoRealLinea(propId,anio,mes,l.k);realCol=rl?fmt(rl):'';}
      const isCalc=l.tipo==='calc';
      rows+=`<tr style="${isCalc?'background:#f0f4f8;':''}"><td style="padding:5px 8px;border-bottom:1px solid #eee;font-size:12px">${l.l}</td>
        <td style="padding:5px 8px;border-bottom:1px solid #eee;text-align:right;font-size:12px">${val}</td>
        <td style="padding:5px 8px;border-bottom:1px solid #eee;text-align:right;font-size:11px;color:#555">${realCol}</td>
        <td style="padding:5px 8px;border-bottom:1px solid #eee;text-align:right;font-size:11px;color:#888">${l.tipo==='edit'&&d.lineas[l.k]?pct(Number(d.lineas[l.k])):(l.tipo==='calc'?pct({ingreso_estimado:ing.renta,opex_subtotal:calc.opex,ganancia_op:calc.ganancia_op,ger_subtotal:calc.ger,ganancia_bruta:calc.ganancia_bruta,ganancia_final:calc.ganancia_final}[l.k]||0):'')}</td></tr>`;
    });
  });
  const inner=pdfEncabezado('Presupuesto mensual — estado de resultados',`${prop?.nombre||''} · ${MF[mes]} ${anio}`)+
    `<table style="width:100%;border-collapse:collapse">
      <thead><tr><th style="text-align:left;padding:6px 8px;border-bottom:2px solid #0059A9;font-size:11px">Concepto</th>
      <th style="text-align:right;padding:6px 8px;border-bottom:2px solid #0059A9;font-size:11px">Presupuesto</th>
      <th style="text-align:right;padding:6px 8px;border-bottom:2px solid #0059A9;font-size:11px">Real</th>
      <th style="text-align:right;padding:6px 8px;border-bottom:2px solid #0059A9;font-size:11px">% ing.</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  await pdfDesdeHTML(inner,`presupuesto_${(prop?.nombre||'').replace(/\s+/g,'_')}_${anio}_${String(mes+1).padStart(2,'0')}.pdf`);
}

  plomeria:{n:'Plomería',i:'🚰',cats:['PLOM'],subcat:'rep_plomeria'},

function waLink(tel,texto){
  const n=(tel||'').replace(/\D/g,'');
  const num=n?(n.length===10?'52'+n:n):'';
  return 'https://wa.me/'+num+'?text='+encodeURIComponent(texto);
}

function saveTecnico(id){
  const nom=document.getElementById('tc-nom').value.trim();
  if(!nom){snack('Falta nombre');return;}
  const obj={nombre:nom,telefono:document.getElementById('tc-tel').value.trim(),
    especialidades:Array.from(document.querySelectorAll('.tc-esp:checked')).map(x=>x.value),
    zonas:Array.from(document.querySelectorAll('.tc-zona:checked')).map(x=>x.value),
    costo_prom:Number(document.getElementById('tc-costo').value)||0,
    notas:document.getElementById('tc-notas').value.trim()};
  if(id)Object.assign(DB.tecnicos.find(x=>x.id===id),obj);
  else DB.tecnicos.push({id:uid(),...obj,creado:nowISO()});
  saveDB('tecnicos');closeM();snack('Técnico guardado ✓');openTecnicos();
}
function delTecnico(id){if(!confirm('¿Eliminar técnico?'))return;DB.tecnicos=DB.tecnicos.filter(x=>x.id!==id);saveDB('tecnicos');closeM();snack('Eliminado');openTecnicos();}

function incInmueble(i){
  return DB.inmuebles.find(x=>{const l=(i.lugar||'').toLowerCase(),n=(x.nombre||'').toLowerCase();return l&&n&&(l.includes(n)||n.includes(l));});

function renderOTBlock(i){

    return `<div class="st-sm" style="margin-top:16px">🧰 Orden de trabajo</div>
      <button class="btn bo bfu" onclick="openAgendarTecnico('${i.id}')" style="text-align:left;padding:11px 14px">

  const tec=DB.tecnicos.find(x=>x.id===ot.tecnicoId);
  const tipo=TIPOS_MANT[ot.tipo]||TIPOS_MANT.otro;
  const ficha=ot.fichaN?FICHAS_MANT.find(f=>f.n===ot.fichaN):null;

      <div class="ir"><span class="ik">Cita</span><span class="iv">${ot.cita_fecha||'—'}${ot.cita_hora?' '+ot.cita_hora:''}</span></div>
      ${ficha?`<div class="ir"><span class="ik">Ficha</span><span class="iv" style="cursor:pointer;color:var(--gold)" onclick="openFichaDetail(${ficha.n},'')">#${ficha.n} ${ficha.titulo}</span></div>`:''}
      ${ot.cerrado?`<div class="ir"><span class="ik">Estado</span><span class="iv" style="color:var(--g)">✓ Cerrado · ${fmt(ot.costo||0)}</span></div>`:''}

function agSugerirTecnicos(zona){
  const tipo=document.getElementById('ot-tipo').value;
  const zsel=document.getElementById('ot-tec');
  let techs=DB.tecnicos.filter(t=>(t.especialidades||[]).includes(tipo));
  if(zona)techs=techs.filter(t=>!t.zonas||!t.zonas.length||t.zonas.includes(zona));
  if(techs.length===0)techs=DB.tecnicos.slice();
  zsel.innerHTML=techs.length?techs.map(t=>`<option value="${t.id}">${t.nombre}${t.costo_prom?' · ~'+fmt(t.costo_prom):''}</option>`).join(''):'<option value="">— Sin técnicos —</option>';
  // fichas sugeridas por tipo
  const fsel=document.getElementById('ot-ficha');
  const cats=TIPOS_MANT[tipo]?.cats||[];
  let fichas=cats.length?FICHAS_MANT.filter(f=>cats.includes(f.cat)):FICHAS_MANT.slice();
  fsel.innerHTML='<option value="">— Sin ficha —</option>'+FICHAS_MANT.map(f=>`<option value="${f.n}"${fichas.includes(f)&&fichas[0]===f?' selected':''}>#${f.n} ${f.titulo}</option>`).join('');
}
function saveOT(incId,zona){
  const i=DB.incidentes.find(x=>x.id===incId);if(!i)return;
  i.ot=Object.assign(i.ot||{},{
    agendado:true,tipo:document.getElementById('ot-tipo').value,

function saveCierreTrabajo(incId){
  const i=DB.incidentes.find(x=>x.id===incId);if(!i)return;
  const sol=document.getElementById('cl-sol').value.trim();
  const costo=Number(document.getElementById('cl-costo').value)||0;
  if(!sol){snack('Describe la solución');return;}
  const cat=document.getElementById('cl-cat').value;
  i.ot=Object.assign(i.ot||{},{
    cerrado:true,solucion:sol,costo,
    fotos_despues:[...pendingPhotos],
    criterios:Array.from(document.querySelectorAll('.cl-crit:checked')).map(x=>Number(x.dataset.idx)),
    fecha_cierre:nowISO()
  });
  i.resuelto=true;i.fecha_resolucion=nowISO();i.notas_resolucion=sol;
  // Generar gasto ligado
  if(costo>0){
    const inm=incInmueble(i);
    const subcat=TIPOS_MANT[i.ot.tipo]?.subcat||'';
    const g={id:uid(),categoria:cat,subcat,monto:costo,descripcion:'OT '+(i.numero||'')+': '+sol.slice(0,40),
      fecha:nowISO(),propietarioId:inm?.propietarioId||'',inmueble:inm?.nombre||i.lugar||'',notas:'Generado por cierre de incidente',incidenteId:i.id,creado:nowISO()};
    DB.gastos.push(g);i.ot.gastoId=g.id;saveDB('gastos');
  }
  pendingPhotos=[];saveDB('incidentes');
  snack('✓ Trabajo cerrado'+(costo>0?' y gasto registrado':''));
  openIncidenteDetail(incId);
}

async function exportListaInqPDF(propId){
  const prop=getPropietario(propId);
  const inms=DB.inmuebles.filter(x=>x.propietarioId===propId).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));
  let rows='',totalEsp=0,totalCob=0,unidades=0,ocupadas=0;
  inms.forEach(inm=>{
    const tenants=DB.inquilinos.filter(t=>t.estado==='activo'&&(t.inmuebleId===inm.id||t.inmueble===inm.nombre))
      .sort((a,b)=>(a.interior||'').localeCompare(b.interior||'',undefined,{numeric:true}));
    const totDep=inm.total_depas||tenants.length;
    unidades+=totDep;
    tenants.forEach(t=>{
      const renta=Number(t.renta||0);
      const vac=renta<=0||/vac[íi]o/i.test(t.nombre||'');
      if(!vac){ocupadas++;totalEsp+=renta;}
      const pagado=isPagado(t.id,HM,HA);if(pagado)totalCob+=renta;
      const est=getContratoEstado?getContratoEstado(t):null;
      const venc=est&&est.vence?est.vence.toLocaleDateString('es-MX'):'—';
      const estatus=vac?'<span style="color:#999">Vacío</span>':(pagado?'<span style="color:#426A54">Al corriente</span>':(isLate(t.id,HM,HA)?'<span style="color:#E05C5C">Vencido</span>':'<span style="color:#B8860B">Pendiente</span>'));
      rows+=`<tr>
        <td style="padding:4px 6px;border-bottom:1px solid #eee;font-size:11px">${inm.nombre}</td>
        <td style="padding:4px 6px;border-bottom:1px solid #eee;font-size:11px">${t.interior||'—'}</td>
        <td style="padding:4px 6px;border-bottom:1px solid #eee;font-size:11px">${vac?'—':(t.nombre||'')}</td>
        <td style="padding:4px 6px;border-bottom:1px solid #eee;font-size:11px;text-align:right">${vac?'—':fmt(renta)}</td>
        <td style="padding:4px 6px;border-bottom:1px solid #eee;font-size:11px">${t.renovacion||'—'}</td>
        <td style="padding:4px 6px;border-bottom:1px solid #eee;font-size:11px">${venc}</td>
        <td style="padding:4px 6px;border-bottom:1px solid #eee;font-size:11px">${estatus}</td></tr>`;
    });
  });
  const pend=Math.max(0,totalEsp-totalCob);
  const ocupPct=unidades>0?Math.round(ocupadas/unidades*100):0;
  const inner=pdfEncabezado('Lista inquilinaria',`${prop?.nombre||''} · ${MF[HM-1]} ${HA}`)+
    `<table style="width:100%;border-collapse:collapse">
      <thead><tr>${['Inmueble','Unidad','Inquilino','Renta','Inicio','Vence','Estatus'].map(h=>`<th style="text-align:left;padding:6px;border-bottom:2px solid #0059A9;font-size:10px;color:#0059A9">${h}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody></table>
    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
      <div style="flex:1;min-width:120px;background:#EDF1F6;border-radius:6px;padding:10px;text-align:center"><div style="font-size:10px;color:#555">OCUPACIÓN</div><div style="font-size:18px;font-weight:700;color:#0059A9">${ocupPct}%</div><div style="font-size:10px;color:#888">${ocupadas}/${unidades}</div></div>
      <div style="flex:1;min-width:120px;background:#EDF1F6;border-radius:6px;padding:10px;text-align:center"><div style="font-size:10px;color:#555">BRUTO ESPERADO</div><div style="font-size:18px;font-weight:700;color:#16202E">${fmt(totalEsp)}</div></div>
      <div style="flex:1;min-width:120px;background:#EDF1F6;border-radius:6px;padding:10px;text-align:center"><div style="font-size:10px;color:#555">COBRADO</div><div style="font-size:18px;font-weight:700;color:#426A54">${fmt(totalCob)}</div></div>
      <div style="flex:1;min-width:120px;background:#EDF1F6;border-radius:6px;padding:10px;text-align:center"><div style="font-size:10px;color:#555">PENDIENTE</div><div style="font-size:18px;font-weight:700;color:#E05C5C">${fmt(pend)}</div></div>
    </div>`;
  await pdfDesdeHTML(inner,`lista_inquilinaria_${(prop?.nombre||'').replace(/\s+/g,'_')}_${HA}_${String(HM).padStart(2,'0')}.pdf`);
}
