function smartImportInquilinos(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        const newList=d.inquilinos||[];
        if(!newList.length){snack('JSON sin inquilinos');return;}
        // Match by nombre+inmueble (case insensitive)
        const existingByKey=new Map();
        DB.inquilinos.forEach(t=>{
          const k=(t.nombre+'|'+t.inmueble).toLowerCase().trim();
          existingByKey.set(k,t);
        });
        const updated=[];const matchedIds=new Set();
        let nuevos=0,actualizados=0;
        newList.forEach(n=>{
          const k=(n.nombre+'|'+n.inmueble).toLowerCase().trim();
          const ex=existingByKey.get(k);
          if(ex){
            updated.push({...ex,...n,id:ex.id});  // preserve ID, merge data
            matchedIds.add(ex.id);
            actualizados++;
          }else{
            updated.push({...n,id:uid()});
            nuevos++;
          }
        });
        // Keep old tenants not in new list, mark as inactive
        let inactivados=0;
        DB.inquilinos.forEach(t=>{
          if(!matchedIds.has(t.id)){
            updated.push({...t,estado:'inactivo'});
            inactivados++;
          }
        });
        if(!confirm(`Resultado de actualización:\n\n• ${actualizados} inquilinos actualizados\n• ${nuevos} inquilinos nuevos\n• ${inactivados} inquilinos marcados como inactivos\n\nLos pagos existentes se conservan. ¿Aplicar?`))return;
        DB.inquilinos=updated;
        saveDB('inquilinos');
        snack('✓ Inquilinos actualizados');
        renderRep();
      }catch(err){snack('Error: '+err.message)}
    };r.readAsText(f);
  };inp.click();
}

async function handlePhotos(e,max){
  const files=Array.from(e.target.files).slice(0,max-pendingPhotos.length);
  if(pendingPhotos.length+files.length>max){snack('Máx '+max+' fotos');return;}
  for(const f of files){
    try{
      const b64=await compressImage(f);
      pendingPhotos.push(b64);
    }catch(err){snack('Error procesando foto')}
  }
  e.target.value='';
  // Find which grid is open
  if(document.getElementById('o-photos-grid'))renderPendingPhotos('o-photos-grid');
  if(document.getElementById('i-photos-grid'))renderPendingPhotos('i-photos-grid');
  if(document.getElementById('ins-photos-grid'))renderPendingPhotos('ins-photos-grid');
}

function renderPendingPhotos(gridId){
  const grid=document.getElementById(gridId);
  if(!grid)return;
  let html='';
  pendingPhotos.forEach((p,idx)=>{
    html+=`<div class="photo-thumb" style="background-image:url('${p}')" onclick="viewFullImg('${idx}','pending')"><button class="photo-remove" onclick="event.stopPropagation();removePending(${idx},'${gridId}')">×</button></div>`;
  });
  grid.innerHTML=html;
}

function removePending(idx,gridId){
  pendingPhotos.splice(idx,1);
  renderPendingPhotos(gridId);
}

function viewFullImg(idx,src){
  let img='';
  if(src==='pending')img=pendingPhotos[idx];
  else img=idx;
  const ov=document.createElement('div');
  ov.className='full-img';
  ov.innerHTML=`<img src="${img}"><button onclick="this.parentElement.remove()">✕</button>`;
  ov.onclick=(e)=>{if(e.target===ov)ov.remove();};
  document.body.appendChild(ov);
}

function saveObra(id){
  const tipo=document.getElementById('o-tipo').value;
  const fecha=document.getElementById('o-fecha').value;
  const costo=document.getElementById('o-costo').value;
  const inm=document.getElementById('o-inm').value.trim();
  const desc=document.getElementById('o-desc').value.trim();
  if(!fecha||!costo||!inm||!desc){snack('Completa los campos obligatorios');return;}
  const [yy,mm,dd]=fecha.split('-').map(Number);
  const now=new Date();
  const fechaLocal=new Date(yy,mm-1,dd,now.getHours(),now.getMinutes(),now.getSeconds());
  const obj={
    tipo,fecha:fechaLocal.toISOString(),
    costo:Number(costo),inmueble:inm,descripcion:desc,
    trabajador:document.getElementById('o-trab').value.trim(),
    fotos:[...pendingPhotos],
    gastoVinculado:document.getElementById('o-gasto').value==='si'
  };
  if(id){
    const ex=DB.obras.find(x=>x.id===id);
    // Remove existing linked gasto if any
    if(ex.gastoId)DB.gastos=DB.gastos.filter(g=>g.id!==ex.gastoId);
    Object.assign(ex,obj);
  }else{
    DB.obras.push({id:uid(),...obj,creado:nowISO()});
  }
  // Crear gasto vinculado
  if(obj.gastoVinculado){
    const tn=TIPOS_OBRA[tipo]?.n||'Obra';
    const gastoId=uid();
    DB.gastos.push({
      id:gastoId,categoria:'mano_obra',monto:Number(costo),
      descripcion:`${tn} — ${desc.slice(0,40)}`,
      fecha:obj.fecha,inmueble:inm,notas:'Vinculado a reporte de obra',
      creado:nowISO(),obraId:id||DB.obras[DB.obras.length-1].id
    });
    if(id){DB.obras.find(x=>x.id===id).gastoId=gastoId;}
    else{DB.obras[DB.obras.length-1].gastoId=gastoId;}
    saveDB('gastos');
  }
  saveDB('obras');
  closeM();snack(id?'Obra actualizada ✓':'Reporte de obra creado ✓');
  pendingPhotos=[];
  renderRep();
}

function buildIncidenteInqOptions(lugar,selectedId){
  const lugarLower=(lugar||'').toLowerCase().trim();
  let inqs=DB.inquilinos.filter(x=>x.estado==='activo');
  if(lugarLower){
    inqs=inqs.filter(x=>{
      const inm=(x.inmueble||'').toLowerCase();
      return lugarLower.includes(inm)||inm.includes(lugarLower);
    });
  }
  // Include selected even if filter would exclude
  if(selectedId&&selectedId!=='_vacio_'&&!inqs.find(x=>x.id===selectedId)){
    const cur=DB.inquilinos.find(x=>x.id===selectedId);
    if(cur)inqs.push(cur);
  }
  let html=`<option value=""${!selectedId?' selected':''}>— Ninguno —</option>`;
  html+=`<option value="_vacio_"${selectedId==='_vacio_'?' selected':''}>🏠 Departamento vacío / sin inquilino</option>`;
  inqs.forEach(x=>{
    html+=`<option value="${x.id}"${selectedId===x.id?' selected':''}>${x.nombre}${x.interior?' · Int '+x.interior:''} — ${x.inmueble}</option>`;
  });
  return html;
}

function rebuildIncidenteInqOptions(){
  const sel=document.getElementById('i-inq');
  if(!sel)return;
  const currentVal=sel.value;
  const lugar=document.getElementById('i-lugar').value;
  sel.innerHTML=buildIncidenteInqOptions(lugar,currentVal);
}

function saveIncidente(id,numero){
  const fecha=document.getElementById('i-fecha').value;
  const hora=document.getElementById('i-hora').value;
  const lugar=document.getElementById('i-lugar').value.trim();
  const desc=document.getElementById('i-desc').value.trim();
  if(!fecha||!hora||!lugar||!desc){snack('Completa los campos obligatorios');return;}
  const inqIdVal=document.getElementById('i-inq').value;
  const obj={
    numero,fecha:fecha+'T'+hora+':00',hora,lugar,
    inqId:inqIdVal==='_vacio_'?'':inqIdVal,
    depto_vacio:inqIdVal==='_vacio_',
    nivel:Number(document.getElementById('i-nivel').value),
    descripcion:desc,accion:document.getElementById('i-accion').value.trim(),
    fotos:[...pendingPhotos]
  };
  if(id){Object.assign(DB.incidentes.find(x=>x.id===id),obj);}
  else{DB.incidentes.push({id:uid(),...obj,creado:nowISO()});}
  saveDB('incidentes');closeM();snack(id?'Actualizado ✓':'Incidente #'+numero+' guardado ✓');
  pendingPhotos=[];renderRep();
}

function marcarResuelto(id){
  const i=DB.incidentes.find(x=>x.id===id);if(!i)return;
  const notas=prompt('Notas de cómo se resolvió (opcional):','');
  if(notas===null)return;
  i.resuelto=true;
  i.fecha_resolucion=nowISO();
  if(notas)i.notas_resolucion=notas;
  saveDB('incidentes');
  closeM();snack(`✓ Incidente ${i.numero} resuelto`);renderRep();
}

function reabrirIncidente(id){
  const i=DB.incidentes.find(x=>x.id===id);if(!i)return;
  if(!confirm('¿Reabrir este incidente?'))return;
  i.resuelto=false;
  delete i.fecha_resolucion;
  saveDB('incidentes');
  closeM();snack('Incidente reabierto');renderRep();
}

function delIncidente(id){
  if(!confirm('¿Eliminar este incidente?'))return;
  DB.incidentes=DB.incidentes.filter(x=>x.id!==id);
  saveDB('incidentes');closeM();snack('Eliminado');renderRep();
}

function setInspEstado(k,estado){
  if(!curInspeccion.items)curInspeccion.items={};
  if(!curInspeccion.items[k])curInspeccion.items[k]={};
  // Toggle: si ya tenía ese estado, lo quita
  if(curInspeccion.items[k].estado===estado)curInspeccion.items[k].estado=null;
  else curInspeccion.items[k].estado=estado;
  // Save fields too
  curInspeccion.fecha=document.getElementById('ins-fecha').value;
  curInspeccion.inmueble=document.getElementById('ins-inmueble').value;
  curInspeccion.inspector=document.getElementById('ins-inspector').value;
  curInspeccion.inquilino_id=document.getElementById('ins-inq').value;
  curInspeccion.notas=document.getElementById('ins-notas').value;
  // Save scroll position
  const ms=document.querySelector('.ms');const scrollT=ms?.scrollTop||0;
  renderInspeccionForm();
  setTimeout(()=>{const ms2=document.querySelector('.ms');if(ms2)ms2.scrollTop=scrollT;},0);
}

function setInspObs(k,val){
  if(!curInspeccion.items)curInspeccion.items={};
  if(!curInspeccion.items[k])curInspeccion.items[k]={};
  curInspeccion.items[k].observaciones=val;
}

function saveInspeccion(){
  const ins=curInspeccion;

  ins.inmueble=document.getElementById('ins-inmueble').value.trim();
  ins.inspector=document.getElementById('ins-inspector').value.trim();
  ins.inquilino_id=document.getElementById('ins-inq').value;

  ins.fotos=[...pendingPhotos];
  if(!ins.inmueble||!ins.fecha){snack('Falta inmueble o fecha');return;}
  // Calcular calificación final
  let scoreObt=0,scoreMax=0;
  Object.values(INSPECCION_TEMPLATE).forEach(cat=>{cat.items.forEach(it=>{
    scoreMax+=it.max;
    const est=ins.items?.[it.k]?.estado;
    if(est&&ESTADOS_INSP[est])scoreObt+=it.max*ESTADOS_INSP[est].mult;
  });});
  ins.score=scoreObt;ins.score_max=scoreMax;
  ins.porcentaje=scoreMax>0?(scoreObt/scoreMax*100):0;

// PDF de la inspección llena
function genPDFInspeccion(id){
  const ins=DB.inspecciones.find(x=>x.id===id);if(!ins)return;
  const inq=ins.inquilino_id?DB.inquilinos.find(x=>x.id===ins.inquilino_id):null;
  const doc=pdfBase('LISTA DE INSPECCIÓN DE DEPARTAMENTO',ins.inmueble);
  let y=42;
  // Info general

// ─── RESUMEN DIARIO POR CORREO ───────────────────
function buildDailySummary(fecha){
  const d=new Date(fecha);d.setHours(0,0,0,0);
  const dNext=new Date(d.getTime()+86400000);
  const inRange=(dateStr)=>{if(!dateStr)return false;const dd=new Date(dateStr);if(isNaN(dd))return false;return dd>=d&&dd<dNext;};
  const pagos=DB.pagos.filter(p=>inCartera(p)&&p.pagado&&inRange(p.fecha_pago));
  const otros=DB.otros_ingresos.filter(o=>inCartera(o)&&inRange(o.fecha));
  const gastos=DB.gastos.filter(g=>inCartera(g)&&inRange(g.fecha));
  const incidentesNuevos=DB.incidentes.filter(i=>inCartera(i)&&inRange(i.fecha));
  const incidentesResueltos=DB.incidentes.filter(i=>inCartera(i)&&i.resuelto&&inRange(i.fecha_resolucion));
  const obras=DB.obras.filter(o=>inCartera(o)&&inRange(o.fecha));
  const inspecciones=DB.inspecciones.filter(ins=>inCartera(ins)&&inRange(ins.fecha));
  const recibosSvc=DB.recibos_servicios.filter(r=>inCartera(r)&&inRange(r.fecha));
  const pagosSvc=DB.pagos_servicios.filter(p=>inCartera(p)&&inRange(p.fecha));
  const totalCobrado=pagos.reduce((s,p)=>s+Number(p.monto||0),0);
  const totalOtros=otros.reduce((s,o)=>s+Number(o.monto||0),0);
  const totalGastos=gastos.reduce((s,g)=>s+Number(g.monto||0),0);
  const neto=totalCobrado+totalOtros-totalGastos;
  const totalActivos=DB.incidentes.filter(i=>!i.resuelto&&inCartera(i)).length;
  return{fecha:d,pagos,otros,gastos,incidentesNuevos,incidentesResueltos,obras,inspecciones,recibosSvc,pagosSvc,totalCobrado,totalOtros,totalGastos,neto,totalActivos};
}

function renderDailySummaryText(data){
  const line='━━━━━━━━━━━━━━━━━━━━━━━━━━━━';
  const dateStr=data.fecha.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  let out=`📊 RESUMEN DE OPERACIÓN\n${dateStr}\n\n${line}\n\n`;
  // Cobranza
  out+=`💰 COBRANZA DEL DÍA\n`;
  out+=`Cobrado: ${fmt(data.totalCobrado)}\n`;
  out+=`Pagos recibidos: ${data.pagos.length}\n`;
  if(data.pagos.length>0){
    out+=`\nDetalle:\n`;
    data.pagos.sort((a,b)=>new Date(a.fecha_pago)-new Date(b.fecha_pago)).forEach(p=>{
      const t=DB.inquilinos.find(i=>i.id===p.iid);
      const hora=new Date(p.fecha_pago).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
      out+=`• ${t?.nombre||'?'} — ${t?.inmueble||''}${t?.interior?' Int '+t.interior:''} — ${fmt(p.monto)} (${p.destino||'-'}, ${hora})${p.adelantado?' ✨':''}\n`;
    });
  }
  out+=`\n${line}\n\n`;
  // Gastos
  if(data.gastos.length>0){
    out+=`💸 GASTOS REGISTRADOS\n`;
    out+=`Total: ${fmt(data.totalGastos)}\n\n`;
    data.gastos.forEach(g=>{
      const cat=CATS_GASTO[g.categoria]?.n||g.categoria;
      out+=`• ${g.descripcion} — ${fmt(g.monto)} — ${cat}${g.inmueble?' — '+g.inmueble:''}\n`;
    });
    out+=`\n${line}\n\n`;
  }
  // Otros ingresos
  if(data.otros.length>0){
    out+=`💵 OTROS INGRESOS\n`;
    out+=`Total: ${fmt(data.totalOtros)}\n\n`;
    data.otros.forEach(o=>{
      const cat=CATS_OTROS_ING[o.categoria]?.n||o.categoria;
      out+=`• ${o.concepto} — ${fmt(o.monto)} — ${cat}${o.inmueble?' — '+o.inmueble:''}\n`;
    });
    out+=`\n${line}\n\n`;
  }
  // Incidentes
  if(data.incidentesNuevos.length>0||data.incidentesResueltos.length>0){
    out+=`🚨 INCIDENTES\n`;
    if(data.incidentesNuevos.length>0){
      out+=`\n${data.incidentesNuevos.length} nuevo${data.incidentesNuevos.length===1?'':'s'}:\n`;
      data.incidentesNuevos.forEach(i=>{
        const n=NIVELES_INC.find(x=>x.k===i.nivel)?.n||'-';
        out+=`• #${i.numero} — ${i.lugar}${i.depto_vacio?' (vacío)':''} — ${(i.descripcion||'').slice(0,100)} — ${n}\n`;
      });
    }
    if(data.incidentesResueltos.length>0){
      out+=`\n${data.incidentesResueltos.length} resuelto${data.incidentesResueltos.length===1?'':'s'} hoy:\n`;
      data.incidentesResueltos.forEach(i=>{
        out+=`• #${i.numero} — ${i.lugar}${i.notas_resolucion?' — '+i.notas_resolucion.slice(0,80):''}\n`;
      });
    }
    out+=`\nEstado: ${data.totalActivos} incidente${data.totalActivos===1?'':'s'} activo${data.totalActivos===1?'':'s'} en total\n\n${line}\n\n`;
  }
  // Obras
  if(data.obras.length>0){
    out+=`🔨 OBRAS DEL DÍA\n`;
    data.obras.forEach(o=>{
      const t=TIPOS_OBRA[o.tipo]?.n||o.tipo;
      out+=`• ${t} — ${o.inmueble||'?'} — ${fmt(o.costo)}${o.trabajador?' — '+o.trabajador:''}\n`;
    });
    out+=`\n${line}\n\n`;
  }
  // Inspecciones
  if(data.inspecciones.length>0){
    out+=`🏠 INSPECCIONES\n`;
    data.inspecciones.forEach(ins=>{
      out+=`• ${ins.inmueble} — ${(ins.porcentaje||0).toFixed(1)}%${ins.inspector?' — '+ins.inspector:''}\n`;
    });
    out+=`\n${line}\n\n`;
  }
  // Servicios (recibos y pagos)
  if(data.recibosSvc.length>0||data.pagosSvc.length>0){
    out+=`🔧 SERVICIOS\n`;
    if(data.recibosSvc.length>0){
      out+=`\nRecibos registrados:\n`;
      data.recibosSvc.forEach(r=>{
        const sv=DB.servicios.find(x=>x.id===r.servicioId);
        const tipo=sv?TIPOS_SVC[sv.tipo]?.n||sv.tipo:'?';
        out+=`• ${tipo} ${sv?.inmueble||''} — ${fmt(r.monto)}${r.concepto?' — '+r.concepto:''}\n`;
      });
    }
    if(data.pagosSvc.length>0){
      out+=`\nPagos realizados:\n`;
      data.pagosSvc.forEach(p=>{
        const sv=DB.servicios.find(x=>x.id===p.servicioId);
        const tipo=sv?TIPOS_SVC[sv.tipo]?.n||sv.tipo:'?';
        out+=`• ${tipo} ${sv?.inmueble||''} — ${fmt(p.monto)}${p.concepto?' — '+p.concepto:''}\n`;
      });
    }
    out+=`\n${line}\n\n`;
  }
  // Neto
  out+=`📈 NETO DEL DÍA\n`;
  out+=`Ingresos: ${fmt(data.totalCobrado+data.totalOtros)}\n`;
  out+=`Gastos: ${fmt(data.totalGastos)}\n`;
  out+=`NETO: ${fmt(data.neto)}\n`;
  out+=`\n${line}\n`;
  out+=`\nGenerado desde Gestión de Rentas\n${new Date().toLocaleString('es-MX')}`;
  return out;
}

  const totalItems=data.pagos.length+data.gastos.length+data.otros.length+data.incidentesNuevos.length+data.incidentesResueltos.length+data.obras.length+data.inspecciones.length+data.recibosSvc.length+data.pagosSvc.length;

      <button class="btn bo" onclick="copyDailySummary('${fechaStr}')">📋 Copiar</button>
      ${navigator.share?`<button class="btn bo" onclick="shareDailySummary('${fechaStr}')">📤 Compartir…</button>`:''}
    </div>
    <div style="font-size:10px;color:var(--dim);margin-top:12px;text-align:center">Correo abre tu app de correo · WhatsApp abre chat para elegir contacto · Copiar deja el texto en el portapapeles</div>
    </div>`);
}

function sendDailyEmail(fechaStr){
  const emails=document.getElementById('ds-emails').value.trim();
  if(!emails){snack('Agrega al menos un destinatario');return;}
  localStorage.setItem('rentas_emails',emails);
  const [yy,mm,dd]=fechaStr.split('-').map(Number);
  const fecha=new Date(yy,mm-1,dd);
  const data=buildDailySummary(fecha);
  const text=renderDailySummaryText(data);
  const subject=`Resumen ${fecha.toLocaleDateString('es-MX')} — Gestión de Rentas`;
  const mailtoUrl=`mailto:${emails}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
  if(mailtoUrl.length>6000){
    if(!confirm(`El resumen es muy largo (${text.length} caracteres). Algunos correos pueden truncarlo. ¿Continuar de todos modos?\n\nAlternativa: usar "Copiar" y pegar en un correo nuevo.`))return;
  }
  window.location.href=mailtoUrl;
  snack('📧 Abriendo tu app de correo…');
}

function copyDailySummary(fechaStr){
  const [yy,mm,dd]=fechaStr.split('-').map(Number);
  const fecha=new Date(yy,mm-1,dd);
  const data=buildDailySummary(fecha);
  const text=renderDailySummaryText(data);
  navigator.clipboard.writeText(text).then(()=>{
    snack(`📋 Copiado (${text.length} caracteres) — pégalo en el correo`);
  }).catch(()=>{
    // Fallback for browsers that block clipboard
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');snack('📋 Copiado');}catch(e){snack('No se pudo copiar. Selecciona manualmente.');}
    document.body.removeChild(ta);
  });
}

async function shareDailySummary(fechaStr){
  const [yy,mm,dd]=fechaStr.split('-').map(Number);
  const fecha=new Date(yy,mm-1,dd);
  const data=buildDailySummary(fecha);
  const text=renderDailySummaryText(data);
  try{
    await navigator.share({
      title:`Resumen ${fecha.toLocaleDateString('es-MX')}`,
      text:text
    });
    snack('📤 Compartido');
  }catch(err){
    if(err.name!=='AbortError')snack('Error: '+err.message);
  }
}

    </div>`;
  modal(html);
}

function saveCartera(id){
  const nombre=document.getElementById('cart-nombre').value.trim();
  if(!nombre){snack('Falta nombre');return;}
  const obj={
    nombre,
    tipo:document.getElementById('cart-tipo').value,
    contacto:document.getElementById('cart-contacto').value.trim(),
    telefono:document.getElementById('cart-tel').value.trim(),
    correo:document.getElementById('cart-correo').value.trim(),
    fecha_inicio:document.getElementById('cart-fecha').value,
    notas:document.getElementById('cart-notas').value.trim()
  };
  if(id){
    Object.assign(DB.carteras.find(x=>x.id===id),obj);
  }else{
    const newId='cart_'+uid();
    DB.carteras.push({id:newId,...obj,creado:nowISO()});
    // Auto-activate new cartera so user can start using it
    localStorage.setItem('rentas_active_cartera',newId);
    updCartBar();
  }
  saveDB('carteras');
  closeM();snack(id?'Cartera actualizada ✓':'Cartera creada ✓ (ahora activa)');
  rerender();
}

function delCartera(id){
  if(id==='cart_familia'){snack('No puedes borrar la cartera default');return;}
  const c=DB.carteras.find(x=>x.id===id);if(!c)return;
  const nItems=['inquilinos','pagos','gastos','obras','incidentes','servicios','inmuebles','inspecciones','otros_ingresos','recibos_servicios','pagos_servicios','bitacora'].reduce((s,k)=>s+DB[k].filter(x=>x.carteraId===id).length,0);
  if(nItems>0){
    if(!confirm(`⚠️ La cartera "${c.nombre}" tiene ${nItems} registros. Al eliminar la cartera se BORRARÁN TODOS sus datos (inquilinos, pagos, gastos, obras, etc.) y esto NO se puede deshacer.\n\n¿Estás absolutamente seguro?`))return;
    if(!confirm(`Última confirmación: escribes "sí" mentalmente y borro ${nItems} registros de ${c.nombre}. ¿Proceder?`))return;
    // Delete all data
    ['inquilinos','pagos','gastos','obras','incidentes','servicios','inmuebles','inspecciones','otros_ingresos','recibos_servicios','pagos_servicios','bitacora'].forEach(k=>{
      DB[k]=DB[k].filter(x=>x.carteraId!==id);
      saveDB(k);
    });
  }else{
    if(!confirm(`¿Eliminar cartera vacía "${c.nombre}"?`))return;
  }
  DB.carteras=DB.carteras.filter(x=>x.id!==id);
  saveDB('carteras');
  // If active cartera was deleted, switch to default
  if(getActiveCarteraId()===id||!getActiveCarteraId()){
    localStorage.setItem('rentas_active_cartera','cart_familia');
    updCartBar();
  }
  closeM();snack('Cartera eliminada');
  rerender();
}

function openBitacora(fechaStr){
  const fecha=fechaStr||todayISO();
  const items=DB.bitacora.filter(b=>b.fecha===fecha&&inCartera(b)).sort((a,b)=>{
    if(a.hora&&!b.hora)return -1;
    if(!a.hora&&b.hora)return 1;
    if(a.hora&&b.hora)return a.hora.localeCompare(b.hora);
    return (a.creado||'').localeCompare(b.creado||'');
  });
  const programados=items.filter(x=>x.hora);
  const pendientes=items.filter(x=>!x.hora);
  const [yy,mm,dd]=fecha.split('-').map(Number);
  const d=new Date(yy,mm-1,dd);
  const dateStr=d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
  const props=[...new Set(DB.inquilinos.map(i=>i.inmueble))].filter(Boolean).sort();

  const bitItemHTML=(b)=>`<div class="bit-item ${b.hecho?'done':''}">
    <div class="bit-check ${b.hecho?'done':''}" onclick="toggleBitacoraHecho('${b.id}')">${b.hecho?'✓':''}</div>
    ${b.hora?`<div class="bit-hora">${b.hora}</div>`:''}
    <div style="flex:1;min-width:0;cursor:pointer" onclick="openBitacoraItem('${b.id}')">
      <div class="bit-titulo" style="font-size:13px;font-weight:600">${b.titulo}</div>
      ${b.inmueble?`<div style="font-size:10px;color:var(--gold);margin-top:2px">🏢 ${b.inmueble}</div>`:''}
      ${b.notas?`<div style="font-size:11px;color:var(--dim);margin-top:2px">${b.notas.slice(0,120)}${b.notas.length>120?'...':''}</div>`:''}
      ${b.hecho&&b.fecha_hecho?`<div style="font-size:9px;color:var(--g);margin-top:2px">✓ Hecho ${new Date(b.fecha_hecho).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</div>`:''}
    </div>
  </div>`;

  modal(`<div class="ms" style="max-height:96vh"><div class="mh"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div><div class="mt2" style="margin:0">📅 Bitácora</div>
      <div style="font-size:11px;color:var(--dim);margin-top:2px">${dateStr}</div></div>
    </div>
    <div class="fg" style="margin-bottom:12px">
      <input class="fi" type="date" id="bit-fecha" value="${fecha}" onchange="openBitacora(this.value)">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
      <button class="btn bo" onclick="openBitacoraItem(null,'pendiente','${fecha}')">☐ + Pendiente</button>
      <button class="btn bs" onclick="openBitacoraItem(null,'programado','${fecha}')">⏰ + Programado</button>
    </div>
    ${programados.length>0?`<div class="st-sm">⏰ Programados (${programados.length})</div>
    ${programados.map(bitItemHTML).join('')}`:''}
    ${pendientes.length>0?`<div class="st-sm" style="margin-top:14px">☐ Pendientes (${pendientes.length})</div>
    ${pendientes.map(bitItemHTML).join('')}`:''}
    ${items.length===0?`<div class="es"><div class="ei">📅</div><div class="et">Sin items para este día<br><br>Agrega pendientes o cosas programadas.</div></div>`:''}
    <div style="height:20px"></div>
  </div>`);

function getBitacoraHoyResumen(){
  const hoy=todayISO();
  const items=DB.bitacora.filter(b=>b.fecha===hoy&&inCartera(b));
  const pendActivos=items.filter(x=>!x.hora&&!x.hecho);
  const progActivos=items.filter(x=>x.hora&&!x.hecho).sort((a,b)=>a.hora.localeCompare(b.hora));
  const hechos=items.filter(x=>x.hecho).length;
  return{items,pendActivos,progActivos,hechos};
}

// ─── Category inference for gastos ──
const CAT_KEYWORDS={
  carros:['gasolina','autopista','llanta','aceite','servicio auto','estacionamiento','uber','taxi','peaje','gomas','pemex'],
  mantenimiento:['pintura','cemento','cal','yeso','pegazulejo','impermeabilizante','plomería','tornillo','clavo','tabla','madera','vidrio','cerradura','tapa','regadera','contacto','apagador','foco','pila','llave','tubería','manguera','vinilica','esmalte','material','ferretería'],
  mano_obra:['freddy','albañil','plomero','electricista','pintor','jornal','peón','oficial','ayudante','mano de obra'],
  servicios:['agua','luz','cfe','predial','gas','internet','teléfono','wifi','izzi','totalplay','sacmex','tv','naturgy'],
  otros:[]
};

function inferCategoryFromDesc(desc){
  if(!desc||desc.length<3)return;
  const d=desc.toLowerCase();
  for(const [cat,keywords] of Object.entries(CAT_KEYWORDS)){
    if(keywords.some(k=>d.includes(k))){
      const inp=document.getElementById('g-cat');
      if(inp&&inp.value!==cat){selectCat(cat);snack('Categoría auto: '+(CATS_GASTO[cat]?.n||cat),1500);}
      return;
    }
  }
}

function renderSubcatOptions(cat,sel){
  const subs=SUBCATS_GASTO[cat]||[];
  return '<option value="">— Ninguna —</option>'+subs.map(k=>`<option value="${k}"${sel===k?' selected':''}>${presupLineLabel(k)}</option>`).join('');
}
function selectCat(cat){
  const inp=document.getElementById('g-cat');if(!inp)return;
  inp.value=cat;
  const sc=document.getElementById('g-subcat');if(sc)sc.innerHTML=renderSubcatOptions(cat,'');
  document.querySelectorAll('#cat-chips .cat-chip').forEach(el=>{
    const c=CATS_GASTO[el.dataset.cat];
    if(el.dataset.cat===cat){el.classList.add('on');el.style.borderColor=c.c;el.style.background=c.c+'22';}
    else{el.classList.remove('on');el.style.borderColor='#CBD5DF';el.style.background='';}
  });
}

// WhatsApp summary
function renderDailySummaryWA(data){
  const dateStr=data.fecha.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  let out=`*📊 Resumen del día*\n_${dateStr}_\n\n`;
  out+=`*💰 Cobranza*\n`;
  out+=`Total: ${fmt(data.totalCobrado)} (${data.pagos.length} pagos)\n`;
  if(data.pagos.length>0&&data.pagos.length<=15){
    data.pagos.sort((a,b)=>new Date(a.fecha_pago)-new Date(b.fecha_pago)).forEach(p=>{
      const t=DB.inquilinos.find(i=>i.id===p.iid);
      out+=`• ${t?.nombre||'?'} — ${fmt(p.monto)}${p.adelantado?' ✨':''}\n`;
    });
  }else if(data.pagos.length>15){
    out+=`(detalle completo en el correo/app)\n`;
  }
  if(data.gastos.length>0){
    out+=`\n*💸 Gastos*\nTotal: ${fmt(data.totalGastos)}\n`;
    data.gastos.slice(0,10).forEach(g=>{out+=`• ${g.descripcion} — ${fmt(g.monto)}\n`;});
    if(data.gastos.length>10)out+=`(+${data.gastos.length-10} más)\n`;
  }
  if(data.otros.length>0){
    out+=`\n*💵 Otros ingresos*\nTotal: ${fmt(data.totalOtros)}\n`;
    data.otros.forEach(o=>out+=`• ${o.concepto} — ${fmt(o.monto)}\n`);
  }
  if(data.incidentesNuevos.length>0||data.incidentesResueltos.length>0){
    out+=`\n*🚨 Incidentes*\n`;
    if(data.incidentesNuevos.length>0){
      out+=`${data.incidentesNuevos.length} nuevo${data.incidentesNuevos.length===1?'':'s'}: `;
      out+=data.incidentesNuevos.map(i=>`#${i.numero} ${i.lugar}`).join(', ')+'\n';
    }
    if(data.incidentesResueltos.length>0){
      out+=`${data.incidentesResueltos.length} resuelto${data.incidentesResueltos.length===1?'':'s'} hoy\n`;
    }
    out+=`_${data.totalActivos} activos en total_\n`;
  }
  if(data.obras.length>0){
    out+=`\n*🔨 Obras* (${data.obras.length})\n`;
    data.obras.forEach(o=>out+=`• ${o.inmueble||'?'} — ${fmt(o.costo)}\n`);
  }
  if(data.inspecciones.length>0){
    out+=`\n*🏠 Inspecciones*\n`;
    data.inspecciones.forEach(ins=>out+=`• ${ins.inmueble} — ${(ins.porcentaje||0).toFixed(0)}%\n`);
  }
  out+=`\n*📈 Neto: ${fmt(data.neto)}*\n`;
  out+=`_Enviado desde Gestión de Rentas_`;
  return out;
}

function sendDailyWA(fechaStr){
  const [yy,mm,dd]=fechaStr.split('-').map(Number);
  const fecha=new Date(yy,mm-1,dd);
  const data=buildDailySummary(fecha);
  const text=renderDailySummaryWA(data);
  const url=`https://wa.me/?text=${encodeURIComponent(text)}`;
  window.open(url,'_blank');
  snack('💬 Abriendo WhatsApp...');
}

function importJSON(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{const d=JSON.parse(ev.target.result);
        if(!confirm(`¿Reemplazar datos actuales?\nInquilinos: ${d.inquilinos?.length||0}\nPagos: ${d.pagos?.length||0}\nGastos: ${d.gastos?.length||0}\nObras: ${d.obras?.length||0}\nIncidentes: ${d.incidentes?.length||0}\nInspecciones: ${d.inspecciones?.length||0}`))return;
        ['inquilinos','pagos','servicios','gastos','obras','incidentes','otros_ingresos','inmuebles','inspecciones','recibos_servicios','pagos_servicios','bitacora'].forEach(k=>{if(d[k])DB[k]=d[k];saveDB(k);});
        snack('✓ Importado');renderRep();
      }catch(err){snack('Error: '+err.message)}
    };r.readAsText(f);
  };inp.click();
}

function resetAll(){
  if(!confirm('¿Borrar TODOS los datos locales? Esta acción NO se puede deshacer.\n\nSe recomienda hacer respaldo primero.'))return;
  if(!confirm('¿Estás completamente seguro?'))return;
  ['inquilinos','pagos','servicios','gastos','obras','incidentes','otros_ingresos','inmuebles','inspecciones','recibos_servicios','pagos_servicios','bitacora'].forEach(k=>localStorage.removeItem('rentas_'+k));
  location.reload();
}

// ─── PDF GENERATION ──────────────────────────────
function pdfBase(titulo,subtitulo){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  // Línea azul superior
  doc.setFillColor(91,155,213);doc.rect(0,0,210,1.5,'F');
  // Título en gris oscuro sobre blanco (imprime perfecto)
  doc.setTextColor(45,55,72);doc.setFontSize(20);doc.setFont('helvetica','bold');
  doc.text('GESTIÓN DE RENTAS',14,15);
  // Subtítulo en gris medio
  doc.setTextColor(110,118,135);doc.setFontSize(10);doc.setFont('helvetica','normal');
  doc.text(titulo,14,22);
  if(subtitulo){doc.setFontSize(9);doc.text(subtitulo,14,27);}
  doc.setFontSize(8);doc.setTextColor(150,150,150);
  doc.text('Generado: '+new Date().toLocaleString('es-MX'),14,subtitulo?32:28);
  // Línea separadora gris claro
  doc.setDrawColor(220,225,235);doc.setLineWidth(0.3);
  doc.line(14,subtitulo?35:32,196,subtitulo?35:32);
  return doc;
}

function genPDFTenant(id){

  const doc=pdfBase('HISTORIAL DE INQUILINO');
  doc.setTextColor(45,55,72);doc.setFontSize(13);doc.setFont('helvetica','bold');
  doc.text(t.nombre.toUpperCase(),14,50);
  doc.setTextColor(80,80,80);doc.setFontSize(9);doc.setFont('helvetica','normal');
  doc.text(t.inmueble+(t.interior?' · INT '+t.interior:''),14,57);
  doc.setDrawColor(200,210,225);doc.setLineWidth(0.3);doc.line(14,60,196,60);
  let y=68;
  const info=[['Renta mensual',fmt(t.renta)],['Día de pago','Día '+t.dia],['Destino',t.destino||'—'],['Servicios',t.servicios||'—'],['Estatus',t.estatus||'—'],['Renovación',t.renovacion||'—'],['Contrato vigente',t.contrato_vigente||'—'],['Comentarios',t.comentarios||'—']];
  info.forEach(([k,v])=>{doc.setFillColor(248,248,248);doc.rect(14,y-4,182,7,'F');
    doc.setFont('helvetica','bold');doc.setTextColor(60,60,60);doc.text(k+':',16,y);
    doc.setFont('helvetica','normal');doc.setTextColor(40,40,40);doc.text(String(v).slice(0,80),65,y);y+=7;});
  y+=4;
  doc.setFillColor(91,155,213);doc.rect(14,y,182,8,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(9);
  doc.text('MES / AÑO',16,y+5.5);doc.text('FECHA Y HORA DE PAGO',75,y+5.5);doc.text('MONTO',183,y+5.5,'right');
  y+=10;
  const pagos=DB.pagos.filter(p=>p.iid===id&&p.pagado).sort((a,b)=>b.anio-a.anio||b.mes-a.mes);
  let total=0;
  pagos.forEach((p,i)=>{
    if(y>275){doc.addPage();y=20;}
    doc.setFillColor(i%2===0?248:255,i%2===0?248:255,i%2===0?248:255);doc.rect(14,y-4,182,8,'F');
    doc.setTextColor(40,40,40);doc.setFont('helvetica','normal');doc.setFontSize(9);
    doc.text(MF[p.mes-1]+' '+p.anio,16,y);
    const fp=p.fecha_pago?new Date(p.fecha_pago).toLocaleString('es-MX'):'—';
    doc.text(fp,75,y);
    doc.setFont('helvetica','bold');doc.setTextColor(40,130,70);
    doc.text(fmt(p.monto),183,y,'right');total+=Number(p.monto);y+=8;
  });
  if(!pagos.length){doc.setTextColor(130,130,130);doc.setFont('helvetica','italic');doc.text('Sin pagos registrados',16,y);}
  y+=6;doc.setDrawColor(200,210,225);doc.setLineWidth(0.3);doc.line(14,y,196,y);y+=7;
  doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(40,40,40);
  doc.text('TOTAL COBRADO:',14,y);doc.setTextColor(40,130,70);doc.text(fmt(total),183,y,'right');
  doc.save('historial_'+t.nombre.replace(/\s+/g,'_')+'.pdf');snack('PDF descargado');
}

function genPDFConciliacionConfig(){
  const r=document.getElementById('pdf-rango').value;
  if(r==='custom'){rangeStart=document.getElementById('pdf-ini').value;rangeEnd=document.getElementById('pdf-fin').value;rangeMode='custom';}
  else rangeMode=r;
  const incIng=document.getElementById('pdf-ing').checked;
  const incGas=document.getElementById('pdf-gas').checked;
  const incDet=document.getElementById('pdf-det').checked;
  closeM();
  genPDFConciliacion(incIng,incGas,incDet);
}

function genPDFConciliacion(incIng=true,incGas=true,incDet=true){
  const r=getRange(rangeMode);
  const doc=pdfBase('CONCILIACIÓN — '+r.label.toUpperCase());
  const pagos=DB.pagos.filter(p=>{if(!inCartera(p))return false;if(!p.fecha_pago||!p.pagado)return false;const d=new Date(p.fecha_pago);return d>=r.ini&&d<=r.fin;});
  const ingresos=pagos.reduce((s,p)=>s+Number(p.monto),0);
  const gs=DB.gastos.filter(g=>{if(!inCartera(g))return false;const d=new Date(g.fecha);return d>=r.ini&&d<=r.fin;});
  const gastos=gs.reduce((s,g)=>s+Number(g.monto),0);
  const neto=ingresos-gastos;
  let y=50;
  // Resumen visual
  doc.setFillColor(248,248,248);doc.rect(14,y-4,182,46,'F');
  doc.setDrawColor(200,210,225);doc.setLineWidth(0.3);doc.rect(14,y-4,182,46);
  doc.setTextColor(neto>=0?40:200,neto>=0?130:60,neto>=0?70:60);doc.setFont('helvetica','bold');doc.setFontSize(22);
  doc.text(fmt(neto),105,y+8,'center');
  doc.setTextColor(100,100,100);doc.setFontSize(9);doc.setFont('helvetica','normal');doc.text('NETO DEL PERIODO',105,y+15,'center');
  doc.setTextColor(40,130,70);doc.setFontSize(13);doc.setFont('helvetica','bold');doc.text('+ '+fmt(ingresos),55,y+28,'center');
  doc.setTextColor(100,100,100);doc.setFontSize(8);doc.setFont('helvetica','normal');doc.text('INGRESOS ('+pagos.length+')',55,y+34,'center');
  doc.setTextColor(200,60,60);doc.setFontSize(13);doc.setFont('helvetica','bold');doc.text('− '+fmt(gastos),155,y+28,'center');
  doc.setTextColor(100,100,100);doc.setFontSize(8);doc.setFont('helvetica','normal');doc.text('GASTOS ('+gs.length+')',155,y+34,'center');
  y+=54;
  // Gastos por categoría
  if(incGas&&gs.length>0){
    doc.setTextColor(91,155,213);doc.setFontSize(11);doc.setFont('helvetica','bold');doc.text('GASTOS POR CATEGORÍA',14,y);y+=6;
    const porCat={};gs.forEach(g=>{porCat[g.categoria]=(porCat[g.categoria]||0)+Number(g.monto)});
    Object.entries(porCat).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{
      const c=CATS_GASTO[k]||CATS_GASTO.otros;
      if(y>270){doc.addPage();y=20;}
      doc.setFillColor(250,250,250);doc.rect(14,y-3,182,7,'F');
      doc.setTextColor(40,40,40);doc.setFont('helvetica','normal');doc.setFontSize(10);
      doc.text(c.n,18,y+1);doc.setFont('helvetica','bold');doc.setTextColor(200,60,60);
      doc.text(fmt(v),183,y+1,'right');y+=8;
    });
    y+=4;
  }
  // Detalle ingresos
  if(incIng&&incDet&&pagos.length>0){
    if(y>250){doc.addPage();y=20;}
    doc.setTextColor(40,130,70);doc.setFontSize(11);doc.setFont('helvetica','bold');doc.text('INGRESOS DEL PERIODO',14,y);y+=6;
    doc.setFillColor(40,130,70);doc.rect(14,y,182,7,'F');
    doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(8.5);
    doc.text('FECHA',16,y+5);doc.text('INQUILINO',45,y+5);doc.text('INMUEBLE',105,y+5);doc.text('MONTO',183,y+5,'right');y+=9;
    pagos.sort((a,b)=>new Date(a.fecha_pago)-new Date(b.fecha_pago)).forEach((p,i)=>{
      if(y>275){doc.addPage();y=20;}
      const t=DB.inquilinos.find(x=>x.id===p.iid);
      doc.setFillColor(i%2===0?248:255,i%2===0?252:255,i%2===0?248:255);doc.rect(14,y-3,182,7,'F');
      doc.setTextColor(40,40,40);doc.setFont('helvetica','normal');doc.setFontSize(8.5);
      doc.text(new Date(p.fecha_pago).toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit'}),16,y+1);
      doc.text((t?.nombre||'?').slice(0,28),45,y+1);doc.text((t?.inmueble||'').slice(0,28),105,y+1);
      doc.setFont('helvetica','bold');doc.setTextColor(40,130,70);doc.text(fmt(p.monto),183,y+1,'right');y+=7;
    });
    y+=4;
  }
  // Detalle gastos
  if(incGas&&incDet&&gs.length>0){
    if(y>250){doc.addPage();y=20;}
    doc.setTextColor(200,60,60);doc.setFontSize(11);doc.setFont('helvetica','bold');doc.text('GASTOS DEL PERIODO',14,y);y+=6;
    doc.setFillColor(200,60,60);doc.rect(14,y,182,7,'F');
    doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(8.5);
    doc.text('FECHA',16,y+5);doc.text('CATEGORÍA',45,y+5);doc.text('DESCRIPCIÓN',85,y+5);doc.text('MONTO',183,y+5,'right');y+=9;
    gs.sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)).forEach((g,i)=>{
      if(y>275){doc.addPage();y=20;}
      const c=CATS_GASTO[g.categoria]||CATS_GASTO.otros;
      doc.setFillColor(i%2===0?255:252,i%2===0?248:255,i%2===0?248:255);doc.rect(14,y-3,182,7,'F');
      doc.setTextColor(40,40,40);doc.setFont('helvetica','normal');doc.setFontSize(8.5);
      doc.text(new Date(g.fecha).toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit'}),16,y+1);
      doc.text(c.n.slice(0,16),45,y+1);doc.text((g.descripcion||'').slice(0,40),85,y+1);
      doc.setFont('helvetica','bold');doc.setTextColor(200,60,60);doc.text(fmt(g.monto),183,y+1,'right');y+=7;
    });
  }
  doc.save('conciliacion_'+r.ini.toISOString().slice(0,10)+'_'+r.fin.toISOString().slice(0,10)+'.pdf');
  snack('📄 PDF descargado');
}

function genPDFResumen(){
  const doc=pdfBase('RESUMEN — '+MF[curMes-1].toUpperCase()+' '+curAnio);
  const act=DB.inquilinos.filter(i=>i.estado==='activo'&&inCartera(i));
  const cobMes=DB.pagos.filter(p=>p.mes===curMes&&p.anio===curAnio&&p.pagado&&inCartera(p)).reduce((s,p)=>s+Number(p.monto),0);
  const totalEsp=act.reduce((s,i)=>s+Number(i.renta),0);
  let y=50;
  doc.setFillColor(248,248,248);doc.rect(14,y-4,182,40,'F');
  doc.setDrawColor(200,210,225);doc.setLineWidth(0.3);doc.rect(14,y-4,182,40);

  doc.setTextColor(200,60,60);doc.setFont('helvetica','bold');doc.setFontSize(14);
  doc.text(fmt(totalEsp-cobMes),105,y+24,'center');
  doc.setTextColor(100,100,100);doc.setFontSize(9);doc.setFont('helvetica','normal');doc.text('PENDIENTE',105,y+31,'center');
  y+=50;
  doc.setFillColor(91,155,213);doc.rect(14,y,182,8,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(9);
  doc.text('INQUILINO',16,y+5.5);doc.text('INMUEBLE',75,y+5.5);doc.text('RENTA',148,y+5.5,'right');doc.text('STATUS',183,y+5.5,'right');
  y+=10;
  act.forEach((t,i)=>{

    const paid=isPagado(t.id,curMes,curAnio);
    doc.setFillColor(i%2===0?248:255,i%2===0?248:255,i%2===0?248:255);doc.rect(14,y-4,182,7,'F');
    doc.setTextColor(40,40,40);doc.setFont('helvetica','normal');doc.setFontSize(8.5);

    y+=7;
  });
  doc.save('resumen_'+MN[curMes-1]+'_'+curAnio+'.pdf');snack('PDF descargado');

  doc.setFillColor(248,248,248);doc.rect(14,y-4,182,7,'F');
  doc.setFont('helvetica','bold');doc.setTextColor(60,60,60);doc.text('Trabajador:',16,y);doc.setFont('helvetica','normal');doc.setTextColor(40,40,40);doc.text(o.trabajador||'—',65,y);y+=10;
  // Descripción
  doc.setTextColor(91,155,213);doc.setFontSize(11);doc.setFont('helvetica','bold');doc.text('DESCRIPCIÓN',14,y);y+=5;
  doc.setTextColor(40,40,40);doc.setFontSize(10);doc.setFont('helvetica','normal');
  const lines=doc.splitTextToSize(o.descripcion,180);
  lines.forEach(l=>{doc.text(l,14,y);y+=5;});
  y+=4;
  // Fotos
  if(o.fotos?.length){
    if(y>200){doc.addPage();y=20;}
    doc.setTextColor(91,155,213);doc.setFontSize(11);doc.setFont('helvetica','bold');doc.text('EVIDENCIA FOTOGRÁFICA',14,y);y+=6;
    const cols=2;const photoW=85;const photoH=64;const gap=4;
    o.fotos.forEach((p,i)=>{
      const col=i%cols;const row=Math.floor(i/cols);
      const x=14+col*(photoW+gap);
      if(col===0&&y+photoH>275){doc.addPage();y=20;}
      try{doc.addImage(p,'JPEG',x,y,photoW,photoH);}catch(e){}
      if(col===cols-1||i===o.fotos.length-1){y+=photoH+gap;}
    });
  }
  doc.save('obra_'+t.n+'_'+o.inmueble.replace(/\s+/g,'_')+'_'+o.fecha.slice(0,10)+'.pdf');
  snack('PDF descargado');
}

function genPDFIncidente(id){
  const i=DB.incidentes.find(x=>x.id===id);if(!i)return;
  const n=NIVELES_INC.find(x=>x.k===i.nivel)||NIVELES_INC[0];
  const inq=i.inqId?DB.inquilinos.find(x=>x.id===i.inqId):null;
  const doc=pdfBase('REPORTE DE INCIDENTE','Folio: '+i.numero);
  let y=50;
  // Folio destacado
  doc.setFillColor(240,245,252);doc.rect(14,y-4,182,18,'F');
  doc.setDrawColor(91,155,213);doc.rect(14,y-4,182,18);
  doc.setTextColor(45,55,72);doc.setFont('helvetica','bold');doc.setFontSize(16);
  doc.text(i.numero,105,y+6,'center');
  doc.setTextColor(110,118,135);doc.setFontSize(9);doc.setFont('helvetica','normal');
  doc.text('NÚMERO DE FOLIO',105,y+11,'center');
  y+=22;
  // Nivel
  const rc=[200,60,60];if(n.k===1){rc[0]=40;rc[1]=130;rc[2]=70;}else if(n.k===2){rc[0]=220;rc[1]=180;rc[2]=60;}else if(n.k===3){rc[0]=229;rc[1]=138;rc[2]=44;}
  doc.setFillColor(rc[0],rc[1],rc[2]);doc.rect(14,y-4,182,8,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(10);
  doc.text('NIVEL DE IMPORTANCIA: '+n.n.toUpperCase(),105,y+2,'center');y+=12;
  // Info
  const info=[['Fecha',new Date(i.fecha).toLocaleString('es-MX',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})],['Lugar',i.lugar],['Inquilino',inq?inq.nombre:'No asociado']];
  info.forEach(([k,v],idx)=>{
    doc.setFillColor(idx%2===0?248:255,idx%2===0?248:255,idx%2===0?248:255);doc.rect(14,y-4,182,7,'F');
    doc.setFont('helvetica','bold');doc.setTextColor(60,60,60);doc.setFontSize(10);doc.text(k+':',16,y);
    doc.setFont('helvetica','normal');doc.setTextColor(40,40,40);doc.text(String(v),50,y);y+=7;
  });
  y+=4;
  doc.setTextColor(91,155,213);doc.setFontSize(11);doc.setFont('helvetica','bold');doc.text('DESCRIPCIÓN',14,y);y+=5;
  doc.setTextColor(40,40,40);doc.setFontSize(10);doc.setFont('helvetica','normal');
  const lines=doc.splitTextToSize(i.descripcion,180);lines.forEach(l=>{doc.text(l,14,y);y+=5;});y+=4;
  if(i.accion){
    doc.setTextColor(91,155,213);doc.setFontSize(11);doc.setFont('helvetica','bold');doc.text('ACCIÓN TOMADA',14,y);y+=5;
    doc.setTextColor(40,40,40);doc.setFontSize(10);doc.setFont('helvetica','normal');
    const al=doc.splitTextToSize(i.accion,180);al.forEach(l=>{doc.text(l,14,y);y+=5;});y+=4;
  }
  if(i.fotos?.length){
    if(y>200){doc.addPage();y=20;}
    doc.setTextColor(91,155,213);doc.setFontSize(11);doc.setFont('helvetica','bold');doc.text('EVIDENCIA',14,y);y+=6;
    i.fotos.forEach((p,idx)=>{
      const x=14+(idx%2)*89;
      if(idx>0&&idx%2===0)y+=68;
      if(y+64>275){doc.addPage();y=20;}
      try{doc.addImage(p,'JPEG',x,y,85,64);}catch(e){}
    });
  }
  doc.save('incidente_'+i.numero+'.pdf');snack('PDF descargado');
}

// ─── Init ──────────────────────────────────────────────
function init(){
  loadDB(); // load from localStorage first (works offline)
  document.getElementById("splash").style.display="none";
  updCartBar();
  renderDash();updNotif();
  // Firebase auth handler will then upgrade to cloud sync if user is logged in
}
init();
</script>
