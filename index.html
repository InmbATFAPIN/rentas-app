// ── RESUMEN (Ingresos - Gastos) ────────────
const CATS_OTROS_ING={multa:{n:'Multa',i:'⚠️'},servicio:{n:'Servicio',i:'💡'},deposito:{n:'Depósito garantía',i:'🔐'},comision:{n:'Comisión',i:'💼'},otro:{n:'Otro',i:'💵'}};

function renderResumen(){
  const r=getRange(rangeMode);
  let chips=`<div class="cr">
    <span class="chip${rangeMode==='hoy'?' on':''}" onclick="rangeMode='hoy';renderCon()">Hoy</span>
    <span class="chip${rangeMode==='ayer'?' on':''}" onclick="rangeMode='ayer';renderCon()">Ayer</span>
    <span class="chip${rangeMode==='semana'?' on':''}" onclick="rangeMode='semana';renderCon()">Esta semana</span>
    <span class="chip${rangeMode==='sem_pas'?' on':''}" onclick="rangeMode='sem_pas';renderCon()">Sem. pasada</span>
    <span class="chip${rangeMode==='mes'?' on':''}" onclick="rangeMode='mes';renderCon()">Este mes</span>
    <span class="chip${rangeMode==='custom'?' on':''}" onclick="openCustomRange()">📅 Personalizado</span></div>`;
  const pagos=DB.pagos.filter(p=>{if(!inCartera(p))return false;if(!p.fecha_pago||!p.pagado)return false;const d=new Date(p.fecha_pago);if(isNaN(d))return false;return d>=r.ini&&d<=r.fin;});
  const otros=DB.otros_ingresos.filter(o=>{if(!inCartera(o))return false;if(!o.fecha)return false;const d=new Date(o.fecha);if(isNaN(d))return false;return d>=r.ini&&d<=r.fin;});
  const ingRenta=pagos.reduce((s,p)=>s+Number(p.monto),0);
  const ingOtros=otros.reduce((s,o)=>s+Number(o.monto),0);
  const ingresos=ingRenta+ingOtros;
  const gs=DB.gastos.filter(g=>{if(!inCartera(g))return false;if(!g.fecha)return false;const d=new Date(g.fecha);if(isNaN(d))return false;return d>=r.ini&&d<=r.fin;});
  const gastos=gs.reduce((s,g)=>s+Number(g.monto),0);
  const neto=ingresos-gastos;
  const porCat={};
  gs.forEach(g=>{porCat[g.categoria]=(porCat[g.categoria]||0)+Number(g.monto)});
  let html=chips;
  html+=`<div class="summary-card" style="text-align:center">
    <div style="font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px">${r.label}</div>
    <div style="font-family:'Playfair Display',serif;font-size:32px;color:${neto>=0?'var(--g)':'var(--r)'};margin-top:6px">${fmt(neto)}</div>
    <div style="font-size:11px;color:var(--dim);margin-top:2px">Neto del periodo</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">
      <div style="background:#426A5411;padding:10px;border-radius:10px;border:1px solid #426A5433">
        <div style="font-size:10px;color:var(--g)">+ INGRESOS</div>
        <div style="font-family:'Playfair Display',serif;font-size:18px;color:var(--g);font-weight:700">${fmt(ingresos)}</div>
        <div style="font-size:10px;color:var(--dim)">${pagos.length} rentas${otros.length?` + ${otros.length} otros`:''}</div></div>
      <div style="background:#E05C5C11;padding:10px;border-radius:10px;border:1px solid #E05C5C33">
        <div style="font-size:10px;color:var(--r)">− GASTOS</div>
        <div style="font-family:'Playfair Display',serif;font-size:18px;color:var(--r);font-weight:700">${fmt(gastos)}</div>
        <div style="font-size:10px;color:var(--dim)">${gs.length} gastos</div></div>
    </div></div>`;
  html+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
    <button class="btn bs" onclick="openAddOtroIngreso()">💰 + Otro ingreso</button>
    <button class="btn bd" onclick="openAddGasto()">💸 + Gasto</button>
  </div>`;
  html+=`<div style="display:flex;gap:8px;margin-bottom:14px">
    <button class="btn bo" style="flex:1" onclick="exportExcelMovs()">📊 Excel</button>
    <button class="btn bo" style="flex:1" onclick="openPDFConfig()">📄 PDF</button>
  </div>`;
  if(Object.keys(porCat).length>0){
    html+=`<div class="st-sm">Gastos por categoría</div>`;
    Object.entries(porCat).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{
      const c=CATS_GASTO[k]||CATS_GASTO.otros;
      const pct=gastos>0?Math.round(v/gastos*100):0;
      html+=`<div style="background:var(--s1);padding:11px 13px;border-radius:10px;margin-bottom:7px;border:1px solid #E4E9EF">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="display:flex;gap:8px;align-items:center"><span style="font-size:18px">${c.i}</span><span style="font-size:13px;font-weight:600">${c.n}</span></div>
          <div style="text-align:right"><div style="font-family:'Playfair Display',serif;color:var(--r);font-weight:600">${fmt(v)}</div><div style="font-size:10px;color:var(--dim)">${pct}%</div></div>
        </div>
        <div style="height:4px;background:#EBEFF4;border-radius:2px;margin-top:7px;overflow:hidden"><div style="height:100%;background:${c.c};width:${pct}%"></div></div></div>`;
    });
  }
  if(otros.length>0){
    html+=`<div class="st-sm">Otros ingresos (${otros.length})</div><div class="card" style="padding:0 14px">`;
    otros.sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).forEach(o=>{
      const c=CATS_OTROS_ING[o.categoria]||CATS_OTROS_ING.otro;
      const f=new Date(o.fecha).toLocaleDateString('es-MX',{day:'2-digit',month:'short'});
      html+=`<div class="pr" onclick="openAddOtroIngreso('${o.id}')" style="cursor:pointer"><div class="pi"><div class="pn">${c.i} ${o.concepto}</div><div class="pd">${c.n}${o.inmueble?' · '+o.inmueble:''} · ${f}${o.destino?' · '+o.destino:''}</div></div><div class="pa">${fmt(o.monto)}</div></div>`;
    });
    html+=`</div>`;
  }
  if(pagos.length>0){
    html+=`<div class="st-sm">Ingresos de renta</div><div class="card" style="padding:0 14px">`;
    pagos.sort((a,b)=>new Date(b.fecha_pago)-new Date(a.fecha_pago)).slice(0,15).forEach(p=>{
      const t=DB.inquilinos.find(i=>i.id===p.iid);
      const f=new Date(p.fecha_pago).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
      html+=`<div class="pr"><div class="pi"><div class="pn">${t?.nombre||'?'}</div><div class="pd">${t?.inmueble||''} · ${f}${p.destino?' · '+p.destino:''}</div></div><div class="pa">${fmt(p.monto)}</div></div>`;
    });
    if(pagos.length>15)html+=`<div style="text-align:center;padding:10px;color:var(--dim);font-size:11px">+ ${pagos.length-15} más...</div>`;
    html+=`</div>`;
  }
  document.getElementById("con-content").innerHTML=html;
}

// ─── EXPORTS ─────────────────────────────────────
function exportExcelMes(){
  try{
    console.log('[Excel] Iniciando export. curMes=',curMes,'curAnio=',curAnio,'total DB.inquilinos=',DB.inquilinos.length);
    if(typeof XLSX==='undefined'){snack('⚠️ Librería XLSX no cargada. Refresca la app.');return;}
    const act=DB.inquilinos.filter(i=>i.estado==='activo'&&inCartera(i));
    console.log('[Excel] Inquilinos activos en cartera:',act.length);
    if(act.length===0){
      const estados=[...new Set(DB.inquilinos.map(i=>i.estado||'(sin estado)'))];
      snack('⚠️ Sin activos. Estados encontrados: '+estados.join(', '));
      return;
    }
    // Función segura para convertir valores
    const S=v=>v==null?'':String(v);
    const N=v=>{const n=Number(v);return isNaN(n)?0:n;};
    const rows=[['Pagado','FECHA','LUGAR','NOMBRE','INT','CANTIDAD','DESTINO','SERVICIOS','ESTATUS','RENOVACIÓN','COMENTARIOS','MEDIDOR DE LUZ','CONTRATO VIGENTE','FECHA DE PAGO','MÉTODO','PROPIETARIO']];
    const grupos={};
    act.forEach(i=>{
      const inm=S(i.inmueble)||'(sin inmueble)';
      if(!grupos[inm])grupos[inm]=[];
      grupos[inm].push(i);
    });
    console.log('[Excel] Inmuebles agrupados:',Object.keys(grupos));
    let rowCount=0;
    Object.keys(grupos).sort().forEach(inm=>{
      grupos[inm].sort((a,b)=>(N(a.dia))-(N(b.dia)));
      grupos[inm].forEach(i=>{
        const p=getPago(i.id,curMes,curAnio);
        const diaN=N(i.dia);
        const dia=diaN===30?0.3:diaN;
        const fp=p?.fecha_pago?new Date(p.fecha_pago).toLocaleString('es-MX'):'';
        const dest=S(p?.destino||i.destino);
        rows.push([
          p?true:false,
          dia,
          S(i.inmueble),
          S(i.nombre),
          S(i.interior),
          N(p?.monto||i.renta),
          dest,
          S(i.servicios),
          S(i.estatus)||'Al corriente',
          S(i.renovacion),
          S(i.comentarios),
          S(i.medidor),
          S(i.contrato_vigente),
          fp,
          S(p?.metodo),
          S(i.propietario)
        ]);
        rowCount++;
      });
    });
    console.log('[Excel] Filas de datos generadas:',rowCount);
    if(rowCount===0){snack('⚠️ 0 filas generadas — bug reportar');return;}
    rows.push([]);
    const totalCob=act.filter(i=>isPagado(i.id,curMes,curAnio)).reduce((s,i)=>{const p=getPago(i.id,curMes,curAnio);return s+N(p?.monto);},0);
    const totalEsp=act.reduce((s,i)=>s+N(i.renta),0);
    rows.push(['','','','TOTAL ESPERADO:','',totalEsp]);
    rows.push(['','','','TOTAL COBRADO:','',totalCob]);
    rows.push(['','','','PENDIENTE:','',totalEsp-totalCob]);
    console.log('[Excel] Total filas incluyendo totales:',rows.length);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{w:8},{w:8},{w:18},{w:30},{w:8},{w:12},{w:10},{w:18},{w:14},{w:14},{w:25},{w:10},{w:14},{w:20},{w:12},{w:12}];
    const wb=XLSX.utils.book_new();
    // Sheet name: max 31 chars, no special chars
    let sheetName=(MF[curMes-1]||'MES').toUpperCase()+' '+curAnio;
    sheetName=sheetName.replace(/[\\\/\?\*\[\]:]/g,'').slice(0,31);
    XLSX.utils.book_append_sheet(wb,ws,sheetName);
    const filename=`lista_inquilinaria_${MN[curMes-1]||'mes'}_${curAnio}.xlsx`;
    XLSX.writeFile(wb,filename);
    console.log('[Excel] Archivo generado:',filename);
    snack(`📥 Excel: ${rowCount} inquilinos en ${Object.keys(grupos).length} inmuebles`);
  }catch(err){
    console.error('[Excel] ERROR:',err);
    snack('⚠️ Error: '+err.message);
    alert('Error al generar Excel:\n\n'+err.message+'\n\nAbre la consola del navegador (F12) para más detalles.');
  }
}

function exportExcelMovs(){
  const r=getRange(rangeMode);
  const pagosFiltered=DB.pagos.filter(p=>{if(!inCartera(p))return false;if(!p.fecha_pago||!p.pagado)return false;const d=new Date(p.fecha_pago);return d>=r.ini&&d<=r.fin;});
  const gastosFiltered=DB.gastos.filter(g=>{if(!inCartera(g))return false;const d=new Date(g.fecha);return d>=r.ini&&d<=r.fin;});
  if(pagosFiltered.length===0&&gastosFiltered.length===0){
    snack(`⚠️ Sin movimientos en ${r.label}. Cambia el periodo.`);
    return;
  }
  const wb=XLSX.utils.book_new();
  // Sheet 1: Ingresos
  const ingRows=[['FECHA','HORA','INQUILINO','INMUEBLE','INTERIOR','MES PAGADO','MONTO','DESTINO','MÉTODO']];
  pagosFiltered.sort((a,b)=>new Date(a.fecha_pago)-new Date(b.fecha_pago)).forEach(p=>{
    const t=DB.inquilinos.find(i=>i.id===p.iid);const d=new Date(p.fecha_pago);
    ingRows.push([d.toLocaleDateString('es-MX'),d.toLocaleTimeString('es-MX'),t?.nombre||'',t?.inmueble||'',t?.interior||'',MF[p.mes-1]+' '+p.anio,p.monto,p.destino||'',p.metodo||'efectivo']);
  });
  const totalIng=pagosFiltered.reduce((s,p)=>s+Number(p.monto),0);
  ingRows.push([]);ingRows.push(['','','','','','TOTAL:',totalIng]);
  const ws1=XLSX.utils.aoa_to_sheet(ingRows);
  ws1['!cols']=[{w:12},{w:10},{w:30},{w:18},{w:10},{w:16},{w:12},{w:12},{w:14}];
  XLSX.utils.book_append_sheet(wb,ws1,'Ingresos');
  // Sheet 2: Gastos
  const gRows=[['FECHA','CATEGORÍA','DESCRIPCIÓN','INMUEBLE','MONTO','NOTAS']];
  const gastos=gastosFiltered.sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  gastos.forEach(g=>{
    const c=CATS_GASTO[g.categoria]||CATS_GASTO.otros;
    gRows.push([new Date(g.fecha).toLocaleDateString('es-MX'),c.n,g.descripcion,g.inmueble||'',g.monto,g.notas||'']);
  });
  const totalG=gastos.reduce((s,g)=>s+Number(g.monto),0);
  gRows.push([]);gRows.push(['','','','TOTAL:',totalG]);
  const ws2=XLSX.utils.aoa_to_sheet(gRows);
  ws2['!cols']=[{w:12},{w:18},{w:35},{w:18},{w:12},{w:30}];
  XLSX.utils.book_append_sheet(wb,ws2,'Gastos');
  // Sheet 3: Resumen
  const resRows=[['CONCEPTO','MONTO'],['INGRESOS',totalIng],['GASTOS',totalG],['NETO',totalIng-totalG],[],['DESGLOSE GASTOS POR CATEGORÍA','']];
  const porCat={};gastos.forEach(g=>{porCat[g.categoria]=(porCat[g.categoria]||0)+Number(g.monto)});
  Object.entries(porCat).forEach(([k,v])=>{const c=CATS_GASTO[k]||CATS_GASTO.otros;resRows.push([c.n,v]);});
  const ws3=XLSX.utils.aoa_to_sheet(resRows);
  ws3['!cols']=[{w:35},{w:15}];
  XLSX.utils.book_append_sheet(wb,ws3,'Resumen');
  const fn=`movimientos_${r.ini.toISOString().slice(0,10)}_${r.fin.toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb,fn);
  snack(`📥 Excel · ${pagosFiltered.length} ingresos, ${gastos.length} gastos`);
}

function renderInq(){
  if(!DB.propietarios.length){
    document.getElementById("v-inq").innerHTML=`<div class="es"><div class="ei">👥</div><div class="et">Sin propietarios<br><br>Crea uno desde Directorio</div></div>`;

  const subnav=`<div style="display:flex;gap:6px;margin-bottom:12px;background:var(--s2);padding:4px;border-radius:12px">

    <button class="btn ${propSub==='cpp'?'bg':'bo'} bsm" style="flex:1;border:${propSub==='cpp'?'none':'1px solid transparent'}" onclick="setPropSub('cpp')">💸 CPP</button>

  for(let i=2;i>=-4;i--){
    const d=new Date(HA,HM-1+i,1);const m=d.getMonth()+1,a=d.getFullYear();

    const isFut=(a>HA||(a===HA&&m>HM));

// ═══════════ CPP · CUENTAS POR PAGAR ═══════════
function cppNorm(t){return t==='cfe'?'luz':t;}
function cppSvcProp(sv){return sv.propietarioId||((DB.inmuebles.find(i=>i.nombre===sv.inmueble)||{}).propietarioId)||'';}
function cppDeuda(sv){
  if(sv.deuda_manual!==undefined&&sv.deuda_manual!==null&&sv.deuda_manual!=='')return Number(sv.deuda_manual)||0;
  return Math.max(0,getServicioBalance(sv.id));
}
function cppSetDeuda(id,val){
  const sv=DB.servicios.find(s=>s.id===id);if(!sv)return;
  sv.deuda_manual=(val===''?null:(Number(val)||0));
  sv.fecha_actualizacion=todayISO();
  saveDB('servicios');renderCPP();
}
function cppData(){
  const out=[];
  DB.propietarios.slice().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'')).forEach(p=>{
    const svcs=DB.servicios.filter(s=>cppSvcProp(s)===p.id&&['agua','luz','predial'].includes(cppNorm(s.tipo)));
    if(!svcs.length)return;
    const grupos={agua:[],luz:[],predial:[]};
    svcs.forEach(s=>grupos[cppNorm(s.tipo)].push(s));
    out.push({p,grupos});
  });
  return out;
}
function cppTabla(tipo,arr){
  if(!arr.length)return '';
  const esLuz=tipo==='luz';
  const tot=arr.reduce((s,sv)=>s+cppDeuda(sv),0);
  const rows=arr.slice().sort((a,b)=>(a.inmueble||'').localeCompare(b.inmueble||'')).map(sv=>{
    const d=cppDeuda(sv);
    const etq=esLuz?`${sv.inmueble||'—'}${sv.alias?' · '+sv.alias:''}${sv.medidor?' · med '+sv.medidor:''}`:(sv.inmueble||'—');
    return `<tr>
      <td style="padding:7px 6px;font-size:11px;border-bottom:1px solid #EAEEF2">${etq}<div style="font-size:9px;color:var(--dim);margin-top:1px">${sv.cuenta?'cta '+sv.cuenta:'sin cuenta'}${sv.fecha_actualizacion?' · act '+sv.fecha_actualizacion:''}</div></td>
      <td style="padding:7px 6px;border-bottom:1px solid #EAEEF2;text-align:right;white-space:nowrap"><span style="font-size:11px;color:var(--dim)">$</span><input type="number" value="${d||''}" placeholder="0" onchange="cppSetDeuda('${sv.id}',this.value)" style="width:80px;text-align:right;padding:5px 6px;border:1px solid #CBD5DF;border-radius:6px;font-size:12px;font-weight:600;margin-left:2px"></td>
    </tr>`;
  }).join('');
  return `<div style="margin:0 0 12px">
    <div style="font-size:12px;font-weight:700;padding:5px 2px;display:flex;justify-content:space-between"><span>${TIPOS_SVC[tipo].i} ${TIPOS_SVC[tipo].n}</span><span style="color:${tot>0?'var(--r)':'var(--g)'}">${fmt(tot)}</span></div>
    <div style="overflow-x:auto;border:1px solid #E4E9EF;border-radius:8px"><table style="width:100%;border-collapse:collapse">
      <thead><tr style="background:var(--s2)"><th style="text-align:left;padding:5px 6px;font-size:9px;color:var(--dim);font-weight:700">${esLuz?'INMUEBLE · MEDIDOR':'INMUEBLE'}</th><th style="text-align:right;padding:5px 6px;font-size:9px;color:var(--dim);font-weight:700">DEUDA TOTAL</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
  </div>`;
}
function renderCPP(){
  const cont=document.getElementById('cpp-body');if(!cont)return;
  const data=cppData();
  let html=`<div style="display:flex;gap:8px;margin-bottom:12px">
    <button class="btn bg" style="flex:1" onclick="exportCPPExcel()">📊 Excel</button>
    <button class="btn bs" style="flex:1" onclick="exportCPPPDF()">📄 PDF</button>
  </div>
  <div style="font-size:11px;color:var(--dim);margin-bottom:10px">Agrupado por propietario → tipo de cuenta. Agua y predial: una fila por inmueble. Luz: una fila por medidor. Teclea la deuda total de cada cuenta y se guarda sola.</div>`;
  if(!data.length){cont.innerHTML=html+`<div class="es"><div class="ei">💸</div><div class="et">Sin cuentas de agua, luz o predial.<br>Regístralas en cada inmueble (Directorio).</div></div>`;return;}
  const granTotal=data.reduce((s,d)=>s+['agua','luz','predial'].reduce((ss,t)=>ss+d.grupos[t].reduce((x,sv)=>x+cppDeuda(sv),0),0),0);
  html+=`<div class="card" style="padding:11px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;color:var(--dim)">Deuda total general</span><span style="font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:${granTotal>0?'var(--r)':'var(--g)'}">${fmt(granTotal)}</span></div>`;
  data.forEach(({p,grupos})=>{
    const tot=['agua','luz','predial'].reduce((ss,t)=>ss+grupos[t].reduce((x,sv)=>x+cppDeuda(sv),0),0);
    const k='cpp_'+p.id;const open=expandedInm[k]===true;
    const nCtas=grupos.agua.length+grupos.luz.length+grupos.predial.length;
    html+=`<div style="background:var(--s1);border:1px solid #E4E9EF;border-radius:11px;margin-bottom:10px;overflow:hidden">
      <div onclick="expandedInm['${k}']=${open?'false':'true'};renderCPP()" style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer">
        <div style="display:flex;align-items:center;gap:10px;min-width:0"><span class="inm-arrow ${open?'open':''}" style="color:var(--gold)">▶</span>
          <div style="min-width:0"><div style="font-weight:700;color:var(--gold);font-size:14px">👤 ${p.nombre}</div><div style="font-size:10px;color:var(--dim)">${nCtas} cuenta(s)</div></div></div>
        <div style="font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:${tot>0?'var(--r)':'var(--g)'};flex-shrink:0">${fmt(tot)}</div>
      </div>
      ${open?`<div style="padding:4px 12px 12px">${cppTabla('agua',grupos.agua)}${cppTabla('luz',grupos.luz)}${cppTabla('predial',grupos.predial)}</div>`:''}
    </div>`;
  });
  cont.innerHTML=html;
}
function exportCPPExcel(){
  const data=cppData();
  const rows=[['PROPIETARIO','TIPO','INMUEBLE','ALIAS','MEDIDOR','CUENTA','NOMBRE RECIBO','DEUDA TOTAL','ACTUALIZADO']];
  data.forEach(({p,grupos})=>['agua','luz','predial'].forEach(t=>grupos[t].slice().sort((a,b)=>(a.inmueble||'').localeCompare(b.inmueble||'')).forEach(sv=>{
    rows.push([p.nombre,TIPOS_SVC[t].n,sv.inmueble||'',sv.alias||'',sv.medidor||'',sv.cuenta||'',sv.nombre_recibo||'',cppDeuda(sv),sv.fecha_actualizacion||'']);
  })));
  if(rows.length===1){snack('Sin cuentas para exportar');return;}
  const wb=XLSX.utils.book_new();const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:22},{wch:10},{wch:20},{wch:16},{wch:12},{wch:14},{wch:20},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws,'CPP');
  XLSX.writeFile(wb,'cuentas_por_pagar_'+todayISO()+'.xlsx');
  snack('📊 Excel generado');
}

function renderPropList(){
  const q=(document.getElementById("search-inq")?.value||"").toLowerCase();
  const searchOn=!!q;
  let html='';
  DB.propietarios.slice().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'')).forEach(p=>{
    const inms=DB.inmuebles.filter(x=>x.propietarioId===p.id);
    const allTenants=DB.inquilinos.filter(x=>x.propietarioId===p.id&&x.estado==='activo');
    // Filter by search - if match propietario name, show all; else filter tenants
    let matchProp=!q||(p.nombre||'').toLowerCase().includes(q);
    let matchAnyChild=false;
    if(q&&!matchProp){
      matchAnyChild=inms.some(inm=>(inm.nombre||'').toLowerCase().includes(q))||
                     allTenants.some(t=>(t.nombre||'').toLowerCase().includes(q));
    }
    if(q&&!matchProp&&!matchAnyChild)return;
    const totalRenta=allTenants.reduce((s,t)=>s+Number(t.renta||0),0);
    const cobrado=allTenants.filter(t=>isPagado(t.id,curMes,curAnio)).reduce((s,t)=>{const pg=getPago(t.id,curMes,curAnio);return s+Number(pg?.monto||0);},0);
    const nVenc=allTenants.filter(t=>isLate(t.id,curMes,curAnio)).length;
    const pct=totalRenta>0?Math.round(cobrado/totalRenta*100):0;
    const kProp='prop_open_'+p.id;
    const openProp=searchOn||expandedInm[kProp]===true;
    html+=`<div style="background:var(--s1);border:1px solid #E4E9EF;border-radius:11px;margin-bottom:10px;overflow:hidden">
      <div onclick="togglePropInq('${p.id}')" style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:linear-gradient(90deg,var(--s1),transparent);cursor:pointer">
        <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
          <span class="inm-arrow ${openProp?'open':''}" style="color:var(--gold)">▶</span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;color:var(--gold);font-size:15px">👤 ${p.nombre}</div>
            <div style="font-size:10px;color:var(--dim);margin-top:2px">${inms.length} propiedades · ${allTenants.length} inq · ${pct}% cobrado${nVenc>0?` · <span style="color:var(--r)">${nVenc} venc</span>`:''}</div>
          </div>
        </div>
        <button class="btn bo bsm" onclick="event.stopPropagation();openPropietarioEdit('${p.id}')" style="font-size:10px;padding:4px 7px">⚙️</button>
      </div>`;
    if(openProp){
      html+=`<div style="padding:0 10px 10px">`;

        html+=`<div style="padding:14px;text-align:center;color:var(--dim);font-size:12px">Sin propiedades registradas</div>`;
      }else{

          const inmRenta=tenants.reduce((s,t)=>s+Number(t.renta||0),0);

                <div style="flex:1;min-width:0">

                  <div class="inq-dia" style="min-width:24px;text-align:center;background:var(--s2);padding:3px 6px;border-radius:5px;font-size:10px;font-weight:700;color:var(--gold)">${t.dia||'—'}</div>

                  <div style="text-align:right;flex-shrink:0">
                    <div style="font-size:12px;font-weight:700;color:var(--gold)">${fmt(t.renta)}</div>
                    ${paid?'<div style="font-size:9px;color:var(--g)">✓ pagado</div>':late?'<div style="font-size:9px;color:var(--r)">⚠ vencido</div>':'<div style="font-size:9px;color:var(--dim)">pendiente</div>'}
                  </div>
                </div>`;
              });
              html+=`<div style="text-align:center;margin-top:6px"><button class="btn bo bsm" onclick="openEditTenantWithDefaults('${p.id}','${inm.id}')" style="font-size:10px;padding:5px 10px">+ Agregar inquilino a ${inm.nombre}</button></div>`;
            }
            html+=`</div>`;
          }
          html+=`</div>`;
        });
      }
      // Inquilinos cuyo inmueble pertenece a otro propietario (mismatch de datos) — mostrarlos para que sean corregibles
      const inmIdsProp=new Set(inms.map(x=>x.id));
      const inmNamesProp=new Set(inms.map(x=>x.nombre));
      const huerfanos=allTenants.filter(t=>!(inmIdsProp.has(t.inmuebleId)||inmNamesProp.has(t.inmueble)));
      if(huerfanos.length>0){
        html+=`<div style="background:#E05C5C11;border:1px solid #E05C5C44;border-radius:9px;padding:10px 12px;margin-top:8px">
          <div style="font-size:11px;color:var(--r);font-weight:700;margin-bottom:6px">⚠️ ${huerfanos.length} inquilino${huerfanos.length===1?'':'s'} con inmueble de otro propietario</div>
          ${huerfanos.map(t=>`<div onclick="openDet('${t.id}')" style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid #E05C5C22;cursor:pointer;font-size:12px">
            <span>${t.nombre}</span><span style="color:var(--dim)">${t.inmueble||'sin inmueble'} →</span>
          </div>`).join('')}
          <div style="font-size:9px;color:var(--dim);margin-top:6px">Toca para abrir y corregir el propietario o el inmueble</div>
        </div>`;
      }
      html+=`<div style="text-align:center;margin-top:6px"><button class="btn bs bsm" onclick="openInmuebleEditForm(null,'${p.id}')" style="font-size:10px">+ Agregar propiedad a ${p.nombre}</button></div>`;
      html+=`</div>`;
    }
    html+=`</div>`;
  });
  if(!html)html=`<div class="es"><div class="ei">🔍</div><div class="et">Sin resultados</div></div>`;
  document.getElementById("prop-list").innerHTML=html;
}

// Llena el dropdown de cuentas de luz según el inmueble seleccionado
function rebuildTenantLuzOptions(preselectId,legacyCuenta){
  const sel=document.getElementById('m-luzId');if(!sel)return;
  const inmId=document.getElementById('m-inmId')?.value;
  const keep=preselectId||sel.dataset.pre||'';
  if(preselectId!==undefined)sel.dataset.pre=preselectId||'';
  if(legacyCuenta!==undefined)sel.dataset.legacy=legacyCuenta||'';
  const inmObj=DB.inmuebles.find(x=>x.id===inmId);
  if(!inmObj){sel.innerHTML='<option value="">— Elige un inmueble primero —</option>';return;}
  const inmUp=(inmObj.nombre||'').trim().toUpperCase();
  const luces=DB.servicios.filter(s=>{
    const tip=s.tipo==='cfe'?'luz':s.tipo;
    return tip==='luz'&&(s.inmueble||'').trim().toUpperCase()===inmUp;
  }).sort((a,b)=>(a.alias||'').localeCompare(b.alias||''));
  const legacy=sel.dataset.legacy||'';
  let pre=keep;
  if(!pre&&legacy){
    const m=luces.find(s=>String(s.cuenta||'').trim()===legacy.trim());
    if(m)pre=m.id;
  }
  const vincUsados={};
  DB.inquilinos.forEach(t=>{if(t.cuentaLuzId)vincUsados[t.cuentaLuzId]=t.nombre;});
  sel.innerHTML='<option value="">— Sin vincular —</option>'+luces.map(s=>{
    const usadoPor=vincUsados[s.id];
    const partes=[s.alias||'(sin alias)'];
    if(s.medidor)partes.push('med '+s.medidor);
    if(s.cuenta)partes.push(s.cuenta);
    return`<option value="${s.id}"${pre===s.id?' selected':''}>${partes.join(' · ')}${usadoPor&&pre!==s.id?' ⚠ '+usadoPor.split(' ')[0]:''}</option>`;
  }).join('');
  if(luces.length===0)sel.innerHTML='<option value="">— Este inmueble no tiene cuentas de luz —</option>';
}

function updateTenantInmuebles(keepInmId){
  const propId=document.getElementById('m-propId').value;
  const sel=document.getElementById('m-inmId');
  if(!sel)return;
  const currentVal=sel.value||keepInmId||'';
  let inmuebles=propId?DB.inmuebles.filter(x=>x.propietarioId===propId):DB.inmuebles.slice();
  // Mantener el inmueble seleccionado visible aunque sea de otro propietario
  if(currentVal&&!inmuebles.find(x=>x.id===currentVal)){
    const inmActual=DB.inmuebles.find(x=>x.id===currentVal);
    if(inmActual){
      const owner=getPropietario(inmActual.propietarioId);
      inmuebles=[{...inmActual,_mismatchOwner:owner?.nombre||'?'},...inmuebles];
    }
  }
  sel.innerHTML='<option value="">— Seleccionar —</option>'+inmuebles.map(im=>`<option value="${im.id}"${currentVal===im.id?' selected':''}>${im.nombre}${im._mismatchOwner?' (de '+im._mismatchOwner+')':''}</option>`).join('');
  rebuildTenantLuzOptions();
}

function saveTenant(id){
  try{
    const nom=document.getElementById('m-nom').value.trim();
    const propId=document.getElementById('m-propId').value;
    const inmId=document.getElementById('m-inmId').value;
    const rent=document.getElementById('m-rent').value;
    const faltan=[];
    if(!nom)faltan.push('nombre');
    if(!propId)faltan.push('propietario');
    if(!inmId)faltan.push('inmueble');
    if(!rent)faltan.push('renta');
    if(faltan.length){snack('⚠️ Falta: '+faltan.join(', '));return;}
    const propObj=getPropietario(propId);
    const inmObj=DB.inmuebles.find(x=>x.id===inmId);
    const luzSel=document.getElementById('m-luzId');
    const cuentaLuzId=luzSel?luzSel.value:'';
    const luzSvc=cuentaLuzId?DB.servicios.find(s=>s.id===cuentaLuzId):null;
    const obj={nombre:nom,
      propietarioId:propId,propietario:propObj?.nombre||'',
      inmuebleId:inmId,inmueble:inmObj?.nombre||'',
      interior:document.getElementById('m-int').value.trim(),renta:Number(rent),
      dia:Number(document.getElementById('m-dia').value)||5,destino:document.getElementById('m-dest').value.trim(),
      cuentaLuzId:cuentaLuzId,
      cuenta_luz:luzSvc?String(luzSvc.cuenta||luzSvc.medidor||''):'',
      servicios:document.getElementById('m-srv').value.trim(),estatus:document.getElementById('m-est').value.trim(),
      renovacion:document.getElementById('m-ren').value,contrato_vigente:document.getElementById('m-cv').value,
      comentarios:document.getElementById('m-com').value.trim(),estado:document.getElementById('m-estado').value};
    if(id){
      const ten=DB.inquilinos.find(x=>x.id===id);
      if(!ten){snack('⚠️ No encontré al inquilino');return;}
      Object.assign(ten,obj);
    }else{DB.inquilinos.push({id:uid(),...obj});}
    saveDB('inquilinos');closeM();snack(id?'Actualizado ✓':'Agregado ✓');
    if(curView==='inq')renderPropList();
    else if(curView==='det'&&detTenant?.id===id){
      detTenant=DB.inquilinos.find(x=>x.id===id);
      document.getElementById("hdr-t").textContent=detTenant?.nombre||"Inquilino";
      document.getElementById("hdr-s").textContent=detTenant?.inmueble||"";
      renderDet();
    }
    else if(curView==='con')renderCon();
    else if(curView==='dash')renderDash();
    updNotif();
  }catch(e){
    console.error('[saveTenant]',e);
    snack('❌ Error al guardar: '+e.message);
  }
}

function delTenant(id){
  const t=DB.inquilinos.find(x=>x.id===id);if(!t)return;
  const numPagos=DB.pagos.filter(p=>p.iid===id).length;
  let msg=`¿Eliminar a ${t.nombre} (${t.inmueble})?`;
  if(numPagos>0)msg+=`\n\n⚠️ Tiene ${numPagos} pagos registrados que también se eliminarán.`;
  msg+='\n\nEsta acción NO se puede deshacer. Considera marcarlo como Inactivo en su lugar.';
  if(!confirm(msg))return;
  DB.inquilinos=DB.inquilinos.filter(x=>x.id!==id);
  DB.pagos=DB.pagos.filter(p=>p.iid!==id);
  saveDB('inquilinos');saveDB('pagos');
  closeM();snack('Inquilino eliminado');
  if(curView==='det'){detTenant=null;go('inq');}
  else if(curView==='inq')renderPropList();
  else if(curView==='con')renderCon();
}

  cfe:{n:'Luz (CFE)',i:'⚡',url:'https://app.cfe.mx/Aplicaciones/CCFE/Temas/Tema1ServiciosLV/ConsultaFactura.aspx'},
  agua:{n:'Agua (SACMEX)',i:'💧',url:'https://www.sacmex.cdmx.gob.mx/servicios-en-linea/adeudo-agua'},
  predial:{n:'Predial CDMX',i:'🏛️',url:'https://portal.finanzas.cdmx.gob.mx/predial/adeudo'},
  gas:{n:'Gas Natural',i:'🔥',url:'https://mgs.naturgy.com.mx'},
  otro:{n:'Servicio',i:'🔧',url:''}};

    <div class="fg"><label class="fl">Tipo *</label><select class="fi" id="m-st">

    <div class="fg"><label class="fl">Nombre en el recibo</label><input class="fi" id="m-snr" value="${(s?.nombre_recibo||'').replace(/"/g,'&quot;')}" placeholder="Ej: IRMA FLORES FLORES"></div>
    <div class="grid2">
      <div class="fg"><label class="fl">Nota inquilino</label><input class="fi" id="m-sni" value="${(s?.nota_inquilino||'').replace(/"/g,'&quot;')}"></div>
      <div class="fg"><label class="fl">Nota inmueble</label><input class="fi" id="m-snin" value="${(s?.nota_inmueble||'').replace(/"/g,'&quot;')}"></div>

      ${id?`<button class="btn bd" onclick="delSvc('${id}')">🗑️</button>`:''}
      <button class="btn bg bfu" onclick="saveSvc('${id||''}')">Guardar</button>
    </div></div>`);
}

function saveSvc(id){
  const inm=document.getElementById('m-sp').value.trim();
  if(!inm){snack('Indica inmueble');return;}
  const inmObj=DB.inmuebles.find(x=>x.nombre===inm);
  const obj={
    inmueble:inm,tipo:document.getElementById('m-st').value,
    cuenta:document.getElementById('m-sc').value.trim(),
    alias:document.getElementById('m-salias').value.trim(),
    medidor:document.getElementById('m-smed').value.trim(),
    nombre_recibo:document.getElementById('m-snr').value.trim(),
    nota_inquilino:document.getElementById('m-sni').value.trim(),
    nota_inmueble:document.getElementById('m-snin').value.trim(),
    notas:document.getElementById('m-sn').value.trim(),
    propietarioId:inmObj?.propietarioId||''
  };
  if(id){Object.assign(DB.servicios.find(x=>x.id===id),obj);}else{DB.servicios.push({id:uid(),...obj,creado:nowISO()});}
  // Sync legacy inmueble fields
  if(inmObj){
    if(obj.tipo==='predial'&&obj.cuenta)inmObj.cuenta_predial=obj.cuenta;
    if(obj.tipo==='agua'&&obj.cuenta)inmObj.cuenta_agua=obj.cuenta;
    saveDB('inmuebles');
  }
  saveDB('servicios');closeM();snack('Cuenta guardada ✓');
}

function delSvc(id){
  const svc=DB.servicios.find(x=>x.id===id);
  const nRec=DB.recibos_servicios.filter(r=>r.servicioId===id).length;
  const nPag=DB.pagos_servicios.filter(p=>p.servicioId===id).length;
  let msg='¿Eliminar esta cuenta?';
  if(nRec>0||nPag>0)msg+=`\n\n⚠️ Se eliminarán también ${nRec} recibos y ${nPag} pagos vinculados.`;
  if(!confirm(msg))return;
  DB.servicios=DB.servicios.filter(s=>s.id!==id);
  DB.recibos_servicios=DB.recibos_servicios.filter(r=>r.servicioId!==id);
  DB.pagos_servicios=DB.pagos_servicios.filter(p=>p.servicioId!==id);
  // Desvincular inquilinos que apuntaban a esta cuenta de luz
  DB.inquilinos.forEach(t=>{if(t.cuentaLuzId===id){t.cuentaLuzId='';}});
  saveDB('servicios');saveDB('recibos_servicios');saveDB('pagos_servicios');saveDB('inquilinos');
  closeM();snack('Cuenta eliminada');
}

// ── VISTA DE BALANCE DE UN SERVICIO ──
function openServicioBalance(svcId){
  const sv=DB.servicios.find(x=>x.id===svcId);if(!sv)return;
  const tipo=TIPOS_SVC[sv.tipo]||TIPOS_SVC.otro;
  const recibos=DB.recibos_servicios.filter(r=>r.servicioId===svcId).sort((a,b)=>new Date(b.fecha||0)-new Date(a.fecha||0));
  const pagos=DB.pagos_servicios.filter(p=>p.servicioId===svcId).sort((a,b)=>new Date(b.fecha||0)-new Date(a.fecha||0));
  const totalRec=recibos.reduce((s,r)=>s+Number(r.monto||0),0);
  const totalPag=pagos.reduce((s,p)=>s+Number(p.monto||0),0);
  const bal=totalRec-totalPag;
  const balColor=bal>0?'#E05C5C':bal<0?'#426A54':'#777';

  // Merge movimientos por fecha
  const movs=[
    ...recibos.map(r=>({...r,_tipo:'recibo'})),
    ...pagos.map(p=>({...p,_tipo:'pago'}))
  ].sort((a,b)=>new Date(b.fecha||0)-new Date(a.fecha||0));

  let html=`<div class="ms" style="max-height:96vh"><div class="mh"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div><div class="mt2" style="margin:0">${tipo.i} ${tipo.n}</div>
      <div style="font-size:11px;color:var(--dim);margin-top:2px">${sv.inmueble}${sv.cuenta?' · '+sv.cuenta:''}</div></div>
      <button class="btn bo bsm" onclick="closeM();openServicioForm('${svcId}')">⚙️</button>
    </div>

    <div style="background:linear-gradient(135deg,#F4F6F9,#E4E9EF);border:2px solid ${balColor};border-radius:12px;padding:14px;margin-bottom:14px;text-align:center">
      <div style="font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px">${bal===0?'Al corriente':bal>0?'Deuda pendiente':'Saldo a favor'}</div>
      <div style="font-family:'Playfair Display',serif;font-size:34px;color:${balColor};margin:4px 0">${fmt(Math.abs(bal))}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
        <div style="background:#E05C5C11;padding:8px;border-radius:8px">
          <div style="font-size:9px;color:var(--r)">RECIBOS (${recibos.length})</div>
          <div style="font-weight:700;color:var(--r);font-size:13px">${fmt(totalRec)}</div>
        </div>
        <div style="background:#426A5411;padding:8px;border-radius:8px">
          <div style="font-size:9px;color:var(--g)">PAGOS (${pagos.length})</div>
          <div style="font-weight:700;color:var(--g);font-size:13px">${fmt(totalPag)}</div>
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
      <button class="btn bd" onclick="openReciboForm('${svcId}')">+ Recibo</button>
      <button class="btn bs" onclick="openPagoServicioForm('${svcId}')">− Pago</button>
    </div>

    ${tipo.url?`<a href="${tipo.url}" target="_blank" class="btn bo bfu" style="text-decoration:none;margin-bottom:14px;text-align:center">🌐 Consultar en portal</a>`:''}

    <div class="st-sm">Movimientos (${movs.length})</div>
    <div class="card" style="padding:0 12px">
      ${movs.length===0?`<div style="padding:16px;text-align:center;color:var(--dim);font-size:12px">Sin movimientos. Empieza registrando un recibo.</div>`:movs.map(m=>{
        const isRec=m._tipo==='recibo';
        const color=isRec?'var(--r)':'var(--g)';
        const sign=isRec?'+':'−';
        return`<div onclick="${isRec?`openReciboForm('${svcId}','${m.id}')`:`openPagoServicioForm('${svcId}','${m.id}')`}" style="padding:10px 0;border-bottom:1px solid #EAEEF2;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">${isRec?'📄 Recibo':'💸 Pago'}${m.concepto?': '+m.concepto:''}</div>
            <div style="font-size:10px;color:var(--dim);margin-top:2px">${m.fecha?new Date(m.fecha).toLocaleDateString('es-MX'):'—'}${m.destino?' · '+m.destino:''}${m.notas?' · '+m.notas.slice(0,30):''}</div>
          </div>
          <div style="color:${color};font-weight:700;font-family:'Playfair Display',serif;font-size:16px">${sign}${fmt(m.monto)}</div>
        </div>`;
      }).join('')}
    </div>
    <div style="height:20px"></div>
    </div>`;
  modal(html);
}

// ── CAPTURA RÁPIDA DE LUZ (tabla: recibo/deuda por depto) ──
function openCapturaLuz(inm){
  const norm=t=>t==='cfe'?'luz':t;
  const luces=DB.servicios.filter(s=>s.inmueble===inm&&norm(s.tipo)==='luz')
    .sort((a,b)=>String(a.cuenta||'zzz').localeCompare(String(b.cuenta||'zzz'),undefined,{numeric:true})||(a.alias||'').localeCompare(b.alias||''));
  if(luces.length===0){snack('Este inmueble no tiene cuentas de luz');return;}
  const fechaHoy=todayISO();
  let filas=luces.map((sv,i)=>{
    const bal=getServicioBalance(sv.id);
    const inqV=DB.inquilinos.find(t=>t.cuentaLuzId===sv.id);
    const numServicio=sv.cuenta||'(sin número de servicio)';
    const subtitulo=[sv.alias,inqV?'👤 '+inqV.nombre.split(' ')[0]:''].filter(Boolean).join(' · ');
    return`<tr style="border-bottom:1px solid #EAEEF2">
      <td style="padding:7px 4px;text-align:center">
        <input type="checkbox" id="pay-${sv.id}" ${sv.pagar_yo?'checked':''} onchange="toggleServicioPagar('${sv.id}')"
          style="width:18px;height:18px;accent-color:var(--gold);cursor:pointer">
      </td>
      <td style="padding:7px 6px;font-size:11px">
        <div style="font-weight:700;font-family:monospace;color:${sv.cuenta?'var(--txt,#fff)':'var(--r)'}">${numServicio}</div>
        <div style="font-size:9px;color:var(--dim)">${subtitulo}</div>
      </td>
      <td style="padding:7px 4px;text-align:right;font-size:11px;color:${bal>0?'var(--r)':'var(--dim)'};white-space:nowrap">${fmt(bal)}</td>
      <td style="padding:7px 4px">
        <input type="number" step="0.01" inputmode="decimal" id="cap-${sv.id}" placeholder="0"
          style="width:72px;background:var(--s2);border:1px solid #CBD5DF;border-radius:6px;padding:6px 7px;color:var(--txt,#fff);font-size:13px;text-align:right">
      </td>
    </tr>`;
  }).join('');
  const nPagar=luces.filter(s=>s.pagar_yo).length;
  modal(`<div class="ms" style="max-height:94vh"><div class="mh"></div>
    <div class="mt2">⚡ Captura rápida — ${inm}</div>
    <div style="font-size:11px;color:var(--dim);margin-bottom:10px">Marca ☑ los servicios que <b>te toca pagar</b> (se guarda). Escribe el monto del nuevo recibo de cada número de servicio; se registra como recibo y <b>suma</b> a la deuda. Deja en blanco los que no cambian.</div>
    <div class="grid2" style="margin-bottom:10px">
      <div class="fg" style="margin:0"><label class="fl">Fecha de los recibos</label><input class="fi" type="date" id="cap-fecha" value="${fechaHoy}"></div>
      <div class="fg" style="margin:0"><label class="fl">Concepto (común)</label><input class="fi" id="cap-concepto" placeholder="Ej: Bim 5 2026"></div>
    </div>
    <div style="overflow-x:auto;border:1px solid #E6EBF0;border-radius:9px">
    <table style="width:100%;border-collapse:collapse">
      <thead><tr style="background:var(--s2)">
        <th style="text-align:center;padding:7px 4px;font-size:9px;color:var(--gold);text-transform:uppercase" title="Me toca pagar">💰</th>
        <th style="text-align:left;padding:7px 6px;font-size:9px;color:var(--dim);text-transform:uppercase">No. servicio</th>
        <th style="text-align:right;padding:7px 4px;font-size:9px;color:var(--dim);text-transform:uppercase">Deuda actual</th>
        <th style="text-align:right;padding:7px 4px;font-size:9px;color:var(--dim);text-transform:uppercase">Nuevo recibo $</th>
      </tr></thead>
      <tbody>${filas}</tbody>
    </table></div>
    <div style="font-size:10px;color:var(--dim);margin-top:8px;text-align:center" id="cap-resumen">${nPagar} servicio(s) marcados para pagar</div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn bo" onclick="openInmuebleDet('${inm.replace(/'/g,"\\'")}')">Cancelar</button>
      <button class="btn bg bfu" onclick="guardarCapturaLuz('${inm.replace(/'/g,"\\'")}')">Guardar recibos</button>
    </div>
    <button class="btn bo bfu" style="margin-top:8px" onclick="openOrdenPago()">🧾 Generar orden de pago (marcados)</button>
    <div style="height:14px"></div></div>`);
  // Resumen en vivo
  const ids=luces.map(s=>s.id);
  const upd=()=>{
    let n=0,tot=0;
    ids.forEach(id=>{const v=Number(document.getElementById('cap-'+id)?.value);if(v>0){n++;tot+=v;}});
    const nPay=luces.filter(s=>s.pagar_yo).length;
    const el=document.getElementById('cap-resumen');
    if(el)el.textContent=n===0?`${nPay} servicio(s) marcados para pagar`:`${n} recibo(s) · suma ${fmt(tot)} · ${nPay} marcados para pagar`;
  };
  ids.forEach(id=>{const inp=document.getElementById('cap-'+id);if(inp)inp.addEventListener('input',upd);});
}

// Marca/desmarca un servicio como "me toca pagar" (persiste)
function toggleServicioPagar(svcId){
  const sv=DB.servicios.find(x=>x.id===svcId);if(!sv)return;
  sv.pagar_yo=!sv.pagar_yo;
  saveDB('servicios');
}

      <select class="fi" id="op-prop" onchange="openOrdenPago(this.value||null)"><option value="">— Todos —</option>${propOpts}</select></div>

    <button class="btn bo bfu" style="margin-top:8px" onclick="closeM()">Cerrar</button>
    <div style="height:14px"></div></div>`);

function ordenPagoTotales(){
  let td=0,tp=0;
  document.querySelectorAll('input[id^="op-"]').forEach(inp=>{
    if(inp.id==='op-prop')return;
    td+=Number(inp.dataset.deuda||0);
    tp+=Number(inp.value||0);
  });
  const d=document.getElementById('op-tot-deuda'),p=document.getElementById('op-tot-pago');
  if(d)d.textContent=fmt(td);
  if(p)p.textContent=fmt(tp);
}

function exportOrdenPagoExcel(propId){
  try{
    propId=propId||null;
    let marcados=DB.servicios.filter(s=>s.pagar_yo);
    if(propId)marcados=marcados.filter(s=>s.propietarioId===propId);
    marcados.sort((a,b)=>(a.inmueble||'').localeCompare(b.inmueble||'')||(a.alias||'').localeCompare(b.alias||'',undefined,{numeric:true}));
    if(marcados.length===0){snack('No hay servicios marcados');return;}
    const S=v=>v===null||v===undefined?'':String(v);
    const header=['INMUEBLE','MEDIDOR','CUENTA','NOMBRE','DEUDA','ORDEN DE PAGO','OBSERVACIONES'];
    const rows=[header];
    let totD=0,totP=0;
    marcados.forEach(sv=>{
      const bal=Math.max(0,getServicioBalance(sv.id));
      const inp=document.getElementById('op-'+sv.id);
      const pago=inp?Number(inp.value||0):bal;
      totD+=bal;totP+=pago;
      const obs=bal<=0?'PAGADO':'';
      rows.push([S(sv.alias||sv.inmueble),S(sv.medidor),S(sv.cuenta),S(sv.nombre_recibo),bal,pago,obs]);
    });
    rows.push(['','','','totales',totD,totP,'']);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:24},{wch:12},{wch:18},{wch:22},{wch:10},{wch:14},{wch:14}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Orden de pago');
    const propObj=propId?getPropietario(propId):null;
    const nombre=propObj?'_'+(propObj.nombre||'').replace(/\s+/g,'_'):'';
    XLSX.writeFile(wb,`orden_de_pago${nombre}_${todayISO()}.xlsx`);
    snack('✓ Orden de pago descargada');
  }catch(e){console.error(e);snack('Error: '+e.message);}
}

// Normaliza texto de deuda: '89713', '$ -', '', '$1,234.56' -> número
function parseDeuda(v){
  if(v===null||v===undefined)return 0;
  const s=String(v).replace(/[$,\s]/g,'');
  if(s===''||s==='-')return 0;
  const n=Number(s);
  return isNaN(n)?0:n;
}
// Normaliza fecha Excel (Date, serial, o string) -> 'YYYY-MM-DD' o ''
function parseFechaExcel(v){
  if(!v)return '';
  if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);
  if(typeof v==='number'&&v>20000&&v<80000){
    const d=new Date(Math.round((v-25569)*86400000));
    return isNaN(d)?'':d.toISOString().slice(0,10);
  }
  const s=String(v).trim();
  const m=s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m)return m[0];
  const d=new Date(s);
  return isNaN(d)?'':d.toISOString().slice(0,10);
}

// Aplica filas ya parseadas [{inmueble,propietario,alias,tipo,medidor,cuenta,nombre_recibo,nota_inquilino,deuda,nota_inmueble,fecha_actualizacion}]
function applyCuentasImport(rows){
  const res={propietariosCreados:0,inmueblesCreados:0,cuentasNuevas:0,cuentasActualizadas:0,recibosDeuda:0,deudaImportada:0,omitidas:0,conMovimientos:0};
  rows.forEach(r=>{
    const inmNombre=String(r.inmueble||'').trim();
    if(!inmNombre){res.omitidas++;return;}
    const tipoRaw=String(r.tipo||'').trim().toLowerCase();
    const tipo=tipoRaw==='luz'||tipoRaw==='cfe'?'luz':tipoRaw==='agua'?'agua':tipoRaw==='predial'?'predial':tipoRaw==='gas'?'gas':'otro';
    // Propietario: buscar o crear
    const propNombre=String(r.propietario||'').trim().toUpperCase();
    let prop=propNombre?DB.propietarios.find(p=>(p.nombre||'').trim().toUpperCase()===propNombre):null;
    if(!prop&&propNombre){
      prop={id:'prop_'+propNombre.toLowerCase().replace(/[^a-z0-9]/g,'_'),nombre:propNombre,contacto:'',telefono:'',correo:'',notas:'Creado por importación de cuentas',fecha_inicio:todayISO(),creado:nowISO()};
      DB.propietarios.push(prop);res.propietariosCreados++;
    }
    // Inmueble: buscar case-insensitive o crear
    const inmUp=inmNombre.toUpperCase();
    let inm=DB.inmuebles.find(x=>(x.nombre||'').trim().toUpperCase()===inmUp);
    if(!inm){
      inm={id:'inm_'+inmUp.toLowerCase().replace(/[^a-z0-9]/g,'_')+'_'+uid().slice(0,4),nombre:inmNombre,propietarioId:prop?.id||'',direccion:'',cuenta_predial:'',cuenta_agua:'',notas:'Creado por importación de cuentas',creado:nowISO()};
      DB.inmuebles.push(inm);res.inmueblesCreados++;
    }else if(!inm.propietarioId&&prop){inm.propietarioId=prop.id;}
    // Upsert servicio: clave = inmueble + tipo + cuenta + alias
    const cuenta=String(r.cuenta||'').trim();
    const alias=String(r.alias||'').trim();
    let svc=DB.servicios.find(s=>
      (s.inmueble||'').trim().toUpperCase()===inmUp&&
      (s.tipo==='cfe'?'luz':s.tipo)===tipo&&
      String(s.cuenta||'').trim()===cuenta&&
      String(s.alias||'').trim()===alias
    );
    const campos={
      inmueble:inm.nombre,tipo,cuenta,alias,
      medidor:String(r.medidor||'').trim(),
      nombre_recibo:String(r.nombre_recibo||'').trim(),
      nota_inquilino:String(r.nota_inquilino||'').trim(),
      nota_inmueble:String(r.nota_inmueble||'').trim(),
      deuda_corte:parseDeuda(r.deuda),
      fecha_actualizacion:parseFechaExcel(r.fecha_actualizacion),
      propietarioId:inm.propietarioId||prop?.id||''
    };
    if(svc){Object.assign(svc,campos);res.cuentasActualizadas++;}
    else{svc={id:uid(),...campos,notas:'',creado:nowISO()};DB.servicios.push(svc);res.cuentasNuevas++;}
    // Deuda al corte -> recibo inicial (solo si no hay movimientos previos y no se importó antes)
    const deudaNum=campos.deuda_corte;
    const tieneMovs=DB.recibos_servicios.some(x=>x.servicioId===svc.id)||DB.pagos_servicios.some(x=>x.servicioId===svc.id);
    if(deudaNum>0){
      if(!tieneMovs&&!svc.deuda_importada){
        DB.recibos_servicios.push({id:uid(),servicioId:svc.id,monto:deudaNum,fecha:campos.fecha_actualizacion||todayISO(),concepto:'Deuda al corte (importada)',notas:'Importado desde Excel',creado:nowISO()});
        svc.deuda_importada=true;
        res.recibosDeuda++;res.deudaImportada+=deudaNum;
      }else if(tieneMovs){res.conMovimientos++;}
    }
    // Sincronizar campos legacy del inmueble (1 por inmueble)
    if(tipo==='predial'&&cuenta)inm.cuenta_predial=cuenta;
    if(tipo==='agua'&&cuenta)inm.cuenta_agua=cuenta;
  });
  ['servicios','recibos_servicios','inmuebles','propietarios'].forEach(k=>saveDB(k));
  return res;
}

// UI: elegir archivo, mapear columnas por encabezado, preview y aplicar
let _importRowsPending=null;
function importCuentasExcel(){
  const input=document.createElement('input');
  input.type='file';input.accept='.xlsx,.xls';
  input.onchange=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        if(raw.length<2){snack('El archivo no tiene datos');return;}
        // Mapear columnas por encabezado (tolerante a variaciones)
        const headers=raw[0].map(h=>String(h||'').toUpperCase());
        const colIdx=(patterns)=>headers.findIndex(h=>patterns.some(p=>h.includes(p)));
        const ci={
          inmueble:colIdx(['INMUEBLE']),propietario:colIdx(['PROPIETARIO']),
          alias:colIdx(['ALIAS']),tipo:colIdx(['TIPO']),
          medidor:colIdx(['MEDIDOR']),cuenta:colIdx(['CUENTA']),
          nombre_recibo:colIdx(['NOMBRE RECIBO','NOMBRE']),
          nota_inquilino:colIdx(['NOTA INQ']),deuda:colIdx(['DEUDA']),
          nota_inmueble:colIdx(['NOTA INM']),fecha_actualizacion:colIdx(['FECHA'])
        };
        if(ci.inmueble<0||ci.tipo<0){snack('⚠️ El Excel necesita al menos columnas INMUEBLE y TIPO');return;}
        const rows=raw.slice(1).filter(r=>r[ci.inmueble]).map(r=>({
          inmueble:r[ci.inmueble],propietario:ci.propietario>=0?r[ci.propietario]:'',
          alias:ci.alias>=0?r[ci.alias]:'',tipo:r[ci.tipo],
          medidor:ci.medidor>=0?r[ci.medidor]:'',cuenta:ci.cuenta>=0?r[ci.cuenta]:'',
          nombre_recibo:ci.nombre_recibo>=0?r[ci.nombre_recibo]:'',
          nota_inquilino:ci.nota_inquilino>=0?r[ci.nota_inquilino]:'',
          deuda:ci.deuda>=0?r[ci.deuda]:'',
          nota_inmueble:ci.nota_inmueble>=0?r[ci.nota_inmueble]:'',
          fecha_actualizacion:ci.fecha_actualizacion>=0?r[ci.fecha_actualizacion]:''
        }));
        // Preview
        const tipos={};rows.forEach(r=>{const t=String(r.tipo||'').trim().toUpperCase()||'?';tipos[t]=(tipos[t]||0)+1;});
        const inms=[...new Set(rows.map(r=>String(r.inmueble||'').trim().toUpperCase()))];
        const deudaTot=rows.reduce((s,r)=>s+parseDeuda(r.deuda),0);
        _importRowsPending=rows;
        modal(`<div class="ms"><div class="mh"></div>
          <div class="mt2">📥 Importar cuentas</div>
          <div style="background:var(--s1);border-radius:11px;padding:14px;margin-bottom:12px">
            <div style="font-size:13px;font-weight:700;margin-bottom:8px">${file.name}</div>
            <div style="font-size:12px;color:#44515F;line-height:1.7">
              • <b>${rows.length}</b> cuentas: ${Object.entries(tipos).map(([t,n])=>`${n} ${t.toLowerCase()}`).join(' · ')}<br>
              • <b>${inms.length}</b> inmuebles: ${inms.slice(0,6).join(', ')}${inms.length>6?` +${inms.length-6}`:''}<br>
              • Deuda al corte total: <b style="color:var(--r)">${fmt(deudaTot)}</b>
            </div>
          </div>
          <div style="font-size:11px;color:var(--dim);margin-bottom:12px;line-height:1.6">Las cuentas se vinculan a cada inmueble. Las deudas al corte se registran como recibo inicial (los pagos que registres después las irán bajando). Re-importar el mismo archivo actualiza datos sin duplicar.</div>
          <div style="display:flex;gap:8px">
            <button class="btn bo" onclick="closeM();_importRowsPending=null">Cancelar</button>
            <button class="btn bg bfu" onclick="confirmImportCuentas()">Importar ${rows.length} cuentas</button>
          </div></div>`);
      }catch(err){console.error(err);snack('Error al leer: '+err.message);}
    };
    reader.readAsArrayBuffer(file);
  };
  input.click();
}

  if(!_importRowsPending){closeM();return;}
  const res=applyCuentasImport(_importRowsPending);

  modal(`<div class="ms"><div class="mh"></div>

let CORRIDA_LAST=null; // guarda el último cálculo para exportar

function isrResicoMensualCorrida(rentaMensual){
  if(rentaMensual<=25000)return rentaMensual*0.01;
  if(rentaMensual<=50000)return rentaMensual*0.011;
  if(rentaMensual<=83333.33)return rentaMensual*0.015;
  if(rentaMensual<=208333.33)return rentaMensual*0.02;
  return rentaMensual*0.025;
}

function coVal(id){return Number(document.getElementById(id)?.value)||0;}
function coChk(id){return document.getElementById(id)?.checked;}

function calcularCorrida(){
  const valor=coVal('co-valor');
  const plusvalia=coVal('co-plusvalia')/100;
  const renta=coVal('co-renta');
  const predial=coVal('co-predial');
  if(!renta){snack('Indica la renta mensual');return;}
  const tog_serv=coChk('co-tog-serv');
  const luz_depto=tog_serv?coVal('co-luz-depto'):0;
  const luz_serv=tog_serv?coVal('co-luz-serv'):0;
  const agua=tog_serv?coVal('co-agua'):0;
  const tog_inc=coChk('co-tog-inc')&&tog_serv;
  const inc_serv=tog_inc?coVal('co-inc-serv')/100:0;
  const plomeria=coVal('co-plomeria'),herreria=coVal('co-herreria'),pintura=coVal('co-pintura'),albanileria=coVal('co-albanileria'),electricidad=coVal('co-electricidad');
  const tog_admin=coChk('co-tog-admin');
  const admin_pct=tog_admin?coVal('co-admin')/100:0;
  const capex=coVal('co-capex');
  const tog_seguro=coChk('co-tog-seguro');
  const seguro_anual=tog_seguro?coVal('co-seguro'):0;
  const tog_hip=coChk('co-tog-hip');
  const hipoteca_mensual=tog_hip?coVal('co-hipoteca'):0;
  const regimen=document.getElementById('co-regimen').value;
  const tasa_isr=coVal('co-tasa-isr')/100;
  const inflacion=coVal('co-inflacion')/100;

  const arr=()=>Array(12).fill(0);
  const filaRenta=Array(12).fill(renta);
  const filaSeguro=arr();if(tog_seguro)filaSeguro[0]=seguro_anual;
  const filaPredial=arr();filaPredial[1]=predial;
  const filaCapex=arr();filaCapex[1]=capex;
  const filaPlomeria=arr();filaPlomeria[1]=plomeria;
  const filaHerreria=arr();filaHerreria[1]=herreria;
  const filaPintura=arr();filaPintura[1]=pintura;
  const filaAlbanileria=arr();filaAlbanileria[1]=albanileria;
  const filaElectricidad=arr();filaElectricidad[1]=electricidad;
  const filaLuzDepto=arr(),filaLuzServ=arr(),filaAgua=arr();
  for(let m=2;m<=12;m+=2){const idx=m-1;const bim=m/2;const factor=Math.pow(1+inc_serv,bim-1);filaLuzDepto[idx]=luz_depto*factor;filaLuzServ[idx]=luz_serv*factor;filaAgua[idx]=agua*factor;}
  const filaAdmin=Array(12).fill(renta*admin_pct);
  const filaHipoteca=Array(12).fill(hipoteca_mensual);
  let isrMes;
  if(regimen==='RESICO')isrMes=isrResicoMensualCorrida(renta);
  else{const base=renta-renta*0.35-predial/12;isrMes=Math.max(0,base*tasa_isr);}
  const filaIsr=Array(12).fill(isrMes);
  const totalGastosMes=Array(12).fill(0).map((_,i)=>filaSeguro[i]+filaPredial[i]+filaLuzDepto[i]+filaLuzServ[i]+filaAgua[i]+filaPlomeria[i]+filaHerreria[i]+filaPintura[i]+filaAlbanileria[i]+filaElectricidad[i]+filaAdmin[i]+filaCapex[i]+filaHipoteca[i]+filaIsr[i]);
  const restanteMes=filaRenta.map((r,i)=>r-totalGastosMes[i]);
  const totalIngresos=renta*12;
  const totalHip=hipoteca_mensual*12;
  const totalIsr=isrMes*12;
  const totalGastosSinHipIsr=totalGastosMes.reduce((a,b)=>a+b,0)-totalHip-totalIsr;
  const noi=totalIngresos-totalGastosSinHipIsr;
  const utilidadNeta=restanteMes.reduce((a,b)=>a+b,0);
  const utilidadReal=utilidadNeta/(1+inflacion);
  const plusvaliaMonto=valor*plusvalia;
  const capRate=valor>0?noi/valor:0;
  const coc=valor>0?utilidadNeta/valor:0;
  const grm=totalIngresos>0?valor/totalIngresos:0;
  const ratio=totalIngresos>0?totalGastosSinHipIsr/totalIngresos:0;
  const roiTotal=valor>0?(utilidadNeta+plusvaliaMonto)/valor:0;

  const filas=[
    {label:'Renta mensual',tipo:'ingreso',valores:filaRenta},
    {label:'Póliza/Seguro (M1)',tipo:'gasto',valores:filaSeguro},
    {label:'Predial (M2)',tipo:'gasto',valores:filaPredial},
    {label:'Luz depto',tipo:'gasto',valores:filaLuzDepto},
    {label:'Luz general',tipo:'gasto',valores:filaLuzServ},
    {label:'Agua',tipo:'gasto',valores:filaAgua},
    {label:'Plomería (M2)',tipo:'gasto',valores:filaPlomeria},
    {label:'Herrería (M2)',tipo:'gasto',valores:filaHerreria},
    {label:'Pintura (M2)',tipo:'gasto',valores:filaPintura},
    {label:'Albañilería (M2)',tipo:'gasto',valores:filaAlbanileria},
    {label:'Electricidad (M2)',tipo:'gasto',valores:filaElectricidad},
    {label:'Inmobiliaria',tipo:'gasto',valores:filaAdmin},
    {label:'CapEx (M2)',tipo:'gasto',valores:filaCapex},
    {label:'Hipoteca',tipo:'gasto',valores:filaHipoteca},
    {label:'ISR mensual',tipo:'gasto',valores:filaIsr},
    {label:'Total Gastos',tipo:'total_gasto',valores:totalGastosMes},
    {label:'RESTANTE',tipo:'neta',valores:restanteMes},
  ];
  CORRIDA_LAST={nombre:document.getElementById('co-nombre').value||'Inmueble',filas,totalIngresos,utilidadNeta,noi,utilidadReal,capRate,coc,grm,ratio,plusvaliaMonto,roiTotal,regimen,restanteMes};
  renderCorridaResultado();
}

function renderCorridaResultado(){
  const d=CORRIDA_LAST;if(!d)return;
  const MC=['E','F','M','A','M','J','J','A','S','O','N','D'];
  const money=n=>'$'+Math.round(n).toLocaleString('es-MX');
  const pctf=n=>(n*100).toFixed(1)+'%';
  // Tabla compacta (scroll horizontal)
  let tabla=`<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #CBD5DF;border-radius:8px"><table style="border-collapse:collapse;font-size:9.5px;min-width:640px;width:100%">
    <tr style="background:var(--s2)"><th style="text-align:left;padding:5px 7px;position:sticky;left:0;background:var(--s2);z-index:2">Concepto</th>${MC.map(m=>`<th style="padding:5px 3px;min-width:34px">${m}</th>`).join('')}<th style="padding:5px 6px;background:#1e3a2a">Total</th></tr>`;
  d.filas.forEach(f=>{
    const total=f.valores.reduce((a,b)=>a+b,0);
    let bg='',col='';
    if(f.tipo==='ingreso'){bg='background:#1a2a1a';col='color:#426A54'}
    else if(f.tipo==='total_gasto'){bg='background:#2a1a1a';col='color:#E05C5C;font-weight:700'}
    else if(f.tipo==='neta'){bg='background:#1a2333';col='color:#2F7CC2;font-weight:700'}
    else col='color:var(--dim)';
    if(total===0&&f.tipo==='gasto')return; // ocultar gastos en cero para compactar
    tabla+=`<tr style="${bg};border-top:1px solid #E6EBF0"><td style="padding:4px 7px;position:sticky;left:0;${bg||'background:var(--s1)'};${col};white-space:nowrap">${f.label}</td>${f.valores.map(v=>`<td style="padding:4px 3px;text-align:right;${col}">${v?Math.round(v/1000)+'k':'−'}</td>`).join('')}<td style="padding:4px 6px;text-align:right;${col};font-weight:700">${money(total)}</td></tr>`;
  });
  tabla+=`</table></div>`;

  const utilColor=d.utilidadNeta>=0?'#426A54':'#E05C5C';
  modal(`<div class="ms" style="max-height:94vh"><div class="mh"></div>
    <div class="mt2">📊 ${d.nombre}</div>
    <div style="font-size:10px;color:var(--dim);margin-bottom:12px">${d.regimen} · proyección 12 meses</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      <div style="background:var(--s1);border-radius:9px;padding:10px;text-align:center">
        <div style="font-size:9px;color:var(--dim);text-transform:uppercase">Ingresos año</div>
        <div style="font-size:16px;font-weight:700;color:var(--gold)">${money(d.totalIngresos)}</div></div>
      <div style="background:var(--s1);border-radius:9px;padding:10px;text-align:center;border:1px solid ${utilColor}44">
        <div style="font-size:9px;color:var(--dim);text-transform:uppercase">Utilidad neta</div>
        <div style="font-size:16px;font-weight:700;color:${utilColor}">${money(d.utilidadNeta)}</div></div>
      <div style="background:var(--s1);border-radius:9px;padding:10px;text-align:center">
        <div style="font-size:9px;color:var(--dim);text-transform:uppercase">NOI</div>
        <div style="font-size:15px;font-weight:700;color:#2F7CC2">${money(d.noi)}</div></div>
      <div style="background:var(--s1);border-radius:9px;padding:10px;text-align:center">
        <div style="font-size:9px;color:var(--dim);text-transform:uppercase">Utilidad real (infl.)</div>
        <div style="font-size:15px;font-weight:700;color:#B565A7">${money(d.utilidadReal)}</div></div>
    </div>

    <div class="st-sm">Indicadores</div>
    <div class="card" style="padding:4px 14px;margin-bottom:12px">
      <div class="ir"><span class="ik">Cap Rate</span><span class="iv" title="NOI / valor">${pctf(d.capRate)}</span></div>
      <div class="ir"><span class="ik">Cash on Cash</span><span class="iv">${pctf(d.coc)}</span></div>
      <div class="ir"><span class="ik">GRM (multiplicador renta)</span><span class="iv">${d.grm.toFixed(1)}×</span></div>
      <div class="ir"><span class="ik">Ratio gastos/ingresos</span><span class="iv">${pctf(d.ratio)}</span></div>
      <div class="ir"><span class="ik">Plusvalía estimada año</span><span class="iv" style="color:#426A54">${money(d.plusvaliaMonto)}</span></div>
      <div class="ir"><span class="ik">ROI total (renta + plusvalía)</span><span class="iv" style="color:var(--gold);font-weight:700">${pctf(d.roiTotal)}</span></div>
    </div>

    <div class="st-sm">Proyección mensual (miles $)</div>

    <button class="btn bo bfu" style="margin-top:8px" onclick="closeM()">Cerrar</button>
    <div style="height:14px"></div></div>`);

let CORRIDA_LAST_PREFILL=null;

function exportCorridaExcel(){
  try{
    const d=CORRIDA_LAST;if(!d){snack('Primero calcula');return;}
    const MESES_C=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    const header=['CONCEPTO',...MESES_C,'TOTAL'];
    const rows=[header];
    d.filas.forEach(f=>{
      const total=f.valores.reduce((a,b)=>a+b,0);
      rows.push([f.label,...f.valores.map(v=>Math.round(v)),Math.round(total)]);
    });
    rows.push([]);
    rows.push(['— INDICADORES —']);
    rows.push(['Cap Rate',(d.capRate*100).toFixed(2)+'%']);
    rows.push(['Cash on Cash',(d.coc*100).toFixed(2)+'%']);
    rows.push(['GRM',d.grm.toFixed(2)]);
    rows.push(['Ratio gastos/ingresos',(d.ratio*100).toFixed(2)+'%']);
    rows.push(['Plusvalía estimada',Math.round(d.plusvaliaMonto)]);
    rows.push(['ROI total',(d.roiTotal*100).toFixed(2)+'%']);
    rows.push(['Utilidad neta',Math.round(d.utilidadNeta)]);
    rows.push(['NOI',Math.round(d.noi)]);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:22},...MESES_C.map(()=>({wch:9})),{wch:11}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Corrida');
    XLSX.writeFile(wb,`corrida_${(d.nombre||'').replace(/\s+/g,'_')}_${todayISO()}.xlsx`);
    snack('✓ Excel descargado');
  }catch(e){console.error(e);snack('Error: '+e.message);}
}

    <div style="font-size:11px;color:var(--dim);margin-bottom:14px">Analiza la rentabilidad de un inmueble a 12 meses. Puedes precargar la renta de un inmueble existente o empezar en blanco.</div>
    <div class="fg"><label class="fl">Precargar desde inmueble</label>
      <select class="fi" id="co-sel-inm"><option value="">— En blanco —</option>${opts}</select></div>
    <button class="btn bg bfu" onclick="corridaDesdeSelector()">Continuar →</button></div>`);
}
function corridaDesdeSelector(){
  const sel=document.getElementById('co-sel-inm');
  const inmId=sel.value;
  let prefill={};
  if(inmId){
    const im=DB.inmuebles.find(x=>x.id===inmId);
    const tenants=DB.inquilinos.filter(t=>t.estado==='activo'&&(t.inmuebleId===inmId||t.inmueble===im.nombre)&&Number(t.renta||0)>0);
    const renta=tenants.reduce((s,t)=>s+Number(t.renta||0),0);
    // Predial: buscar deuda predial del inmueble como referencia (no es el anual, pero orienta)
    prefill={nombre:im.nombre,renta,admin:10,plusvalia:8};
  }
  CORRIDA_LAST_PREFILL=prefill;
  openCorridaForm(prefill);
}

{ n:11, cat:"PLOM", titulo:"Destapar desagüe (émbolo)", diag:"desague",

  tiempo:[["Émbolo + agua caliente","15 – 20 min"],["Desmontando el sifón","20 – 35 min"]],
  mat:[["Desatascador líquido (opcional)","ml","200"],["Agua caliente (no hirviendo)","Litro","2-3"]],
  herr:["Émbolo de goma","Cubeta","Trapo","Llave para sifón (si se desmonta)"],
  epp:["Guantes de goma","Lentes si se usan químicos"],
  fases:[
    {f:"Agua caliente",pasos:["Verter 1–2 L de agua caliente (no hirviendo) en el desagüe.","Esperar 3–5 min y ver si drena normal."]},
    {f:"Émbolo mecánico",pasos:["Tapar el orificio de rebose con trapo húmedo para hacer vacío.","Colocar el émbolo cubriendo el desagüe, con agua encima.","10–15 bombeos firmes; levantar bruscamente al final.","Repetir 2–3 veces y correr agua para verificar."],diag:"desague"},
    {f:"Desmontar el sifón",pasos:["Colocar cubeta debajo para el agua.","Aflojar las tuercas del sifón a mano.","Retirar y limpiar el interior con cepillo; revisar objetos extraños.","Rearmar apretando a mano + 1/4 de vuelta."]},

  eval:[

{ n:12, cat:"PLOM", titulo:"Cambiar cabezal de regadera", diag:"cabezal",
  kw:"cabezal regadera ducha teflon rosca brazo cambiar chorro",
  generalidades:"Van a reemplazar el cabezal de una regadera (la pieza con los agujeros por donde sale el agua). Es el cambio más sencillo en plomería: se desenrosca el viejo y se enrosca el nuevo. El único cuidado es poner cinta teflón en la rosca del brazo antes de instalar el nuevo — evita fugas. No se aprieta con llave directo sobre el cabezal porque se raya o se rompe: se usa un trapo de por medio.",
  tiempo:[["Cambio del cabezal","10 – 20 min"]],
  mat:[["Cabezal nuevo (rosca 1/2\" estándar)","Pieza","1"],["Cinta teflón","Rollo","1"]],
  herr:["Llave ajustable","Trapo o franela (proteger acabado)"],
  epp:["Ninguno especial"],
  fases:[
    {f:"Retirar el viejo",pasos:["Cerrar el paso de agua de la regadera o del baño.","Trapo sobre el cabezal; con la llave, girar en sentido antihorario. Si está duro, golpe suave para aflojar óxido.","Retirar y limpiar la rosca del brazo con trapo seco."]},
    {f:"Teflón y colocar el nuevo",pasos:["Envolver la rosca del brazo con teflón: 3–5 vueltas en sentido HORARIO.","Roscar el cabezal a mano, en sentido horario, hasta que quede firme.","Con trapo de por medio, apretar 1/4 de vuelta con la llave. No excederse."],diag:"cabezal"},
    {f:"Probar",pasos:["Abrir el agua lentamente y revisar fugas en la unión brazo-cabezal.","Si hay fuga: quitar, cambiar el teflón por más vueltas y reinstalar.","Verificar buen caudal en todos los agujeros."]}
  ],
  crit:["Sin fugas en la unión brazo-cabezal.","Caudal uniforme por todos los agujeros.","El cabezal queda firme y bien orientado."],
  eval:[

    ['Sin fuga','Papel seco 5 min en unión brazo-cabezal.'],
    ['Orientación','Apunta al centro de la regadera.']
  ]
},
{ n:13, cat:"PLOM", titulo:"Destapar desagüe con guía (serpiente)", diag:"serpiente",
  kw:"guia serpiente resorte destapar drenaje tapon profundo tambor sonda plomeria",
  generalidades:"Este procedimiento se usa cuando el émbolo (procedimiento 11) no fue suficiente. La guía flexible —serpiente o resorte— llega más profundo en la tubería y rompe o jala la obstrucción directamente. Se introduce por el desagüe girando el tambor en sentido horario mientras se avanza. Es normal sentir resistencia al llegar al tapón: ahí se sigue girando sin forzar hasta que la guía perfora el bloqueo. NUNCA usar la guía después de haber vaciado químicos desatascadores.",
  tiempo:[["Tapón accesible","15 – 30 min"],["Tapón profundo (> 2 m)","30 – 60 min"]],
  mat:[["Guía flexible / serpiente (mín. 3 m)","Pieza","1"],["Agua caliente","Litro","2"],["Trapo o cubeta","Pieza","1"]],
  herr:["Guía flexible con tambor","Cubeta"],
  epp:["Guantes de goma gruesos","Lentes de seguridad","Cubrebocas"],
  fases:[
    {f:"Preparar el acceso",pasos:["Si el sifón tiene tapón de limpieza, insertar la guía ahí; si no, por el desagüe directo.","Cubeta bajo el punto de acceso y trapos alrededor.","Extender 20–30 cm de guía al inicio y bloquear el tambor."]},
    {f:"Introducir y avanzar",pasos:["Insertar la punta y girar el tambor en sentido horario empujando suave.","Cada 20–30 cm, bloquear y empujar. Repetir.","Si hay mucha resistencia, girar en el mismo punto sin forzar el avance."],diag:"serpiente"},
    {f:"Trabajar el tapón y retirar",pasos:["Al llegar al tapón, girar repetidamente sin avanzar para romperlo o engancharlo.","Jalar la guía lentamente manteniendo el giro para que no se suelte el material.","Retirar limpiando lo que traiga. Enjuagar con 2 L de agua caliente."]},
    {f:"Verificar y limpiar equipo",pasos:["Abrir el agua y ver que fluya libremente.","Si sigue lento, repetir o desmontar el sifón (procedimiento 11).","Limpiar la guía antes de guardarla, sin residuos orgánicos."]}
  ],
  crit:["El agua drena en < 10 s en un lavabo estándar.","La guía sale limpia o con el material del tapón.","Sin fugas si se abrió el sifón."],
  eval:[
    ['Drenado <10 s','Lavabo a la mitad.'],
    ['Serpiente limpia','Sin residuos ni óxido en su tambor.'],
    ['Sin fugas si abrieron sifón','Papel seco 15 min.']
  ]
},
{ n:14, cat:"VICE", titulo:"Mastique en ventana (o cambio de vidrio)", diag:"mastique",
  kw:"mastique masilla ventana vidrio vidriero medir sin filo cambio cristal sellar",
  generalidades:"Van a sellar o resellar el vidrio en el marco usando mastique. Hay dos escenarios: (A) mantenimiento, cuando el vidrio está bien pero el mastique viejo está cuarteado, y solo se retira y se repone; (B) cambio de vidrio, cuando se retira el vidrio roto, se mide, se pide al vidriero especificando que va SIN FILO (cantos no biselados), se instala y se sella. En ambos, el mastique se aplica con espátula formando un bisel uniforme y se pinta cuando ya secó.",
  tiempo:[["Proceso A — solo mastique","45–60 min + 24 h secado"],["Proceso B — cambio de vidrio","2 – 3 h"],["Pintar el mastique","20 – 30 min"]],
  mat:[["Mastique de vidriero","kg","0.25"],["Vidrio SIN FILO (proceso B)","Pieza","1"],["Pintura esmalte/vinílica","ml","100"],["Masking tape","Rollo","1"],["Thinner o aguarrás","ml","50"]],
  herr:["Espátula de vidriero","Lija grano 120","Cinta métrica","Escuadra","Brocha 1\""],
  epp:["Guantes anti-corte (SIEMPRE con vidrio)","Lentes de seguridad","Calzado cerrado"],
  fases:[
    {f:"Proceso A — mantenimiento",pasos:["Retirar todo el mastique viejo cuarteado con la espátula, sin astillar vidrio ni marco.","Limpiar el canal del marco con trapo seco.","Pasar a la fase de Aplicación de mastique."]},
    {f:"Proceso B — medición y compra",pasos:["Retirar el mastique viejo. Con guantes, sacar los fragmentos empujando de adentro hacia afuera.","Limpiar el canal completamente.","Medir el ANCHO interior (marco a marco) y RESTAR 6 mm (3 mm por lado).","Medir el ALTO interior y RESTAR 6 mm igual.","Pedir al vidriero vidrio de 4 mm e INDICAR 'sin filo': cantos cortados, no biselados, para que el mastique adhiera."],diag:"mastique"},
    {f:"Aplicación del mastique",pasos:["Aplicar una capa delgada de mastique en el canal (base) antes de colocar el vidrio.","Colocar el vidrio centrado con 3 mm de holgura por lado. Presionar para asentarlo.","Aplicar mastique en el perímetro formando bisel de 45° con espátula mojada, en un solo movimiento.","Alisar con la espátula húmeda. Dejar secar mínimo 24 h antes de pintar."]},
    {f:"Pintura del mastique",pasos:["Masking tape sobre el vidrio, dejando 1 mm de separación del mastique.","Aplicar una mano de esmalte cubriendo el mastique.","Retirar la cinta con la pintura ligeramente húmeda para bordes limpios.","Secar 4 h; segunda mano si no cubrió."]}
  ],
  crit:["El mastique forma un bisel continuo sin huecos ni burbujas.","El vidrio no vibra al presionarlo.","La pintura cubre el mastique sin escurrir sobre el vidrio.","Sin filtraciones al probar con manguera (proceso B)."],
  eval:[
    ['Bisel continuo','Sin huecos ni burbujas.'],
    ['Vidrio firme','Empujar con palma: sin vibrar.'],
    ['Manguera 2 min','Sin gota que entre.'],
    ['Pintura sin escurrir','Sobre vidrio ni marco.']
  ]
},
{ n:15, cat:"VICE", titulo:"Instalar cerradura Hermex Instala Fácil", diag:"cerradura",
  kw:"cerradura hermex instala facil chapa perilla puerta barreno pestillo golpeador plantilla sierra corona",
  generalidades:"Van a instalar una cerradura de perilla o palanca Hermex línea Instala Fácil en una puerta. La caja incluye una plantilla de papel que marca dónde hacer los dos barrenos — si se usa bien, sale a la primera. El barreno grande (54 mm con sierra de corona) es para el mecanismo de la manija; el barreno del canto (22 mm) es para el pestillo. La altura estándar es 90–96 cm desde el piso. El resultado es una cerradura firme, que cierre suave y con el pestillo entrando bien en el golpeador.",
  tiempo:[["Puerta nueva sin barrenos","40 – 60 min"],["Reemplazo de cerradura","20 – 30 min"]],
  mat:[["Cerradura Hermex Instala Fácil","Juego","1"],["Tornillos de refuerzo (marco suave)","Pieza","4"]],
  herr:["Taladro","Sierra de corona 54 mm","Broca de madera 22–25 mm","Broca guía 3 mm","Desarmador de cruz","Lápiz","Cinta métrica","Formón y martillo"],
  epp:["Lentes de seguridad","Guantes de trabajo"],
  fases:[
    {f:"Marcar con la plantilla",pasos:["Doblar la plantilla por la línea de canto y pegarla a 90–96 cm del piso.","Marcar el centro del barreno grande y el del pestillo en el canto.","Verificar con escuadra que ambas marcas estén al mismo nivel."],diag:"cerradura"},
    {f:"Hacer los barrenos",pasos:["Broca guía 3 mm en la marca del barreno grande, de lado a lado.","Sierra de corona 54 mm: taladrar medio desde afuera y terminar desde adentro (evita astillar).","Broca 22–25 mm en el canto para el pestillo, 6–7 cm de profundidad.","Limpiar el aserrín de ambos barrenos."]},
    {f:"Pestillo y frente",pasos:["Insertar el pestillo por el canto, apuntando hacia el marco.","Marcar el contorno de la placa frontal con lápiz.","Con formón, rebajar 2–3 mm para que la placa quede al ras. Atornillar."]},
    {f:"Mecanismo de perilla/palanca",pasos:["Insertar la parte exterior (con cuadradillo) por el barreno grande.","Alinear el cuadradillo con el mecanismo del pestillo.","Colocar la parte interior y unir con los tornillos largos. Apretar firme sin deformar.","Verificar que la manija gira libre y el pestillo entra y sale."]},
    {f:"Golpeador en el marco",pasos:["Cerrar la puerta y marcar la posición del pestillo sobre el marco.","Colocar la plantilla del golpeador y marcar el orificio.","Perforar y rebajar para que quede al ras. Atornillar.","Cerrar: el pestillo debe entrar suave. Si no, reubicar el golpeador 1–2 mm."]}
  ],
  crit:["La manija gira suave, sin juego flojo.","La puerta abre y cierra desde ambos lados.","El pestillo entra al golpeador sin forzar.","Placa frontal y golpeador al ras, sin protuberancias."],
  eval:[
