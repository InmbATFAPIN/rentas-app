function renderInq(){
  if(!DB.propietarios.length){
    document.getElementById("v-inq").innerHTML=`<div class="es"><div class="ei">👥</div><div class="et">Sin propietarios<br><br>Crea uno desde Directorio</div></div>`;
    return;
  }
  let html=`<div style="display:flex;gap:8px;margin-bottom:10px">
    <input class="fi" id="search-inq" placeholder="🔍 Buscar propietario, inmueble o inquilino..." oninput="renderPropList()" style="flex:1">
  </div>
  <div class="cr" style="margin-bottom:10px">`;
  // Month chips (future + current + past)
  for(let i=2;i>=-4;i--){
    const d=new Date(HA,HM-1+i,1);const m=d.getMonth()+1,a=d.getFullYear();
    const sel=(m===curMes&&a===curAnio);
    const isFut=(a>HA||(a===HA&&m>HM));
    html+=`<span class="chip${sel?' on':''}" onclick="curMes=${m};curAnio=${a};renderPropList()" style="${isFut?'border-style:dashed':''}">${isFut?'→ ':''}${MF[m-1]} ${a}</span>`;
  }
  html+=`</div><div id="prop-list"></div>`;
  document.getElementById("v-inq").innerHTML=html;
  renderPropList();
}

function renderPropList(){
  const q=(document.getElementById("search-inq")?.value||"").toLowerCase();
  const searchOn=!!q;
  let html='';
  DB.propietarios.slice().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'')).forEach(p=>{
    const inms=DB.inmuebles.filter(x=>x.propietarioId===p.id);
    const allTenants=DB.inquilinos.filter(x=>x.propietarioId===p.id&&x.estado==='activo');
    // Filter by search - if match propietario name, show all; else filter tenants
    let matchProp=!q||(p.nombre||'').toLowerCase().includes(q);
    let matchAnyChild=false;
    if(q&&!matchProp){
      matchAnyChild=inms.some(inm=>(inm.nombre||'').toLowerCase().includes(q))||
                     allTenants.some(t=>(t.nombre||'').toLowerCase().includes(q));
    }
    if(q&&!matchProp&&!matchAnyChild)return;
    const totalRenta=allTenants.reduce((s,t)=>s+Number(t.renta||0),0);
    const cobrado=allTenants.filter(t=>isPagado(t.id,curMes,curAnio)).reduce((s,t)=>{const pg=getPago(t.id,curMes,curAnio);return s+Number(pg?.monto||0);},0);
    const nVenc=allTenants.filter(t=>isLate(t.id,curMes,curAnio)).length;
    const pct=totalRenta>0?Math.round(cobrado/totalRenta*100):0;
    const kProp='prop_open_'+p.id;
    const openProp=searchOn||expandedInm[kProp]!==false;
    html+=`<div style="background:var(--s1);border:1px solid #222;border-radius:11px;margin-bottom:10px;overflow:hidden">
      <div onclick="togglePropInq('${p.id}')" style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:linear-gradient(90deg,var(--s1),transparent);cursor:pointer">
        <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
          <span class="inm-arrow ${openProp?'open':''}" style="color:var(--gold)">▶</span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;color:var(--gold);font-size:15px">👤 ${p.nombre}</div>
            <div style="font-size:10px;color:var(--dim);margin-top:2px">${inms.length} propiedades · ${allTenants.length} inq · ${pct}% cobrado${nVenc>0?` · <span style="color:var(--r)">${nVenc} venc</span>`:''}</div>
          </div>
        </div>
        <button class="btn bo bsm" onclick="event.stopPropagation();openPropietarioEdit('${p.id}')" style="font-size:10px;padding:4px 7px">⚙️</button>
      </div>`;
    if(openProp){
      html+=`<div style="padding:0 10px 10px">`;
      if(inms.length===0){
        html+=`<div style="padding:14px;text-align:center;color:var(--dim);font-size:12px">Sin propiedades registradas</div>`;
      }else{
        inms.slice().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'')).forEach(inm=>{
          // Filter by search
          let inmMatch=!q||(inm.nombre||'').toLowerCase().includes(q)||matchProp;
          const tenants=allTenants.filter(t=>t.inmuebleId===inm.id||t.inmueble===inm.nombre);
          const anyTenantMatch=tenants.some(t=>(t.nombre||'').toLowerCase().includes(q));
          if(q&&!inmMatch&&!anyTenantMatch&&!matchProp)return;
          tenants.sort((a,b)=>(a.dia||0)-(b.dia||0)||(a.interior||'').localeCompare(b.interior||''));
          const inmRenta=tenants.reduce((s,t)=>s+Number(t.renta||0),0);
          const inmCob=tenants.filter(t=>isPagado(t.id,curMes,curAnio)).reduce((s,t)=>{const pg=getPago(t.id,curMes,curAnio);return s+Number(pg?.monto||0);},0);
          const inmVenc=tenants.filter(t=>isLate(t.id,curMes,curAnio)).length;
          const deuda=getInmuebleDeudaTotal(inm.nombre);
          const kInm='inq_open_'+inm.id;
          const openInm=searchOn||expandedInm[kInm]!==false;
          html+=`<div style="background:var(--s2);border-radius:9px;margin-bottom:6px;overflow:hidden;border:1px solid #262626">
            <div onclick="toggleInmInq('${inm.id}')" style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;cursor:pointer">
              <div style="flex:1;min-width:0;display:flex;gap:8px;align-items:center">
                <span class="inm-arrow ${openInm?'open':''}">▶</span>
                <div style="flex:1;min-width:0">
                  <div style="font-weight:600;font-size:13px">🏢 ${inm.nombre}</div>
                  <div style="font-size:10px;color:var(--dim);margin-top:2px">${tenants.length} inq · ${fmt(inmCob)}/${fmt(inmRenta)}${inmVenc>0?` · <span style="color:var(--r)">${inmVenc} venc</span>`:''}${deuda>0?` · <span style="color:var(--r)">⚠ ${fmt(deuda)}</span>`:''}</div>
                </div>
              </div>
              <div style="display:flex;gap:4px">
                <button class="btn bs bsm" onclick="event.stopPropagation();openInmuebleDet('${inm.nombre.replace(/'/g,"\\'")}')" style="font-size:9px;padding:3px 6px">📊</button>
                <button class="btn bo bsm" onclick="event.stopPropagation();openInmuebleEditForm('${inm.id}')" style="font-size:9px;padding:3px 6px">⚙️</button>
              </div>
            </div>`;
          if(openInm){
            html+=`<div style="padding:0 8px 8px">`;
            if(tenants.length===0){
              html+=`<div style="padding:10px;text-align:center;color:var(--dim);font-size:11px">Sin inquilinos activos<br><button class="btn bs bsm" onclick="openEditTenantWithDefaults('${p.id}','${inm.id}')" style="margin-top:6px;font-size:10px">+ Agregar inquilino</button></div>`;
            }else{
              tenants.forEach(t=>{
                const paid=isPagado(t.id,curMes,curAnio);
                const late=isLate(t.id,curMes,curAnio);
                const pg=getPago(t.id,curMes,curAnio);
                html+=`<div style="display:flex;align-items:center;gap:8px;padding:8px 8px;background:var(--s1);border-radius:7px;margin-bottom:4px;border:1px solid #1a1a1a">
                  <div onclick="event.stopPropagation();quickTogglePagoInq('${t.id}',${curMes},${curAnio})" class="bit-check ${paid?'done':''}" style="cursor:pointer;background:${paid?'var(--g)':'transparent'};border-color:${paid?'var(--g)':late?'var(--r)':'#555'};color:${paid?'#000':'transparent'}">${paid?'✓':''}</div>
                  <div class="inq-dia" style="min-width:24px;text-align:center;background:var(--s2);padding:3px 6px;border-radius:5px;font-size:10px;font-weight:700;color:var(--gold)">${t.dia||'—'}</div>
                  <div style="flex:1;min-width:0;cursor:pointer" onclick="openDet('${t.id}')">
                    <div style="font-size:12.5px;font-weight:600">${t.nombre}${contratoAlertaIcon(t)}${t.interior?` <span style="color:var(--dim);font-weight:400;font-size:11px">· Int ${t.interior}</span>`:''}</div>
                    <div style="font-size:10px;color:var(--dim);margin-top:1px">${t.servicios||t.estatus||''}${pg?.destino?` · pagó ${pg.destino}`:''}</div>
                  </div>
                  <div style="text-align:right;flex-shrink:0">
                    <div style="font-size:12px;font-weight:700;color:var(--gold)">${fmt(t.renta)}</div>
                    ${paid?'<div style="font-size:9px;color:var(--g)">✓ pagado</div>':late?'<div style="font-size:9px;color:var(--r)">⚠ vencido</div>':'<div style="font-size:9px;color:var(--dim)">pendiente</div>'}
                  </div>
                </div>`;
              });
              html+=`<div style="text-align:center;margin-top:6px"><button class="btn bo bsm" onclick="openEditTenantWithDefaults('${p.id}','${inm.id}')" style="font-size:10px;padding:5px 10px">+ Agregar inquilino a ${inm.nombre}</button></div>`;
            }
            html+=`</div>`;
          }
          html+=`</div>`;
        });
      }
      // Inquilinos cuyo inmueble pertenece a otro propietario (mismatch de datos) — mostrarlos para que sean corregibles
      const inmIdsProp=new Set(inms.map(x=>x.id));
      const inmNamesProp=new Set(inms.map(x=>x.nombre));
      const huerfanos=allTenants.filter(t=>!(inmIdsProp.has(t.inmuebleId)||inmNamesProp.has(t.inmueble)));
      if(huerfanos.length>0){
        html+=`<div style="background:#E05C5C11;border:1px solid #E05C5C44;border-radius:9px;padding:10px 12px;margin-top:8px">
          <div style="font-size:11px;color:var(--r);font-weight:700;margin-bottom:6px">⚠️ ${huerfanos.length} inquilino${huerfanos.length===1?'':'s'} con inmueble de otro propietario</div>
          ${huerfanos.map(t=>`<div onclick="openDet('${t.id}')" style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid #E05C5C22;cursor:pointer;font-size:12px">
            <span>${t.nombre}</span><span style="color:var(--dim)">${t.inmueble||'sin inmueble'} →</span>
          </div>`).join('')}
          <div style="font-size:9px;color:var(--dim);margin-top:6px">Toca para abrir y corregir el propietario o el inmueble</div>
        </div>`;
      }
      html+=`<div style="text-align:center;margin-top:6px"><button class="btn bs bsm" onclick="openInmuebleEditForm(null,'${p.id}')" style="font-size:10px">+ Agregar propiedad a ${p.nombre}</button></div>`;
      html+=`</div>`;
    }
    html+=`</div>`;
  });
  if(!html)html=`<div class="es"><div class="ei">🔍</div><div class="et">Sin resultados</div></div>`;
  document.getElementById("prop-list").innerHTML=html;
}

function togglePropInq(propId){
  const k='prop_open_'+propId;
  expandedInm[k]=expandedInm[k]===false?true:false;
  renderPropList();
}
function toggleInmInq(inmId){
  const k='inq_open_'+inmId;
  expandedInm[k]=expandedInm[k]===false?true:false;
  renderPropList();
}

function quickTogglePagoInq(iid,m,a){
  event.stopPropagation();
  const t=DB.inquilinos.find(x=>x.id===iid);if(!t)return;
  if(isPagado(iid,m,a)){
    // Unmark
    if(!confirm('¿Quitar pago de '+t.nombre+' de '+MF[m-1]+' '+a+'?'))return;
    DB.pagos=DB.pagos.filter(p=>!(p.iid===iid&&p.mes===m&&p.anio===a));
    saveDB('pagos');snack('Pago removido');renderPropList();
  }else{
    // Open pago modal
    openMarkPago(iid,m,a);
  }
}

// Llena el dropdown de cuentas de luz según el inmueble seleccionado
function rebuildTenantLuzOptions(preselectId,legacyCuenta){
  const sel=document.getElementById('m-luzId');if(!sel)return;
  const inmId=document.getElementById('m-inmId')?.value;
  const keep=preselectId||sel.dataset.pre||'';
  if(preselectId!==undefined)sel.dataset.pre=preselectId||'';
  if(legacyCuenta!==undefined)sel.dataset.legacy=legacyCuenta||'';
  const inmObj=DB.inmuebles.find(x=>x.id===inmId);
  if(!inmObj){sel.innerHTML='<option value="">— Elige un inmueble primero —</option>';return;}
  const inmUp=(inmObj.nombre||'').trim().toUpperCase();
  const luces=DB.servicios.filter(s=>{
    const tip=s.tipo==='cfe'?'luz':s.tipo;
    return tip==='luz'&&(s.inmueble||'').trim().toUpperCase()===inmUp;
  }).sort((a,b)=>(a.alias||'').localeCompare(b.alias||''));
  const legacy=sel.dataset.legacy||'';
  let pre=keep;
  if(!pre&&legacy){
    const m=luces.find(s=>String(s.cuenta||'').trim()===legacy.trim());
    if(m)pre=m.id;
  }
  const vincUsados={};
  DB.inquilinos.forEach(t=>{if(t.cuentaLuzId)vincUsados[t.cuentaLuzId]=t.nombre;});
  sel.innerHTML='<option value="">— Sin vincular —</option>'+luces.map(s=>{
    const usadoPor=vincUsados[s.id];
    const partes=[s.alias||'(sin alias)'];
    if(s.medidor)partes.push('med '+s.medidor);
    if(s.cuenta)partes.push(s.cuenta);
    return`<option value="${s.id}"${pre===s.id?' selected':''}>${partes.join(' · ')}${usadoPor&&pre!==s.id?' ⚠ '+usadoPor.split(' ')[0]:''}</option>`;
  }).join('');
  if(luces.length===0)sel.innerHTML='<option value="">— Este inmueble no tiene cuentas de luz —</option>';
}

function updateTenantInmuebles(keepInmId){
  const propId=document.getElementById('m-propId').value;
  const sel=document.getElementById('m-inmId');
  if(!sel)return;
  const currentVal=sel.value||keepInmId||'';
  let inmuebles=propId?DB.inmuebles.filter(x=>x.propietarioId===propId):DB.inmuebles.slice();
  // Mantener el inmueble seleccionado visible aunque sea de otro propietario
  if(currentVal&&!inmuebles.find(x=>x.id===currentVal)){
    const inmActual=DB.inmuebles.find(x=>x.id===currentVal);
    if(inmActual){
      const owner=getPropietario(inmActual.propietarioId);
      inmuebles=[{...inmActual,_mismatchOwner:owner?.nombre||'?'},...inmuebles];
    }
  }
  sel.innerHTML='<option value="">— Seleccionar —</option>'+inmuebles.map(im=>`<option value="${im.id}"${currentVal===im.id?' selected':''}>${im.nombre}${im._mismatchOwner?' (de '+im._mismatchOwner+')':''}</option>`).join('');
  rebuildTenantLuzOptions();
}

function saveTenant(id){
  try{
    const nom=document.getElementById('m-nom').value.trim();
    const propId=document.getElementById('m-propId').value;
    const inmId=document.getElementById('m-inmId').value;
    const rent=document.getElementById('m-rent').value;
    const faltan=[];
    if(!nom)faltan.push('nombre');
    if(!propId)faltan.push('propietario');
    if(!inmId)faltan.push('inmueble');
    if(!rent)faltan.push('renta');
    if(faltan.length){snack('⚠️ Falta: '+faltan.join(', '));return;}
    const propObj=getPropietario(propId);
    const inmObj=DB.inmuebles.find(x=>x.id===inmId);
    const luzSel=document.getElementById('m-luzId');
    const cuentaLuzId=luzSel?luzSel.value:'';
    const luzSvc=cuentaLuzId?DB.servicios.find(s=>s.id===cuentaLuzId):null;
    const obj={nombre:nom,
      propietarioId:propId,propietario:propObj?.nombre||'',
      inmuebleId:inmId,inmueble:inmObj?.nombre||'',
      interior:document.getElementById('m-int').value.trim(),renta:Number(rent),
      dia:Number(document.getElementById('m-dia').value)||5,destino:document.getElementById('m-dest').value.trim(),
      cuentaLuzId:cuentaLuzId,
      cuenta_luz:luzSvc?String(luzSvc.cuenta||luzSvc.medidor||''):'',
      servicios:document.getElementById('m-srv').value.trim(),estatus:document.getElementById('m-est').value.trim(),
      renovacion:document.getElementById('m-ren').value,contrato_vigente:document.getElementById('m-cv').value,
      comentarios:document.getElementById('m-com').value.trim(),estado:document.getElementById('m-estado').value};
    if(id){
      const ten=DB.inquilinos.find(x=>x.id===id);
      if(!ten){snack('⚠️ No encontré al inquilino');return;}
      Object.assign(ten,obj);
    }else{DB.inquilinos.push({id:uid(),...obj});}
    saveDB('inquilinos');closeM();snack(id?'Actualizado ✓':'Agregado ✓');
    if(curView==='inq')renderPropList();
    else if(curView==='det'&&detTenant?.id===id){
      detTenant=DB.inquilinos.find(x=>x.id===id);
      document.getElementById("hdr-t").textContent=detTenant?.nombre||"Inquilino";
      document.getElementById("hdr-s").textContent=detTenant?.inmueble||"";
      renderDet();
    }
    else if(curView==='con')renderCon();
    else if(curView==='dash')renderDash();
    updNotif();
  }catch(e){
    console.error('[saveTenant]',e);
    snack('❌ Error al guardar: '+e.message);
  }
}

function delTenant(id){
  const t=DB.inquilinos.find(x=>x.id===id);if(!t)return;
  const numPagos=DB.pagos.filter(p=>p.iid===id).length;
  let msg=`¿Eliminar a ${t.nombre} (${t.inmueble})?`;
  if(numPagos>0)msg+=`\n\n⚠️ Tiene ${numPagos} pagos registrados que también se eliminarán.`;
  msg+='\n\nEsta acción NO se puede deshacer. Considera marcarlo como Inactivo en su lugar.';
  if(!confirm(msg))return;
  DB.inquilinos=DB.inquilinos.filter(x=>x.id!==id);
  DB.pagos=DB.pagos.filter(p=>p.iid!==id);
  saveDB('inquilinos');saveDB('pagos');
  closeM();snack('Inquilino eliminado');
  if(curView==='det'){detTenant=null;go('inq');}
  else if(curView==='inq')renderPropList();
  else if(curView==='con')renderCon();
}

function saveSvc(id){

    inmueble:inm,tipo:document.getElementById('m-st').value,
    cuenta:document.getElementById('m-sc').value.trim(),
    alias:document.getElementById('m-salias').value.trim(),
    medidor:document.getElementById('m-smed').value.trim(),
    nombre_recibo:document.getElementById('m-snr').value.trim(),
    nota_inquilino:document.getElementById('m-sni').value.trim(),
    nota_inmueble:document.getElementById('m-snin').value.trim(),
    notas:document.getElementById('m-sn').value.trim(),
    propietarioId:inmObj?.propietarioId||''
  };
  if(id){Object.assign(DB.servicios.find(x=>x.id===id),obj);}else{DB.servicios.push({id:uid(),...obj,creado:nowISO()});}
  // Sync legacy inmueble fields
  if(inmObj){
    if(obj.tipo==='predial'&&obj.cuenta)inmObj.cuenta_predial=obj.cuenta;
    if(obj.tipo==='agua'&&obj.cuenta)inmObj.cuenta_agua=obj.cuenta;
    saveDB('inmuebles');
  }
  saveDB('servicios');closeM();snack('Cuenta guardada ✓');

function delSvc(id){
  const svc=DB.servicios.find(x=>x.id===id);
  const nRec=DB.recibos_servicios.filter(r=>r.servicioId===id).length;
  const nPag=DB.pagos_servicios.filter(p=>p.servicioId===id).length;
  let msg='¿Eliminar esta cuenta?';
  if(nRec>0||nPag>0)msg+=`\n\n⚠️ Se eliminarán también ${nRec} recibos y ${nPag} pagos vinculados.`;
  if(!confirm(msg))return;
  DB.servicios=DB.servicios.filter(s=>s.id!==id);
  DB.recibos_servicios=DB.recibos_servicios.filter(r=>r.servicioId!==id);
  DB.pagos_servicios=DB.pagos_servicios.filter(p=>p.servicioId!==id);
  // Desvincular inquilinos que apuntaban a esta cuenta de luz
  DB.inquilinos.forEach(t=>{if(t.cuentaLuzId===id){t.cuentaLuzId='';}});
  saveDB('servicios');saveDB('recibos_servicios');saveDB('pagos_servicios');saveDB('inquilinos');
  closeM();snack('Cuenta eliminada');
}

// ── VISTA DE BALANCE DE UN SERVICIO ──
function openServicioBalance(svcId){
  const sv=DB.servicios.find(x=>x.id===svcId);if(!sv)return;
  const tipo=TIPOS_SVC[sv.tipo]||TIPOS_SVC.otro;
  const recibos=DB.recibos_servicios.filter(r=>r.servicioId===svcId).sort((a,b)=>new Date(b.fecha||0)-new Date(a.fecha||0));
  const pagos=DB.pagos_servicios.filter(p=>p.servicioId===svcId).sort((a,b)=>new Date(b.fecha||0)-new Date(a.fecha||0));
  const totalRec=recibos.reduce((s,r)=>s+Number(r.monto||0),0);
  const totalPag=pagos.reduce((s,p)=>s+Number(p.monto||0),0);
  const bal=totalRec-totalPag;
  const balColor=bal>0?'#E05C5C':bal<0?'#5CB87A':'#777';

  // Merge movimientos por fecha
  const movs=[
    ...recibos.map(r=>({...r,_tipo:'recibo'})),
    ...pagos.map(p=>({...p,_tipo:'pago'}))
  ].sort((a,b)=>new Date(b.fecha||0)-new Date(a.fecha||0));

  let html=`<div class="ms" style="max-height:96vh"><div class="mh"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div><div class="mt2" style="margin:0">${tipo.i} ${tipo.n}</div>
      <div style="font-size:11px;color:var(--dim);margin-top:2px">${sv.inmueble}${sv.cuenta?' · '+sv.cuenta:''}</div></div>

function savePagoServicio(svcId,id){
  const sv=DB.servicios.find(x=>x.id===svcId);if(!sv)return;
  const monto=Number(document.getElementById('pg-monto').value);
  const fecha=document.getElementById('pg-fecha').value;
  if(!monto||!fecha){snack('Falta monto o fecha');return;}
  const [yy,mm,dd]=fecha.split('-').map(Number);
  const now=new Date();
  const fechaLocal=new Date(yy,mm-1,dd,now.getHours(),now.getMinutes(),now.getSeconds());
  const fechaIso=fechaLocal.toISOString();
  const tipo=TIPOS_SVC[sv.tipo]||TIPOS_SVC.otro;
  const concepto=document.getElementById('pg-concepto').value.trim();
  const obj={
    servicioId:svcId,monto,fecha:fechaIso,
    destino:document.getElementById('pg-dest').value.trim(),
    metodo:document.getElementById('pg-met').value,
    concepto,notas:document.getElementById('pg-notas').value.trim()
  };
  // Update or create pago; also manage linked gasto
  if(id){
    const ex=DB.pagos_servicios.find(x=>x.id===id);
    // Remove old linked gasto if any
    if(ex.gastoId)DB.gastos=DB.gastos.filter(g=>g.id!==ex.gastoId);
    Object.assign(ex,obj);
    // Create new gasto
    const gastoId=uid();
    DB.gastos.push({
      id:gastoId,categoria:'servicios',monto,
      descripcion:`${tipo.i} ${tipo.n} — ${sv.inmueble}${concepto?': '+concepto:''}`,
      fecha:fechaIso,inmueble:sv.inmueble,
      notas:'Pago automático de servicio',
      creado:nowISO(),pagoServicioId:id
    });
    ex.gastoId=gastoId;
  }else{
    const pagoId=uid();
    const gastoId=uid();
    DB.pagos_servicios.push({id:pagoId,...obj,gastoId,creado:nowISO()});
    DB.gastos.push({
      id:gastoId,categoria:'servicios',monto,
      descripcion:`${tipo.i} ${tipo.n} — ${sv.inmueble}${concepto?': '+concepto:''}`,
      fecha:fechaIso,inmueble:sv.inmueble,
      notas:'Pago automático de servicio',
      creado:nowISO(),pagoServicioId:pagoId
    });
  }
  saveDB('pagos_servicios');saveDB('gastos');
  closeM();snack('Pago registrado ✓');
  openServicioBalance(svcId);
}

function delPagoServicio(id){

// Normaliza texto de deuda: '89713', '$ -', '', '$1,234.56' -> número
function parseDeuda(v){
  if(v===null||v===undefined)return 0;
  const s=String(v).replace(/[$,\s]/g,'');
  if(s===''||s==='-')return 0;
  const n=Number(s);
  return isNaN(n)?0:n;
}
// Normaliza fecha Excel (Date, serial, o string) -> 'YYYY-MM-DD' o ''
function parseFechaExcel(v){
  if(!v)return '';
  if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);
  if(typeof v==='number'&&v>20000&&v<80000){
    const d=new Date(Math.round((v-25569)*86400000));
    return isNaN(d)?'':d.toISOString().slice(0,10);
  }
  const s=String(v).trim();
  const m=s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m)return m[0];
  const d=new Date(s);
  return isNaN(d)?'':d.toISOString().slice(0,10);
}

// Aplica filas ya parseadas [{inmueble,propietario,alias,tipo,medidor,cuenta,nombre_recibo,nota_inquilino,deuda,nota_inmueble,fecha_actualizacion}]
function applyCuentasImport(rows){
  const res={propietariosCreados:0,inmueblesCreados:0,cuentasNuevas:0,cuentasActualizadas:0,recibosDeuda:0,deudaImportada:0,omitidas:0,conMovimientos:0};
  rows.forEach(r=>{
    const inmNombre=String(r.inmueble||'').trim();
    if(!inmNombre){res.omitidas++;return;}
    const tipoRaw=String(r.tipo||'').trim().toLowerCase();
    const tipo=tipoRaw==='luz'||tipoRaw==='cfe'?'luz':tipoRaw==='agua'?'agua':tipoRaw==='predial'?'predial':tipoRaw==='gas'?'gas':'otro';
    // Propietario: buscar o crear
    const propNombre=String(r.propietario||'').trim().toUpperCase();
    let prop=propNombre?DB.propietarios.find(p=>(p.nombre||'').trim().toUpperCase()===propNombre):null;
    if(!prop&&propNombre){
      prop={id:'prop_'+propNombre.toLowerCase().replace(/[^a-z0-9]/g,'_'),nombre:propNombre,contacto:'',telefono:'',correo:'',notas:'Creado por importación de cuentas',fecha_inicio:todayISO(),creado:nowISO()};
      DB.propietarios.push(prop);res.propietariosCreados++;
    }
    // Inmueble: buscar case-insensitive o crear
    const inmUp=inmNombre.toUpperCase();
    let inm=DB.inmuebles.find(x=>(x.nombre||'').trim().toUpperCase()===inmUp);
    if(!inm){
      inm={id:'inm_'+inmUp.toLowerCase().replace(/[^a-z0-9]/g,'_')+'_'+uid().slice(0,4),nombre:inmNombre,propietarioId:prop?.id||'',direccion:'',cuenta_predial:'',cuenta_agua:'',notas:'Creado por importación de cuentas',creado:nowISO()};
      DB.inmuebles.push(inm);res.inmueblesCreados++;
    }else if(!inm.propietarioId&&prop){inm.propietarioId=prop.id;}
    // Upsert servicio: clave = inmueble + tipo + cuenta + alias
    const cuenta=String(r.cuenta||'').trim();
    const alias=String(r.alias||'').trim();
    let svc=DB.servicios.find(s=>
      (s.inmueble||'').trim().toUpperCase()===inmUp&&
      (s.tipo==='cfe'?'luz':s.tipo)===tipo&&
      String(s.cuenta||'').trim()===cuenta&&
      String(s.alias||'').trim()===alias
    );
    const campos={
      inmueble:inm.nombre,tipo,cuenta,alias,
      medidor:String(r.medidor||'').trim(),
      nombre_recibo:String(r.nombre_recibo||'').trim(),
      nota_inquilino:String(r.nota_inquilino||'').trim(),
      nota_inmueble:String(r.nota_inmueble||'').trim(),
      deuda_corte:parseDeuda(r.deuda),
      fecha_actualizacion:parseFechaExcel(r.fecha_actualizacion),
      propietarioId:inm.propietarioId||prop?.id||''
    };
    if(svc){Object.assign(svc,campos);res.cuentasActualizadas++;}
    else{svc={id:uid(),...campos,notas:'',creado:nowISO()};DB.servicios.push(svc);res.cuentasNuevas++;}
    // Deuda al corte -> recibo inicial (solo si no hay movimientos previos y no se importó antes)
    const deudaNum=campos.deuda_corte;
    const tieneMovs=DB.recibos_servicios.some(x=>x.servicioId===svc.id)||DB.pagos_servicios.some(x=>x.servicioId===svc.id);
    if(deudaNum>0){
      if(!tieneMovs&&!svc.deuda_importada){
        DB.recibos_servicios.push({id:uid(),servicioId:svc.id,monto:deudaNum,fecha:campos.fecha_actualizacion||todayISO(),concepto:'Deuda al corte (importada)',notas:'Importado desde Excel',creado:nowISO()});
        svc.deuda_importada=true;
        res.recibosDeuda++;res.deudaImportada+=deudaNum;
      }else if(tieneMovs){res.conMovimientos++;}
    }
    // Sincronizar campos legacy del inmueble (1 por inmueble)
    if(tipo==='predial'&&cuenta)inm.cuenta_predial=cuenta;
    if(tipo==='agua'&&cuenta)inm.cuenta_agua=cuenta;
  });
  ['servicios','recibos_servicios','inmuebles','propietarios'].forEach(k=>saveDB(k));
  return res;
}

// UI: elegir archivo, mapear columnas por encabezado, preview y aplicar
let _importRowsPending=null;
function importCuentasExcel(){
  const input=document.createElement('input');
  input.type='file';input.accept='.xlsx,.xls';
  input.onchange=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        if(raw.length<2){snack('El archivo no tiene datos');return;}
        // Mapear columnas por encabezado (tolerante a variaciones)
        const headers=raw[0].map(h=>String(h||'').toUpperCase());
        const colIdx=(patterns)=>headers.findIndex(h=>patterns.some(p=>h.includes(p)));
        const ci={
          inmueble:colIdx(['INMUEBLE']),propietario:colIdx(['PROPIETARIO']),
          alias:colIdx(['ALIAS']),tipo:colIdx(['TIPO']),
          medidor:colIdx(['MEDIDOR']),cuenta:colIdx(['CUENTA']),
          nombre_recibo:colIdx(['NOMBRE RECIBO','NOMBRE']),
          nota_inquilino:colIdx(['NOTA INQ']),deuda:colIdx(['DEUDA']),
          nota_inmueble:colIdx(['NOTA INM']),fecha_actualizacion:colIdx(['FECHA'])
        };
        if(ci.inmueble<0||ci.tipo<0){snack('⚠️ El Excel necesita al menos columnas INMUEBLE y TIPO');return;}
        const rows=raw.slice(1).filter(r=>r[ci.inmueble]).map(r=>({
          inmueble:r[ci.inmueble],propietario:ci.propietario>=0?r[ci.propietario]:'',
          alias:ci.alias>=0?r[ci.alias]:'',tipo:r[ci.tipo],
          medidor:ci.medidor>=0?r[ci.medidor]:'',cuenta:ci.cuenta>=0?r[ci.cuenta]:'',
          nombre_recibo:ci.nombre_recibo>=0?r[ci.nombre_recibo]:'',
          nota_inquilino:ci.nota_inquilino>=0?r[ci.nota_inquilino]:'',
          deuda:ci.deuda>=0?r[ci.deuda]:'',
          nota_inmueble:ci.nota_inmueble>=0?r[ci.nota_inmueble]:'',
          fecha_actualizacion:ci.fecha_actualizacion>=0?r[ci.fecha_actualizacion]:''
        }));
        // Preview
        const tipos={};rows.forEach(r=>{const t=String(r.tipo||'').trim().toUpperCase()||'?';tipos[t]=(tipos[t]||0)+1;});
        const inms=[...new Set(rows.map(r=>String(r.inmueble||'').trim().toUpperCase()))];
        const deudaTot=rows.reduce((s,r)=>s+parseDeuda(r.deuda),0);
        _importRowsPending=rows;
        modal(`<div class="ms"><div class="mh"></div>
          <div class="mt2">📥 Importar cuentas</div>
          <div style="background:var(--s1);border-radius:11px;padding:14px;margin-bottom:12px">
            <div style="font-size:13px;font-weight:700;margin-bottom:8px">${file.name}</div>
            <div style="font-size:12px;color:#ccc;line-height:1.7">
              • <b>${rows.length}</b> cuentas: ${Object.entries(tipos).map(([t,n])=>`${n} ${t.toLowerCase()}`).join(' · ')}<br>
              • <b>${inms.length}</b> inmuebles: ${inms.slice(0,6).join(', ')}${inms.length>6?` +${inms.length-6}`:''}<br>
              • Deuda al corte total: <b style="color:var(--r)">${fmt(deudaTot)}</b>
            </div>
          </div>
          <div style="font-size:11px;color:var(--dim);margin-bottom:12px;line-height:1.6">Las cuentas se vinculan a cada inmueble. Las deudas al corte se registran como recibo inicial (los pagos que registres después las irán bajando). Re-importar el mismo archivo actualiza datos sin duplicar.</div>
          <div style="display:flex;gap:8px">
            <button class="btn bo" onclick="closeM();_importRowsPending=null">Cancelar</button>
            <button class="btn bg bfu" onclick="confirmImportCuentas()">Importar ${rows.length} cuentas</button>
          </div></div>`);
      }catch(err){console.error(err);snack('Error al leer: '+err.message);}
    };
    reader.readAsArrayBuffer(file);
  };
  input.click();
}

function confirmImportCuentas(){
  if(!_importRowsPending){closeM();return;}
  const res=applyCuentasImport(_importRowsPending);
  _importRowsPending=null;
  closeM();
  modal(`<div class="ms"><div class="mh"></div>
    <div class="mt2">✅ Importación completa</div>
    <div style="background:var(--s1);border-radius:11px;padding:14px;font-size:12.5px;line-height:1.9;margin-bottom:12px">
      ${res.cuentasNuevas>0?`✓ ${res.cuentasNuevas} cuentas nuevas<br>`:''}
      ${res.cuentasActualizadas>0?`✓ ${res.cuentasActualizadas} cuentas actualizadas<br>`:''}
      ${res.inmueblesCreados>0?`✓ ${res.inmueblesCreados} inmuebles creados<br>`:''}
      ${res.propietariosCreados>0?`✓ ${res.propietariosCreados} propietarios creados<br>`:''}
      ${res.recibosDeuda>0?`✓ ${res.recibosDeuda} deudas registradas: <b style="color:var(--r)">${fmt(res.deudaImportada)}</b><br>`:''}
      ${res.conMovimientos>0?`ℹ️ ${res.conMovimientos} cuentas ya tenían movimientos (deuda no tocada)<br>`:''}
      ${res.omitidas>0?`⚠️ ${res.omitidas} filas omitidas (sin inmueble)`:''}
    </div>
    <button class="btn bg bfu" onclick="closeM();rerender()">Entendido</button></div>`);
}

// Detalle completo de una cuenta (todos los campos + balance + acciones)
function openCuentaDetail(svcId){

let CORRIDA_LAST=null; // guarda el último cálculo para exportar

function isrResicoMensualCorrida(rentaMensual){
  if(rentaMensual<=25000)return rentaMensual*0.01;
  if(rentaMensual<=50000)return rentaMensual*0.011;
  if(rentaMensual<=83333.33)return rentaMensual*0.015;
  if(rentaMensual<=208333.33)return rentaMensual*0.02;
  return rentaMensual*0.025;
}

function coVal(id){return Number(document.getElementById(id)?.value)||0;}
function coChk(id){return document.getElementById(id)?.checked;}

function calcularCorrida(){
  const valor=coVal('co-valor');
  const plusvalia=coVal('co-plusvalia')/100;
  const renta=coVal('co-renta');
  const predial=coVal('co-predial');
  if(!renta){snack('Indica la renta mensual');return;}
  const tog_serv=coChk('co-tog-serv');
  const luz_depto=tog_serv?coVal('co-luz-depto'):0;
  const luz_serv=tog_serv?coVal('co-luz-serv'):0;
  const agua=tog_serv?coVal('co-agua'):0;
  const tog_inc=coChk('co-tog-inc')&&tog_serv;
  const inc_serv=tog_inc?coVal('co-inc-serv')/100:0;
  const plomeria=coVal('co-plomeria'),herreria=coVal('co-herreria'),pintura=coVal('co-pintura'),albanileria=coVal('co-albanileria'),electricidad=coVal('co-electricidad');
  const tog_admin=coChk('co-tog-admin');
  const admin_pct=tog_admin?coVal('co-admin')/100:0;
  const capex=coVal('co-capex');
  const tog_seguro=coChk('co-tog-seguro');
  const seguro_anual=tog_seguro?coVal('co-seguro'):0;
  const tog_hip=coChk('co-tog-hip');
  const hipoteca_mensual=tog_hip?coVal('co-hipoteca'):0;
  const regimen=document.getElementById('co-regimen').value;
  const tasa_isr=coVal('co-tasa-isr')/100;
  const inflacion=coVal('co-inflacion')/100;

  const arr=()=>Array(12).fill(0);
  const filaRenta=Array(12).fill(renta);
  const filaSeguro=arr();if(tog_seguro)filaSeguro[0]=seguro_anual;
  const filaPredial=arr();filaPredial[1]=predial;
  const filaCapex=arr();filaCapex[1]=capex;
  const filaPlomeria=arr();filaPlomeria[1]=plomeria;
  const filaHerreria=arr();filaHerreria[1]=herreria;
  const filaPintura=arr();filaPintura[1]=pintura;
  const filaAlbanileria=arr();filaAlbanileria[1]=albanileria;
  const filaElectricidad=arr();filaElectricidad[1]=electricidad;
  const filaLuzDepto=arr(),filaLuzServ=arr(),filaAgua=arr();
  for(let m=2;m<=12;m+=2){const idx=m-1;const bim=m/2;const factor=Math.pow(1+inc_serv,bim-1);filaLuzDepto[idx]=luz_depto*factor;filaLuzServ[idx]=luz_serv*factor;filaAgua[idx]=agua*factor;}
  const filaAdmin=Array(12).fill(renta*admin_pct);
  const filaHipoteca=Array(12).fill(hipoteca_mensual);
  let isrMes;
  if(regimen==='RESICO')isrMes=isrResicoMensualCorrida(renta);
  else{const base=renta-renta*0.35-predial/12;isrMes=Math.max(0,base*tasa_isr);}
  const filaIsr=Array(12).fill(isrMes);
  const totalGastosMes=Array(12).fill(0).map((_,i)=>filaSeguro[i]+filaPredial[i]+filaLuzDepto[i]+filaLuzServ[i]+filaAgua[i]+filaPlomeria[i]+filaHerreria[i]+filaPintura[i]+filaAlbanileria[i]+filaElectricidad[i]+filaAdmin[i]+filaCapex[i]+filaHipoteca[i]+filaIsr[i]);
  const restanteMes=filaRenta.map((r,i)=>r-totalGastosMes[i]);
  const totalIngresos=renta*12;
  const totalHip=hipoteca_mensual*12;
  const totalIsr=isrMes*12;
  const totalGastosSinHipIsr=totalGastosMes.reduce((a,b)=>a+b,0)-totalHip-totalIsr;
  const noi=totalIngresos-totalGastosSinHipIsr;
  const utilidadNeta=restanteMes.reduce((a,b)=>a+b,0);
  const utilidadReal=utilidadNeta/(1+inflacion);
  const plusvaliaMonto=valor*plusvalia;
  const capRate=valor>0?noi/valor:0;
  const coc=valor>0?utilidadNeta/valor:0;
  const grm=totalIngresos>0?valor/totalIngresos:0;
  const ratio=totalIngresos>0?totalGastosSinHipIsr/totalIngresos:0;
  const roiTotal=valor>0?(utilidadNeta+plusvaliaMonto)/valor:0;

  const filas=[
    {label:'Renta mensual',tipo:'ingreso',valores:filaRenta},
    {label:'Póliza/Seguro (M1)',tipo:'gasto',valores:filaSeguro},
    {label:'Predial (M2)',tipo:'gasto',valores:filaPredial},
    {label:'Luz depto',tipo:'gasto',valores:filaLuzDepto},
    {label:'Luz general',tipo:'gasto',valores:filaLuzServ},
    {label:'Agua',tipo:'gasto',valores:filaAgua},
    {label:'Plomería (M2)',tipo:'gasto',valores:filaPlomeria},
    {label:'Herrería (M2)',tipo:'gasto',valores:filaHerreria},
    {label:'Pintura (M2)',tipo:'gasto',valores:filaPintura},
    {label:'Albañilería (M2)',tipo:'gasto',valores:filaAlbanileria},
    {label:'Electricidad (M2)',tipo:'gasto',valores:filaElectricidad},
    {label:'Inmobiliaria',tipo:'gasto',valores:filaAdmin},
    {label:'CapEx (M2)',tipo:'gasto',valores:filaCapex},
    {label:'Hipoteca',tipo:'gasto',valores:filaHipoteca},
    {label:'ISR mensual',tipo:'gasto',valores:filaIsr},
    {label:'Total Gastos',tipo:'total_gasto',valores:totalGastosMes},
    {label:'RESTANTE',tipo:'neta',valores:restanteMes},
  ];
  CORRIDA_LAST={nombre:document.getElementById('co-nombre').value||'Inmueble',filas,totalIngresos,utilidadNeta,noi,utilidadReal,capRate,coc,grm,ratio,plusvaliaMonto,roiTotal,regimen,restanteMes};
  renderCorridaResultado();
}

function renderCorridaResultado(){
  const d=CORRIDA_LAST;if(!d)return;
  const MC=['E','F','M','A','M','J','J','A','S','O','N','D'];
  const money=n=>'$'+Math.round(n).toLocaleString('es-MX');
  const pctf=n=>(n*100).toFixed(1)+'%';
  // Tabla compacta (scroll horizontal)
  let tabla=`<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #333;border-radius:8px"><table style="border-collapse:collapse;font-size:9.5px;min-width:640px;width:100%">

  d.filas.forEach(f=>{
    const total=f.valores.reduce((a,b)=>a+b,0);
    let bg='',col='';
    if(f.tipo==='ingreso'){bg='background:#1a2a1a';col='color:#5CB87A'}

    else if(f.tipo==='neta'){bg='background:#1a2333';col='color:#5B9BD5;font-weight:700'}
    else col='color:var(--dim)';
    if(total===0&&f.tipo==='gasto')return; // ocultar gastos en cero para compactar
    tabla+=`<tr style="${bg};border-top:1px solid #262626"><td style="padding:4px 7px;position:sticky;left:0;${bg||'background:var(--s1)'};${col};white-space:nowrap">${f.label}</td>${f.valores.map(v=>`<td style="padding:4px 3px;text-align:right;${col}">${v?Math.round(v/1000)+'k':'−'}</td>`).join('')}<td style="padding:4px 6px;text-align:right;${col};font-weight:700">${money(total)}</td></tr>`;
  });
  tabla+=`</table></div>`;

  const utilColor=d.utilidadNeta>=0?'#5CB87A':'#E05C5C';
  modal(`<div class="ms" style="max-height:94vh"><div class="mh"></div>
    <div class="mt2">📊 ${d.nombre}</div>
    <div style="font-size:10px;color:var(--dim);margin-bottom:12px">${d.regimen} · proyección 12 meses</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      <div style="background:var(--s1);border-radius:9px;padding:10px;text-align:center">
        <div style="font-size:9px;color:var(--dim);text-transform:uppercase">Ingresos año</div>
        <div style="font-size:16px;font-weight:700;color:var(--gold)">${money(d.totalIngresos)}</div></div>
      <div style="background:var(--s1);border-radius:9px;padding:10px;text-align:center;border:1px solid ${utilColor}44">
        <div style="font-size:9px;color:var(--dim);text-transform:uppercase">Utilidad neta</div>
        <div style="font-size:16px;font-weight:700;color:${utilColor}">${money(d.utilidadNeta)}</div></div>
      <div style="background:var(--s1);border-radius:9px;padding:10px;text-align:center">
        <div style="font-size:9px;color:var(--dim);text-transform:uppercase">NOI</div>
        <div style="font-size:15px;font-weight:700;color:#5B9BD5">${money(d.noi)}</div></div>
      <div style="background:var(--s1);border-radius:9px;padding:10px;text-align:center">
        <div style="font-size:9px;color:var(--dim);text-transform:uppercase">Utilidad real (infl.)</div>
        <div style="font-size:15px;font-weight:700;color:#B565A7">${money(d.utilidadReal)}</div></div>
    </div>

    <div class="st-sm">Indicadores</div>
    <div class="card" style="padding:4px 14px;margin-bottom:12px">
      <div class="ir"><span class="ik">Cap Rate</span><span class="iv" title="NOI / valor">${pctf(d.capRate)}</span></div>
      <div class="ir"><span class="ik">Cash on Cash</span><span class="iv">${pctf(d.coc)}</span></div>
      <div class="ir"><span class="ik">GRM (multiplicador renta)</span><span class="iv">${d.grm.toFixed(1)}×</span></div>
      <div class="ir"><span class="ik">Ratio gastos/ingresos</span><span class="iv">${pctf(d.ratio)}</span></div>
      <div class="ir"><span class="ik">Plusvalía estimada año</span><span class="iv" style="color:#5CB87A">${money(d.plusvaliaMonto)}</span></div>

let CORRIDA_LAST_PREFILL=null;

function exportCorridaExcel(){
  try{
    const d=CORRIDA_LAST;if(!d){snack('Primero calcula');return;}
    const MESES_C=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    const header=['CONCEPTO',...MESES_C,'TOTAL'];
    const rows=[header];
    d.filas.forEach(f=>{
      const total=f.valores.reduce((a,b)=>a+b,0);
      rows.push([f.label,...f.valores.map(v=>Math.round(v)),Math.round(total)]);
    });
    rows.push([]);
    rows.push(['— INDICADORES —']);
    rows.push(['Cap Rate',(d.capRate*100).toFixed(2)+'%']);
    rows.push(['Cash on Cash',(d.coc*100).toFixed(2)+'%']);
    rows.push(['GRM',d.grm.toFixed(2)]);
    rows.push(['Ratio gastos/ingresos',(d.ratio*100).toFixed(2)+'%']);
    rows.push(['Plusvalía estimada',Math.round(d.plusvaliaMonto)]);
    rows.push(['ROI total',(d.roiTotal*100).toFixed(2)+'%']);
    rows.push(['Utilidad neta',Math.round(d.utilidadNeta)]);
    rows.push(['NOI',Math.round(d.noi)]);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:22},...MESES_C.map(()=>({wch:9})),{wch:11}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Corrida');
    XLSX.writeFile(wb,`corrida_${(d.nombre||'').replace(/\s+/g,'_')}_${todayISO()}.xlsx`);
    snack('✓ Excel descargado');
  }catch(e){console.error(e);snack('Error: '+e.message);}
}

function openCorridaSelector(){
  const inms=DB.inmuebles.slice().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));
  let opts=inms.map(im=>{
    const tenants=DB.inquilinos.filter(t=>t.estado==='activo'&&(t.inmuebleId===im.id||t.inmueble===im.nombre)&&Number(t.renta||0)>0);
    const renta=tenants.reduce((s,t)=>s+Number(t.renta||0),0);
    return`<option value="${im.id}" data-renta="${renta}" data-predial="${im.cuenta_predial?'':''}">${im.nombre} (${tenants.length} deptos · ${fmt(renta)}/mes)</option>`;
  }).join('');
  modal(`<div class="ms"><div class="mh"></div>
    <div class="mt2">📊 Corrida financiera</div>
    <div style="font-size:11px;color:var(--dim);margin-bottom:14px">Analiza la rentabilidad de un inmueble a 12 meses. Puedes precargar la renta de un inmueble existente o empezar en blanco.</div>
    <div class="fg"><label class="fl">Precargar desde inmueble</label>
      <select class="fi" id="co-sel-inm"><option value="">— En blanco —</option>${opts}</select></div>
    <button class="btn bg bfu" onclick="corridaDesdeSelector()">Continuar →</button></div>`);
}
function corridaDesdeSelector(){
  const sel=document.getElementById('co-sel-inm');
  const inmId=sel.value;
  let prefill={};
  if(inmId){
    const im=DB.inmuebles.find(x=>x.id===inmId);
    const tenants=DB.inquilinos.filter(t=>t.estado==='activo'&&(t.inmuebleId===inmId||t.inmueble===im.nombre)&&Number(t.renta||0)>0);
    const renta=tenants.reduce((s,t)=>s+Number(t.renta||0),0);
    // Predial: buscar deuda predial del inmueble como referencia (no es el anual, pero orienta)
    prefill={nombre:im.nombre,renta,admin:10,plusvalia:8};
  }
  CORRIDA_LAST_PREFILL=prefill;
  openCorridaForm(prefill);
}

const FICHAS_CAT_NOMBRES={LIMP:'Limpieza',MURO:'Muros y pintura',ELEC:'Eléctrico',PLOM:'Plomería',VICE:'Vidrios y cerraduras'};

// Sugerir fichas para un texto de incidente (match por keywords/título)
function sugerirFichas(texto){
  const q=(texto||'').toLowerCase();
  if(!q.trim())return [];
  const scored=FICHAS_MANT.map(f=>{
    let score=0;
    const kws=(f.kw||'').toLowerCase().split(/\s+/);
    kws.forEach(k=>{if(k&&q.includes(k))score+=2;});
    // título palabras
    (f.titulo||'').toLowerCase().split(/\s+/).forEach(w=>{if(w.length>3&&q.includes(w))score+=1;});
    return {f,score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
  return scored.slice(0,5).map(x=>x.f);
}

// Modal: elegir ficha de solución para un incidente
function openFichaSelector(incId){
  const inc=incId?DB.incidentes.find(x=>x.id===incId):null;
  const sugeridas=inc?sugerirFichas((inc.descripcion||'')+' '+(inc.lugar||'')):[];
  const porCat={};
  FICHAS_MANT.forEach(f=>{porCat[f.cat]=porCat[f.cat]||[];porCat[f.cat].push(f);});
  let body=`<div class="ms" style="max-height:92vh"><div class="mh"></div>
    <div class="mt2">🔧 Asignar solución</div>
    <div style="font-size:11px;color:var(--dim);margin-bottom:12px">Elige el procedimiento de mantenimiento que resuelve este incidente. Quedará vinculado y podrás ver la ficha completa.</div>`;
  if(sugeridas.length){
    body+=`<div class="st-sm" style="color:#E8912D">✨ Sugeridas para este incidente</div>`;
    sugeridas.forEach(f=>{body+=fichaRow(f,incId);});
  }
  body+=`<div class="st-sm" style="margin-top:12px">Todas las fichas</div>`;
  ['LIMP','MURO','ELEC','PLOM','VICE'].forEach(cat=>{
    if(!porCat[cat])return;
    body+=`<div style="font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:8px 0 4px">${FICHAS_CAT_NOMBRES[cat]||cat}</div>`;
    porCat[cat].forEach(f=>{body+=fichaRow(f,incId);});
  });
  body+=`<button class="btn bo bfu" style="margin-top:12px" onclick="${incId?`openIncidenteDetail('${incId}')`:'closeM()'}">‹ Volver</button></div>`;
  modal(body);
}
function fichaRow(f,incId){
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 11px;background:var(--s1);border-radius:8px;margin-bottom:5px">
    <div style="flex:1;min-width:0;cursor:pointer" onclick="openFichaDetail(${f.n},'${incId||''}')">
      <div style="font-size:12.5px;font-weight:600">#${f.n} ${f.titulo}</div>
      <div style="font-size:9px;color:var(--dim)">${FICHAS_CAT_NOMBRES[f.cat]||f.cat}</div>
    </div>
    ${incId?`<button class="btn bg bsm" onclick="asignarFicha('${incId}',${f.n})" style="font-size:10px;flex-shrink:0">Asignar</button>`:`<button class="btn bo bsm" onclick="openFichaDetail(${f.n},'')" style="font-size:10px;flex-shrink:0">Ver</button>`}
  </div>`;
}
function asignarFicha(incId,fichaN){
  const inc=DB.incidentes.find(x=>x.id===incId);if(!inc)return;
  inc.fichaSolucion=fichaN;
  saveDB('incidentes');closeM();snack('✓ Solución asignada');
  openIncidenteDetail(incId);
}
function quitarFicha(incId){
  const inc=DB.incidentes.find(x=>x.id===incId);if(!inc)return;
  delete inc.fichaSolucion;saveDB('incidentes');snack('Solución desvinculada');openIncidenteDetail(incId);
}

  if(f.herr&&f.herr.length){

  }
  // EPP
  if(f.epp&&f.epp.length){
    body+=`<div class="st-sm">🦺 Equipo de protección</div><div class="card" style="padding:10px 14px;margin-bottom:12px"><div style="font-size:12px;line-height:1.7">${f.epp.map(e=>'• '+e).join('<br>')}</div></div>`;

  if(incId)body+=`<button class="btn bg" style="flex:1" onclick="asignarFicha('${incId}',${f.n})">✓ Asignar a este incidente</button>`;
  body+=`<button class="btn bo${incId?'':' bfu'}" onclick="${incId?`openFichaSelector('${incId}')`:'openFichasMatrix()'}">‹ Volver</button></div></div>`;

// Vista matrix: todas las fichas (accesible desde Gestión o Back office)
function openFichasMatrix(){
  const porCat={};
  FICHAS_MANT.forEach(f=>{porCat[f.cat]=porCat[f.cat]||[];porCat[f.cat].push(f);});

// ── Helpers de fecha para cronograma ──
function cIso(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`;}
function cParse(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function cAdd(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function cDiff(a,b){return Math.round((cParse(a)-cParse(b))/86400000);}
function cMonthKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function cWd(d){return (d.getDay()+6)%7;} // 0=Lun..6=Dom
function cFinde(d){return cWd(d)>=5;}
function cLigero(d){const w=cWd(d);return w===0||w===6;} // lunes o domingo

// ── Hoy No Circula ──
function cFindeOrd(d){
  if(!cFinde(d))return null;
  const sat=cWd(d)===5?new Date(d):cAdd(d,-1);
  let count=0,dd=new Date(sat.getFullYear(),sat.getMonth(),1);
  while(dd<=sat){if(cWd(dd)===5)count++;dd=cAdd(dd,1);}
  return count;
}
function cFindesMes(y,m){let c=0,dd=new Date(y,m,1);while(dd.getMonth()===m){if(cWd(dd)===5)c++;dd=cAdd(dd,1);}return c;}
function cCircula(auto,d){
  const w=cWd(d),fo=cFindeOrd(d),tot=cFindesMes(d.getFullYear(),d.getMonth());
  if(fo===5&&tot>=5)return true;
  const impar=fo!==null&&fo%2===1,par=fo!==null&&fo%2===0;
  if(auto==='Ford')return true;
  if(auto==='Vectra'){if(w===3)return false;if(impar)return false;return true;}
  if(auto==='Monza'){if(w===2)return false;if(par)return false;return true;}
  if(auto==='Windstar'){if(w===0)return false;if(impar)return false;return true;}
  return true;
}

// ── Inmuebles con zona, agrupados ──
function cInmueblesConZona(){return DB.inmuebles.filter(i=>i.zona&&ZONAS_CRONO[i.zona]);}
function cDiasCobro(inm){
  // Días de cobro reales desde los inquilinos de ese inmueble
  const dias=new Set();
  DB.inquilinos.filter(t=>t.estado!=='inactivo'&&(t.inmuebleId===inm.id||t.inmueble===inm.nombre)).forEach(t=>{
    const d=parseInt(t.dia);if(d>=1&&d<=31)dias.add(d);
  });
  return[...dias];
}

// ── MOTOR DE AGENDADO ──
function cGenerar(y,m){
  cronoLoad();
  const mk=`${y}-${String(m+1).padStart(2,'0')}`;
  const cron={};
  const uv=Object.assign({},CRONO.ultimaVez);
  const setUV=(k,d)=>{uv[k]=cIso(d);};
  const venc=(k,freq,f)=>{const u=uv[k];if(!u)return 999;return cDiff(cIso(f),u)-freq;};
  const primero=new Date(y,m,1),ultimo=new Date(y,m+1,0);
  const zonasList=Object.keys(ZONAS_CRONO).filter(z=>z!=='toluca');
  const inmsZona=cInmueblesConZona();
  const inmPorZona={};
  zonasList.forEach(z=>inmPorZona[z]=inmsZona.filter(i=>i.zona===z));

  // Incidentes activos de la app (DB.incidentes) + extra del cronograma
  const incidentesApp=DB.incidentes.filter(i=>!i.resuelto).map(i=>{
    // ubicar zona por el lugar/inmueble
    const inm=DB.inmuebles.find(x=>{const l=(i.lugar||'').toLowerCase(),n=(x.nombre||'').toLowerCase();return l&&n&&(l.includes(n)||n.includes(l));});
    const urgente=(i.nivel==='alto'||i.nivel==='urgente');
    // Agendar automáticamente si cae en este mes y no tiene fecha
    let fAg=i._cronoFecha||null;
    if(!fAg){
      const base=i.fecha&&cParse(i.fecha)>=primero?cParse(i.fecha):primero;
      // urgente: primer día no-ligero desde base; normal: primer día laboral
      let dd=new Date(base);
      for(let k=0;k<20;k++){if(!cLigero(dd)&&dd>=primero&&dd<=ultimo){fAg=cIso(dd);break;}dd=cAdd(dd,1);}
      if(!fAg)fAg=cIso(primero);
    }
    return{titulo:i.descripcion||i.numero||'Incidente',inmueble:inm?inm.nombre:(i.lugar||''),zona:inm?inm.zona:null,fecha_agendada:fAg,urgente,src:'app',id:i.id};
  });

  for(let dd=new Date(primero);dd<=ultimo;dd=cAdd(dd,1)){
    const fecha=cIso(dd);
    const tareasHoy=[];
    const ligero=cLigero(dd);

    // 1. Incidentes agendados hoy
    incidentesApp.filter(i=>i.fecha_agendada===fecha).forEach(i=>{
      tareasHoy.push({tipo:'incidente',zona:i.zona||'inc',titulo:'🚨 '+i.titulo,detalle:i.inmueble||'',incId:i.id});
    });
    (CRONO.incidentes_extra||[]).filter(i=>!i.resuelto&&i.fecha_agendada===fecha).forEach(i=>{
      tareasHoy.push({tipo:'incidente',zona:i.zona||'inc',titulo:'🚨 '+i.titulo,detalle:i.inmueble||'',incId:i.id});
    });

    // 2. Autos (en base)
    const autoTasks=[];
    CRONO.tareas_auto.forEach(t=>{
      AUTOS_CRONO.forEach(a=>{
        const k=`auto|${a}|${t.id}`;
        const v=venc(k,t.freq,dd);
        const umbral=ligero?1:0;
        if(v>=umbral)autoTasks.push({tipo:'auto',zona:'autos',titulo:`${t.icon} ${t.nombre}: ${a}`,detalle:cCircula(a,dd)?'circula':'en base',auto:a,tarea:t.id,venc:v,k});
      });
    });
    autoTasks.sort((a,b)=>b.venc-a.venc);
    const maxAutos=ligero?2:4;
    autoTasks.slice(0,maxAutos).forEach(t=>{tareasHoy.push(t);setUV(t.k,dd);});

    // 3. Mantenimiento por zona (agrupado)
    const zonaFijada=CRONO.zonasFijadas[fecha];
    const calcZona=(forzar)=>{
      const sz={};
      zonasList.forEach(z=>{
        let score=0,detalle=[];
        inmPorZona[z].forEach(inm=>{
          CRONO.tareas_inm.forEach(t=>{
            const freqAj=Math.round(t.freq/(ZONAS_CRONO[z].freq||1));
            const k=`${inm.nombre}|${t.id}`;
            const v=venc(k,freqAj,dd);
            const umbralV=forzar===z?-3:-1;
            if(v>=umbralV){score+=(v+2);detalle.push({inm:inm.nombre,tarea:t,k,v});}
          });
        });
        const diaMes=dd.getDate();
        const cobrosHoy=inmPorZona[z].filter(inm=>cDiasCobro(inm).includes(diaMes));
        if(cobrosHoy.length)score+=cobrosHoy.length*1.5;
        sz[z]={score,detalle,cobros:cobrosHoy};
      });
      return sz;
    };
    let presup=ligero?3:10;
    if(zonaFijada&&ZONAS_CRONO[zonaFijada]){
      const sz=calcZona(zonaFijada),sel=sz[zonaFijada];
      sel.detalle.sort((a,b)=>b.v-a.v).forEach(d2=>{
        tareasHoy.push({tipo:'mant',zona:zonaFijada,titulo:`${d2.tarea.icon} ${d2.tarea.nombre}`,detalle:d2.inm,inm:d2.inm,tarea:d2.tarea.id,fijada:true});
        setUV(d2.k,dd);
      });
      sel.cobros.forEach(inm=>tareasHoy.push({tipo:'cobro',zona:zonaFijada,titulo:`💵 Cobranza ${inm.nombre}`,detalle:'día de cobro',inm:inm.nombre}));
    }else if(!ligero){
      const sz=calcZona(null);
      const mejor=zonasList.map(z=>({z,...sz[z]})).filter(x=>x.score>=3).sort((a,b)=>b.score-a.score)[0];
      if(mejor){
        mejor.detalle.sort((a,b)=>b.v-a.v).forEach(d2=>{
          if(presup<=0)return;
          tareasHoy.push({tipo:'mant',zona:mejor.z,titulo:`${d2.tarea.icon} ${d2.tarea.nombre}`,detalle:d2.inm,inm:d2.inm,tarea:d2.tarea.id});
          setUV(d2.k,dd);presup-=1.2;
        });
        mejor.cobros.forEach(inm=>tareasHoy.push({tipo:'cobro',zona:mejor.z,titulo:`💵 Cobranza ${inm.nombre}`,detalle:'día de cobro',inm:inm.nombre}));
      }
    }else{
      const diaMes=dd.getDate();
      zonasList.forEach(z=>{
        inmPorZona[z].filter(inm=>cDiasCobro(inm).includes(diaMes)).forEach(inm=>{
          tareasHoy.push({tipo:'cobro',zona:z,titulo:`💵 Cobranza ${inm.nombre}`,detalle:'día de cobro (ligero)',inm:inm.nombre});
        });
      });
    }

    // 4. Cobros de otras zonas (recordatorio, solo días normales)
    if(!ligero){
      const zonasConTareas=new Set(tareasHoy.filter(t=>t.tipo==='mant').map(t=>t.zona));
      const diaMes=dd.getDate();
      zonasList.forEach(z=>{
        if(zonasConTareas.has(z))return;
        inmPorZona[z].filter(inm=>cDiasCobro(inm).includes(diaMes)).forEach(inm=>{
          if(tareasHoy.some(t=>t.inm===inm.nombre&&t.tipo==='cobro'))return;
          tareasHoy.push({tipo:'cobro',zona:z,titulo:`💵 Cobranza ${inm.nombre}`,detalle:'día de cobro',inm:inm.nombre});
        });
      });
    }

    if(tareasHoy.length)cron[fecha]=tareasHoy;
  }

  // Toluca bimestral
  const tolFreq=60;
  const necTol=!CRONO.toluca_ultima||cDiff(cIso(ultimo),CRONO.toluca_ultima)>=tolFreq;
  const hayToluca=DB.inmuebles.some(i=>i.zona==='toluca');
  if(necTol&&hayToluca){
    for(let dd=new Date(y,m,8);dd<=new Date(y,m,20);dd=cAdd(dd,1)){
      if(!cLigero(dd)){const f=cIso(dd);if(!cron[f])cron[f]=[];cron[f].push({tipo:'mant',zona:'toluca',titulo:'🚙 Visita Toluca (bimestral)',detalle:'revisión general'});break;}
    }
  }

  CRONO.cronograma[mk]=cron;
  cronoSave();
  return cron;
}

// ── RENDER: vista principal cronograma dentro de Gestión ──
function renderCrono(){
  cronoLoad();
  const cont=document.getElementById('crono-body');
  if(!cont)return;
  const sinZona=DB.inmuebles.filter(i=>!i.zona).length;
  const conZona=cInmueblesConZona().length;
  let sub=`<div class="cr" style="margin-bottom:10px">
    <span class="chip${cronoSub==='cal'?' on':''}" onclick="cronoSub='cal';renderCrono()">🗓️ Calendario</span>
    <span class="chip${cronoSub==='autos'?' on':''}" onclick="cronoSub='autos';renderCrono()">🚗 Autos</span>
    <span class="chip${cronoSub==='config'?' on':''}" onclick="cronoSub='config';renderCrono()">⚙️ Config</span>
  </div>`;
  if(conZona===0){
    cont.innerHTML=sub+`<div class="es"><div class="ei">🗺️</div><div class="et">Ningún inmueble tiene zona asignada</div>
      <div style="font-size:12px;color:var(--dim);margin:10px 0">Para usar el cronograma, asigna una zona a cada inmueble desde Propietarios → editar inmueble (⚙️).</div>
      <button class="btn bg" onclick="cronoAsignarZonasAuto()">Auto-asignar zonas conocidas</button></div>`;
    return;
  }
  if(cronoSub==='cal')cont.innerHTML=sub+renderCronoCal()+(sinZona>0?`<div style="font-size:11px;color:var(--dim);text-align:center;margin-top:10px">${sinZona} inmueble(s) sin zona no aparecen. Asígnalas en Propietarios.</div>`:'');
  else if(cronoSub==='autos')cont.innerHTML=sub+renderCronoAutos();
  else if(cronoSub==='config')cont.innerHTML=sub+renderCronoConfig();
}

function renderCronoCal(){
  const y=cronoDate.getFullYear(),m=cronoDate.getMonth();
  const mk=cMonthKey(cronoDate);
  let cron=CRONO.cronograma[mk];
  if(!cron)cron=cGenerar(y,m);
  const primero=new Date(y,m,1),ultimo=new Date(y,m+1,0);
  const startPad=cWd(primero);
  const hoy=cIso(new Date());
  const MESES_C=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  let html=`<div style="display:flex;justify-content:center;align-items:center;gap:10px;margin:6px 0 12px">
    <button class="btn bo bsm" onclick="cronoChMonth(-1)">‹</button>
    <div style="font-weight:700;font-size:15px;text-transform:capitalize;min-width:140px;text-align:center">${MESES_C[m]} ${y}</div>
    <button class="btn bo bsm" onclick="cronoChMonth(1)">›</button>
    <button class="btn bs bsm" onclick="cronoHoy()">Hoy</button>
  </div>
  <button class="btn bg bfu" style="margin-bottom:10px" onclick="cronoRegen()">🔄 Recalcular mes</button>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px">${DIAS_SEM_C.map(d=>`<div style="text-align:center;font-size:9px;color:var(--dim);font-weight:700;padding:2px 0">${d}</div>`).join('')}</div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">`;
  for(let i=0;i<startPad;i++)html+='<div></div>';
  for(let dd=new Date(primero);dd<=ultimo;dd=cAdd(dd,1)){
    const f=cIso(dd);
    const tareas=cron[f]||[];
    const ligero=cLigero(dd);
    const isToday=f===hoy;
    const zColor=t=>t.tipo==='incidente'?'#E05C5C':t.tipo==='cobro'?'transparent':t.zona==='autos'?'#16A2B8':(ZONAS_CRONO[t.zona]?ZONAS_CRONO[t.zona].color:'#888');
    let dots='';
    const zonasDia=[...new Set(tareas.filter(t=>t.tipo==='mant').map(t=>t.zona))];
    zonasDia.slice(0,3).forEach(z=>{dots+=`<span style="width:6px;height:6px;border-radius:2px;background:${ZONAS_CRONO[z]?ZONAS_CRONO[z].color:'#888'};display:inline-block"></span>`;});
    if(tareas.some(t=>t.tipo==='auto'))dots+=`<span style="width:6px;height:6px;border-radius:50%;background:#16A2B8;display:inline-block"></span>`;
    if(tareas.some(t=>t.tipo==='cobro'))dots+=`<span style="width:6px;height:6px;border-radius:50%;border:1px solid #E05C5C;display:inline-block"></span>`;
    if(tareas.some(t=>t.tipo==='incidente'))dots+=`<span style="width:6px;height:6px;border-radius:50%;background:#E05C5C;display:inline-block"></span>`;
    const nMant=tareas.filter(t=>t.tipo==='mant').length;
    html+=`<div onclick="cronoOpenDay('${f}')" style="background:${isToday?'#D4A84322':'var(--s1)'};border:1px solid ${isToday?'var(--gold,#C9A227)':'#222'};border-radius:7px;min-height:62px;padding:4px;cursor:pointer;display:flex;flex-direction:column;${ligero?'background-image:repeating-linear-gradient(45deg,transparent,transparent 5px,#ffffff08 5px,#ffffff08 10px)':''}">
      <div style="font-size:11px;font-weight:700;display:flex;justify-content:space-between">${dd.getDate()}${CRONO.zonasFijadas[f]?'<span style="font-size:8px">📌</span>':''}</div>
      <div style="display:flex;flex-wrap:wrap;gap:2px;margin-top:3px">${dots}</div>
      ${nMant>0?`<div style="font-size:8px;color:var(--dim);margin-top:auto">${nMant} tareas</div>`:''}
    </div>`;
  }
  html+='</div>';
  // Leyenda
  html+='<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">';
  Object.entries(ZONAS_CRONO).forEach(([k,z])=>{
    if(!DB.inmuebles.some(i=>i.zona===k))return;
    html+=`<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim)"><span style="width:9px;height:9px;border-radius:2px;background:${z.color}"></span>${z.nombre}</div>`;
  });
  html+=`<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim)"><span style="width:9px;height:9px;border-radius:50%;background:#16A2B8"></span>Autos</div>`;
  html+=`<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim)"><span style="width:9px;height:9px;border-radius:50%;border:1px solid #E05C5C"></span>Cobranza</div></div>`;
  return html;
}

function cronoChMonth(n){cronoDate=new Date(cronoDate.getFullYear(),cronoDate.getMonth()+n,1);renderCrono();}
function cronoHoy(){cronoDate=new Date();renderCrono();}
function cronoRegen(){cGenerar(cronoDate.getFullYear(),cronoDate.getMonth());renderCrono();snack('✓ Cronograma recalculado');}

function cronoOpenDay(f){
  const d=cParse(f);
  const mk=cMonthKey(d);
  const cron=CRONO.cronograma[mk]||{};
  const tareas=cron[f]||[];
  const ligero=cLigero(d);
  const MESES_C=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const nombreDia=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'][cWd(d)];
  const zonaFijada=CRONO.zonasFijadas[f];
  const autoPills=AUTOS_CRONO.map(a=>`<span class="pill" style="padding:3px 8px;border-radius:12px;background:var(--s2);border:1px solid #333;font-size:10px;${cCircula(a,d)?'':'opacity:.4;text-decoration:line-through'}">${a}</span>`).join(' ');
  const zonaOpts=Object.entries(ZONAS_CRONO).map(([k,z])=>`<option value="${k}"${zonaFijada===k?' selected':''}>${z.nombre}</option>`).join('');
  let body=`<div class="ms"><div class="mh"></div>
    <div class="mt2">${nombreDia} ${d.getDate()} de ${MESES_C[d.getMonth()]}</div>
    <div style="font-size:11px;color:var(--dim);margin-bottom:12px">${ligero?'🟡 Día ligero (dom/lun) — carga reducida':'🟢 Día normal (Freddy)'}${zonaFijada?' · 📌 zona fijada':''}</div>
    <div style="font-size:11px;margin-bottom:12px">🚗 Circulan: ${autoPills}</div>
    <div class="fg" style="background:var(--s1);padding:10px 12px;border-radius:9px">
      <label class="fl">📌 ¿En qué zona estarás este día?</label>
      <div style="display:flex;gap:8px">
        <select class="fi" id="crono-zona-manual" style="flex:1"><option value="">— Automático —</option>${zonaOpts}</select>
        <button class="btn bg bsm" onclick="cronoFijarZona('${f}')">Aplicar</button>
      </div>
      ${zonaFijada?`<button class="btn bo bsm" style="width:100%;margin-top:8px" onclick="cronoQuitarZona('${f}')">Quitar zona fija</button>`:''}
    </div>`;
  if(tareas.length===0){
    body+=`<div class="es"><div class="ei">🌤️</div><div class="et">Sin tareas este día</div></div>`;
  }else{
    tareas.forEach(t=>{
      const c=t.tipo==='incidente'?'#E05C5C':t.tipo==='cobro'?'#E05C5C':t.zona==='autos'?'#16A2B8':(ZONAS_CRONO[t.zona]?ZONAS_CRONO[t.zona].color:'#888');
      body+=`<div style="background:var(--s1);border-radius:9px;padding:10px 12px;margin-bottom:6px;border-left:3px solid ${c}">
        <div style="font-weight:600;font-size:13px">${t.titulo}${t.fijada?' 📌':''}</div>
        <div style="font-size:11px;color:var(--dim);margin-top:2px">${t.detalle||''}${t.zona&&ZONAS_CRONO[t.zona]?' · '+ZONAS_CRONO[t.zona].nombre:''}</div>
      </div>`;
    });
  }
  body+=`<div style="display:flex;gap:8px;margin-top:12px">
    <button class="btn bg" style="flex:1" onclick="cronoExportWA('${f}')">📱 WhatsApp</button>
    <button class="btn bo" onclick="closeM()">Cerrar</button>
  </div></div>`;
  modal(body);
}

function cronoFijarZona(f){
  const z=document.getElementById('crono-zona-manual').value;
  if(!z){cronoQuitarZona(f);return;}
  CRONO.zonasFijadas[f]=z;
  const d=cParse(f);cGenerar(d.getFullYear(),d.getMonth());cronoSave();
  snack('📌 Zona fijada: '+ZONAS_CRONO[z].nombre);cronoOpenDay(f);
}
function cronoQuitarZona(f){
  delete CRONO.zonasFijadas[f];
  const d=cParse(f);cGenerar(d.getFullYear(),d.getMonth());cronoSave();
  snack('Volviendo a automático');cronoOpenDay(f);
}

function cronoExportWA(f){
  const d=cParse(f);const mk=cMonthKey(d);const cron=CRONO.cronograma[mk]||{};const tareas=cron[f]||[];
  const nombreDia=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'][cWd(d)];
  const circulan=AUTOS_CRONO.filter(a=>cCircula(a,d));
  let txt=`🗓️ *AGENDA ${nombreDia.toUpperCase()} ${d.getDate()}/${d.getMonth()+1}*\n_Inmobiliaria_\n\n`;
  const mant=tareas.filter(t=>t.tipo==='mant'),autos=tareas.filter(t=>t.tipo==='auto'),cobros=tareas.filter(t=>t.tipo==='cobro'),incs=tareas.filter(t=>t.tipo==='incidente');
  if(incs.length){txt+=`🚨 *INCIDENTES*\n`;incs.forEach(t=>txt+=`• ${t.titulo.replace('🚨 ','')}${t.detalle?' ('+t.detalle+')':''}\n`);txt+=`\n`;}
  if(mant.length){
    const porZona={};mant.forEach(t=>{porZona[t.zona]=porZona[t.zona]||[];porZona[t.zona].push(t);});
    Object.entries(porZona).forEach(([z,ts])=>{
      txt+=`📍 *${(ZONAS_CRONO[z]?ZONAS_CRONO[z].nombre:z).toUpperCase()}*\n`;
      const porInm={};ts.forEach(t=>{porInm[t.inm]=porInm[t.inm]||[];porInm[t.inm].push(t.titulo.replace(/^\S+\s/,''));});
      Object.entries(porInm).forEach(([inm,tt])=>txt+=`  🏠 ${inm}: ${tt.join(', ')}\n`);
      txt+=`\n`;
    });
  }
  if(cobros.length){
    const zonasVis=new Set(mant.map(t=>t.zona));
    const enZona=cobros.filter(t=>{const inm=DB.inmuebles.find(i=>i.nombre===t.inm);return inm&&zonasVis.has(inm.zona);});
    const otras=cobros.filter(t=>!enZona.includes(t));
    txt+=`💵 *COBRANZA*\n`;
    enZona.forEach(t=>txt+=`• ${t.inm}\n`);
    if(otras.length){txt+=`_(otras zonas, si te queda de paso):_\n`;otras.forEach(t=>{const inm=DB.inmuebles.find(i=>i.nombre===t.inm);const zn=inm&&ZONAS_CRONO[inm.zona]?ZONAS_CRONO[inm.zona].nombre:'';txt+=`• ${t.inm} ${zn?'('+zn+')':''}\n`;});}
    txt+=`\n`;
  }

function buildPropietarioReporte(propId,rango){
  const prop=getPropietario(propId);
  if(!prop)return null;
  const r=rango||getRange('semana');
  const inRango=(f)=>{if(!f)return false;const d=new Date(f);if(isNaN(d))return false;return d>=r.ini&&d<=r.fin;};
  const inmuebles=DB.inmuebles.filter(i=>i.propietarioId===propId).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));
  const norm=t=>t==='cfe'?'luz':t;

  // Datos por inmueble
  const porInmueble=inmuebles.map(inm=>{
    const tenants=DB.inquilinos.filter(t=>(t.inmuebleId===inm.id||t.inmueble===inm.nombre)&&t.estado==='activo');
    const totalRenta=tenants.reduce((s,t)=>s+Number(t.renta||0),0);
    // Cobrado en el período (pagos con fecha_pago en rango)
    const inqIds=tenants.map(t=>t.id);
    const pagosPeriodo=DB.pagos.filter(p=>p.pagado&&inqIds.includes(p.iid)&&inRango(p.fecha_pago));
    const cobradoPeriodo=pagosPeriodo.reduce((s,p)=>s+Number(p.monto||0),0);
    // Detalle de cobros: quién pagó y cuánto (para la lista en la diapositiva)
    const cobrosDetalle=pagosPeriodo.map(p=>{
      const t=DB.inquilinos.find(x=>x.id===p.iid);
      return{nombre:t?.nombre||'?',interior:t?.interior||'',monto:Number(p.monto||0),fecha:new Date(p.fecha_pago)};
    }).sort((a,b)=>b.monto-a.monto);
    // Cobrado del mes actual (para % esperado mensual)
    const pagosMes=DB.pagos.filter(p=>p.pagado&&inqIds.includes(p.iid)&&p.mes===HM&&p.anio===HA);
    const cobradoMes=pagosMes.reduce((s,p)=>s+Number(p.monto||0),0);
    const pendienteMes=Math.max(0,totalRenta-cobradoMes);
    // Vacancia
    const totalDepas=inm.total_depas||tenants.length;
    const ocupados=tenants.length;
    const pctOcup=totalDepas>0?Math.round(ocupados/totalDepas*100):0;
    // Atrasados (vencidos este mes)
    const atrasados=tenants.filter(t=>isLate(t.id,HM,HA)).map(t=>({nombre:t.nombre,interior:t.interior,renta:Number(t.renta||0)}));
    // Trabajos (obras del período)
    const obras=DB.obras.filter(o=>(o.inmueble===inm.nombre)&&inRango(o.fecha)).map(o=>({tipo:(TIPOS_OBRA[o.tipo]||TIPOS_OBRA.otros).n,costo:Number(o.costo||0),desc:o.descripcion||''}));
    // Incidentes del período
    const incidentes=DB.incidentes.filter(i=>{
      const lugarLow=(i.lugar||'').toLowerCase();const inmLow=inm.nombre.toLowerCase();
      return (lugarLow.includes(inmLow)||inmLow.includes(lugarLow))&&inRango(i.fecha);
    }).map(i=>({numero:i.numero,desc:i.descripcion||'',resuelto:i.resuelto,nivel:i.nivel}));
    // Deudas de servicios
    const svcs=DB.servicios.filter(s=>s.inmueble===inm.nombre);
    const deudaLuzArr=svcs.filter(s=>norm(s.tipo)==='luz').map(s=>({alias:s.alias||'',monto:Math.max(0,getServicioBalance(s.id))})).filter(x=>x.monto>0);
    const deudaLuz=deudaLuzArr.reduce((s,x)=>s+x.monto,0);
    const deudaAgua=svcs.filter(s=>norm(s.tipo)==='agua').reduce((s,sv)=>s+Math.max(0,getServicioBalance(sv.id)),0);
    const deudaPredial=svcs.filter(s=>norm(s.tipo)==='predial').reduce((s,sv)=>s+Math.max(0,getServicioBalance(sv.id)),0);
    return{inm,tenants,totalRenta,cobradoPeriodo,cobrosDetalle,cobradoMes,pendienteMes,totalDepas,ocupados,pctOcup,atrasados,obras,incidentes,deudaLuz,deudaLuzArr,deudaAgua,deudaPredial};
  });

  // OPEX (gastos del período por categoría)
  const gastosPeriodo=DB.gastos.filter(g=>g.propietarioId===propId&&inRango(g.fecha));
  const opex={mano_obra:0,carros:0,mantenimiento:0,servicios:0,otros:0};
  const opexDetalle={mano_obra:[],carros:[],mantenimiento:[],servicios:[],otros:[]};
  gastosPeriodo.forEach(g=>{
    const c=g.categoria||'otros';
    opex[c]=(opex[c]||0)+Number(g.monto||0);
    if(!opexDetalle[c])opexDetalle[c]=[];
    // Etiqueta: descripción (y notas si aportan), inmueble
    const label=(g.descripcion||'').trim()||(g.notas||'').trim()||'(sin descripción)';
    opexDetalle[c].push({label,inmueble:g.inmueble||'',monto:Number(g.monto||0),notas:(g.notas||'').trim()});
  });
  // Agrupar detalle por descripción para no repetir (ej: "Freddy" varias veces -> suma)
  Object.keys(opexDetalle).forEach(c=>{
    const agr={};
    opexDetalle[c].forEach(it=>{
      const key=it.label.toLowerCase();
      if(!agr[key])agr[key]={label:it.label,monto:0,count:0};
      agr[key].monto+=it.monto;agr[key].count++;
    });
    opexDetalle[c]=Object.values(agr).sort((a,b)=>b.monto-a.monto);
  });

  return{prop,rango:r,porInmueble,opex,opexDetalle,gastosPeriodo};
}

// Carga PptxGenJS bajo demanda con varios CDN de respaldo
let _pptxLoading=null;
function ensurePptxGenJS(){
  if(typeof PptxGenJS!=='undefined')return Promise.resolve(true);
  if(_pptxLoading)return _pptxLoading;
  const urls=[
    'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js',
    'https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js',
    'https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.min.js'
  ];
  _pptxLoading=new Promise((resolve)=>{
    let idx=0;
    const tryNext=()=>{
      if(typeof PptxGenJS!=='undefined'){resolve(true);return;}
      if(idx>=urls.length){resolve(false);return;}
      const url=urls[idx++];
      const sc=document.createElement('script');
      sc.src=url;
      sc.onload=()=>{
        setTimeout(()=>{
          if(typeof PptxGenJS!=='undefined')resolve(true);
          else tryNext();
        },100);
      };
      sc.onerror=()=>{tryNext();};
      document.head.appendChild(sc);
    };
    tryNext();
  });
  return _pptxLoading;
}

async function generarPPTPropietario(propId,rangoMode){
  snack('⏳ Cargando generador de presentaciones...');
  const ok=await ensurePptxGenJS();
  if(!ok||typeof PptxGenJS==='undefined'){
    snack('⚠️ No se pudo cargar la librería. Revisa tu conexión a internet e inténtalo de nuevo.');
    return;
  }
  const rango=getRange(rangoMode||'semana');
  const data=buildPropietarioReporte(propId,rango);
  if(!data){snack('No encontré al propietario');return;}
  snack('⏳ Generando presentación...');

  const P={navy:'1F3A5F',blue:'4472C4',blueLt:'8FAADC',blueBg:'D9E2F3',gold:'C9A227',red:'C0392B',green:'27AE60',gray:'6B7280',dark:'2C3E50',white:'FFFFFF',light:'F4F6FA'};

    if(d.incidentes.length===0){
      s.addText('Sin incidentes en el período',{x:colX+0.2,y:5.45,w:colW,h:0.3,fontSize:12,color:P.gray,italic:true});
    }else{
      const inc=d.incidentes.slice(0,5).map(i=>({text:(i.numero||'?')+' — '+i.desc.slice(0,60)+(i.resuelto?' ✓ resuelto':' (activo)'),options:{fontSize:11,color:i.resuelto?P.gray:P.dark,bullet:{code:'2022'},breakLine:true,paraSpaceAfter:3}}));
      s.addText(inc,{x:colX+0.2,y:5.45,w:colW,h:1.5,valign:'top'});
    }
  });

  // ── SLIDE: PASIVOS A LIQUIDAR ──
  s=pptx.addSlide();
  s.background={color:P.white};
  s.addText('PASIVOS A LIQUIDAR',{x:0.5,y:0.35,w:12.3,h:0.6,fontSize:26,bold:true,color:P.navy,fontFace:'Georgia'});
  const headP=['INMUEBLE','DEUDA LUZ','DEUDA AGUA','DEUDA PREDIAL','TOTAL'];
  const rowsP=[headP.map(t=>({text:t,options:{bold:true,color:P.white,fill:{color:P.blue},align:'center',valign:'middle',fontSize:12}}))];
  let totP={luz:0,agua:0,pred:0};
  data.porInmueble.forEach((d,i)=>{
    const totInm=d.deudaLuz+d.deudaAgua+d.deudaPredial;
    if(totInm===0&&d.deudaLuzArr.length===0)return; // omitir inmuebles sin deuda
    totP.luz+=d.deudaLuz;totP.agua+=d.deudaAgua;totP.pred+=d.deudaPredial;
    const bg=i%2===0?P.light:P.white;
    const luzDetalle=d.deudaLuzArr.length>0?money(d.deudaLuz):(d.deudaLuz>0?money(d.deudaLuz):'—');
    rowsP.push([
      {text:d.inm.nombre+'\n('+money(d.totalRenta)+' renta/mes)',options:{bold:true,color:P.dark,fill:{color:bg},valign:'middle',fontSize:10}},
      {text:luzDetalle,options:{color:d.deudaLuz>0?P.red:P.gray,fill:{color:bg},align:'center',valign:'middle',fontSize:11}},
      {text:d.deudaAgua>0?money(d.deudaAgua):'—',options:{color:d.deudaAgua>0?P.red:P.gray,fill:{color:bg},align:'center',valign:'middle',fontSize:11}},
      {text:d.deudaPredial>0?money(d.deudaPredial):'—',options:{color:d.deudaPredial>0?P.red:P.gray,fill:{color:bg},align:'center',valign:'middle',fontSize:11}},
      {text:money(totInm),options:{bold:true,color:P.red,fill:{color:bg},align:'center',valign:'middle',fontSize:11}}
    ]);
  });
  const granTotal=totP.luz+totP.agua+totP.pred;
  rowsP.push([
    {text:'TOTAL',options:{bold:true,color:P.white,fill:{color:P.navy},valign:'middle',fontSize:12}},
    {text:money(totP.luz),options:{bold:true,color:P.white,fill:{color:P.navy},align:'center',valign:'middle',fontSize:11}},
    {text:money(totP.agua),options:{bold:true,color:P.white,fill:{color:P.navy},align:'center',valign:'middle',fontSize:11}},
    {text:money(totP.pred),options:{bold:true,color:P.white,fill:{color:P.navy},align:'center',valign:'middle',fontSize:11}},
    {text:money(granTotal),options:{bold:true,color:P.gold,fill:{color:P.navy},align:'center',valign:'middle',fontSize:12}}
  ]);
  if(rowsP.length===2){ // solo header + total = sin deudas
    s.addText('✓ Sin pasivos pendientes en los inmuebles de '+data.prop.nombre,{x:0.5,y:3.3,w:12.3,h:0.6,fontSize:18,color:P.green,align:'center',bold:true});
  }else{
    s.addTable(rowsP,{x:0.5,y:1.3,w:12.3,colW:[3.4,2.5,2.3,2.5,1.6],border:{type:'solid',color:'D0D5DD',pt:0.5},autoPage:false});
  }

  // ── SLIDE: OPEX ──
  s=pptx.addSlide();
  s.background={color:P.white};
  s.addText('OPEX: GASTOS OPERATIVOS',{x:0.5,y:0.35,w:12.3,h:0.6,fontSize:26,bold:true,color:P.navy,fontFace:'Georgia'});
  s.addText('Período: '+data.rango.label,{x:0.5,y:0.95,w:12.3,h:0.35,fontSize:13,color:P.gray,italic:true});
  const opexItems=[
    {label:'MANO DE OBRA',val:data.opex.mano_obra||0,color:P.blue},
    {label:'CARRO / TRANSPORTE',val:data.opex.carros||0,color:P.navy},
    {label:'MANTENIMIENTO / REPARACIONES',val:data.opex.mantenimiento||0,color:P.gold},
    {label:'SERVICIOS',val:data.opex.servicios||0,color:P.green},
    {label:'OTROS',val:data.opex.otros||0,color:P.gray}
  ];
  const totalOpex=opexItems.reduce((s2,i)=>s2+i.val,0);
  let cardY=1.6;
  opexItems.forEach(it=>{
    s.addShape(pptx.ShapeType.roundRect,{x:0.8,y:cardY,w:8.5,h:0.75,fill:{color:P.light},line:{color:'E0E4EA',width:1},rectRadius:0.05});
    s.addShape(pptx.ShapeType.ellipse,{x:1.0,y:cardY+0.13,w:0.5,h:0.5,fill:{color:it.color}});
    s.addText(it.label,{x:1.7,y:cardY,w:5.0,h:0.75,fontSize:14,bold:true,color:P.dark,valign:'middle'});
    s.addText(money(it.val),{x:6.7,y:cardY,w:2.4,h:0.75,fontSize:18,bold:true,color:it.color,align:'right',valign:'middle'});
    cardY+=0.92;
  });
  // Total OPEX card
  s.addShape(pptx.ShapeType.roundRect,{x:9.6,y:1.6,w:3.2,h:2.5,fill:{color:P.navy},rectRadius:0.05});
  s.addText([{text:'TOTAL OPEX\n',options:{fontSize:14,color:P.blueLt}},{text:money(totalOpex)+'\n',options:{fontSize:30,bold:true,color:P.white}},{text:data.rango.label,options:{fontSize:11,color:P.blueLt}}],{x:9.6,y:1.6,w:3.2,h:2.5,align:'center',valign:'middle'});

  // ── SLIDE: REPARACIONES RECOMENDADAS ──
  s=pptx.addSlide();
  s.background={color:P.white};
  s.addText('REPARACIONES RECOMENDADAS',{x:0.5,y:0.35,w:12.3,h:0.6,fontSize:26,bold:true,color:P.navy,fontFace:'Georgia'});
  // Sugerir desde incidentes activos + inspecciones bajas
  const recomend=[];
  data.porInmueble.forEach(d=>{
    d.incidentes.filter(i=>!i.resuelto).forEach(i=>recomend.push(d.inm.nombre+': '+i.desc.slice(0,70)));
  });
  if(recomend.length>0){
    const rec=recomend.slice(0,10).map(t=>({text:t,options:{fontSize:13,color:P.dark,bullet:{code:'2022'},breakLine:true,paraSpaceAfter:6}}));
    s.addText(rec,{x:0.8,y:1.5,w:11.7,h:5.2,valign:'top'});
  }else{
    s.addShape(pptx.ShapeType.roundRect,{x:1.5,y:2.5,w:10.3,h:2.2,fill:{color:P.light},line:{color:'E0E4EA',width:1},rectRadius:0.08});
    s.addText('Espacio para notas y recomendaciones',{x:1.5,y:3.4,w:10.3,h:0.5,fontSize:16,color:P.gray,align:'center',italic:true});
  }

  // Guardar
  const fname='Reporte_'+data.prop.nombre.replace(/\s+/g,'_')+'_'+todayISO()+'.pptx';
  try{
    // Método robusto: generar blob y forzar descarga (funciona mejor en móvil)
    const blob=await pptx.write({outputType:'blob'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=fname;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
    snack('✅ Presentación descargada');
  }catch(e){
    console.error('[PPTX write blob]',e);
    // Fallback al método directo de la librería
    try{
      await pptx.writeFile({fileName:fname});
      snack('✅ Presentación descargada');
    }catch(e2){
      console.error('[PPTX writeFile]',e2);
      snack('❌ Error al generar: '+e2.message);
    }
  }
}
