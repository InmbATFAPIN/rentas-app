<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rentas — Gestión Inmobiliaria</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<style>
:root{--bg:#0f0f0f;--s1:#1a1a1a;--s2:#252525;--s3:#2e2e2e;--gold:#D4A843;--gdim:#9A7A2F;--txt:#F0EAD6;--dim:#777;--r:#E05C5C;--g:#5CB87A;--y:#E0B840;--b:#5B9BD5;--p:#B074D4;--nav:68px;--rad:14px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'DM Sans',sans-serif}
body{background:var(--bg);color:var(--txt);max-width:430px;margin:0 auto;min-height:100vh;overflow-x:hidden;font-size:14px}
.hdr{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:20;border-bottom:1px solid #1c1c1c}
.hdr-t{font-family:'Playfair Display',serif;font-size:19px;color:var(--gold)}
.hdr-s{font-size:11px;color:var(--dim);margin-top:2px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#111;border-top:1px solid #1c1c1c;display:flex;height:var(--nav);z-index:100}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--dim);font-size:10px;font-weight:500;border:none;background:none;padding:0;position:relative;transition:color .15s}
.ni.on{color:var(--gold)}
.ni svg{width:20px;height:20px;stroke-width:1.8}
.nd{width:7px;height:7px;background:var(--r);border-radius:50%;position:absolute;top:8px;right:calc(50% - 13px);display:none}
.mc{padding:12px 14px calc(var(--nav) + 14px)}
.view{display:none}.view.on{display:block}
.card{background:var(--s1);border-radius:var(--rad);padding:14px;margin-bottom:10px;border:1px solid #222}
.card.gd{border-left:3px solid var(--gold)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.sg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:14px}
.sc{background:var(--s1);border-radius:var(--rad);padding:13px;border:1px solid #222;text-align:center}
.sl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.sv{font-family:'Playfair Display',serif;font-size:21px;color:var(--gold)}
.sv.r{color:var(--r)}.sv.g{color:var(--g)}.sv.b{color:var(--b)}
.svm{font-family:'Playfair Display',serif;font-size:17px;color:var(--gold)}
.st{font-family:'Playfair Display',serif;font-size:17px;color:var(--gold);margin-bottom:11px;margin-top:4px}
.st-sm{font-size:14px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin:14px 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:all .12s;border:none;white-space:nowrap}
.bg{background:var(--gold);color:#111}.bg:active{background:var(--gdim)}
.bo{background:transparent;color:var(--gold);border:1px solid var(--gold)}.bo:active{background:#D4A84322}
.bd{background:#E05C5C22;color:var(--r);border:1px solid #E05C5C44}
.bs{background:#5CB87A22;color:var(--g);border:1px solid #5CB87A44}
.bb{background:#5B9BD522;color:var(--b);border:1px solid #5B9BD544}
.bfu{width:100%;text-align:center}
.bsm{padding:7px 11px;font-size:12px}
.fg{margin-bottom:12px}
.fl{font-size:11px;color:var(--dim);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.4px}
.fi{width:100%;background:var(--s2);border:1px solid #333;border-radius:9px;padding:10px 13px;color:var(--txt);font-size:14px;outline:none;font-family:inherit}
.fi:focus{border-color:var(--gold)}
select.fi{appearance:none}
textarea.fi{resize:vertical;min-height:60px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;display:flex;align-items:flex-end;backdrop-filter:blur(5px)}
.ms{background:#161616;border-radius:22px 22px 0 0;padding:18px 18px 30px;width:100%;max-height:92vh;overflow-y:auto;border-top:1px solid #2a2a2a}
.mh{width:38px;height:4px;background:#333;border-radius:2px;margin:0 auto 14px}
.mt2{font-family:'Playfair Display',serif;font-size:18px;color:var(--gold);margin-bottom:16px}
.fab{position:fixed;bottom:calc(var(--nav) + 14px);right:16px;width:52px;height:52px;border-radius:50%;background:var(--gold);color:#111;border:none;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(212,168,67,.35);z-index:50;font-size:22px;line-height:1}
.fab:active{transform:scale(.93)}
.snk{position:fixed;bottom:calc(var(--nav)+14px);left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:12px;z-index:500;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90%}
.snk.show{opacity:1}
.cr{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}
.cr::-webkit-scrollbar{display:none}
.chip{padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;background:var(--s2);color:var(--dim);border:1px solid #2e2e2e;flex-shrink:0;white-space:nowrap}
.chip.on{background:var(--gold);color:#111;border-color:var(--gold)}
.subnav{display:flex;background:var(--s1);border-radius:10px;padding:3px;margin-bottom:14px;border:1px solid #222;gap:2px}
.subnav button{flex:1;padding:9px 4px;background:none;border:none;color:var(--dim);font-size:11px;font-weight:600;border-radius:8px;cursor:pointer;transition:all .15s}
.subnav button.on{background:var(--gdim);color:#fff}
.inm-group{margin-bottom:10px;background:var(--s1);border-radius:12px;border:1px solid #222;overflow:hidden}
.inm-hd{padding:12px 14px;background:#1f1f1f;cursor:pointer;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #252525}
.inm-hd-l{display:flex;align-items:center;gap:8px}
.inm-nom{font-family:'Playfair Display',serif;font-size:15px;color:var(--gold);font-weight:600;letter-spacing:.3px}
.inm-meta{font-size:10px;color:var(--dim);margin-top:1px}
.inm-arrow{color:var(--dim);transition:transform .2s;font-size:13px}
.inm-arrow.open{transform:rotate(90deg)}
.inm-body{display:none}
.inm-body.open{display:block}
.row-inq{display:flex;align-items:center;gap:9px;padding:11px 12px;border-bottom:1px solid #1d1d1d;cursor:pointer;transition:background .12s}
.row-inq:last-child{border-bottom:none}
.row-inq:active{background:var(--s2)}
.row-inq.paid{background:#5CB87A0a}
.row-inq.late{background:#E05C5C0a}
.chkbox{width:24px;height:24px;border-radius:7px;border:1.5px solid #444;background:#161616;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.chkbox.on{background:var(--g);border-color:var(--g)}
.chkbox.on::after{content:"✓";color:#fff;font-size:14px;font-weight:700}
.chkbox.late{border-color:var(--r)}
.inq-dia{width:32px;text-align:center;font-family:'Playfair Display',serif;font-size:14px;color:var(--gold);font-weight:600;flex-shrink:0}
.inq-info{flex:1;min-width:0}
.inq-nom{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inq-sub{font-size:10px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inq-monto{font-size:12px;font-weight:600;color:var(--gold);text-align:right;flex-shrink:0;white-space:nowrap}
.inq-tstamp{font-size:9px;color:var(--g);margin-top:2px;text-align:right}
.confirm-msg{text-align:center;padding:14px 0 20px}
.confirm-q{font-family:'Playfair Display',serif;font-size:17px;color:var(--txt);margin-bottom:6px}
.confirm-sub{font-size:12px;color:var(--dim)}
.confirm-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bk{background:none;border:none;color:var(--gold);font-size:13px;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:3px;margin-bottom:14px}
.ir{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1e1e1e}
.ir:last-child{border-bottom:none}
.ik{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.3px}
.iv{font-size:13px;font-weight:500;text-align:right;max-width:60%}
.tag-g{color:var(--g)}.tag-gd{color:var(--gold)}.tag-r{color:var(--r)}
.bge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.bge.v{background:#E05C5C22;color:var(--r);border:1px solid #E05C5C44}
.bge.ok{background:#5CB87A22;color:var(--g);border:1px solid #5CB87A44}
.bge.ad{background:#88888822;color:var(--dim);border:1px solid #33333366}
.bge.b{background:#5B9BD522;color:var(--b);border:1px solid #5B9BD544}
.bge.y{background:#E0B84022;color:var(--y);border:1px solid #E0B84044}
.bge.p{background:#B074D422;color:var(--p);border:1px solid #B074D444}
.av{width:42px;height:42px;border-radius:50%;background:var(--gdim);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:15px;color:#fff;flex-shrink:0}
.es{text-align:center;padding:36px 20px;color:var(--dim)}
.ei{font-size:36px;margin-bottom:10px}
.et{font-size:13px;line-height:1.5}
.ti{background:var(--s1);border-radius:var(--rad);padding:12px 14px;margin-bottom:8px;border:1px solid #222;cursor:pointer;display:flex;align-items:center;gap:11px}
.ti:active{background:var(--s2)}
.tn{flex:1;min-width:0}
.tnm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid #1e1e1e}
.pr:last-child{border-bottom:none}
.pi{flex:1;min-width:0}.pn{font-weight:500;font-size:13px}.pd{font-size:11px;color:var(--dim);margin-top:1px}
.pa{font-family:'Playfair Display',serif;font-size:15px;color:var(--g);white-space:nowrap}
.pa.r{color:var(--r)}
.ro{background:var(--s1);border-radius:var(--rad);padding:14px;margin-bottom:10px;border:1px solid #222;cursor:pointer;display:flex;align-items:center;gap:12px}
.ro:active{background:var(--s2)}
.rtit{font-weight:600;font-size:14px}.rdesc{font-size:12px;color:var(--dim);margin-top:2px}
.progress-bar{height:6px;background:#252525;border-radius:3px;overflow:hidden;margin-top:8px}
.progress-bar>div{height:100%;background:linear-gradient(90deg,var(--g),var(--gold));transition:width .3s}
.summary-card{background:linear-gradient(135deg,#1a1a1a,#222);border:1px solid var(--gdim);border-radius:14px;padding:16px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.cat-card{background:var(--s1);border:1px solid #222;border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px}
.cat-icon{font-size:22px;width:36px;text-align:center}
.cat-info{flex:1;min-width:0}
.cat-name{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.3px}
.cat-amt{font-family:'Playfair Display',serif;font-size:16px;color:var(--r);font-weight:600}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.photo-thumb{aspect-ratio:1;border-radius:8px;background-size:cover;background-position:center;border:1px solid #333;position:relative;cursor:pointer}
.photo-remove{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);border:none;color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.photo-add{aspect-ratio:1;border-radius:8px;background:var(--s2);border:1.5px dashed #444;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dim);cursor:pointer;gap:3px;font-size:10px}
.photo-add:active{background:var(--s3)}
.gasto-row{background:var(--s1);border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid #222;display:flex;align-items:center;gap:11px;cursor:pointer}
.gasto-row:active{background:var(--s2)}
.gasto-icon{width:38px;height:38px;border-radius:10px;background:#E05C5C22;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.gasto-info{flex:1;min-width:0}
.gasto-desc{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gasto-meta{font-size:10px;color:var(--dim);margin-top:2px}
.gasto-amt{font-family:'Playfair Display',serif;font-size:15px;color:var(--r);font-weight:600;white-space:nowrap}
.lvl-1{color:var(--g);border-color:#5CB87A66}
.lvl-2{color:var(--y);border-color:#E0B84066}
.lvl-3{color:#E58A2C;border-color:#E58A2C66}
.lvl-4{color:var(--r);border-color:#E05C5C66}
.num-inc{font-family:'Playfair Display',serif;font-size:17px;color:var(--gold);letter-spacing:.5px}
.modal-img{max-width:100%;border-radius:10px;margin-bottom:8px}
.full-img{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.full-img img{max-width:100%;max-height:100%;border-radius:8px}
.full-img button{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.1);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer}

.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0f0f0f,#1a1a1a);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:998;padding:30px;text-align:center}
.login-logo{font-family:'Playfair Display',serif;font-size:42px;color:#D4A843;letter-spacing:1.5px;margin-bottom:8px}
.login-sub{font-size:11px;color:#666;letter-spacing:4px;text-transform:uppercase;margin-bottom:60px}
.login-msg{color:#888;font-size:13px;margin-bottom:30px;line-height:1.6;max-width:320px}
.btn-google{background:#fff;color:#222;border:none;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.btn-google:active{transform:scale(.97)}
.cloud-status{position:fixed;top:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;font-size:9px;text-align:center;padding:2px 0;background:#0a0a0a;color:#555;z-index:15;border-bottom:1px solid #1a1a1a;letter-spacing:.5px;text-transform:uppercase}
.cloud-status.syncing{color:#D4A843}
.cloud-status.synced{color:#5CB87A}
.cloud-status.error{color:#E05C5C}
.cloud-status.offline{color:#777}
.fab{position:fixed;bottom:78px;right:16px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#D4A843,#B89235);color:#000;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:90;box-shadow:0 6px 16px rgba(0,0,0,.55),0 0 0 3px rgba(212,168,67,.15);transition:transform .15s}
.fab:hover,.fab:active{transform:scale(1.08)}
.fab svg{stroke:#000;stroke-width:3.2;stroke-linecap:round}
.chip-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.cat-chip{padding:8px 12px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;background:var(--s2);color:#ccc;border:2px solid #333;flex-shrink:0;transition:all .15s;user-select:none}
.cat-chip.on{color:#fff}
.cat-chip:active{transform:scale(.95)}
.quick-btn{background:var(--s1);border:1px solid #333;color:#eee;border-radius:12px;cursor:pointer;transition:all .15s}
.quick-btn:active{transform:scale(.96);background:var(--s2)}
.bit-item{background:var(--s1);border:1px solid #222;border-radius:9px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:flex-start;gap:10px}
.bit-item.done{opacity:.55}
.bit-item.done .bit-titulo{text-decoration:line-through;color:var(--dim)}
.bit-check{width:22px;height:22px;border-radius:6px;border:2px solid #555;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;cursor:pointer;transition:all .15s;margin-top:1px}
.bit-check.done{background:var(--g);border-color:var(--g);color:#000}
.bit-hora{background:var(--gdim);color:var(--gold);padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700;font-family:monospace;flex-shrink:0}
</style>
</head>
<body>
<div class="login-screen" id="login-overlay" style="display:none">
  <div class="login-logo">Rentas</div>
  <div class="login-sub">Gestión Inmobiliaria</div>
  <div class="login-msg">Inicia sesión con tu cuenta de Google para sincronizar tus datos entre todos tus dispositivos.</div>
  <button class="btn-google" onclick="signInGoogle()">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Continuar con Google
  </button>
  <div style="font-size:10px;color:#444;margin-top:40px;max-width:300px;line-height:1.5">Tus datos se guardan en tu cuenta de Firebase. Solo tú tienes acceso.</div>
</div>
<div class="cloud-status" id="cloud-status">Sin sincronización</div>

<div id="app">
  <div id="splash" style="position:fixed;inset:0;background:#0f0f0f;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999">
    <div style="font-family:'Playfair Display',serif;font-size:30px;color:#D4A843;letter-spacing:1px">Rentas</div>
    <div style="font-size:11px;color:#444;margin-top:8px;letter-spacing:3px;text-transform:uppercase">Gestión Inmobiliaria</div>
    <div style="width:44px;height:2px;background:#D4A843;border-radius:2px;margin-top:28px;animation:pu 1s infinite alternate"></div>
    <style>@keyframes pu{from{opacity:.2}to{opacity:1}}
.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0f0f0f,#1a1a1a);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:998;padding:30px;text-align:center}
.login-logo{font-family:'Playfair Display',serif;font-size:42px;color:#D4A843;letter-spacing:1.5px;margin-bottom:8px}

.login-msg{color:#888;font-size:13px;margin-bottom:30px;line-height:1.6;max-width:320px}

function stripPhotos(coll, item) {
  if (PHOTO_COLLS.includes(coll) && item.fotos) {
    const {fotos, ...rest} = item;
    return {...rest, _hasPhotos: fotos.length, _photoDevice: navigator.userAgent.slice(0,50)};
  }
  return item;
}

  try {
    await auth.signInWithPopup(provider);
  } catch (e) {

      try { await auth.signInWithRedirect(provider); } catch(e2) { alert('Error: '+e2.message); }

  }
}

async function initialCloudSync() {
  const uid = currentUser.uid;
  try {
    // Check if cloud has data
    const probe = await fdb.doc(`users/${uid}/data/inquilinos`).get();
    if (!probe.exists || !probe.data()?.items?.length) {
      // First time: upload everything from localStorage
      if (DB.inquilinos && DB.inquilinos.length > 0) {
        await uploadAllToCloud();
        snack('☁️ Datos iniciales subidos a la nube');
      }
    } else {
      await downloadAllFromCloud();
      snack('☁️ Datos descargados de la nube');
    }
  } catch (e) {
    console.error('Initial sync error:', e);
    setCloudStatus('error', '⚠️ Error de sincronización');
  }
}

async function uploadAllToCloud() {
  const uid = currentUser.uid;
  for (const k of SYNC_COLLS) {
    if (!DB[k]) DB[k] = [];
    const items = DB[k].map(item => stripPhotos(k, item));
    await fdb.doc(`users/${uid}/data/${k}`).set({
      items, updated: firebase.firestore.FieldValue.serverTimestamp()
    });
  }
}

async function downloadAllFromCloud() {
  const uid = currentUser.uid;
  for (const k of SYNC_COLLS) {
    try {
      const doc = await fdb.doc(`users/${uid}/data/${k}`).get();
      if (!doc.exists) continue;
      let cloudItems = doc.data().items || [];
      
      if (PHOTO_COLLS.includes(k)) {
        // Preserve local photos
        const localMap = {};
        (DB[k]||[]).forEach(item => { if (item.fotos) localMap[item.id] = item.fotos; });
        cloudItems = cloudItems.map(item => {
          if (localMap[item.id]) return {...item, fotos: localMap[item.id]};
          return {...item, fotos: []};
        });
      }
      DB[k] = cloudItems;
      saveDBLocal(k);
    } catch (e) {
      console.error(`Load ${k}:`, e);
    }
  }
  // Ensure default cartera exists and all items have carteraId after cloud load
  migrateToCarteras();
  updCartBar();
  rerender();
}

function subscribeToCloud() {
  const uid = currentUser.uid;
  cloudUnsubs.forEach(u => u());
  cloudUnsubs = [];
  
  SYNC_COLLS.forEach(k => {
    const unsub = fdb.doc(`users/${uid}/data/${k}`).onSnapshot(doc => {
      if (doc.metadata.hasPendingWrites) return; // local write - skip
      if (!doc.exists) return;
      
      let cloudItems = doc.data().items || [];
      if (PHOTO_COLLS.includes(k)) {
        const localMap = {};
        (DB[k]||[]).forEach(item => { if (item.fotos) localMap[item.id] = item.fotos; });
        cloudItems = cloudItems.map(item => {
          if (localMap[item.id]) return {...item, fotos: localMap[item.id]};
          return {...item, fotos: []};
        });
      }
      DB[k] = cloudItems;
      saveDBLocal(k);
      // Re-run propietarios migration in case cloud data was pre-refactor
      migrateToPropietarios();
      setCloudStatus('synced','☁️ Actualizado · ' + new Date().toLocaleTimeString('es-MX'));
      rerender();
    }, err => {
      console.error('Snapshot error:', err);
      setCloudStatus('error', '⚠️ Error: ' + err.code);
    });
    cloudUnsubs.push(unsub);
  });
}

// Local-only save (was previously called saveDB)
function saveDBLocal(k){
  try{localStorage.setItem("rentas_"+k,JSON.stringify(DB[k]))}
  catch(e){snack("⚠️ Almacenamiento lleno")}
}

function cloudSaveDebounced(k) {
  if (!cloudSyncEnabled || !currentUser) return;
  clearTimeout(saveTimers[k]);
  setCloudStatus('syncing','☁️ Guardando...');
  saveTimers[k] = setTimeout(() => cloudSaveNow(k), 150);
}

async function cloudSaveNow(k) {
  if (!currentUser) return;
  const uid = currentUser.uid;
  try {
    if (!DB[k]) DB[k] = [];
    const items = DB[k].map(item => stripPhotos(k, item));
    await fdb.doc(`users/${uid}/data/${k}`).set({
      items, updated: firebase.firestore.FieldValue.serverTimestamp()
    });
    setCloudStatus('synced','☁️ Guardado · ' + new Date().toLocaleTimeString('es-MX'));
  } catch (e) {
    console.error('Cloud save error:', e);
    setCloudStatus('error', '⚠️ Sin conexión — se guardó local');
  }
}

function loadDB(){
  let firstRun=true;
  ["inquilinos","pagos","servicios","gastos","obras","incidentes","otros_ingresos","inmuebles","inspecciones","recibos_servicios","pagos_servicios","bitacora","carteras","propietarios"].forEach(k=>{
    try{const v=localStorage.getItem("rentas_"+k);if(v){DB[k]=JSON.parse(v);if(k==="inquilinos"&&DB[k].length>0)firstRun=false;}}catch(e){}
  });
  // Migration: rename propiedad -> inmueble in servicios
  DB.servicios.forEach(s=>{
    if(s.propiedad&&!s.inmueble){s.inmueble=s.propiedad;delete s.propiedad;}
  });
  // Migration: ensure default cartera exists (backward compat)
  migrateToCarteras();
  // Migration: propietarios entities + link all data to them
  migrateToPropietarios();
  // Cargar estado del cronograma
  cronoLoad();
  if(firstRun){
    DB.inquilinos=SEED.inquilinos;
    DB.pagos=SEED.pagos.map(p=>({...p,id:uid()}));
    saveDB("inquilinos");saveDB("pagos");
    setTimeout(()=>snack("Cargados 73 inquilinos iniciales"),800);
  }
}
function saveDB(k){
  // Auto-assign carteraId to any new item without one
  const activeId=getActiveCarteraId();
  if(activeId&&Array.isArray(DB[k])&&k!=='carteras'){
    DB[k].forEach(item=>{
      if(item&&typeof item==='object'&&!item.carteraId)item.carteraId=activeId;
    });
  }
  saveDBLocal(k);
  cloudSaveDebounced(k);
}

function getPropietario(id){return DB.propietarios.find(p=>p.id===id);}
function getPropietarioByName(nombre){
  if(!nombre)return null;
  const n=nombre.trim().toUpperCase();
  return DB.propietarios.find(p=>(p.nombre||'').trim().toUpperCase()===n);
}
function getPropietarioInmuebles(propId){
  return DB.inmuebles.filter(i=>i.propietarioId===propId);
}
function getPropietarioInquilinos(propId,soloActivos){
  let list=DB.inquilinos.filter(i=>i.propietarioId===propId);
  if(soloActivos)list=list.filter(i=>i.estado==='activo');
  return list;
}
function migrateToPropietarios(){
  const log=[];
  let changed=false;

  // 0. Normalizar tipo 'cfe' -> 'luz' en servicios existentes
  DB.servicios.forEach(s=>{if(s.tipo==='cfe'){s.tipo='luz';changed=true;}});

  // 1. Create propietario entities from EVERY source (inquilinos + inmuebles)
  const nombresSet=new Set();
  DB.inquilinos.forEach(i=>{if(i.propietario)nombresSet.add(String(i.propietario).trim().toUpperCase());});
  DB.inmuebles.forEach(i=>{if(i.propietario)nombresSet.add(String(i.propietario).trim().toUpperCase());});
  nombresSet.forEach(nUp=>{
    if(!nUp)return;
    const id='prop_'+nUp.toLowerCase().replace(/[^a-z0-9]/g,'_');
    if(!DB.propietarios.find(p=>p.id===id||(p.nombre||'').trim().toUpperCase()===nUp)){
      DB.propietarios.push({
        id,nombre:nUp,contacto:'',telefono:'',correo:'',
        notas:'Migrado desde datos previos',
        fecha_inicio:todayISO(),creado:nowISO()
      });
      changed=true;log.push('Creado propietario: '+nUp);
    }
  });

  // Helper: robust propietario lookup by name (case-insensitive)
  const findPropId=(nombre)=>{
    if(!nombre)return null;
    const nUp=String(nombre).trim().toUpperCase();
    const p=DB.propietarios.find(x=>(x.nombre||'').trim().toUpperCase()===nUp);
    return p?p.id:null;
  };

  // 2. inquilinos: string propietario -> propietarioId
  let inqMig=0;
  DB.inquilinos.forEach(i=>{
    if(i.propietario&&!i.propietarioId){
      const pid=findPropId(i.propietario);
      if(pid){i.propietarioId=pid;changed=true;inqMig++;}
    }
  });
  if(inqMig)log.push('Inquilinos asignados propietarioId: '+inqMig);

  // 3. inmuebles: FIX propietarioId first (from string field OR from inquilinos)
  let inmFixed=0;
  DB.inmuebles.forEach(inm=>{
    if(!inm.propietarioId){
      // Try string field first
      if(inm.propietario){
        const pid=findPropId(inm.propietario);
        if(pid){inm.propietarioId=pid;changed=true;inmFixed++;}
      }
      // Fallback: get from any tenant of this inmueble
      if(!inm.propietarioId){
        const tenant=DB.inquilinos.find(t=>(t.inmueble===inm.nombre||t.inmuebleId===inm.id)&&t.propietarioId);
        if(tenant){inm.propietarioId=tenant.propietarioId;changed=true;inmFixed++;}
      }
    }
    if(!inm.id){
      inm.id='inm_'+(inm.nombre||'').toLowerCase().replace(/[^a-z0-9]/g,'_')+'_'+Math.random().toString(36).slice(2,5);
      changed=true;
    }
  });
  if(inmFixed)log.push('Inmuebles con propietarioId corregido: '+inmFixed);

  // 4. Create MISSING inmueble entities from inquilinos (this was the main bug)
  const inmMap={}; // nombre_upper -> propietarioId
  DB.inquilinos.forEach(i=>{
    if(i.inmueble&&i.propietarioId){
      const key=String(i.inmueble).trim().toUpperCase();
      if(!inmMap[key])inmMap[key]=i.propietarioId;
    }
  });
  let inmCreated=0;
  Object.entries(inmMap).forEach(([nomUp,propId])=>{
    // Check if inmueble exists (case-insensitive)
    let inmObj=DB.inmuebles.find(x=>(x.nombre||'').trim().toUpperCase()===nomUp);
    if(!inmObj){
      // Use original casing from an inquilino
      const originalName=DB.inquilinos.find(i=>String(i.inmueble||'').trim().toUpperCase()===nomUp)?.inmueble||nomUp;
      inmObj={
        id:'inm_'+nomUp.toLowerCase().replace(/[^a-z0-9]/g,'_')+'_'+Math.random().toString(36).slice(2,5),
        nombre:originalName,
        propietarioId:propId,
        direccion:'',cuenta_predial:'',cuenta_agua:'',
        notas:'Migrado automaticamente',creado:nowISO()
      };
      DB.inmuebles.push(inmObj);
      changed=true;inmCreated++;
    }
  });
  if(inmCreated)log.push('Inmuebles creados desde inquilinos: '+inmCreated);

  // 5. Link inquilinos to inmueble entity (inmuebleId)
  let linked=0;
  DB.inquilinos.forEach(i=>{
    if(i.inmueble&&!i.inmuebleId){
      const nomUp=String(i.inmueble).trim().toUpperCase();
      const inm=DB.inmuebles.find(x=>(x.nombre||'').trim().toUpperCase()===nomUp);
      if(inm){i.inmuebleId=inm.id;changed=true;linked++;}
    }
  });
  if(linked)log.push('Inquilinos enlazados a inmueble: '+linked);

  // 6. Otros items (gastos, obras, etc): derive propietarioId from inmueble name
  ['gastos','obras','otros_ingresos','inspecciones','servicios'].forEach(k=>{
    let n=0;
    (DB[k]||[]).forEach(x=>{
      if(x.inmueble&&!x.propietarioId){
        const nomUp=String(x.inmueble).trim().toUpperCase();
        const inm=DB.inmuebles.find(y=>(y.nombre||'').trim().toUpperCase()===nomUp);
        if(inm&&inm.propietarioId){x.propietarioId=inm.propietarioId;changed=true;n++;}
      }
    });
    if(n)log.push(k+' asignados: '+n);
  });

  // 7. incidentes: match by lugar
  let incMig=0;
  DB.incidentes.forEach(x=>{
    if(!x.propietarioId){
      if(x.lugar){
        const lugarLow=x.lugar.toLowerCase();
        const inm=DB.inmuebles.find(y=>lugarLow.includes((y.nombre||'').toLowerCase())||(y.nombre||'').toLowerCase().includes(lugarLow));
        if(inm&&inm.propietarioId){x.propietarioId=inm.propietarioId;changed=true;incMig++;}
      }
      if(!x.propietarioId&&x.inqId){
        const inq=DB.inquilinos.find(y=>y.id===x.inqId);
        if(inq&&inq.propietarioId){x.propietarioId=inq.propietarioId;changed=true;incMig++;}
      }
    }
  });
  if(incMig)log.push('Incidentes: '+incMig);

  if(log.length>0){
    console.log('[Migration] Applied:',log);
  }

  // Save migrated collections locally always
  ['inquilinos','inmuebles','gastos','obras','incidentes','otros_ingresos','inspecciones','servicios','propietarios'].forEach(k=>{
    saveDBLocal(k);
  });
  // If anything changed AND we're logged in, push to cloud so migration persists across devices
  if(changed&&currentUser){
    console.log('[Migration] Pushing to cloud');
    ['inquilinos','inmuebles','gastos','obras','incidentes','otros_ingresos','inspecciones','servicios','propietarios'].forEach(k=>{
      cloudSaveDebounced(k);
    });
  }
  return changed;
}

function fmt(n){return"$"+Number(n||0).toLocaleString("es-MX",{minimumFractionDigits:0})}

function getPago(iid,m,a){return DB.pagos.find(p=>p.iid===iid&&p.mes===m&&p.anio===a&&p.pagado)}
function isPagado(iid,m,a){return!!getPago(iid,m,a)}
function isLate(iid,m,a){
  if(getPago(iid,m,a))return false;
  if(a>HA||(a===HA&&m>HM))return false;
  if(a<HA||(a===HA&&m<HM))return true;
  const t=DB.inquilinos.find(x=>x.id===iid);return HD>=Number(t?.dia||1);
}
function todayISO(){
  const d=new Date();
  // Fecha local (no UTC) — evita que después de las 6pm en México se adelante un día
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// ── Vencimiento de contrato (12 meses desde renovación) ──
// Devuelve {vence:Date, mesesRestantes:number, porVencer:boolean, vencido:boolean} o null
function getContratoEstado(t){
  if(!t||!t.renovacion)return null;
  const ini=new Date(t.renovacion);
  if(isNaN(ini))return null;
  // El contrato cubre 12 meses desde la renovación
  const vence=new Date(ini);vence.setFullYear(vence.getFullYear()+1);
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const msRestantes=vence-hoy;
  const diasRestantes=Math.round(msRestantes/86400000);
  const mesesRestantes=diasRestantes/30.44;
  return{
    vence,
    diasRestantes,
    mesesRestantes,
    vencido:diasRestantes<0,
    porVencer:diasRestantes>=0&&mesesRestantes<=2 // alerta naranja: ≤2 meses
  };
}
function contratoAlertaIcon(t){
  const e=getContratoEstado(t);
  if(!e)return'';
  if(e.vencido)return`<span title="Contrato vencido hace ${Math.abs(e.diasRestantes)} días" style="color:#E05C5C;font-size:12px">⚠️</span>`;
  if(e.porVencer)return`<span title="Contrato por vencer en ${Math.max(0,Math.round(e.mesesRestantes*30.44))} días" style="color:#E8912D;font-size:12px">🔶</span>`;
  return'';
}

// ── Servicios balance & rendimiento por inmueble ──
function getServicioBalance(svcId){
  const recibos=DB.recibos_servicios.filter(r=>r.servicioId===svcId).reduce((s,r)=>s+Number(r.monto||0),0);
  const pagos=DB.pagos_servicios.filter(p=>p.servicioId===svcId).reduce((s,p)=>s+Number(p.monto||0),0);
  return recibos-pagos;
}
function getInmuebleDeudaTotal(inm){
  const svcs=DB.servicios.filter(s=>s.inmueble===inm&&inCartera(s));
  return svcs.reduce((s,sv)=>s+Math.max(0,getServicioBalance(sv.id)),0);
}
function getInmuebleRendimiento(inm,anio){
  anio=anio||HA;
  const iniAnio=new Date(anio,0,1);
  const finAnio=new Date(anio+1,0,1);
  const inqIds=DB.inquilinos.filter(x=>x.inmueble===inm&&inCartera(x)).map(x=>x.id);
  const rentas=DB.pagos.filter(p=>{
    if(!p.pagado||!p.fecha_pago)return false;
    if(!inqIds.includes(p.iid))return false;
    const d=new Date(p.fecha_pago);
    return d>=iniAnio&&d<finAnio;
  }).reduce((s,p)=>s+Number(p.monto||0),0);
  const otros=DB.otros_ingresos.filter(o=>{
    if(o.inmueble!==inm||!inCartera(o))return false;
    const d=new Date(o.fecha||0);
    return d>=iniAnio&&d<finAnio;
  }).reduce((s,o)=>s+Number(o.monto||0),0);
  const gastos=DB.gastos.filter(g=>{
    if(g.inmueble!==inm||!inCartera(g))return false;
    const d=new Date(g.fecha||0);
    return d>=iniAnio&&d<finAnio;
  }).reduce((s,g)=>s+Number(g.monto||0),0);
  // Obras SIN gastoVinculado (las vinculadas ya están en gastos)
  const obrasSueltas=DB.obras.filter(o=>{
    if(o.inmueble!==inm||!inCartera(o))return false;
    if(o.gastoVinculado)return false;
    const d=new Date(o.fecha||0);
    return d>=iniAnio&&d<finAnio;
  }).reduce((s,o)=>s+Number(o.costo||0),0);
  const ingresos=rentas+otros;
  const totalGastos=gastos+obrasSueltas;
  return{ingresos,rentas,otros,gastos:totalGastos,gastosDirectos:gastos,obrasSueltas,neto:ingresos-totalGastos};
}

// ── Image compression ─────────────
async function compressImage(file,maxW=1024,q=0.65){
  return new Promise((resolve)=>{
    const r=new FileReader();
    r.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');
        let w=img.width,h=img.height;
        if(w>maxW){h=h*maxW/w;w=maxW;}
        c.width=w;c.height=h;
        const ctx=c.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',q));
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}

// ── Date range helpers ────────────
function getRange(mode){
  const t=new Date();t.setHours(0,0,0,0);
  if(mode==='hoy')return{ini:t,fin:new Date(t.getTime()+86400000-1),label:'Hoy '+t.toLocaleDateString('es-MX')};
  if(mode==='3dias'){const i=new Date(t.getTime()-2*86400000);return{ini:i,fin:new Date(t.getTime()+86400000-1),label:'Últimos 3 días'};}
  if(mode==='ayer'){const a=new Date(t.getTime()-86400000);return{ini:a,fin:new Date(t.getTime()-1),label:'Ayer '+a.toLocaleDateString('es-MX')};}
  if(mode==='semana'){const d=t.getDay()||7;const ini=new Date(t.getTime()-(d-1)*86400000);return{ini,fin:new Date(t.getTime()+86400000-1),label:'Esta semana'};}
  if(mode==='sem_pas'){const d=t.getDay()||7;const ini=new Date(t.getTime()-(d-1+7)*86400000);const fin=new Date(ini.getTime()+7*86400000-1);return{ini,fin,label:'Semana pasada'};}
  if(mode==='mes')return{ini:new Date(t.getFullYear(),t.getMonth(),1),fin:new Date(t.getFullYear(),t.getMonth()+1,0,23,59,59),label:MF[t.getMonth()]+' '+t.getFullYear()};
  if(mode==='custom'&&rangeStart&&rangeEnd){const i=new Date(rangeStart);const f=new Date(rangeEnd);f.setHours(23,59,59);return{ini:i,fin:f,label:rangeStart+' a '+rangeEnd};}
  return{ini:t,fin:new Date(t.getTime()+86400000-1),label:'Hoy'};
}

function renderDash(){
  // Get pago breakdown by method for propietario
  const getPropData=(propId)=>{
    const act=DB.inquilinos.filter(i=>i.estado==='activo'&&i.propietarioId===propId);
    const inqIds=act.map(i=>i.id);
    const pagosMes=DB.pagos.filter(p=>p.pagado&&p.mes===HM&&p.anio===HA&&inqIds.includes(p.iid));
    let efectivo=0,deposito=0;
    pagosMes.forEach(p=>{
      const m=(p.metodo||'efectivo').toLowerCase();
      if(m==='efectivo')efectivo+=Number(p.monto||0);
      else deposito+=Number(p.monto||0); // transferencia, deposito, cheque -> agrupamos como "depósito"
    });
    const cobrado=efectivo+deposito;
    const totalEsp=act.reduce((s,i)=>s+Number(i.renta||0),0);
    const inqPagados=act.filter(i=>isPagado(i.id,HM,HA));
    const inqVenc=act.filter(i=>isLate(i.id,HM,HA));
    // Vencido (dinero) = suma renta esperada de vencidos
    const montoVencido=inqVenc.reduce((s,i)=>s+Number(i.renta||0),0);
    const pendSinVencer=Math.max(0,totalEsp-cobrado-montoVencido);
    const pctCobrado=totalEsp>0?Math.round(cobrado/totalEsp*100):0;
    const inmCount=[...new Set(act.map(i=>i.inmueble))].filter(Boolean).length;
    return{efectivo,deposito,cobrado,totalEsp,pctCobrado,montoVencido,pendSinVencer,inqCount:act.length,inqPagados:inqPagados.length,inqVenc:inqVenc.length,inmCount};
  };
  // SVG dona chart
  const dona=(data,size=140)=>{
    const cx=size/2,cy=size/2,r=size/2-14,stroke=18;
    const total=Math.max(1,data.efectivo+data.deposito+data.montoVencido+data.pendSinVencer);
    const segs=[
      {v:data.efectivo,c:'#5CB87A',l:'Efectivo'},
      {v:data.deposito,c:'#5B9BD5',l:'Depósito'},
      {v:data.montoVencido,c:'#E05C5C',l:'Vencido'},
      {v:data.pendSinVencer,c:'#555',l:'Por cobrar'}
    ];
    const C=2*Math.PI*r;
    let offset=0;
    let paths='';
    segs.forEach(s=>{
      if(s.v<=0)return;
      const pct=s.v/total;
      const len=C*pct;
      paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${stroke}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" />`;
      offset+=len;
    });
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="display:block;margin:0 auto">
      ${paths}
      <text x="${cx}" y="${cy-3}" text-anchor="middle" fill="#fff" font-size="20" font-weight="700" font-family="Playfair Display,serif">${data.pctCobrado}%</text>

// ─── Detalle de rentas vencidas por propietario ─────
function diasVencido(iid,m,a){
  // Días transcurridos desde el día de pago del mes vencido
  const t=DB.inquilinos.find(x=>x.id===iid);
  if(!t)return 0;
  const dia=Math.min(Number(t.dia||1),28);
  const fVenc=new Date(a,m-1,dia); // fecha en que venció
  const hoy=new Date();hoy.setHours(0,0,0,0);
  return Math.max(0,Math.round((hoy-fVenc)/86400000));
}
function openVencidasDetail(propId){
  const p=getPropietario(propId);if(!p)return;
  const act=DB.inquilinos.filter(i=>i.estado==='activo'&&i.propietarioId===propId&&Number(i.renta||0)>0);
  // Vencidos: recorrer TODOS los meses del año hasta el actual y juntar los no pagados vencidos
  const vencidos=[];
  act.forEach(t=>{
    for(let a=HA;a>=HA-1;a--){
      const mesMax=(a===HA)?HM:12;
      for(let m=1;m<=mesMax;m++){
        if(isLate(t.id,m,a)){
          vencidos.push({t,mes:m,anio:a,dias:diasVencido(t.id,m,a),monto:Number(t.renta||0)});
        }
      }
    }
  });
  // Ordenar por días vencido desc
  vencidos.sort((x,y)=>y.dias-x.dias);

  let body=`<div class="ms" style="max-height:92vh"><div class="mh"></div>

    body+=`<div class="es"><div class="ei">✅</div><div class="et">Sin rentas vencidas</div></div>`;
  }else{
    body+=`<div style="max-height:60vh;overflow-y:auto">`;

      body+=`<div onclick="closeM();openDet('${v.t.id}')" style="background:var(--s1);border-radius:9px;padding:11px 12px;margin-bottom:7px;cursor:pointer;border-left:3px solid ${urgColor}">

          </div>
          <div style="text-align:right;flex-shrink:0">

            <div style="font-size:9px;color:${urgColor};font-weight:600">${v.dias} día${v.dias===1?'':'s'}</div>

    body+=`</div>`;
  }
  body+=`<button class="btn bg bfu" style="margin-top:10px" onclick="exportVencidasExcel('${propId}')">📊 Descargar (Excel)</button>
    <button class="btn bo bfu" style="margin-top:8px" onclick="closeM()">Cerrar</button></div>`;

}
function exportVencidasExcel(propId){
  try{
    const p=getPropietario(propId);
    const act=DB.inquilinos.filter(i=>i.estado==='activo'&&i.propietarioId===propId&&Number(i.renta||0)>0);
    const vencidos=[];
    act.forEach(t=>{
      for(let a=HA;a>=HA-1;a--){
        const mesMax=(a===HA)?HM:12;
        for(let m=1;m<=mesMax;m++){
          if(isLate(t.id,m,a))vencidos.push({t,mes:m,anio:a,dias:diasVencido(t.id,m,a),monto:Number(t.renta||0)});
        }
      }
    });
    vencidos.sort((x,y)=>y.dias-x.dias);
    const header=['NOMBRE','INMUEBLE','INTERIOR','MES VENCIDO','DÍAS VENCIDO','MONTO'];
    const rows=[header,...vencidos.map(v=>[v.t.nombre,v.t.inmueble||'',v.t.interior||'',MF[v.mes-1]+' '+v.anio,v.dias,v.monto])];
    rows.push([]);rows.push(['','','','','TOTAL:',vencidos.reduce((s,v)=>s+v.monto,0)]);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:28},{wch:14},{wch:10},{wch:16},{wch:14},{wch:12}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Vencidas');
    XLSX.writeFile(wb,`rentas_vencidas_${(p?.nombre||'').replace(/\s+/g,'_')}_${todayISO()}.xlsx`);
    snack('✓ Excel descargado');
  }catch(e){console.error(e);snack('Error: '+e.message);}
}

// ─── Propietario detail (dona grande + números) ─────
function openPropietarioDetail(propId){
  const p=getPropietario(propId);if(!p)return;
  const act=DB.inquilinos.filter(i=>i.estado==='activo'&&i.propietarioId===propId);
  const inqIds=act.map(i=>i.id);
  const pagosMes=DB.pagos.filter(pg=>pg.pagado&&pg.mes===HM&&pg.anio===HA&&inqIds.includes(pg.iid));
  let efectivo=0,deposito=0;
  pagosMes.forEach(pg=>{
    const m=(pg.metodo||'efectivo').toLowerCase();
    if(m==='efectivo')efectivo+=Number(pg.monto||0);
    else deposito+=Number(pg.monto||0);
  });
  const cobrado=efectivo+deposito;
  const totalEsp=act.reduce((s,i)=>s+Number(i.renta||0),0);
  const inqVenc=act.filter(i=>isLate(i.id,HM,HA));
  const montoVencido=inqVenc.reduce((s,i)=>s+Number(i.renta||0),0);
  const pendSinVencer=Math.max(0,totalEsp-cobrado-montoVencido);
  const pctCobrado=totalEsp>0?Math.round(cobrado/totalEsp*100):0;
  const pctEfe=totalEsp>0?Math.round(efectivo/totalEsp*100):0;
  const pctDep=totalEsp>0?Math.round(deposito/totalEsp*100):0;
  const pctVenc=totalEsp>0?Math.round(montoVencido/totalEsp*100):0;
  const pctPend=totalEsp>0?Math.round(pendSinVencer/totalEsp*100):0;
  const inmuebles=DB.inmuebles.filter(i=>i.propietarioId===propId);

  // Big dona
  const size=200,cx=size/2,cy=size/2,r=size/2-24,stroke=28;
  const total=Math.max(1,efectivo+deposito+montoVencido+pendSinVencer);
  const segs=[
    {v:efectivo,c:'#5CB87A'},{v:deposito,c:'#5B9BD5'},
    {v:montoVencido,c:'#E05C5C'},{v:pendSinVencer,c:'#555'}
  ];
  const C=2*Math.PI*r;
  let offset=0;let paths='';
  segs.forEach(s=>{
    if(s.v<=0)return;
    const len=C*(s.v/total);
    paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${stroke}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" />`;
    offset+=len;
  });

  modal(`<div class="ms" style="max-height:96vh"><div class="mh"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div><div class="mt2" style="margin:0">👤 ${p.nombre}</div>
      <div style="font-size:11px;color:var(--dim);margin-top:2px">${MF[HM-1]} ${HA} · ${inmuebles.length} propiedades · ${act.length} inquilinos</div></div>
      <button class="btn bo bsm" onclick="closeM();openPropietarioEdit('${propId}')">⚙️</button>
    </div>

    <div style="text-align:center;margin-bottom:16px">
      <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
        ${paths}
        <text x="${cx}" y="${cy-6}" text-anchor="middle" fill="#fff" font-size="34" font-weight="700" font-family="Playfair Display,serif">${pctCobrado}%</text>
        <text x="${cx}" y="${cy+14}" text-anchor="middle" fill="#888" font-size="11">cobrado</text>
      </svg>
    </div>

    <div style="background:var(--s1);border-radius:11px;padding:12px 14px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #1e1e1e">
        <div><span style="color:#5CB87A;font-size:14px">●</span> <span style="font-size:12px">Efectivo</span></div>
        <div style="text-align:right"><div style="color:#5CB87A;font-weight:700">${fmt(efectivo)}</div><div style="font-size:9px;color:var(--dim)">${pctEfe}%</div></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #1e1e1e">
        <div><span style="color:#5B9BD5;font-size:14px">●</span> <span style="font-size:12px">Depósito/Transferencia</span></div>
        <div style="text-align:right"><div style="color:#5B9BD5;font-weight:700">${fmt(deposito)}</div><div style="font-size:9px;color:var(--dim)">${pctDep}%</div></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #1e1e1e">
        <div><span style="color:#E05C5C;font-size:14px">●</span> <span style="font-size:12px">Vencido (rentas atrasadas)</span></div>
        <div style="text-align:right"><div style="color:#E05C5C;font-weight:700">${fmt(montoVencido)}</div><div style="font-size:9px;color:var(--dim)">${pctVenc}% · ${inqVenc.length} inq</div></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0">
        <div><span style="color:#888;font-size:14px">●</span> <span style="font-size:12px">Por cobrar (sin vencer)</span></div>
        <div style="text-align:right"><div style="color:#888;font-weight:700">${fmt(pendSinVencer)}</div><div style="font-size:9px;color:var(--dim)">${pctPend}%</div></div>
      </div>
    </div>

    <div style="background:linear-gradient(135deg,#1a1a1a,#222);border:1px solid #333;border-radius:11px;padding:12px 14px;margin-bottom:12px;text-align:center">
      <div style="font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px">Total esperado</div>
      <div style="font-family:'Playfair Display',serif;font-size:26px;color:var(--gold);margin-top:3px">${fmt(totalEsp)}</div>
    </div>

    <button class="btn bo bfu" onclick="closeM();go('inq');setTimeout(()=>togglePropInq('${propId}'),100)" style="margin-bottom:10px">Ver propiedades e inquilinos →</button>
    <div style="height:16px"></div>
    </div>`);
}

function savePropietario(id){
  const nombre=document.getElementById('pr-nombre').value.trim().toUpperCase();
  if(!nombre){snack('Falta nombre');return;}
  const obj={
    nombre,
    contacto:document.getElementById('pr-contacto').value.trim(),
    telefono:document.getElementById('pr-tel').value.trim(),
    correo:document.getElementById('pr-correo').value.trim(),
    fecha_inicio:document.getElementById('pr-fecha').value,
    notas:document.getElementById('pr-notas').value.trim()
  };
  if(id){Object.assign(getPropietario(id),obj);}
  else{
    const newId='prop_'+nombre.toLowerCase().replace(/[^a-z0-9]/g,'_')+'_'+uid().slice(0,4);
    DB.propietarios.push({id:newId,...obj,creado:nowISO()});
  }
  saveDB('propietarios');closeM();snack('Propietario guardado ✓');rerender();
}

function delPropietario(id){
  const p=getPropietario(id);if(!p)return;
  const inms=DB.inmuebles.filter(x=>x.propietarioId===id).length;
  const inqs=DB.inquilinos.filter(x=>x.propietarioId===id).length;
  if(inms>0||inqs>0){
    if(!confirm(`⚠️ ${p.nombre} tiene ${inms} propiedades y ${inqs} inquilinos.\n\nAl eliminar el propietario, TODOS sus datos (inmuebles, inquilinos, pagos, gastos, obras, servicios, etc.) SE BORRARÁN y NO se puede deshacer.\n\n¿Estás seguro?`))return;
    if(!confirm(`Confirmación final: borrar propietario ${p.nombre} y TODOS sus datos. ¿Proceder?`))return;
    // Delete cascaded
    ['inquilinos','inmuebles','gastos','obras','incidentes','otros_ingresos','inspecciones','servicios'].forEach(k=>{
      DB[k]=DB[k].filter(x=>x.propietarioId!==id);
      saveDB(k);
    });
    // Also cleanup pagos of deleted inquilinos and recibos/pagos_servicios of deleted servicios
    const validInqIds=new Set(DB.inquilinos.map(i=>i.id));
    DB.pagos=DB.pagos.filter(p=>validInqIds.has(p.iid));
    const validSvcIds=new Set(DB.servicios.map(s=>s.id));
    DB.recibos_servicios=DB.recibos_servicios.filter(r=>validSvcIds.has(r.servicioId));
    DB.pagos_servicios=DB.pagos_servicios.filter(p=>validSvcIds.has(p.servicioId));
    saveDB('pagos');saveDB('recibos_servicios');saveDB('pagos_servicios');
  }else if(!confirm(`¿Eliminar propietario "${p.nombre}" (sin datos)?`))return;
  DB.propietarios=DB.propietarios.filter(x=>x.id!==id);
  saveDB('propietarios');closeM();snack('Propietario eliminado');rerender();
}

  const matchProp=(item)=>!propSel||item.propietarioId===propSel.id;

      <div style="display:flex;align-items:center;gap:10px">

        <div style="flex:1"><div style="font-weight:700;font-size:13px">Matrix de soluciones</div>
        <div style="font-size:10px;color:var(--dim);margin-top:2px">Procedimientos de mantenimiento estándar para incidentes comunes</div></div>
      </div>
    </button>

      const horaStr=f.fecha.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
      if(f.tipo==='pago'){
        const t=DB.inquilinos.find(i=>i.id===f.item.iid);
        html+=`<div onclick="openDet('${f.item.iid}')" style="background:var(--s1);border:1px solid #222;border-radius:9px;padding:10px 12px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
          <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">🏠 ${t?.nombre||'?'}${f.item.adelantado?' ✨':''}</div>
          <div style="font-size:10px;color:var(--dim);margin-top:2px">${dateStr} ${horaStr} · ${t?.inmueble||''} · renta ${MF[f.item.mes-1]} · ${f.item.destino||'—'}</div></div>
          <div style="color:var(--g);font-weight:700">+${fmt(f.item.monto)}</div></div>`;
      }else if(f.tipo==='otro'){

        html+=`<div onclick="openAddOtroIngreso('${f.item.id}')" style="background:var(--s1);border:1px solid #222;border-radius:9px;padding:10px 12px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
          <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">${cat.i} ${f.item.concepto}</div>
          <div style="font-size:10px;color:var(--dim);margin-top:2px">${dateStr} · ${f.item.inmueble||'—'}</div></div>
          <div style="color:var(--g);font-weight:700">+${fmt(f.item.monto)}</div></div>`;
      }else{
        const cat=CATS_GASTO[f.item.categoria]||CATS_GASTO.otros;
        html+=`<div onclick="openAddGasto('${f.item.id}')" style="background:var(--s1);border:1px solid #222;border-radius:9px;padding:10px 12px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
          <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">${cat.i} ${f.item.descripcion}</div>
          <div style="font-size:10px;color:var(--dim);margin-top:2px">${dateStr} · ${f.item.inmueble||'—'} · ${cat.n}</div></div>
          <div style="color:var(--r);font-weight:700">−${fmt(f.item.monto)}</div></div>`;
      }
    });
    if(movs.length>80)html+=`<div style="text-align:center;padding:10px;color:var(--dim);font-size:11px">+ ${movs.length-80} más (usa Excel para ver todo)</div>`;
  }

  document.getElementById("v-con").innerHTML=html;
  renderCrono();
}

// ── Lista Inquilinaria ────────────
function renderListaInq(){
  let chips=`<div class="cr">`;
  // 2 meses futuros (para pre-pagos) + actual + 4 anteriores
  for(let i=2;i>=-4;i--){
    const d=new Date(HA,HM-1+i,1);const m=d.getMonth()+1,a=d.getFullYear();
    const sel=(m===curMes&&a===curAnio);
    const isFut=(a>HA||(a===HA&&m>HM));
    chips+=`<span class="chip${sel?' on':''}" onclick="curMes=${m};curAnio=${a};renderCon()" style="${isFut?'border-style:dashed':''}">${isFut?'→ ':''}${MF[m-1]} ${a}</span>`;
  }
  chips+=`</div>`;
  // Filtro propietario
  chips+=`<div class="cr">
    <span class="chip${propFilter==='todos'?' on':''}" onclick="propFilter='todos';renderCon()">👥 Todos</span>
    <span class="chip${propFilter==='IRMA'?' on':''}" onclick="propFilter='IRMA';renderCon()">👩 Irma</span>
    <span class="chip${propFilter==='ANTONIO'?' on':''}" onclick="propFilter='ANTONIO';renderCon()">👨 Antonio</span>
    </div>`;
  let act=DB.inquilinos.filter(i=>i.estado==="activo");
  if(propFilter!=='todos')act=act.filter(i=>i.propietario===propFilter);
  const grupos={};
  act.forEach(i=>{if(!grupos[i.inmueble])grupos[i.inmueble]=[];grupos[i.inmueble].push(i);});
  Object.values(grupos).forEach(g=>g.sort((a,b)=>(a.dia||0)-(b.dia||0)||a.nombre.localeCompare(b.nombre)));
  const totalEsp=act.reduce((s,i)=>s+Number(i.renta),0);
  const totalCob=act.filter(i=>isPagado(i.id,curMes,curAnio)).reduce((s,i)=>{const p=getPago(i.id,curMes,curAnio);return s+Number(p?.monto||i.renta);},0);
  const nPag=act.filter(i=>isPagado(i.id,curMes,curAnio)).length;
  const nVenc=act.filter(i=>isLate(i.id,curMes,curAnio)).length;
  let html=chips;
  html+=`<div class="summary-card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div><div style="font-size:10px;color:var(--dim);text-transform:uppercase">Cobrado ${MF[curMes-1]} ${curAnio}</div>
      <div style="font-family:'Playfair Display',serif;font-size:26px;color:var(--g);margin-top:3px">${fmt(totalCob)}</div></div>
      <button class="btn bo bsm" onclick="exportExcelMes()">📥 Excel</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;font-size:11px">
      <div><div style="color:var(--dim)">Pagados</div><div style="color:var(--g);font-weight:700;font-size:15px">${nPag}/${act.length}</div></div>
      <div><div style="color:var(--dim)">Vencidos</div><div style="color:var(--r);font-weight:700;font-size:15px">${nVenc}</div></div>
      <div><div style="color:var(--dim)">Por cobrar</div><div style="color:var(--gold);font-weight:700;font-size:15px">${fmt(totalEsp-totalCob)}</div></div>
    </div>
    <div class="progress-bar" style="margin-top:12px"><div style="width:${totalEsp>0?Math.round(totalCob/totalEsp*100):0}%"></div></div>
  </div>`;
  Object.keys(grupos).sort().forEach(inm=>{
    const items=grupos[inm];const totG=items.reduce((s,i)=>s+Number(i.renta),0);
    const cobG=items.filter(i=>isPagado(i.id,curMes,curAnio)).reduce((s,i)=>{const p=getPago(i.id,curMes,curAnio);return s+Number(p?.monto||i.renta);},0);
    const nPagG=items.filter(i=>isPagado(i.id,curMes,curAnio)).length;
    const open=expandedInm[inm]!==false;
    html+=`<div class="inm-group"><div class="inm-hd" onclick="toggleInm('${inm}')">
      <div class="inm-hd-l"><span class="inm-arrow ${open?'open':''}">▶</span>
      <div><div class="inm-nom">${inm}${items[0]?.propietario?` <span style="font-size:9px;color:var(--dim);font-weight:400;letter-spacing:1px">${items[0].propietario}</span>`:''}</div><div class="inm-meta">${nPagG}/${items.length} pagados · ${fmt(cobG)} de ${fmt(totG)}</div></div></div>
      <button class="btn bo bsm" onclick="event.stopPropagation();openInmuebleEdit('${inm.replace(/'/g,"\\'")}')">⚙️</button></div>
      <div class="inm-body ${open?'open':''}">`;
    items.forEach(t=>{
      const paid=isPagado(t.id,curMes,curAnio);const late=isLate(t.id,curMes,curAnio);
      const pago=getPago(t.id,curMes,curAnio);
      const ts=pago?.fecha_pago?new Date(pago.fecha_pago).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      html+=`<div class="row-inq ${paid?'paid':''} ${late?'late':''}" onclick="confirmTogglePago('${t.id}',${curMes},${curAnio})">
        <div class="chkbox ${paid?'on':''} ${late?'late':''}"></div>
        <div class="inq-dia">${t.dia||'—'}</div>
        <div class="inq-info"><div class="inq-nom">${t.nombre}${t.interior?' <span style="color:var(--dim);font-weight:400">· '+t.interior+'</span>':''}</div>
        <div class="inq-sub">${t.servicios||t.destino||t.estatus||''}</div></div>
        <div><div class="inq-monto">${fmt(t.renta)}</div>${ts?`<div class="inq-tstamp">${pago?.adelantado?'✨':'✓'} ${ts}${pago?.destino?' · '+pago.destino:''}</div>`:''}</div></div>`;
    });
    html+=`</div></div>`;
  });
  if(act.length===0)html+=`<div class="es"><div class="ei">📋</div><div class="et">Sin inquilinos activos</div></div>`;
  document.getElementById("con-content").innerHTML=html;
}
function toggleInm(inm){expandedInm[inm]=expandedInm[inm]===false?true:false;renderListaInq();}

// ─── FICHA COMPLETA DEL INMUEBLE ────────

  const pctMes=totalRenta>0?Math.round(cobrado/totalRenta*100):0;
  // Rendimiento anual
  const rend=getInmuebleRendimiento(inm,HA);
  const rColor=rend.neto>=0?'#5CB87A':'#E05C5C';

  const svcs=DB.servicios.filter(s=>s.inmueble===inm&&inCartera(s));

  const incActivos=incidentesInm.filter(x=>!x.resuelto);

  // Otros ingresos

  let html=`<div class="ms" style="max-height:96vh"><div class="mh"></div>

      <div>
        <div class="mt2" style="margin:0">🏢 ${inm}</div>

      </div>

    </div>

    <div class="summary-card" style="margin-bottom:12px">
      <div style="font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px">Cobrado ${MF[HM-1]} ${HA}</div>
      <div style="font-family:'Playfair Display',serif;font-size:26px;color:var(--g);margin-top:3px">${fmt(cobrado)}</div>
      <div style="font-size:11px;color:var(--dim)">de ${fmt(totalRenta)} esperados · ${pctMes}%</div>
      <div class="progress-bar"><div style="width:${pctMes}%"></div></div>
    </div>

    <div style="background:linear-gradient(135deg,#1a1a1a,#222);border:2px solid ${rColor};border-radius:12px;padding:14px;margin-bottom:14px">
      <div style="font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;text-align:center">Rendimiento ${HA} (YTD)</div>
      <div style="font-family:'Playfair Display',serif;font-size:30px;color:${rColor};text-align:center;margin:4px 0">${fmt(rend.neto)}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;text-align:center">
        <div style="background:#5CB87A11;padding:8px;border-radius:8px">
          <div style="font-size:9px;color:var(--g)">INGRESOS</div>
          <div style="font-weight:700;color:var(--g);font-size:14px">${fmt(rend.ingresos)}</div>

function saveInmuebleById(id){
  const nombre=document.getElementById('im-nom').value.trim();
  const propId=document.getElementById('im-prop').value;
  if(!nombre){snack('Falta nombre');return;}
  if(!propId){snack('Selecciona propietario');return;}
  const obj={
    nombre,propietarioId:propId,
    direccion:document.getElementById('im-dir').value.trim(),
    zona:document.getElementById('im-zona').value,
    total_depas:Number(document.getElementById('im-total').value)||0,
    cuenta_predial:document.getElementById('im-predial').value.trim(),
    cuenta_agua:document.getElementById('im-agua').value.trim(),
    notas:document.getElementById('im-notas').value.trim()
  };
  let inm;
  if(id){
    inm=DB.inmuebles.find(x=>x.id===id);
    const oldNombre=inm.nombre;
    Object.assign(inm,obj);
    // Cascade: si cambió nombre, actualizar inquilinos que tenían el string viejo
    if(oldNombre!==nombre){
      DB.inquilinos.forEach(t=>{if(t.inmueble===oldNombre)t.inmueble=nombre;});
    }
    // Propietario cascada: actualizar todos los inquilinos e items relacionados
    DB.inquilinos.forEach(t=>{
      if(t.inmuebleId===id||t.inmueble===nombre){
        t.inmuebleId=id;t.propietarioId=propId;
        const pObj=getPropietario(propId);if(pObj)t.propietario=pObj.nombre;
      }
    });
    ['gastos','obras','otros_ingresos','inspecciones','servicios'].forEach(k=>{
      DB[k].forEach(x=>{if(x.inmueble===nombre||x.inmueble===oldNombre){x.inmueble=nombre;x.propietarioId=propId;}});
    });
    saveDB('inquilinos');saveDB('gastos');saveDB('obras');saveDB('otros_ingresos');saveDB('inspecciones');saveDB('servicios');
  }else{
    const newId='inm_'+nombre.toLowerCase().replace(/[^a-z0-9]/g,'_')+'_'+uid().slice(0,4);
    DB.inmuebles.push({id:newId,...obj,creado:nowISO()});
  }
  saveDB('inmuebles');
  closeM();snack(id?'Propiedad actualizada ✓':'Propiedad creada ✓');
  rerender();
}

function delInmuebleById(id){
  const inm=DB.inmuebles.find(x=>x.id===id);if(!inm)return;
  const nInq=DB.inquilinos.filter(t=>t.inmuebleId===id||t.inmueble===inm.nombre).length;
  if(nInq>0){
    if(!confirm(`⚠️ ${inm.nombre} tiene ${nInq} inquilinos. Al borrar la propiedad, esos inquilinos quedan huérfanos (sin inmueble asociado) pero NO se eliminan.\n\n¿Continuar?`))return;
  }else{
    if(!confirm(`¿Eliminar propiedad "${inm.nombre}"?`))return;
  }
  DB.inmuebles=DB.inmuebles.filter(x=>x.id!==id);
  saveDB('inmuebles');closeM();snack('Propiedad eliminada');rerender();
}

function renderHistorial(){
  let chips=`<div class="cr">`;
  for(let i=0;i<8;i++){
    const d=new Date(HA,HM-1-i,1);const m=d.getMonth()+1,a=d.getFullYear();

    chips+=`<span class="chip${sel?' on':''}" onclick="curMes=${m};curAnio=${a};renderCon()">${MN[m-1]} ${a}</span>`;
  }
  chips+=`</div>`;
  const ps=DB.pagos.filter(p=>p.mes===curMes&&p.anio===curAnio&&p.pagado);
  const sorted=[...ps].sort((a,b)=>new Date(b.fecha_pago||0)-new Date(a.fecha_pago||0));
  const total=ps.reduce((s,p)=>s+Number(p.monto),0);
  let html=chips;
  html+=`<div class="sg"><div class="sc"><div class="sl">Total cobrado</div><div class="sv g">${fmt(total)}</div></div>
    <div class="sc"><div class="sl">Registros</div><div class="sv">${ps.length}</div></div></div>`;

    const t=DB.inquilinos.find(i=>i.id===p.iid);

  document.getElementById("con-content").innerHTML=html;

      </div>

function selectPropGasto(propId){
  document.getElementById('g-propId').value=propId;
  // Update UI
  document.querySelectorAll('#prop-chips-g .cat-chip').forEach(el=>{
    if(el.dataset.prop===propId){el.classList.add('on');el.style.borderColor='var(--gold)';el.style.background='var(--gdim)';}
    else{el.classList.remove('on');el.style.borderColor='#333';el.style.background='';}
  });
  // Rebuild inmuebles chips
  const inmChips=document.getElementById('inm-chips-g');
  const inmuebles=DB.inmuebles.filter(x=>x.propietarioId===propId);
  document.getElementById('g-inm').value='';
  if(inmuebles.length===0){
    inmChips.innerHTML='<div style="font-size:11px;color:var(--dim);padding:8px">Este propietario no tiene propiedades registradas</div>';
  }else{
    inmChips.innerHTML=inmuebles.map(im=>`<div class="cat-chip" data-inm="${im.nombre.replace(/"/g,'&quot;')}" onclick="selectInmGasto('${im.nombre.replace(/'/g,"\\'")}')" style="">🏢 ${im.nombre}</div>`).join('');
  }
}

function selectInmGasto(inm){
  document.getElementById('g-inm').value=inm;
  document.querySelectorAll('#inm-chips-g .cat-chip').forEach(el=>{
    if(el.dataset.inm===inm){el.classList.add('on');el.style.borderColor='var(--gold)';el.style.background='var(--gdim)';}
    else{el.classList.remove('on');el.style.borderColor='#333';el.style.background='';}
  });
  const monto=document.getElementById('g-monto');if(monto&&!monto.value)monto.focus();
}

function saveGasto(id){
  const cat=document.getElementById('g-cat').value;
  const monto=document.getElementById('g-monto').value;
  const desc=document.getElementById('g-desc').value.trim();
  const fecha=document.getElementById('g-fecha').value;
  const propId=document.getElementById('g-propId').value;
  const inm=document.getElementById('g-inm').value.trim();
  if(!monto||!desc||!fecha){snack('Completa monto, descripción y fecha');return;}
  if(!propId){snack('Selecciona propietario');return;}
  if(!inm){snack('Selecciona inmueble');return;}
  // Parse local date properly
  const [yy,mm,dd]=fecha.split('-').map(Number);
  const now=new Date();
  const fechaLocal=new Date(yy,mm-1,dd,now.getHours(),now.getMinutes(),now.getSeconds());
  const obj={
    categoria:cat,monto:Number(monto),descripcion:desc,
    fecha:fechaLocal.toISOString(),
    propietarioId:propId,inmueble:inm,
    notas:document.getElementById('g-notas').value.trim()
  };
  if(id){Object.assign(DB.gastos.find(x=>x.id===id),obj);}
  else{DB.gastos.push({id:uid(),...obj,creado:nowISO()});}
  saveDB('gastos');closeM();snack(id?'Gasto actualizado ✓':'Gasto registrado ✓');
  rerender();
}

function delGasto(id){
  if(!confirm('¿Eliminar este gasto?'))return;
  DB.gastos=DB.gastos.filter(g=>g.id!==id);
  saveDB('gastos');closeM();snack('Eliminado');renderCon();
}

// ── RESUMEN (Ingresos - Gastos) ────────────
const CATS_OTROS_ING={multa:{n:'Multa',i:'⚠️'},servicio:{n:'Servicio',i:'💡'},deposito:{n:'Depósito garantía',i:'🔐'},comision:{n:'Comisión',i:'💼'},otro:{n:'Otro',i:'💵'}};

function renderResumen(){
  const r=getRange(rangeMode);
  let chips=`<div class="cr">
    <span class="chip${rangeMode==='hoy'?' on':''}" onclick="rangeMode='hoy';renderCon()">Hoy</span>
    <span class="chip${rangeMode==='ayer'?' on':''}" onclick="rangeMode='ayer';renderCon()">Ayer</span>
    <span class="chip${rangeMode==='semana'?' on':''}" onclick="rangeMode='semana';renderCon()">Esta semana</span>
    <span class="chip${rangeMode==='sem_pas'?' on':''}" onclick="rangeMode='sem_pas';renderCon()">Sem. pasada</span>
    <span class="chip${rangeMode==='mes'?' on':''}" onclick="rangeMode='mes';renderCon()">Este mes</span>
    <span class="chip${rangeMode==='custom'?' on':''}" onclick="openCustomRange()">📅 Personalizado</span></div>`;
  const pagos=DB.pagos.filter(p=>{if(!inCartera(p))return false;if(!p.fecha_pago||!p.pagado)return false;const d=new Date(p.fecha_pago);if(isNaN(d))return false;return d>=r.ini&&d<=r.fin;});
  const otros=DB.otros_ingresos.filter(o=>{if(!inCartera(o))return false;if(!o.fecha)return false;const d=new Date(o.fecha);if(isNaN(d))return false;return d>=r.ini&&d<=r.fin;});
  const ingRenta=pagos.reduce((s,p)=>s+Number(p.monto),0);
  const ingOtros=otros.reduce((s,o)=>s+Number(o.monto),0);
  const ingresos=ingRenta+ingOtros;
  const gs=DB.gastos.filter(g=>{if(!inCartera(g))return false;if(!g.fecha)return false;const d=new Date(g.fecha);if(isNaN(d))return false;return d>=r.ini&&d<=r.fin;});
  const gastos=gs.reduce((s,g)=>s+Number(g.monto),0);
  const neto=ingresos-gastos;
  const porCat={};
  gs.forEach(g=>{porCat[g.categoria]=(porCat[g.categoria]||0)+Number(g.monto)});
  let html=chips;
  html+=`<div class="summary-card" style="text-align:center">
    <div style="font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px">${r.label}</div>
    <div style="font-family:'Playfair Display',serif;font-size:32px;color:${neto>=0?'var(--g)':'var(--r)'};margin-top:6px">${fmt(neto)}</div>
    <div style="font-size:11px;color:var(--dim);margin-top:2px">Neto del periodo</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">
      <div style="background:#5CB87A11;padding:10px;border-radius:10px;border:1px solid #5CB87A33">
        <div style="font-size:10px;color:var(--g)">+ INGRESOS</div>
        <div style="font-family:'Playfair Display',serif;font-size:18px;color:var(--g);font-weight:700">${fmt(ingresos)}</div>
        <div style="font-size:10px;color:var(--dim)">${pagos.length} rentas${otros.length?` + ${otros.length} otros`:''}</div></div>
      <div style="background:#E05C5C11;padding:10px;border-radius:10px;border:1px solid #E05C5C33">
        <div style="font-size:10px;color:var(--r)">− GASTOS</div>
        <div style="font-family:'Playfair Display',serif;font-size:18px;color:var(--r);font-weight:700">${fmt(gastos)}</div>
        <div style="font-size:10px;color:var(--dim)">${gs.length} gastos</div></div>
    </div></div>`;
  html+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
    <button class="btn bs" onclick="openAddOtroIngreso()">💰 + Otro ingreso</button>
    <button class="btn bd" onclick="openAddGasto()">💸 + Gasto</button>
  </div>`;
  html+=`<div style="display:flex;gap:8px;margin-bottom:14px">
    <button class="btn bo" style="flex:1" onclick="exportExcelMovs()">📊 Excel</button>
    <button class="btn bo" style="flex:1" onclick="openPDFConfig()">📄 PDF</button>
  </div>`;
  if(Object.keys(porCat).length>0){
    html+=`<div class="st-sm">Gastos por categoría</div>`;
    Object.entries(porCat).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{
      const c=CATS_GASTO[k]||CATS_GASTO.otros;
      const pct=gastos>0?Math.round(v/gastos*100):0;
      html+=`<div style="background:var(--s1);padding:11px 13px;border-radius:10px;margin-bottom:7px;border:1px solid #222">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="display:flex;gap:8px;align-items:center"><span style="font-size:18px">${c.i}</span><span style="font-size:13px;font-weight:600">${c.n}</span></div>
          <div style="text-align:right"><div style="font-family:'Playfair Display',serif;color:var(--r);font-weight:600">${fmt(v)}</div><div style="font-size:10px;color:var(--dim)">${pct}%</div></div>
        </div>
        <div style="height:4px;background:#252525;border-radius:2px;margin-top:7px;overflow:hidden"><div style="height:100%;background:${c.c};width:${pct}%"></div></div></div>`;
    });
  }
  if(otros.length>0){
    html+=`<div class="st-sm">Otros ingresos (${otros.length})</div><div class="card" style="padding:0 14px">`;
    otros.sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).forEach(o=>{
      const c=CATS_OTROS_ING[o.categoria]||CATS_OTROS_ING.otro;
      const f=new Date(o.fecha).toLocaleDateString('es-MX',{day:'2-digit',month:'short'});
      html+=`<div class="pr" onclick="openAddOtroIngreso('${o.id}')" style="cursor:pointer"><div class="pi"><div class="pn">${c.i} ${o.concepto}</div><div class="pd">${c.n}${o.inmueble?' · '+o.inmueble:''} · ${f}${o.destino?' · '+o.destino:''}</div></div><div class="pa">${fmt(o.monto)}</div></div>`;
    });
    html+=`</div>`;
  }
  if(pagos.length>0){
    html+=`<div class="st-sm">Ingresos de renta</div><div class="card" style="padding:0 14px">`;
    pagos.sort((a,b)=>new Date(b.fecha_pago)-new Date(a.fecha_pago)).slice(0,15).forEach(p=>{
      const t=DB.inquilinos.find(i=>i.id===p.iid);
      const f=new Date(p.fecha_pago).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
      html+=`<div class="pr"><div class="pi"><div class="pn">${t?.nombre||'?'}</div><div class="pd">${t?.inmueble||''} · ${f}${p.destino?' · '+p.destino:''}</div></div><div class="pa">${fmt(p.monto)}</div></div>`;
    });
    if(pagos.length>15)html+=`<div style="text-align:center;padding:10px;color:var(--dim);font-size:11px">+ ${pagos.length-15} más...</div>`;
    html+=`</div>`;
  }
  document.getElementById("con-content").innerHTML=html;
}

function saveOtroIngreso(id){

    destino:document.getElementById('oi-dest').value.trim(),

  };

  saveDB('otros_ingresos');closeM();snack(id?'Ingreso actualizado ✓':'Ingreso registrado ✓');renderCon();

function delOtroIngreso(id){
  if(!confirm('¿Eliminar este ingreso?'))return;
  DB.otros_ingresos=DB.otros_ingresos.filter(o=>o.id!==id);
  saveDB('otros_ingresos');closeM();snack('Eliminado');renderCon();
}

// ─── EXPORTS ─────────────────────────────────────
function exportExcelMes(){
  try{
    console.log('[Excel] Iniciando export. curMes=',curMes,'curAnio=',curAnio,'total DB.inquilinos=',DB.inquilinos.length);
    if(typeof XLSX==='undefined'){snack('⚠️ Librería XLSX no cargada. Refresca la app.');return;}
    const act=DB.inquilinos.filter(i=>i.estado==='activo'&&inCartera(i));
    console.log('[Excel] Inquilinos activos en cartera:',act.length);
    if(act.length===0){
      const estados=[...new Set(DB.inquilinos.map(i=>i.estado||'(sin estado)'))];
      snack('⚠️ Sin activos. Estados encontrados: '+estados.join(', '));
      return;
    }
    // Función segura para convertir valores
    const S=v=>v==null?'':String(v);
    const N=v=>{const n=Number(v);return isNaN(n)?0:n;};
    const rows=[['Pagado','FECHA','LUGAR','NOMBRE','INT','CANTIDAD','DESTINO','SERVICIOS','ESTATUS','RENOVACIÓN','COMENTARIOS','MEDIDOR DE LUZ','CONTRATO VIGENTE','FECHA DE PAGO','MÉTODO','PROPIETARIO']];
    const grupos={};
    act.forEach(i=>{
      const inm=S(i.inmueble)||'(sin inmueble)';
      if(!grupos[inm])grupos[inm]=[];
      grupos[inm].push(i);
    });
    console.log('[Excel] Inmuebles agrupados:',Object.keys(grupos));
    let rowCount=0;
    Object.keys(grupos).sort().forEach(inm=>{
      grupos[inm].sort((a,b)=>(N(a.dia))-(N(b.dia)));
      grupos[inm].forEach(i=>{
        const p=getPago(i.id,curMes,curAnio);
        const diaN=N(i.dia);
        const dia=diaN===30?0.3:diaN;
        const fp=p?.fecha_pago?new Date(p.fecha_pago).toLocaleString('es-MX'):'';
        const dest=S(p?.destino||i.destino);
        rows.push([
          p?true:false,
          dia,
          S(i.inmueble),
          S(i.nombre),
          S(i.interior),
          N(p?.monto||i.renta),
          dest,
          S(i.servicios),
          S(i.estatus)||'Al corriente',
          S(i.renovacion),
          S(i.comentarios),
          S(i.medidor),
          S(i.contrato_vigente),
          fp,
          S(p?.metodo),
          S(i.propietario)
        ]);
        rowCount++;
      });
    });
    console.log('[Excel] Filas de datos generadas:',rowCount);
    if(rowCount===0){snack('⚠️ 0 filas generadas — bug reportar');return;}
    rows.push([]);
    const totalCob=act.filter(i=>isPagado(i.id,curMes,curAnio)).reduce((s,i)=>{const p=getPago(i.id,curMes,curAnio);return s+N(p?.monto);},0);
    const totalEsp=act.reduce((s,i)=>s+N(i.renta),0);
    rows.push(['','','','TOTAL ESPERADO:','',totalEsp]);
    rows.push(['','','','TOTAL COBRADO:','',totalCob]);
    rows.push(['','','','PENDIENTE:','',totalEsp-totalCob]);
    console.log('[Excel] Total filas incluyendo totales:',rows.length);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{w:8},{w:8},{w:18},{w:30},{w:8},{w:12},{w:10},{w:18},{w:14},{w:14},{w:25},{w:10},{w:14},{w:20},{w:12},{w:12}];
    const wb=XLSX.utils.book_new();
    // Sheet name: max 31 chars, no special chars
    let sheetName=(MF[curMes-1]||'MES').toUpperCase()+' '+curAnio;
    sheetName=sheetName.replace(/[\\\/\?\*\[\]:]/g,'').slice(0,31);
    XLSX.utils.book_append_sheet(wb,ws,sheetName);
    const filename=`lista_inquilinaria_${MN[curMes-1]||'mes'}_${curAnio}.xlsx`;
    XLSX.writeFile(wb,filename);
    console.log('[Excel] Archivo generado:',filename);
    snack(`📥 Excel: ${rowCount} inquilinos en ${Object.keys(grupos).length} inmuebles`);
  }catch(err){
    console.error('[Excel] ERROR:',err);
    snack('⚠️ Error: '+err.message);
    alert('Error al generar Excel:\n\n'+err.message+'\n\nAbre la consola del navegador (F12) para más detalles.');
  }
}

function exportExcelMovs(){
  const r=getRange(rangeMode);
  const pagosFiltered=DB.pagos.filter(p=>{if(!inCartera(p))return false;if(!p.fecha_pago||!p.pagado)return false;const d=new Date(p.fecha_pago);return d>=r.ini&&d<=r.fin;});
  const gastosFiltered=DB.gastos.filter(g=>{if(!inCartera(g))return false;const d=new Date(g.fecha);return d>=r.ini&&d<=r.fin;});
  if(pagosFiltered.length===0&&gastosFiltered.length===0){
    snack(`⚠️ Sin movimientos en ${r.label}. Cambia el periodo.`);
    return;
  }
  const wb=XLSX.utils.book_new();
  // Sheet 1: Ingresos
  const ingRows=[['FECHA','HORA','INQUILINO','INMUEBLE','INTERIOR','MES PAGADO','MONTO','DESTINO','MÉTODO']];
  pagosFiltered.sort((a,b)=>new Date(a.fecha_pago)-new Date(b.fecha_pago)).forEach(p=>{
    const t=DB.inquilinos.find(i=>i.id===p.iid);const d=new Date(p.fecha_pago);
    ingRows.push([d.toLocaleDateString('es-MX'),d.toLocaleTimeString('es-MX'),t?.nombre||'',t?.inmueble||'',t?.interior||'',MF[p.mes-1]+' '+p.anio,p.monto,p.destino||'',p.metodo||'efectivo']);
  });
  const totalIng=pagosFiltered.reduce((s,p)=>s+Number(p.monto),0);
  ingRows.push([]);ingRows.push(['','','','','','TOTAL:',totalIng]);
  const ws1=XLSX.utils.aoa_to_sheet(ingRows);
  ws1['!cols']=[{w:12},{w:10},{w:30},{w:18},{w:10},{w:16},{w:12},{w:12},{w:14}];
  XLSX.utils.book_append_sheet(wb,ws1,'Ingresos');
  // Sheet 2: Gastos
  const gRows=[['FECHA','CATEGORÍA','DESCRIPCIÓN','INMUEBLE','MONTO','NOTAS']];
  const gastos=gastosFiltered.sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  gastos.forEach(g=>{
    const c=CATS_GASTO[g.categoria]||CATS_GASTO.otros;
    gRows.push([new Date(g.fecha).toLocaleDateString('es-MX'),c.n,g.descripcion,g.inmueble||'',g.monto,g.notas||'']);
  });
  const totalG=gastos.reduce((s,g)=>s+Number(g.monto),0);
  gRows.push([]);gRows.push(['','','','TOTAL:',totalG]);
  const ws2=XLSX.utils.aoa_to_sheet(gRows);
  ws2['!cols']=[{w:12},{w:18},{w:35},{w:18},{w:12},{w:30}];
  XLSX.utils.book_append_sheet(wb,ws2,'Gastos');
  // Sheet 3: Resumen
  const resRows=[['CONCEPTO','MONTO'],['INGRESOS',totalIng],['GASTOS',totalG],['NETO',totalIng-totalG],[],['DESGLOSE GASTOS POR CATEGORÍA','']];
  const porCat={};gastos.forEach(g=>{porCat[g.categoria]=(porCat[g.categoria]||0)+Number(g.monto)});
  Object.entries(porCat).forEach(([k,v])=>{const c=CATS_GASTO[k]||CATS_GASTO.otros;resRows.push([c.n,v]);});
  const ws3=XLSX.utils.aoa_to_sheet(resRows);
  ws3['!cols']=[{w:35},{w:15}];
  XLSX.utils.book_append_sheet(wb,ws3,'Resumen');
  const fn=`movimientos_${r.ini.toISOString().slice(0,10)}_${r.fin.toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb,fn);
  snack(`📥 Excel · ${pagosFiltered.length} ingresos, ${gastos.length} gastos`);
}
