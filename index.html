      <div style="font-family:'Playfair Display',serif;font-size:34px;color:${balColor};margin:4px 0">${fmt(Math.abs(bal))}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
        <div style="background:#E05C5C11;padding:8px;border-radius:8px">
          <div style="font-size:9px;color:var(--r)">RECIBOS (${recibos.length})</div>

          <div style="font-size:9px;color:var(--g)">PAGOS (${pagos.length})</div>
          <div style="font-weight:700;color:var(--g);font-size:13px">${fmt(totalPag)}</div>

    <div class="st-sm">Movimientos (${movs.length})</div>

        const isRec=m._tipo==='recibo';

function savePagoServicio(svcId,id){
  const sv=DB.servicios.find(x=>x.id===svcId);if(!sv)return;

  const fecha=document.getElementById('pg-fecha').value;

  const [yy,mm,dd]=fecha.split('-').map(Number);
  const now=new Date();
  const fechaLocal=new Date(yy,mm-1,dd,now.getHours(),now.getMinutes(),now.getSeconds());
  const fechaIso=fechaLocal.toISOString();
  const tipo=TIPOS_SVC[sv.tipo]||TIPOS_SVC.otro;
  const concepto=document.getElementById('pg-concepto').value.trim();
  const obj={
    servicioId:svcId,monto,fecha:fechaIso,
    destino:document.getElementById('pg-dest').value.trim(),
    metodo:document.getElementById('pg-met').value,
    concepto,notas:document.getElementById('pg-notas').value.trim()
  };
  // Update or create pago; also manage linked gasto
  if(id){
    const ex=DB.pagos_servicios.find(x=>x.id===id);
    // Remove old linked gasto if any
    if(ex.gastoId)DB.gastos=DB.gastos.filter(g=>g.id!==ex.gastoId);
    Object.assign(ex,obj);
    // Create new gasto
    const gastoId=uid();
    DB.gastos.push({
      id:gastoId,categoria:'servicios',monto,
      descripcion:`${tipo.i} ${tipo.n} — ${sv.inmueble}${concepto?': '+concepto:''}`,
      fecha:fechaIso,inmueble:sv.inmueble,
      notas:'Pago automático de servicio',
      creado:nowISO(),pagoServicioId:id
    });
    ex.gastoId=gastoId;
  }else{
    const pagoId=uid();
    const gastoId=uid();
    DB.pagos_servicios.push({id:pagoId,...obj,gastoId,creado:nowISO()});
    DB.gastos.push({
      id:gastoId,categoria:'servicios',monto,
      descripcion:`${tipo.i} ${tipo.n} — ${sv.inmueble}${concepto?': '+concepto:''}`,
      fecha:fechaIso,inmueble:sv.inmueble,
      notas:'Pago automático de servicio',
      creado:nowISO(),pagoServicioId:pagoId
    });
  }
  saveDB('pagos_servicios');saveDB('gastos');
  closeM();snack('Pago registrado ✓');
  openServicioBalance(svcId);
}

// ═══ CUENTAS DE SERVICIO: importación Excel, detalle, form extendido, export ═══

// Normaliza texto de deuda: '89713', '$ -', '', '$1,234.56' -> número
function parseDeuda(v){
  if(v===null||v===undefined)return 0;
  const s=String(v).replace(/[$,\s]/g,'');
  if(s===''||s==='-')return 0;
  const n=Number(s);
  return isNaN(n)?0:n;
}
// Normaliza fecha Excel (Date, serial, o string) -> 'YYYY-MM-DD' o ''
function parseFechaExcel(v){
  if(!v)return '';
  if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);
  if(typeof v==='number'&&v>20000&&v<80000){
    const d=new Date(Math.round((v-25569)*86400000));
    return isNaN(d)?'':d.toISOString().slice(0,10);
  }
  const s=String(v).trim();
  const m=s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m)return m[0];
  const d=new Date(s);
  return isNaN(d)?'':d.toISOString().slice(0,10);
}

// Aplica filas ya parseadas [{inmueble,propietario,alias,tipo,medidor,cuenta,nombre_recibo,nota_inquilino,deuda,nota_inmueble,fecha_actualizacion}]
function applyCuentasImport(rows){
  const res={propietariosCreados:0,inmueblesCreados:0,cuentasNuevas:0,cuentasActualizadas:0,recibosDeuda:0,deudaImportada:0,omitidas:0,conMovimientos:0};
  rows.forEach(r=>{
    const inmNombre=String(r.inmueble||'').trim();
    if(!inmNombre){res.omitidas++;return;}
    const tipoRaw=String(r.tipo||'').trim().toLowerCase();
    const tipo=tipoRaw==='luz'||tipoRaw==='cfe'?'luz':tipoRaw==='agua'?'agua':tipoRaw==='predial'?'predial':tipoRaw==='gas'?'gas':'otro';
    // Propietario: buscar o crear
    const propNombre=String(r.propietario||'').trim().toUpperCase();
    let prop=propNombre?DB.propietarios.find(p=>(p.nombre||'').trim().toUpperCase()===propNombre):null;
    if(!prop&&propNombre){
      prop={id:'prop_'+propNombre.toLowerCase().replace(/[^a-z0-9]/g,'_'),nombre:propNombre,contacto:'',telefono:'',correo:'',notas:'Creado por importación de cuentas',fecha_inicio:todayISO(),creado:nowISO()};
      DB.propietarios.push(prop);res.propietariosCreados++;
    }
    // Inmueble: buscar case-insensitive o crear
    const inmUp=inmNombre.toUpperCase();
    let inm=DB.inmuebles.find(x=>(x.nombre||'').trim().toUpperCase()===inmUp);
    if(!inm){
      inm={id:'inm_'+inmUp.toLowerCase().replace(/[^a-z0-9]/g,'_')+'_'+uid().slice(0,4),nombre:inmNombre,propietarioId:prop?.id||'',direccion:'',cuenta_predial:'',cuenta_agua:'',notas:'Creado por importación de cuentas',creado:nowISO()};
      DB.inmuebles.push(inm);res.inmueblesCreados++;
    }else if(!inm.propietarioId&&prop){inm.propietarioId=prop.id;}
    // Upsert servicio: clave = inmueble + tipo + cuenta + alias
    const cuenta=String(r.cuenta||'').trim();
    const alias=String(r.alias||'').trim();
    let svc=DB.servicios.find(s=>
      (s.inmueble||'').trim().toUpperCase()===inmUp&&
      (s.tipo==='cfe'?'luz':s.tipo)===tipo&&
      String(s.cuenta||'').trim()===cuenta&&
      String(s.alias||'').trim()===alias
    );
    const campos={
      inmueble:inm.nombre,tipo,cuenta,alias,
      medidor:String(r.medidor||'').trim(),
      nombre_recibo:String(r.nombre_recibo||'').trim(),
      nota_inquilino:String(r.nota_inquilino||'').trim(),
      nota_inmueble:String(r.nota_inmueble||'').trim(),
      deuda_corte:parseDeuda(r.deuda),
      fecha_actualizacion:parseFechaExcel(r.fecha_actualizacion),
      propietarioId:inm.propietarioId||prop?.id||''
    };
    if(svc){Object.assign(svc,campos);res.cuentasActualizadas++;}
    else{svc={id:uid(),...campos,notas:'',creado:nowISO()};DB.servicios.push(svc);res.cuentasNuevas++;}
    // Deuda al corte -> recibo inicial (solo si no hay movimientos previos y no se importó antes)
    const deudaNum=campos.deuda_corte;
    const tieneMovs=DB.recibos_servicios.some(x=>x.servicioId===svc.id)||DB.pagos_servicios.some(x=>x.servicioId===svc.id);
    if(deudaNum>0){
      if(!tieneMovs&&!svc.deuda_importada){
        DB.recibos_servicios.push({id:uid(),servicioId:svc.id,monto:deudaNum,fecha:campos.fecha_actualizacion||todayISO(),concepto:'Deuda al corte (importada)',notas:'Importado desde Excel',creado:nowISO()});
        svc.deuda_importada=true;
        res.recibosDeuda++;res.deudaImportada+=deudaNum;
      }else if(tieneMovs){res.conMovimientos++;}
    }
    // Sincronizar campos legacy del inmueble (1 por inmueble)
    if(tipo==='predial'&&cuenta)inm.cuenta_predial=cuenta;
    if(tipo==='agua'&&cuenta)inm.cuenta_agua=cuenta;
  });
  ['servicios','recibos_servicios','inmuebles','propietarios'].forEach(k=>saveDB(k));
  return res;
}

// UI: elegir archivo, mapear columnas por encabezado, preview y aplicar
let _importRowsPending=null;
function importCuentasExcel(){
  const input=document.createElement('input');
  input.type='file';input.accept='.xlsx,.xls';
  input.onchange=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        if(raw.length<2){snack('El archivo no tiene datos');return;}
        // Mapear columnas por encabezado (tolerante a variaciones)
        const headers=raw[0].map(h=>String(h||'').toUpperCase());
        const colIdx=(patterns)=>headers.findIndex(h=>patterns.some(p=>h.includes(p)));
        const ci={
          inmueble:colIdx(['INMUEBLE']),propietario:colIdx(['PROPIETARIO']),
          alias:colIdx(['ALIAS']),tipo:colIdx(['TIPO']),
          medidor:colIdx(['MEDIDOR']),cuenta:colIdx(['CUENTA']),
          nombre_recibo:colIdx(['NOMBRE RECIBO','NOMBRE']),
          nota_inquilino:colIdx(['NOTA INQ']),deuda:colIdx(['DEUDA']),
          nota_inmueble:colIdx(['NOTA INM']),fecha_actualizacion:colIdx(['FECHA'])
        };
        if(ci.inmueble<0||ci.tipo<0){snack('⚠️ El Excel necesita al menos columnas INMUEBLE y TIPO');return;}
        const rows=raw.slice(1).filter(r=>r[ci.inmueble]).map(r=>({
          inmueble:r[ci.inmueble],propietario:ci.propietario>=0?r[ci.propietario]:'',
          alias:ci.alias>=0?r[ci.alias]:'',tipo:r[ci.tipo],
          medidor:ci.medidor>=0?r[ci.medidor]:'',cuenta:ci.cuenta>=0?r[ci.cuenta]:'',
          nombre_recibo:ci.nombre_recibo>=0?r[ci.nombre_recibo]:'',
          nota_inquilino:ci.nota_inquilino>=0?r[ci.nota_inquilino]:'',
          deuda:ci.deuda>=0?r[ci.deuda]:'',
          nota_inmueble:ci.nota_inmueble>=0?r[ci.nota_inmueble]:'',
          fecha_actualizacion:ci.fecha_actualizacion>=0?r[ci.fecha_actualizacion]:''
        }));
        // Preview
        const tipos={};rows.forEach(r=>{const t=String(r.tipo||'').trim().toUpperCase()||'?';tipos[t]=(tipos[t]||0)+1;});
        const inms=[...new Set(rows.map(r=>String(r.inmueble||'').trim().toUpperCase()))];
        const deudaTot=rows.reduce((s,r)=>s+parseDeuda(r.deuda),0);
        _importRowsPending=rows;
        modal(`<div class="ms"><div class="mh"></div>
          <div class="mt2">📥 Importar cuentas</div>
          <div style="background:var(--s1);border-radius:11px;padding:14px;margin-bottom:12px">
            <div style="font-size:13px;font-weight:700;margin-bottom:8px">${file.name}</div>
            <div style="font-size:12px;color:#ccc;line-height:1.7">
              • <b>${rows.length}</b> cuentas: ${Object.entries(tipos).map(([t,n])=>`${n} ${t.toLowerCase()}`).join(' · ')}<br>
              • <b>${inms.length}</b> inmuebles: ${inms.slice(0,6).join(', ')}${inms.length>6?` +${inms.length-6}`:''}<br>
              • Deuda al corte total: <b style="color:var(--r)">${fmt(deudaTot)}</b>
            </div>
          </div>
          <div style="font-size:11px;color:var(--dim);margin-bottom:12px;line-height:1.6">Las cuentas se vinculan a cada inmueble. Las deudas al corte se registran como recibo inicial (los pagos que registres después las irán bajando). Re-importar el mismo archivo actualiza datos sin duplicar.</div>
          <div style="display:flex;gap:8px">
            <button class="btn bo" onclick="closeM();_importRowsPending=null">Cancelar</button>
            <button class="btn bg bfu" onclick="confirmImportCuentas()">Importar ${rows.length} cuentas</button>
          </div></div>`);
      }catch(err){console.error(err);snack('Error al leer: '+err.message);}
    };
    reader.readAsArrayBuffer(file);
  };
  input.click();
}

  if(!_importRowsPending){closeM();return;}

// ═══ GENERADOR DE PRESENTACIÓN (PPTX) POR PROPIETARIO ═══
// Recolecta todos los datos de un propietario para el período dado
function buildPropietarioReporte(propId,rango){
  const prop=getPropietario(propId);
  if(!prop)return null;
  const r=rango||getRange('semana');
  const inRango=(f)=>{if(!f)return false;const d=new Date(f);if(isNaN(d))return false;return d>=r.ini&&d<=r.fin;};
  const inmuebles=DB.inmuebles.filter(i=>i.propietarioId===propId).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));
  const norm=t=>t==='cfe'?'luz':t;

  // Datos por inmueble
  const porInmueble=inmuebles.map(inm=>{
    const tenants=DB.inquilinos.filter(t=>(t.inmuebleId===inm.id||t.inmueble===inm.nombre)&&t.estado==='activo');
    const totalRenta=tenants.reduce((s,t)=>s+Number(t.renta||0),0);
    // Cobrado en el período (pagos con fecha_pago en rango)
    const inqIds=tenants.map(t=>t.id);
    const pagosPeriodo=DB.pagos.filter(p=>p.pagado&&inqIds.includes(p.iid)&&inRango(p.fecha_pago));
    const cobradoPeriodo=pagosPeriodo.reduce((s,p)=>s+Number(p.monto||0),0);
    // Cobrado del mes actual (para % esperado mensual)
    const pagosMes=DB.pagos.filter(p=>p.pagado&&inqIds.includes(p.iid)&&p.mes===HM&&p.anio===HA);
    const cobradoMes=pagosMes.reduce((s,p)=>s+Number(p.monto||0),0);
    const pendienteMes=Math.max(0,totalRenta-cobradoMes);
    // Vacancia
    const totalDepas=inm.total_depas||tenants.length;
    const ocupados=tenants.length;
    const pctOcup=totalDepas>0?Math.round(ocupados/totalDepas*100):0;
    // Atrasados (vencidos este mes)
    const atrasados=tenants.filter(t=>isLate(t.id,HM,HA)).map(t=>({nombre:t.nombre,interior:t.interior,renta:Number(t.renta||0)}));
    // Trabajos (obras del período)
    const obras=DB.obras.filter(o=>(o.inmueble===inm.nombre)&&inRango(o.fecha)).map(o=>({tipo:(TIPOS_OBRA[o.tipo]||TIPOS_OBRA.otros).n,costo:Number(o.costo||0),desc:o.descripcion||''}));
    // Incidentes del período
    const incidentes=DB.incidentes.filter(i=>{
      const lugarLow=(i.lugar||'').toLowerCase();const inmLow=inm.nombre.toLowerCase();
      return (lugarLow.includes(inmLow)||inmLow.includes(lugarLow))&&inRango(i.fecha);
    }).map(i=>({numero:i.numero,desc:i.descripcion||'',resuelto:i.resuelto,nivel:i.nivel}));
    // Deudas de servicios
    const svcs=DB.servicios.filter(s=>s.inmueble===inm.nombre);
    const deudaLuzArr=svcs.filter(s=>norm(s.tipo)==='luz').map(s=>({alias:s.alias||'',monto:Math.max(0,getServicioBalance(s.id))})).filter(x=>x.monto>0);
    const deudaLuz=deudaLuzArr.reduce((s,x)=>s+x.monto,0);
    const deudaAgua=svcs.filter(s=>norm(s.tipo)==='agua').reduce((s,sv)=>s+Math.max(0,getServicioBalance(sv.id)),0);
    const deudaPredial=svcs.filter(s=>norm(s.tipo)==='predial').reduce((s,sv)=>s+Math.max(0,getServicioBalance(sv.id)),0);
    return{inm,tenants,totalRenta,cobradoPeriodo,cobradoMes,pendienteMes,totalDepas,ocupados,pctOcup,atrasados,obras,incidentes,deudaLuz,deudaLuzArr,deudaAgua,deudaPredial};
  });

  // OPEX (gastos del período por categoría)
  const gastosPeriodo=DB.gastos.filter(g=>g.propietarioId===propId&&inRango(g.fecha));
  const opex={mano_obra:0,carros:0,mantenimiento:0,servicios:0,otros:0};
  gastosPeriodo.forEach(g=>{const c=g.categoria||'otros';opex[c]=(opex[c]||0)+Number(g.monto||0);});

  return{prop,rango:r,porInmueble,opex,gastosPeriodo};
}

// Carga PptxGenJS bajo demanda con varios CDN de respaldo
let _pptxLoading=null;
function ensurePptxGenJS(){
  if(typeof PptxGenJS!=='undefined')return Promise.resolve(true);
  if(_pptxLoading)return _pptxLoading;
  const urls=[
    'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js',
    'https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js',
    'https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.min.js'
  ];
  _pptxLoading=new Promise((resolve)=>{
    let idx=0;
    const tryNext=()=>{
      if(typeof PptxGenJS!=='undefined'){resolve(true);return;}
      if(idx>=urls.length){resolve(false);return;}
      const url=urls[idx++];
      const sc=document.createElement('script');
      sc.src=url;
      sc.onload=()=>{
        setTimeout(()=>{
          if(typeof PptxGenJS!=='undefined')resolve(true);
          else tryNext();
        },100);
      };
      sc.onerror=()=>{tryNext();};
      document.head.appendChild(sc);
    };
    tryNext();
  });
  return _pptxLoading;
}

async function generarPPTPropietario(propId,rangoMode){
  snack('⏳ Cargando generador de presentaciones...');
  const ok=await ensurePptxGenJS();
  if(!ok||typeof PptxGenJS==='undefined'){
    snack('⚠️ No se pudo cargar la librería. Revisa tu conexión a internet e inténtalo de nuevo.');
    return;
  }
  const rango=getRange(rangoMode||'semana');
  const data=buildPropietarioReporte(propId,rango);
  if(!data){snack('No encontré al propietario');return;}
  snack('⏳ Generando presentación...');

  const P={navy:'1F3A5F',blue:'4472C4',blueLt:'8FAADC',blueBg:'D9E2F3',gold:'C9A227',red:'C0392B',green:'27AE60',gray:'6B7280',dark:'2C3E50',white:'FFFFFF',light:'F4F6FA'};
  const pptx=new PptxGenJS();
  pptx.layout='LAYOUT_WIDE'; // 13.3 x 7.5
  pptx.author='Gestión de Rentas';
  pptx.company=data.prop.nombre;

  const money=(n)=>'$'+Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0});
  const pct=(a,b)=>b>0?Math.round(a/b*100)+'%':'0%';

  // ── SLIDE 1: PORTADA ──
  let s=pptx.addSlide();
  s.background={color:P.navy};
  s.addText('Situación Financiera de Inmuebles',{x:0.8,y:2.3,w:11.7,h:1.2,fontSize:40,bold:true,color:P.white,fontFace:'Georgia',align:'center'});

  // ── SLIDE 2: SITUACIÓN DE LOS INMUEBLES (tabla) ──
  s=pptx.addSlide();
  s.background={color:P.white};
  s.addText('SITUACIÓN DE LOS INMUEBLES',{x:0.5,y:0.35,w:12.3,h:0.6,fontSize:26,bold:true,color:P.navy,fontFace:'Georgia'});
  const head2=['INMUEBLE','TOTAL RENTAS\n(MENSUAL)','COBRADO\n('+data.rango.label+')','PENDIENTE\n(MES)','OCUPACIÓN'];
  const rows2=[head2.map(t=>({text:t,options:{bold:true,color:P.white,fill:{color:P.blue},align:'center',valign:'middle',fontSize:11}}))];
  let tot={renta:0,cobP:0,pend:0};

    tot.renta+=d.totalRenta;tot.cobP+=d.cobradoPeriodo;tot.pend+=d.pendienteMes;

      s.addText('Sin incidentes en el período',{x:colX+0.2,y:5.45,w:colW,h:0.3,fontSize:12,color:P.gray,italic:true});
    }else{
      const inc=d.incidentes.slice(0,5).map(i=>({text:(i.numero||'?')+' — '+i.desc.slice(0,60)+(i.resuelto?' ✓ resuelto':' (activo)'),options:{fontSize:11,color:i.resuelto?P.gray:P.dark,bullet:{code:'2022'},breakLine:true,paraSpaceAfter:3}}));
      s.addText(inc,{x:colX+0.2,y:5.45,w:colW,h:1.5,valign:'top'});
    }
  });

  // ── SLIDE: PASIVOS A LIQUIDAR ──
  s=pptx.addSlide();
  s.background={color:P.white};
  s.addText('PASIVOS A LIQUIDAR',{x:0.5,y:0.35,w:12.3,h:0.6,fontSize:26,bold:true,color:P.navy,fontFace:'Georgia'});
  const headP=['INMUEBLE','DEUDA LUZ','DEUDA AGUA','DEUDA PREDIAL','TOTAL'];
  const rowsP=[headP.map(t=>({text:t,options:{bold:true,color:P.white,fill:{color:P.blue},align:'center',valign:'middle',fontSize:12}}))];
  let totP={luz:0,agua:0,pred:0};
  data.porInmueble.forEach((d,i)=>{
    const totInm=d.deudaLuz+d.deudaAgua+d.deudaPredial;
    if(totInm===0&&d.deudaLuzArr.length===0)return; // omitir inmuebles sin deuda
    totP.luz+=d.deudaLuz;totP.agua+=d.deudaAgua;totP.pred+=d.deudaPredial;
    const bg=i%2===0?P.light:P.white;
    const luzDetalle=d.deudaLuzArr.length>0?money(d.deudaLuz):(d.deudaLuz>0?money(d.deudaLuz):'—');
    rowsP.push([
      {text:d.inm.nombre+'\n('+money(d.totalRenta)+' renta/mes)',options:{bold:true,color:P.dark,fill:{color:bg},valign:'middle',fontSize:10}},
      {text:luzDetalle,options:{color:d.deudaLuz>0?P.red:P.gray,fill:{color:bg},align:'center',valign:'middle',fontSize:11}},
      {text:d.deudaAgua>0?money(d.deudaAgua):'—',options:{color:d.deudaAgua>0?P.red:P.gray,fill:{color:bg},align:'center',valign:'middle',fontSize:11}},
      {text:d.deudaPredial>0?money(d.deudaPredial):'—',options:{color:d.deudaPredial>0?P.red:P.gray,fill:{color:bg},align:'center',valign:'middle',fontSize:11}},
      {text:money(totInm),options:{bold:true,color:P.red,fill:{color:bg},align:'center',valign:'middle',fontSize:11}}
    ]);
  });
  const granTotal=totP.luz+totP.agua+totP.pred;
  rowsP.push([
    {text:'TOTAL',options:{bold:true,color:P.white,fill:{color:P.navy},valign:'middle',fontSize:12}},
    {text:money(totP.luz),options:{bold:true,color:P.white,fill:{color:P.navy},align:'center',valign:'middle',fontSize:11}},
    {text:money(totP.agua),options:{bold:true,color:P.white,fill:{color:P.navy},align:'center',valign:'middle',fontSize:11}},
    {text:money(totP.pred),options:{bold:true,color:P.white,fill:{color:P.navy},align:'center',valign:'middle',fontSize:11}},
    {text:money(granTotal),options:{bold:true,color:P.gold,fill:{color:P.navy},align:'center',valign:'middle',fontSize:12}}
  ]);
  if(rowsP.length===2){ // solo header + total = sin deudas
    s.addText('✓ Sin pasivos pendientes en los inmuebles de '+data.prop.nombre,{x:0.5,y:3.3,w:12.3,h:0.6,fontSize:18,color:P.green,align:'center',bold:true});
  }else{
    s.addTable(rowsP,{x:0.5,y:1.3,w:12.3,colW:[3.4,2.5,2.3,2.5,1.6],border:{type:'solid',color:'D0D5DD',pt:0.5},autoPage:false});
  }

  // ── SLIDE: OPEX ──
  s=pptx.addSlide();
  s.background={color:P.white};
  s.addText('OPEX: GASTOS OPERATIVOS',{x:0.5,y:0.35,w:12.3,h:0.6,fontSize:26,bold:true,color:P.navy,fontFace:'Georgia'});
  s.addText('Período: '+data.rango.label,{x:0.5,y:0.95,w:12.3,h:0.35,fontSize:13,color:P.gray,italic:true});
  const opexItems=[
    {label:'MANO DE OBRA',val:data.opex.mano_obra||0,color:P.blue},
    {label:'CARRO / TRANSPORTE',val:data.opex.carros||0,color:P.navy},
    {label:'MANTENIMIENTO / REPARACIONES',val:data.opex.mantenimiento||0,color:P.gold},
    {label:'SERVICIOS',val:data.opex.servicios||0,color:P.green},
    {label:'OTROS',val:data.opex.otros||0,color:P.gray}
  ];
  const totalOpex=opexItems.reduce((s2,i)=>s2+i.val,0);
  let cardY=1.6;
  opexItems.forEach(it=>{
    s.addShape(pptx.ShapeType.roundRect,{x:0.8,y:cardY,w:8.5,h:0.75,fill:{color:P.light},line:{color:'E0E4EA',width:1},rectRadius:0.05});
    s.addShape(pptx.ShapeType.ellipse,{x:1.0,y:cardY+0.13,w:0.5,h:0.5,fill:{color:it.color}});
    s.addText(it.label,{x:1.7,y:cardY,w:5.0,h:0.75,fontSize:14,bold:true,color:P.dark,valign:'middle'});
    s.addText(money(it.val),{x:6.7,y:cardY,w:2.4,h:0.75,fontSize:18,bold:true,color:it.color,align:'right',valign:'middle'});
    cardY+=0.92;
  });
  // Total OPEX card
  s.addShape(pptx.ShapeType.roundRect,{x:9.6,y:1.6,w:3.2,h:2.5,fill:{color:P.navy},rectRadius:0.05});
  s.addText([{text:'TOTAL OPEX\n',options:{fontSize:14,color:P.blueLt}},{text:money(totalOpex)+'\n',options:{fontSize:30,bold:true,color:P.white}},{text:data.rango.label,options:{fontSize:11,color:P.blueLt}}],{x:9.6,y:1.6,w:3.2,h:2.5,align:'center',valign:'middle'});

  // ── SLIDE: REPARACIONES RECOMENDADAS ──
  s=pptx.addSlide();
  s.background={color:P.white};
  s.addText('REPARACIONES RECOMENDADAS',{x:0.5,y:0.35,w:12.3,h:0.6,fontSize:26,bold:true,color:P.navy,fontFace:'Georgia'});
  // Sugerir desde incidentes activos + inspecciones bajas
  const recomend=[];
  data.porInmueble.forEach(d=>{
    d.incidentes.filter(i=>!i.resuelto).forEach(i=>recomend.push(d.inm.nombre+': '+i.desc.slice(0,70)));
  });
  if(recomend.length>0){
    const rec=recomend.slice(0,10).map(t=>({text:t,options:{fontSize:13,color:P.dark,bullet:{code:'2022'},breakLine:true,paraSpaceAfter:6}}));
    s.addText(rec,{x:0.8,y:1.5,w:11.7,h:5.2,valign:'top'});
  }else{
    s.addShape(pptx.ShapeType.roundRect,{x:1.5,y:2.5,w:10.3,h:2.2,fill:{color:P.light},line:{color:'E0E4EA',width:1},rectRadius:0.08});
    s.addText('Espacio para notas y recomendaciones',{x:1.5,y:3.4,w:10.3,h:0.5,fontSize:16,color:P.gray,align:'center',italic:true});
  }

  // Guardar
  const fname='Reporte_'+data.prop.nombre.replace(/\s+/g,'_')+'_'+todayISO()+'.pptx';
  try{
    // Método robusto: generar blob y forzar descarga (funciona mejor en móvil)
    const blob=await pptx.write({outputType:'blob'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=fname;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
    snack('✅ Presentación descargada');
  }catch(e){
    console.error('[PPTX write blob]',e);
    // Fallback al método directo de la librería
    try{
      await pptx.writeFile({fileName:fname});
      snack('✅ Presentación descargada');
    }catch(e2){
      console.error('[PPTX writeFile]',e2);
      snack('❌ Error al generar: '+e2.message);
    }
  }
}

function exportCuentasExcel(){
  try{
    const wb=XLSX.utils.book_new();
    const header=['PROPIETARIO','INMUEBLE','TIPO','ALIAS','MEDIDOR','NO. CUENTA','NOMBRE RECIBO','DEUDA ACTUAL','DEUDA AL CORTE (IMP.)','NOTA INQUILINO','NOTA INMUEBLE','INQUILINO VINCULADO','FECHA ACTUALIZACIÓN'];
    const S=v=>v===null||v===undefined?'':String(v);
    const buildRow=(sv)=>{
      const propObj=getPropietario(sv.propietarioId);
      const tipoN=(TIPOS_SVC[sv.tipo]||TIPOS_SVC.otro).n;
      const bal=getServicioBalance(sv.id);
      const inqVinc=(sv.tipo==='luz'||sv.tipo==='cfe')?DB.inquilinos.find(t=>t.cuentaLuzId===sv.id):null;
      return[S(propObj?.nombre),S(sv.inmueble),tipoN,S(sv.alias),S(sv.medidor),S(sv.cuenta),S(sv.nombre_recibo),bal,Number(sv.deuda_corte||0),S(sv.nota_inquilino),S(sv.nota_inmueble),inqVinc?S(inqVinc.nombre):'',S(sv.fecha_actualizacion)];
    };
    const ordenTipo={predial:0,agua:1,luz:2,cfe:2,gas:3,otro:4};
    const svcsSorted=DB.servicios.slice().sort((a,b)=>(a.inmueble||'').localeCompare(b.inmueble||'')||(ordenTipo[a.tipo]??9)-(ordenTipo[b.tipo]??9)||(a.alias||'').localeCompare(b.alias||''));
    // Hoja global
    const rows=[header,...svcsSorted.map(buildRow)];
    const totalDeuda=svcsSorted.reduce((s,sv)=>s+Math.max(0,getServicioBalance(sv.id)),0);
    rows.push([]);rows.push(['','','','','','','TOTAL DEUDA:',totalDeuda,'','','','','']);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:12},{wch:14},{wch:12},{wch:24},{wch:10},{wch:18},{wch:24},{wch:12},{wch:14},{wch:20},{wch:16},{wch:22},{wch:12}];
    XLSX.utils.book_append_sheet(wb,ws,'Todas');
    // Hoja por inmueble
    const inmuebles=[...new Set(svcsSorted.map(sv=>sv.inmueble).filter(Boolean))];
    inmuebles.forEach(inmN=>{
      const svcsInm=svcsSorted.filter(sv=>sv.inmueble===inmN);
      const r2=[header,...svcsInm.map(buildRow)];
      const dt=svcsInm.reduce((s,sv)=>s+Math.max(0,getServicioBalance(sv.id)),0);
      r2.push([]);r2.push(['','','','','','','TOTAL:',dt,'','','','','']);
      const ws2=XLSX.utils.aoa_to_sheet(r2);
      ws2['!cols']=ws['!cols'];
      XLSX.utils.book_append_sheet(wb,ws2,inmN.slice(0,28).replace(/[/\\?*:\[\]]/g,'_'));
    });
    XLSX.writeFile(wb,`cuentas_servicios_${todayISO()}.xlsx`);
    snack(`✓ Excel con ${svcsSorted.length} cuentas descargado`);
  }catch(e){console.error(e);snack('Error: '+e.message);}
}

function exportInqAllPropietarios(){
  try{
    const wb=XLSX.utils.book_new();
    DB.propietarios.forEach(p=>{
      const tenants=DB.inquilinos.filter(t=>t.propietarioId===p.id&&t.estado==='activo').sort((a,b)=>(a.inmueble||'').localeCompare(b.inmueble||'')||(a.dia||0)-(b.dia||0));
      const rows=[['NOMBRE','INMUEBLE','INTERIOR','DÍA COBRO','RENTA','DESTINO','CTA LUZ','ESTATUS','PAGADO','FECHA PAGO','MÉTODO']];
      tenants.forEach(t=>{
        const pg=getPago(t.id,curMes,curAnio);
        rows.push([t.nombre,t.inmueble||'',t.interior||'',t.dia||'',t.renta||0,t.destino||'',t.cuenta_luz||'',t.estatus||'',pg?'Sí':'',pg?.fecha_pago?new Date(pg.fecha_pago).toLocaleDateString('es-MX'):'',pg?.metodo||'']);
      });
      const ws=XLSX.utils.aoa_to_sheet(rows);
      ws['!cols']=[{wch:28},{wch:14},{wch:8},{wch:10},{wch:10},{wch:10},{wch:14},{wch:14},{wch:8},{wch:12},{wch:12}];
      const shName=(p.nombre||'').slice(0,28).replace(/[/\\?*:\[\]]/g,'_');
      XLSX.utils.book_append_sheet(wb,ws,shName||'sin_nombre');
    });
    XLSX.writeFile(wb,`inquilinos_${MN[curMes-1]}_${curAnio}.xlsx`);
    snack('✓ Excel descargado');
  }catch(e){console.error(e);snack('Error: '+e.message);}
}

function downloadTenantPDF(id){
  const t=DB.inquilinos.find(x=>x.id===id);if(!t)return;
  const propObj=getPropietario(t.propietarioId);
  const doc=pdfBase('HISTORIAL — '+(t.nombre||'').toUpperCase());
  let y=45;
  doc.setTextColor(80,80,80);doc.setFont('helvetica','normal');doc.setFontSize(9);
  doc.text('Propietario: '+(propObj?.nombre||'—'),14,y);y+=5;
  doc.text('Inmueble: '+(t.inmueble||'—')+(t.interior?' Int '+t.interior:''),14,y);y+=5;
  doc.text('Renta: '+fmt(t.renta||0)+' · Día pago: '+(t.dia||'—'),14,y);y+=5;
  doc.text('Cuenta luz: '+(t.cuenta_luz||'—'),14,y);y+=5;
  doc.text('Estatus: '+(t.estatus||'—'),14,y);y+=8;
  // Historial de pagos
  doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(40,40,40);
  doc.text('Historial de pagos',14,y);y+=6;
  const pagos=DB.pagos.filter(p=>p.iid===id&&p.pagado).sort((a,b)=>new Date(b.fecha_pago||0)-new Date(a.fecha_pago||0));
  if(pagos.length===0){doc.setFont('helvetica','italic');doc.setFontSize(9);doc.setTextColor(120,120,120);doc.text('(Sin pagos registrados)',14,y);y+=8;}
  else{

function smartImportInquilinos(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        const newList=d.inquilinos||[];
        if(!newList.length){snack('JSON sin inquilinos');return;}
        // Match by nombre+inmueble (case insensitive)
        const existingByKey=new Map();
        DB.inquilinos.forEach(t=>{
          const k=(t.nombre+'|'+t.inmueble).toLowerCase().trim();
          existingByKey.set(k,t);
        });
        const updated=[];const matchedIds=new Set();
        let nuevos=0,actualizados=0;
        newList.forEach(n=>{
          const k=(n.nombre+'|'+n.inmueble).toLowerCase().trim();
          const ex=existingByKey.get(k);
          if(ex){
            updated.push({...ex,...n,id:ex.id});  // preserve ID, merge data
            matchedIds.add(ex.id);
            actualizados++;
          }else{
            updated.push({...n,id:uid()});
            nuevos++;
          }
        });
        // Keep old tenants not in new list, mark as inactive
        let inactivados=0;
        DB.inquilinos.forEach(t=>{
          if(!matchedIds.has(t.id)){
            updated.push({...t,estado:'inactivo'});
            inactivados++;
          }
        });
        if(!confirm(`Resultado de actualización:\n\n• ${actualizados} inquilinos actualizados\n• ${nuevos} inquilinos nuevos\n• ${inactivados} inquilinos marcados como inactivos\n\nLos pagos existentes se conservan. ¿Aplicar?`))return;
        DB.inquilinos=updated;
        saveDB('inquilinos');
        snack('✓ Inquilinos actualizados');
        renderRep();
      }catch(err){snack('Error: '+err.message)}
    };r.readAsText(f);
  };inp.click();
}

async function handlePhotos(e,max){
  const files=Array.from(e.target.files).slice(0,max-pendingPhotos.length);
  if(pendingPhotos.length+files.length>max){snack('Máx '+max+' fotos');return;}
  for(const f of files){
    try{
      const b64=await compressImage(f);
      pendingPhotos.push(b64);
    }catch(err){snack('Error procesando foto')}
  }
  e.target.value='';
  // Find which grid is open
  if(document.getElementById('o-photos-grid'))renderPendingPhotos('o-photos-grid');
  if(document.getElementById('i-photos-grid'))renderPendingPhotos('i-photos-grid');
  if(document.getElementById('ins-photos-grid'))renderPendingPhotos('ins-photos-grid');
}

function renderPendingPhotos(gridId){
  const grid=document.getElementById(gridId);
  if(!grid)return;
  let html='';
  pendingPhotos.forEach((p,idx)=>{
    html+=`<div class="photo-thumb" style="background-image:url('${p}')" onclick="viewFullImg('${idx}','pending')"><button class="photo-remove" onclick="event.stopPropagation();removePending(${idx},'${gridId}')">×</button></div>`;
  });
  grid.innerHTML=html;
}

function removePending(idx,gridId){
  pendingPhotos.splice(idx,1);
  renderPendingPhotos(gridId);
}

function viewFullImg(idx,src){
  let img='';
  if(src==='pending')img=pendingPhotos[idx];
  else img=idx;
  const ov=document.createElement('div');
  ov.className='full-img';
  ov.innerHTML=`<img src="${img}"><button onclick="this.parentElement.remove()">✕</button>`;
  ov.onclick=(e)=>{if(e.target===ov)ov.remove();};
  document.body.appendChild(ov);
}

function saveObra(id){
  const tipo=document.getElementById('o-tipo').value;
  const fecha=document.getElementById('o-fecha').value;
  const costo=document.getElementById('o-costo').value;
  const inm=document.getElementById('o-inm').value.trim();
  const desc=document.getElementById('o-desc').value.trim();
  if(!fecha||!costo||!inm||!desc){snack('Completa los campos obligatorios');return;}
  const [yy,mm,dd]=fecha.split('-').map(Number);
  const now=new Date();
  const fechaLocal=new Date(yy,mm-1,dd,now.getHours(),now.getMinutes(),now.getSeconds());
  const obj={
    tipo,fecha:fechaLocal.toISOString(),
    costo:Number(costo),inmueble:inm,descripcion:desc,
    trabajador:document.getElementById('o-trab').value.trim(),
    fotos:[...pendingPhotos],
    gastoVinculado:document.getElementById('o-gasto').value==='si'
  };
  if(id){
    const ex=DB.obras.find(x=>x.id===id);
    // Remove existing linked gasto if any
    if(ex.gastoId)DB.gastos=DB.gastos.filter(g=>g.id!==ex.gastoId);
    Object.assign(ex,obj);
  }else{
    DB.obras.push({id:uid(),...obj,creado:nowISO()});
  }
  // Crear gasto vinculado
  if(obj.gastoVinculado){
    const tn=TIPOS_OBRA[tipo]?.n||'Obra';
    const gastoId=uid();
    DB.gastos.push({
      id:gastoId,categoria:'mano_obra',monto:Number(costo),
      descripcion:`${tn} — ${desc.slice(0,40)}`,
      fecha:obj.fecha,inmueble:inm,notas:'Vinculado a reporte de obra',
      creado:nowISO(),obraId:id||DB.obras[DB.obras.length-1].id
    });
    if(id){DB.obras.find(x=>x.id===id).gastoId=gastoId;}
    else{DB.obras[DB.obras.length-1].gastoId=gastoId;}
    saveDB('gastos');
  }
  saveDB('obras');
  closeM();snack(id?'Obra actualizada ✓':'Reporte de obra creado ✓');
  pendingPhotos=[];
  renderRep();
}

function buildIncidenteInqOptions(lugar,selectedId){
  const lugarLower=(lugar||'').toLowerCase().trim();
  let inqs=DB.inquilinos.filter(x=>x.estado==='activo');
  if(lugarLower){
    inqs=inqs.filter(x=>{
      const inm=(x.inmueble||'').toLowerCase();
      return lugarLower.includes(inm)||inm.includes(lugarLower);
    });
  }
  // Include selected even if filter would exclude
  if(selectedId&&selectedId!=='_vacio_'&&!inqs.find(x=>x.id===selectedId)){
    const cur=DB.inquilinos.find(x=>x.id===selectedId);
    if(cur)inqs.push(cur);
  }
  let html=`<option value=""${!selectedId?' selected':''}>— Ninguno —</option>`;
  html+=`<option value="_vacio_"${selectedId==='_vacio_'?' selected':''}>🏠 Departamento vacío / sin inquilino</option>`;
  inqs.forEach(x=>{
    html+=`<option value="${x.id}"${selectedId===x.id?' selected':''}>${x.nombre}${x.interior?' · Int '+x.interior:''} — ${x.inmueble}</option>`;
  });
  return html;
}

      <button class="btn bo" onclick="closeM();openIncidenteForm('${i.id}')">✏️</button>
      <button class="btn bd" onclick="delIncidente('${i.id}')">🗑️</button>
    </div></div>`);
}

function marcarResuelto(id){
  const i=DB.incidentes.find(x=>x.id===id);if(!i)return;
  const notas=prompt('Notas de cómo se resolvió (opcional):','');
  if(notas===null)return;
  i.resuelto=true;
  i.fecha_resolucion=nowISO();
  if(notas)i.notas_resolucion=notas;
  saveDB('incidentes');
  closeM();snack(`✓ Incidente ${i.numero} resuelto`);renderRep();
}

function reabrirIncidente(id){
  const i=DB.incidentes.find(x=>x.id===id);if(!i)return;
  if(!confirm('¿Reabrir este incidente?'))return;
  i.resuelto=false;
  delete i.fecha_resolucion;
  saveDB('incidentes');
  closeM();snack('Incidente reabierto');renderRep();
}

function delIncidente(id){
  if(!confirm('¿Eliminar este incidente?'))return;
  DB.incidentes=DB.incidentes.filter(x=>x.id!==id);
  saveDB('incidentes');closeM();snack('Eliminado');renderRep();
}

// ─── INSPECCIÓN DE DEPARTAMENTO ──────────────────
function openInspeccionForm(id){
  if(id){curInspeccion=JSON.parse(JSON.stringify(DB.inspecciones.find(x=>x.id===id)||{}));}
  else{curInspeccion={items:{},fecha:todayISO(),inmueble:'',inquilino_id:'',inspector:'',notas:'',fotos:[]};}
  pendingPhotos=curInspeccion.fotos?[...curInspeccion.fotos]:[];
  renderInspeccionForm();
}

function renderInspeccionForm(){
  const ins=curInspeccion;
  const props=[...new Set(DB.inquilinos.map(i=>i.inmueble))].sort();
  const inqs=DB.inquilinos.filter(x=>x.estado==='activo');
  // Calcular puntaje
  let scoreObt=0,scoreMax=0;
  Object.values(INSPECCION_TEMPLATE).forEach(cat=>{
    cat.items.forEach(it=>{
      scoreMax+=it.max;
      const est=ins.items?.[it.k]?.estado;
      if(est&&ESTADOS_INSP[est])scoreObt+=it.max*ESTADOS_INSP[est].mult;
    });
  });
  const pct=scoreMax>0?(scoreObt/scoreMax*100):0;
  const calColor=pct>=80?'#5CB87A':pct>=60?'#E0B840':pct>=40?'#E58A2C':'#E05C5C';
  // Render
  let html=`<div class="ms" style="max-height:96vh"><div class="mh"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="mt2" style="margin:0">🏠 Inspección de departamento</div>
      <button class="btn bd bsm" onclick="closeM()">✕</button>
    </div>
    <div class="grid2">
      <div class="fg"><label class="fl">Fecha *</label><input class="fi" type="date" id="ins-fecha" value="${ins.fecha?ins.fecha.slice(0,10):todayISO()}"></div>
      <div class="fg"><label class="fl">Inspector</label><input class="fi" id="ins-inspector" value="${ins.inspector||''}" placeholder="Tu nombre"></div>
    </div>
    <div class="fg"><label class="fl">Inmueble *</label>
      <input class="fi" id="ins-inmueble" list="props-ins" value="${ins.inmueble||''}" placeholder="Ej: XOCO">
      <datalist id="props-ins">${props.map(p=>`<option value="${p}">`).join('')}</datalist></div>
    <div class="fg"><label class="fl">Inquilino (opcional)</label>
      <select class="fi" id="ins-inq"><option value="">— Ninguno —</option>
      ${inqs.map(x=>`<option value="${x.id}"${ins.inquilino_id===x.id?' selected':''}>${x.nombre} — ${x.inmueble}${x.interior?' '+x.interior:''}</option>`).join('')}</select></div>
    <div style="background:linear-gradient(135deg,#1a1a1a,#222);border:2px solid ${calColor};border-radius:12px;padding:14px;margin-bottom:16px;text-align:center">
      <div style="font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px">Calificación actual</div>
      <div style="font-family:'Playfair Display',serif;font-size:34px;color:${calColor};margin:4px 0">${scoreObt.toFixed(1)} <span style="font-size:18px;color:var(--dim)">/ ${scoreMax}</span></div>
      <div style="font-size:18px;color:${calColor};font-weight:700">${pct.toFixed(1)}%</div>
      <div style="height:6px;background:#252525;border-radius:3px;margin-top:10px;overflow:hidden"><div style="height:100%;background:${calColor};width:${pct}%;transition:width .3s"></div></div>
    </div>`;
  // Secciones
  Object.entries(INSPECCION_TEMPLATE).forEach(([catKey,cat])=>{
    let scoreCat=0,maxCat=0;
    cat.items.forEach(it=>{
      maxCat+=it.max;
      const est=ins.items?.[it.k]?.estado;
      if(est&&ESTADOS_INSP[est])scoreCat+=it.max*ESTADOS_INSP[est].mult;
    });
    html+=`<div style="margin-bottom:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--s2);border-radius:9px;margin-bottom:8px;border-left:3px solid var(--gold)">
        <div style="font-family:'Playfair Display',serif;font-size:15px;color:var(--gold)">${cat.nombre}</div>
        <div style="font-size:13px;font-weight:700;color:var(--gold)">${scoreCat.toFixed(1)} / ${maxCat}</div>
      </div>`;
    cat.items.forEach(it=>{
      const itemData=ins.items?.[it.k]||{};
      const est=itemData.estado||'';
      const obs=itemData.observaciones||'';
      html+=`<div style="background:var(--s1);border-radius:9px;padding:10px;margin-bottom:6px;border:1px solid #222">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">${it.n}</div>
            <div style="font-size:10px;color:var(--dim);margin-top:2px">${it.prueba} · max ${it.max} pts</div>
          </div>
          <div style="display:flex;gap:4px;flex-shrink:0">
            <button onclick="setInspEstado('${it.k}','excelente')" style="width:32px;height:32px;border-radius:8px;border:${est==='excelente'?'2px solid #5CB87A':'1px solid #333'};background:${est==='excelente'?'#5CB87A33':'var(--s2)'};cursor:pointer;font-size:14px;padding:0">🟢</button>
            <button onclick="setInspEstado('${it.k}','medio')" style="width:32px;height:32px;border-radius:8px;border:${est==='medio'?'2px solid #E0B840':'1px solid #333'};background:${est==='medio'?'#E0B84033':'var(--s2)'};cursor:pointer;font-size:14px;padding:0">🟡</button>
            <button onclick="setInspEstado('${it.k}','malo')" style="width:32px;height:32px;border-radius:8px;border:${est==='malo'?'2px solid #E05C5C':'1px solid #333'};background:${est==='malo'?'#E05C5C33':'var(--s2)'};cursor:pointer;font-size:14px;padding:0">🔴</button>
          </div>
        </div>
        <input class="fi" placeholder="Observaciones (opcional)" value="${obs}" onblur="setInspObs('${it.k}',this.value)" style="font-size:12px;padding:6px 10px">

    html+=`</div>`;

  html+=`<div class="fg"><label class="fl">Fotos (hasta 8)</label>
      <input type="file" accept="image/*" multiple id="ins-fotos-inp" style="display:none" onchange="handlePhotos(event,8)">
      <div class="photo-grid" id="ins-photos-grid"></div>
      <button class="btn bo bsm" onclick="document.getElementById('ins-fotos-inp').click()">📷 Agregar fotos</button>
      <div style="font-size:10px;color:var(--dim);margin-top:6px">Evidencia visual del estado del departamento</div></div>
    <div class="fg"><label class="fl">Notas generales</label><textarea class="fi" id="ins-notas" rows="2">${ins.notas||''}</textarea></div>
    <div style="display:flex;gap:8px">
      ${ins.id?`<button class="btn bd" onclick="delInspeccion('${ins.id}')">🗑️ Eliminar</button>`:''}
      <button class="btn bg bfu" onclick="saveInspeccion()">Guardar inspección</button>
    </div></div>`;
  modal(html);
  renderPendingPhotos('ins-photos-grid');
}

function setInspEstado(k,estado){
  if(!curInspeccion.items)curInspeccion.items={};
  if(!curInspeccion.items[k])curInspeccion.items[k]={};
  // Toggle: si ya tenía ese estado, lo quita
  if(curInspeccion.items[k].estado===estado)curInspeccion.items[k].estado=null;
  else curInspeccion.items[k].estado=estado;
  // Save fields too
  curInspeccion.fecha=document.getElementById('ins-fecha').value;
  curInspeccion.inmueble=document.getElementById('ins-inmueble').value;
  curInspeccion.inspector=document.getElementById('ins-inspector').value;
  curInspeccion.inquilino_id=document.getElementById('ins-inq').value;
  curInspeccion.notas=document.getElementById('ins-notas').value;
  // Save scroll position
  const ms=document.querySelector('.ms');const scrollT=ms?.scrollTop||0;
  renderInspeccionForm();
  setTimeout(()=>{const ms2=document.querySelector('.ms');if(ms2)ms2.scrollTop=scrollT;},0);
}

function setInspObs(k,val){
  if(!curInspeccion.items)curInspeccion.items={};
  if(!curInspeccion.items[k])curInspeccion.items[k]={};
  curInspeccion.items[k].observaciones=val;
}

function saveInspeccion(){
  const ins=curInspeccion;
  ins.fecha=document.getElementById('ins-fecha').value;
  ins.inmueble=document.getElementById('ins-inmueble').value.trim();
  ins.inspector=document.getElementById('ins-inspector').value.trim();
  ins.inquilino_id=document.getElementById('ins-inq').value;
  ins.notas=document.getElementById('ins-notas').value.trim();
  ins.fotos=[...pendingPhotos];
  if(!ins.inmueble||!ins.fecha){snack('Falta inmueble o fecha');return;}
  // Calcular calificación final
  let scoreObt=0,scoreMax=0;
  Object.values(INSPECCION_TEMPLATE).forEach(cat=>{cat.items.forEach(it=>{
    scoreMax+=it.max;
    const est=ins.items?.[it.k]?.estado;
    if(est&&ESTADOS_INSP[est])scoreObt+=it.max*ESTADOS_INSP[est].mult;
  });});
  ins.score=scoreObt;ins.score_max=scoreMax;
  ins.porcentaje=scoreMax>0?(scoreObt/scoreMax*100):0;
  if(ins.id){Object.assign(DB.inspecciones.find(x=>x.id===ins.id),ins);}
  else{ins.id=uid();ins.creado=nowISO();DB.inspecciones.push(ins);}
  saveDB('inspecciones');
  closeM();
  snack(`✓ Inspección guardada · ${ins.porcentaje.toFixed(1)}%`);
  curInspeccion=null;
  renderRep();
}

function viewInspeccion(id){
  const ins=DB.inspecciones.find(x=>x.id===id);if(!ins)return;
  const inq=ins.inquilino_id?DB.inquilinos.find(x=>x.id===ins.inquilino_id):null;
  const calColor=ins.porcentaje>=80?'#5CB87A':ins.porcentaje>=60?'#E0B840':ins.porcentaje>=40?'#E58A2C':'#E05C5C';
  let html=`<div class="ms"><div class="mh"></div>
    <div class="mt2">🏠 Inspección — ${ins.inmueble}</div>
    <div style="background:linear-gradient(135deg,#1a1a1a,#222);border:2px solid ${calColor};border-radius:12px;padding:14px;margin-bottom:14px;text-align:center">
      <div style="font-size:10px;color:var(--dim)">Calificación final</div>
      <div style="font-family:'Playfair Display',serif;font-size:34px;color:${calColor};margin:4px 0">${(ins.score||0).toFixed(1)} <span style="font-size:18px;color:var(--dim)">/ ${ins.score_max||100}</span></div>
      <div style="font-size:20px;color:${calColor};font-weight:700">${(ins.porcentaje||0).toFixed(1)}%</div>
    </div>
    <div class="card" style="padding:6px 14px;margin-bottom:14px">
      <div class="ir"><span class="ik">Fecha</span><span class="iv">${new Date(ins.fecha).toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'})}</span></div>
      <div class="ir"><span class="ik">Inspector</span><span class="iv">${ins.inspector||'—'}</span></div>
      ${inq?`<div class="ir"><span class="ik">Inquilino</span><span class="iv">${inq.nombre}</span></div>`:''}
    </div>`;
  Object.entries(INSPECCION_TEMPLATE).forEach(([catKey,cat])=>{
    let scoreCat=0,maxCat=0;
    cat.items.forEach(it=>{
      maxCat+=it.max;
      const est=ins.items?.[it.k]?.estado;
      if(est&&ESTADOS_INSP[est])scoreCat+=it.max*ESTADOS_INSP[est].mult;
    });
    html+=`<div class="st-sm">${cat.nombre} · ${scoreCat.toFixed(1)}/${maxCat}</div><div class="card" style="padding:0 12px;margin-bottom:10px">`;
    cat.items.forEach(it=>{
      const d=ins.items?.[it.k]||{};
      const e=d.estado?ESTADOS_INSP[d.estado]:null;
      html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1e1e1e">
        <div style="flex:1"><div style="font-size:13px">${it.n}</div>${d.observaciones?`<div style="font-size:10px;color:var(--dim);margin-top:2px">💬 ${d.observaciones}</div>`:''}</div>
        <div style="text-align:right">${e?`<span style="color:${e.c};font-weight:700">${e.i} ${e.l}</span>`:'<span style="color:var(--dim)">—</span>'}<div style="font-size:10px;color:var(--dim)">${e?(it.max*e.mult).toFixed(2):'0'}/${it.max}</div></div>
      </div>`;
    });
    html+=`</div>`;
  });
  if(ins.notas)html+=`<div class="st-sm">Notas generales</div><div class="card"><div style="font-size:13px;line-height:1.5">${ins.notas}</div></div>`;
  if(ins.fotos?.length){
    html+=`<div class="st-sm">Fotos (${ins.fotos.length})</div><div class="photo-grid">`;
    ins.fotos.forEach(p=>{html+=`<div class="photo-thumb" style="background-image:url('${p}')" onclick="viewFullImg('${p}','direct')"></div>`;});
    html+=`</div>`;
  }
  html+=`<div style="display:flex;gap:8px;margin-top:14px">
    <button class="btn bg" style="flex:1" onclick="genPDFInspeccion('${ins.id}')">📄 PDF</button>

    <button class="btn bd" onclick="delInspeccion('${ins.id}')">🗑️</button>
  </div></div>`;
  modal(html);

function delInspeccion(id){
  if(!confirm('¿Eliminar esta inspección?'))return;
  DB.inspecciones=DB.inspecciones.filter(x=>x.id!==id);
  saveDB('inspecciones');closeM();snack('Eliminado');renderRep();

// PDF de la inspección llena
function genPDFInspeccion(id){
  const ins=DB.inspecciones.find(x=>x.id===id);if(!ins)return;
  const inq=ins.inquilino_id?DB.inquilinos.find(x=>x.id===ins.inquilino_id):null;
  const doc=pdfBase('LISTA DE INSPECCIÓN DE DEPARTAMENTO',ins.inmueble);
  let y=42;
  // Info general
  doc.setFillColor(245,248,252);doc.rect(14,y-3,182,22,'F');
  doc.setDrawColor(200,210,225);doc.rect(14,y-3,182,22);
  doc.setTextColor(45,55,72);doc.setFont('helvetica','bold');doc.setFontSize(10);
  doc.text('Dirección: ',16,y+2);doc.setFont('helvetica','normal');doc.text(ins.inmueble,40,y+2);
  doc.setFont('helvetica','bold');doc.text('Fecha: ',16,y+8);doc.setFont('helvetica','normal');
  doc.text(new Date(ins.fecha).toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'}),32,y+8);
  if(ins.inspector){doc.setFont('helvetica','bold');doc.text('Inspector: ',16,y+14);doc.setFont('helvetica','normal');doc.text(ins.inspector,40,y+14);}
  if(inq){doc.setFont('helvetica','bold');doc.text('Inquilino: ',90,y+14);doc.setFont('helvetica','normal');doc.text(inq.nombre,116,y+14);}
  y+=26;
  // Calificación
  const calColor=ins.porcentaje>=80?[40,130,70]:ins.porcentaje>=60?[220,170,40]:[200,60,60];
  doc.setFillColor(...calColor);doc.rect(14,y,182,12,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(14);
  doc.text(`CALIFICACIÓN FINAL: ${(ins.score||0).toFixed(1)} / ${ins.score_max||100} (${(ins.porcentaje||0).toFixed(1)}%)`,105,y+8,'center');
  y+=18;
  // Tablas por sección
  Object.entries(INSPECCION_TEMPLATE).forEach(([catKey,cat])=>{
    if(y>250){doc.addPage();y=20;}
    // Header sección
    doc.setFillColor(91,155,213);doc.rect(14,y,182,8,'F');
    doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(10);
    let scoreCat=0,maxCat=0;
    cat.items.forEach(it=>{maxCat+=it.max;const est=ins.items?.[it.k]?.estado;if(est&&ESTADOS_INSP[est])scoreCat+=it.max*ESTADOS_INSP[est].mult;});
    doc.text(cat.nombre.toUpperCase(),16,y+5.5);
    doc.text(`${scoreCat.toFixed(1)} / ${maxCat}`,193,y+5.5,'right');
    y+=10;
    // Columnas: Item, Estado, Puntaje, Observaciones
    doc.setFillColor(240,245,250);doc.rect(14,y,182,6,'F');
    doc.setTextColor(60,70,90);doc.setFont('helvetica','bold');doc.setFontSize(8);
    doc.text('ITEM',16,y+4);doc.text('ESTADO',92,y+4);doc.text('PTS',125,y+4);doc.text('OBSERVACIONES',140,y+4);
    y+=7;
    cat.items.forEach((it,i)=>{
      if(y>280){doc.addPage();y=20;}
      doc.setFillColor(i%2===0?252:255,i%2===0?252:255,i%2===0?252:255);doc.rect(14,y-3,182,7,'F');
      doc.setTextColor(40,40,40);doc.setFont('helvetica','normal');doc.setFontSize(8.5);
      doc.text(it.n.slice(0,40),16,y+1);
      const d=ins.items?.[it.k]||{};const e=d.estado?ESTADOS_INSP[d.estado]:null;
      if(e){
        const ec=e.c==='#5CB87A'?[40,130,70]:e.c==='#E0B840'?[200,160,40]:[200,60,60];
        doc.setTextColor(...ec);doc.setFont('helvetica','bold');doc.text(e.l,92,y+1);
        doc.setTextColor(40,40,40);doc.setFont('helvetica','normal');
        doc.text(`${(it.max*e.mult).toFixed(2)}/${it.max}`,125,y+1);
      }else{
        doc.setTextColor(150,150,150);doc.text('—',92,y+1);doc.text(`0/${it.max}`,125,y+1);
      }
      if(d.observaciones){doc.setTextColor(80,80,80);doc.setFontSize(7.5);doc.text(d.observaciones.slice(0,38),140,y+1);}
      y+=7;
    });
    y+=4;
  });
  if(ins.notas){
    if(y>250){doc.addPage();y=20;}
    doc.setTextColor(45,55,72);doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text('NOTAS GENERALES',14,y);y+=5;
    doc.setTextColor(40,40,40);doc.setFontSize(10);doc.setFont('helvetica','normal');
    doc.splitTextToSize(ins.notas,180).forEach(l=>{doc.text(l,14,y);y+=5;});
  }
  if(ins.fotos?.length){
    if(y>200){doc.addPage();y=20;}
    doc.setTextColor(45,55,72);doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text('EVIDENCIA FOTOGRÁFICA',14,y);y+=6;
    const cols=2,photoW=85,photoH=64,gap=4;
    ins.fotos.forEach((p,i)=>{
      const col=i%cols;
      const x=14+col*(photoW+gap);
      if(col===0&&y+photoH>275){doc.addPage();y=20;}
      try{doc.addImage(p,'JPEG',x,y,photoW,photoH);}catch(e){}
      if(col===cols-1||i===ins.fotos.length-1)y+=photoH+gap;
    });
  }
  doc.save(`inspeccion_${ins.inmueble.replace(/\s+/g,'_')}_${ins.fecha.slice(0,10)}.pdf`);
  snack('PDF descargado');
}

// ─── RESUMEN DIARIO POR CORREO ───────────────────
function buildDailySummary(fecha){
  const d=new Date(fecha);d.setHours(0,0,0,0);
  const dNext=new Date(d.getTime()+86400000);
  const inRange=(dateStr)=>{if(!dateStr)return false;const dd=new Date(dateStr);if(isNaN(dd))return false;return dd>=d&&dd<dNext;};
  const pagos=DB.pagos.filter(p=>inCartera(p)&&p.pagado&&inRange(p.fecha_pago));
  const otros=DB.otros_ingresos.filter(o=>inCartera(o)&&inRange(o.fecha));
  const gastos=DB.gastos.filter(g=>inCartera(g)&&inRange(g.fecha));
  const incidentesNuevos=DB.incidentes.filter(i=>inCartera(i)&&inRange(i.fecha));
  const incidentesResueltos=DB.incidentes.filter(i=>inCartera(i)&&i.resuelto&&inRange(i.fecha_resolucion));
  const obras=DB.obras.filter(o=>inCartera(o)&&inRange(o.fecha));
  const inspecciones=DB.inspecciones.filter(ins=>inCartera(ins)&&inRange(ins.fecha));
  const recibosSvc=DB.recibos_servicios.filter(r=>inCartera(r)&&inRange(r.fecha));
  const pagosSvc=DB.pagos_servicios.filter(p=>inCartera(p)&&inRange(p.fecha));
  const totalCobrado=pagos.reduce((s,p)=>s+Number(p.monto||0),0);
  const totalOtros=otros.reduce((s,o)=>s+Number(o.monto||0),0);
  const totalGastos=gastos.reduce((s,g)=>s+Number(g.monto||0),0);
  const neto=totalCobrado+totalOtros-totalGastos;
  const totalActivos=DB.incidentes.filter(i=>!i.resuelto&&inCartera(i)).length;
  return{fecha:d,pagos,otros,gastos,incidentesNuevos,incidentesResueltos,obras,inspecciones,recibosSvc,pagosSvc,totalCobrado,totalOtros,totalGastos,neto,totalActivos};
}

function renderDailySummaryText(data){
  const line='━━━━━━━━━━━━━━━━━━━━━━━━━━━━';
  const dateStr=data.fecha.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  let out=`📊 RESUMEN DE OPERACIÓN\n${dateStr}\n\n${line}\n\n`;
  // Cobranza
  out+=`💰 COBRANZA DEL DÍA\n`;
  out+=`Cobrado: ${fmt(data.totalCobrado)}\n`;
  out+=`Pagos recibidos: ${data.pagos.length}\n`;
  if(data.pagos.length>0){
    out+=`\nDetalle:\n`;
    data.pagos.sort((a,b)=>new Date(a.fecha_pago)-new Date(b.fecha_pago)).forEach(p=>{
      const t=DB.inquilinos.find(i=>i.id===p.iid);
      const hora=new Date(p.fecha_pago).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
      out+=`• ${t?.nombre||'?'} — ${t?.inmueble||''}${t?.interior?' Int '+t.interior:''} — ${fmt(p.monto)} (${p.destino||'-'}, ${hora})${p.adelantado?' ✨':''}\n`;
    });
  }
  out+=`\n${line}\n\n`;
  // Gastos
  if(data.gastos.length>0){
    out+=`💸 GASTOS REGISTRADOS\n`;
    out+=`Total: ${fmt(data.totalGastos)}\n\n`;
    data.gastos.forEach(g=>{
      const cat=CATS_GASTO[g.categoria]?.n||g.categoria;
      out+=`• ${g.descripcion} — ${fmt(g.monto)} — ${cat}${g.inmueble?' — '+g.inmueble:''}\n`;
    });
    out+=`\n${line}\n\n`;
  }
  // Otros ingresos
  if(data.otros.length>0){
    out+=`💵 OTROS INGRESOS\n`;
    out+=`Total: ${fmt(data.totalOtros)}\n\n`;
    data.otros.forEach(o=>{
      const cat=CATS_OTROS_ING[o.categoria]?.n||o.categoria;
      out+=`• ${o.concepto} — ${fmt(o.monto)} — ${cat}${o.inmueble?' — '+o.inmueble:''}\n`;
    });
    out+=`\n${line}\n\n`;
  }
  // Incidentes
  if(data.incidentesNuevos.length>0||data.incidentesResueltos.length>0){
    out+=`🚨 INCIDENTES\n`;
    if(data.incidentesNuevos.length>0){
      out+=`\n${data.incidentesNuevos.length} nuevo${data.incidentesNuevos.length===1?'':'s'}:\n`;
      data.incidentesNuevos.forEach(i=>{
        const n=NIVELES_INC.find(x=>x.k===i.nivel)?.n||'-';
        out+=`• #${i.numero} — ${i.lugar}${i.depto_vacio?' (vacío)':''} — ${(i.descripcion||'').slice(0,100)} — ${n}\n`;
      });
    }
    if(data.incidentesResueltos.length>0){
      out+=`\n${data.incidentesResueltos.length} resuelto${data.incidentesResueltos.length===1?'':'s'} hoy:\n`;
      data.incidentesResueltos.forEach(i=>{
        out+=`• #${i.numero} — ${i.lugar}${i.notas_resolucion?' — '+i.notas_resolucion.slice(0,80):''}\n`;
      });
    }
    out+=`\nEstado: ${data.totalActivos} incidente${data.totalActivos===1?'':'s'} activo${data.totalActivos===1?'':'s'} en total\n\n${line}\n\n`;
  }
  // Obras
  if(data.obras.length>0){
    out+=`🔨 OBRAS DEL DÍA\n`;
    data.obras.forEach(o=>{
      const t=TIPOS_OBRA[o.tipo]?.n||o.tipo;
      out+=`• ${t} — ${o.inmueble||'?'} — ${fmt(o.costo)}${o.trabajador?' — '+o.trabajador:''}\n`;
    });
    out+=`\n${line}\n\n`;
  }
  // Inspecciones
  if(data.inspecciones.length>0){
    out+=`🏠 INSPECCIONES\n`;
    data.inspecciones.forEach(ins=>{
      out+=`• ${ins.inmueble} — ${(ins.porcentaje||0).toFixed(1)}%${ins.inspector?' — '+ins.inspector:''}\n`;
    });
    out+=`\n${line}\n\n`;
  }
  // Servicios (recibos y pagos)
  if(data.recibosSvc.length>0||data.pagosSvc.length>0){
    out+=`🔧 SERVICIOS\n`;
    if(data.recibosSvc.length>0){
      out+=`\nRecibos registrados:\n`;
      data.recibosSvc.forEach(r=>{
        const sv=DB.servicios.find(x=>x.id===r.servicioId);
        const tipo=sv?TIPOS_SVC[sv.tipo]?.n||sv.tipo:'?';
        out+=`• ${tipo} ${sv?.inmueble||''} — ${fmt(r.monto)}${r.concepto?' — '+r.concepto:''}\n`;
      });
    }
    if(data.pagosSvc.length>0){
      out+=`\nPagos realizados:\n`;
      data.pagosSvc.forEach(p=>{
        const sv=DB.servicios.find(x=>x.id===p.servicioId);
        const tipo=sv?TIPOS_SVC[sv.tipo]?.n||sv.tipo:'?';
        out+=`• ${tipo} ${sv?.inmueble||''} — ${fmt(p.monto)}${p.concepto?' — '+p.concepto:''}\n`;
      });
    }
    out+=`\n${line}\n\n`;
  }
  // Neto
  out+=`📈 NETO DEL DÍA\n`;
  out+=`Ingresos: ${fmt(data.totalCobrado+data.totalOtros)}\n`;
  out+=`Gastos: ${fmt(data.totalGastos)}\n`;
  out+=`NETO: ${fmt(data.neto)}\n`;
  out+=`\n${line}\n`;
  out+=`\nGenerado desde Gestión de Rentas\n${new Date().toLocaleString('es-MX')}`;
  return out;
}

  const totalItems=data.pagos.length+data.gastos.length+data.otros.length+data.incidentesNuevos.length+data.incidentesResueltos.length+data.obras.length+data.inspecciones.length+data.recibosSvc.length+data.pagosSvc.length;

      <label class="fl">Destinatarios (separados por coma)</label>
      <input class="fi" id="ds-emails" value="${savedEmails}" placeholder="tu@correo.com, contador@ejemplo.com">

    </div>
    <div style="display:grid;grid-template-columns:1fr ${navigator.share?'1fr':''};gap:8px">
      <button class="btn bo" onclick="copyDailySummary('${fechaStr}')">📋 Copiar</button>
      ${navigator.share?`<button class="btn bo" onclick="shareDailySummary('${fechaStr}')">📤 Compartir…</button>`:''}
    </div>
    <div style="font-size:10px;color:var(--dim);margin-top:12px;text-align:center">Correo abre tu app de correo · WhatsApp abre chat para elegir contacto · Copiar deja el texto en el portapapeles</div>

}

function sendDailyEmail(fechaStr){
  const emails=document.getElementById('ds-emails').value.trim();
  if(!emails){snack('Agrega al menos un destinatario');return;}
  localStorage.setItem('rentas_emails',emails);
  const [yy,mm,dd]=fechaStr.split('-').map(Number);
  const fecha=new Date(yy,mm-1,dd);
  const data=buildDailySummary(fecha);
  const text=renderDailySummaryText(data);
  const subject=`Resumen ${fecha.toLocaleDateString('es-MX')} — Gestión de Rentas`;
  const mailtoUrl=`mailto:${emails}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
  if(mailtoUrl.length>6000){
    if(!confirm(`El resumen es muy largo (${text.length} caracteres). Algunos correos pueden truncarlo. ¿Continuar de todos modos?\n\nAlternativa: usar "Copiar" y pegar en un correo nuevo.`))return;
  }
  window.location.href=mailtoUrl;
  snack('📧 Abriendo tu app de correo…');
}

function copyDailySummary(fechaStr){
  const [yy,mm,dd]=fechaStr.split('-').map(Number);
  const fecha=new Date(yy,mm-1,dd);
  const data=buildDailySummary(fecha);
  const text=renderDailySummaryText(data);
  navigator.clipboard.writeText(text).then(()=>{
    snack(`📋 Copiado (${text.length} caracteres) — pégalo en el correo`);
  }).catch(()=>{
    // Fallback for browsers that block clipboard
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');snack('📋 Copiado');}catch(e){snack('No se pudo copiar. Selecciona manualmente.');}
    document.body.removeChild(ta);
  });
}

async function shareDailySummary(fechaStr){
  const [yy,mm,dd]=fechaStr.split('-').map(Number);
  const fecha=new Date(yy,mm-1,dd);
  const data=buildDailySummary(fecha);
  const text=renderDailySummaryText(data);
  try{
    await navigator.share({
      title:`Resumen ${fecha.toLocaleDateString('es-MX')}`,
      text:text
    });
    snack('📤 Compartido');
  }catch(err){
    if(err.name!=='AbortError')snack('Error: '+err.message);
  }
}

function saveCartera(id){
  const nombre=document.getElementById('cart-nombre').value.trim();
  if(!nombre){snack('Falta nombre');return;}
  const obj={
    nombre,
    tipo:document.getElementById('cart-tipo').value,
    contacto:document.getElementById('cart-contacto').value.trim(),
    telefono:document.getElementById('cart-tel').value.trim(),
    correo:document.getElementById('cart-correo').value.trim(),
    fecha_inicio:document.getElementById('cart-fecha').value,
    notas:document.getElementById('cart-notas').value.trim()
  };
  if(id){
    Object.assign(DB.carteras.find(x=>x.id===id),obj);
  }else{
    const newId='cart_'+uid();
    DB.carteras.push({id:newId,...obj,creado:nowISO()});
    // Auto-activate new cartera so user can start using it
    localStorage.setItem('rentas_active_cartera',newId);
    updCartBar();
  }
  saveDB('carteras');
  closeM();snack(id?'Cartera actualizada ✓':'Cartera creada ✓ (ahora activa)');
  rerender();
}

function delCartera(id){
  if(id==='cart_familia'){snack('No puedes borrar la cartera default');return;}
  const c=DB.carteras.find(x=>x.id===id);if(!c)return;
  const nItems=['inquilinos','pagos','gastos','obras','incidentes','servicios','inmuebles','inspecciones','otros_ingresos','recibos_servicios','pagos_servicios','bitacora'].reduce((s,k)=>s+DB[k].filter(x=>x.carteraId===id).length,0);
  if(nItems>0){
    if(!confirm(`⚠️ La cartera "${c.nombre}" tiene ${nItems} registros. Al eliminar la cartera se BORRARÁN TODOS sus datos (inquilinos, pagos, gastos, obras, etc.) y esto NO se puede deshacer.\n\n¿Estás absolutamente seguro?`))return;
    if(!confirm(`Última confirmación: escribes "sí" mentalmente y borro ${nItems} registros de ${c.nombre}. ¿Proceder?`))return;
    // Delete all data
    ['inquilinos','pagos','gastos','obras','incidentes','servicios','inmuebles','inspecciones','otros_ingresos','recibos_servicios','pagos_servicios','bitacora'].forEach(k=>{
      DB[k]=DB[k].filter(x=>x.carteraId!==id);
      saveDB(k);
    });
  }else{
    if(!confirm(`¿Eliminar cartera vacía "${c.nombre}"?`))return;
  }
  DB.carteras=DB.carteras.filter(x=>x.id!==id);
  saveDB('carteras');
  // If active cartera was deleted, switch to default
  if(getActiveCarteraId()===id||!getActiveCarteraId()){
    localStorage.setItem('rentas_active_cartera','cart_familia');
    updCartBar();
  }
  closeM();snack('Cartera eliminada');
  rerender();
}

// ─── BITÁCORA DEL DÍA ────────────────────────────
function openBitacora(fechaStr){
  const fecha=fechaStr||todayISO();
  const items=DB.bitacora.filter(b=>b.fecha===fecha&&inCartera(b)).sort((a,b)=>{
    if(a.hora&&!b.hora)return -1;
    if(!a.hora&&b.hora)return 1;
    if(a.hora&&b.hora)return a.hora.localeCompare(b.hora);
    return (a.creado||'').localeCompare(b.creado||'');
  });
  const programados=items.filter(x=>x.hora);
  const pendientes=items.filter(x=>!x.hora);
  const [yy,mm,dd]=fecha.split('-').map(Number);
  const d=new Date(yy,mm-1,dd);
  const dateStr=d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
  const props=[...new Set(DB.inquilinos.map(i=>i.inmueble))].filter(Boolean).sort();

  const bitItemHTML=(b)=>`<div class="bit-item ${b.hecho?'done':''}">
    <div class="bit-check ${b.hecho?'done':''}" onclick="toggleBitacoraHecho('${b.id}')">${b.hecho?'✓':''}</div>
    ${b.hora?`<div class="bit-hora">${b.hora}</div>`:''}
    <div style="flex:1;min-width:0;cursor:pointer" onclick="openBitacoraItem('${b.id}')">
      <div class="bit-titulo" style="font-size:13px;font-weight:600">${b.titulo}</div>
      ${b.inmueble?`<div style="font-size:10px;color:var(--gold);margin-top:2px">🏢 ${b.inmueble}</div>`:''}
      ${b.notas?`<div style="font-size:11px;color:var(--dim);margin-top:2px">${b.notas.slice(0,120)}${b.notas.length>120?'...':''}</div>`:''}
      ${b.hecho&&b.fecha_hecho?`<div style="font-size:9px;color:var(--g);margin-top:2px">✓ Hecho ${new Date(b.fecha_hecho).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</div>`:''}
    </div>
  </div>`;

  modal(`<div class="ms" style="max-height:96vh"><div class="mh"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div><div class="mt2" style="margin:0">📅 Bitácora</div>
      <div style="font-size:11px;color:var(--dim);margin-top:2px">${dateStr}</div></div>
    </div>
    <div class="fg" style="margin-bottom:12px">
      <input class="fi" type="date" id="bit-fecha" value="${fecha}" onchange="openBitacora(this.value)">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
      <button class="btn bo" onclick="openBitacoraItem(null,'pendiente','${fecha}')">☐ + Pendiente</button>
      <button class="btn bs" onclick="openBitacoraItem(null,'programado','${fecha}')">⏰ + Programado</button>
    </div>
    ${programados.length>0?`<div class="st-sm">⏰ Programados (${programados.length})</div>
    ${programados.map(bitItemHTML).join('')}`:''}
    ${pendientes.length>0?`<div class="st-sm" style="margin-top:14px">☐ Pendientes (${pendientes.length})</div>
    ${pendientes.map(bitItemHTML).join('')}`:''}
    ${items.length===0?`<div class="es"><div class="ei">📅</div><div class="et">Sin items para este día<br><br>Agrega pendientes o cosas programadas.</div></div>`:''}
    <div style="height:20px"></div>
  </div>`);
}

  const isPend=!b.hora;
  const props=[...new Set(DB.inquilinos.map(i=>i.inmueble))].filter(Boolean).sort();
  modal(`<div class="ms"><div class="mh"></div>

function saveBitacoraItem(id){
  const titulo=document.getElementById('bit-titulo').value.trim();
  const fecha=document.getElementById('bit-fecha-e').value;
  if(!titulo||!fecha){snack('Título y fecha requeridos');return;}
  const obj={
    titulo,fecha,
    hora:document.getElementById('bit-hora').value||'',
    inmueble:document.getElementById('bit-inmueble').value.trim(),
    notas:document.getElementById('bit-notas').value.trim()
  };
  if(id){Object.assign(DB.bitacora.find(x=>x.id===id),obj);}
  else{DB.bitacora.push({id:uid(),...obj,hecho:false,creado:nowISO()});}
  saveDB('bitacora');
  closeM();snack(id?'Actualizado ✓':'Agregado a la bitácora ✓');
  openBitacora(fecha);
}

function toggleBitacoraHecho(id){
  const b=DB.bitacora.find(x=>x.id===id);if(!b)return;
  b.hecho=!b.hecho;
  b.fecha_hecho=b.hecho?nowISO():null;
  saveDB('bitacora');
  openBitacora(b.fecha);
  if(b.hecho)snack('✓ Marcado como hecho');
}

function delBitacoraItem(id){
  const b=DB.bitacora.find(x=>x.id===id);if(!b)return;
  if(!confirm('¿Eliminar de la bitácora?'))return;
  const fecha=b.fecha;
  DB.bitacora=DB.bitacora.filter(x=>x.id!==id);
  saveDB('bitacora');closeM();snack('Eliminado');
  openBitacora(fecha);
}

function getBitacoraHoyResumen(){
  const hoy=todayISO();
  const items=DB.bitacora.filter(b=>b.fecha===hoy&&inCartera(b));
  const pendActivos=items.filter(x=>!x.hora&&!x.hecho);
  const progActivos=items.filter(x=>x.hora&&!x.hecho).sort((a,b)=>a.hora.localeCompare(b.hora));
  const hechos=items.filter(x=>x.hecho).length;
  return{items,pendActivos,progActivos,hechos};
}

const CAT_KEYWORDS={
  carros:['gasolina','autopista','llanta','aceite','servicio auto','estacionamiento','uber','taxi','peaje','gomas','pemex'],
  mantenimiento:['pintura','cemento','cal','yeso','pegazulejo','impermeabilizante','plomería','tornillo','clavo','tabla','madera','vidrio','cerradura','tapa','regadera','contacto','apagador','foco','pila','llave','tubería','manguera','vinilica','esmalte','material','ferretería'],
  mano_obra:['freddy','albañil','plomero','electricista','pintor','jornal','peón','oficial','ayudante','mano de obra'],
  servicios:['agua','luz','cfe','predial','gas','internet','teléfono','wifi','izzi','totalplay','sacmex','tv','naturgy'],
  otros:[]
};

function inferCategoryFromDesc(desc){
  if(!desc||desc.length<3)return;
  const d=desc.toLowerCase();
  for(const [cat,keywords] of Object.entries(CAT_KEYWORDS)){
    if(keywords.some(k=>d.includes(k))){
      const inp=document.getElementById('g-cat');
      if(inp&&inp.value!==cat){selectCat(cat);snack('Categoría auto: '+(CATS_GASTO[cat]?.n||cat),1500);}
      return;
    }
  }
}

function selectCat(cat){
  const inp=document.getElementById('g-cat');if(!inp)return;
  inp.value=cat;
  document.querySelectorAll('#cat-chips .cat-chip').forEach(el=>{
    const c=CATS_GASTO[el.dataset.cat];
    if(el.dataset.cat===cat){el.classList.add('on');el.style.borderColor=c.c;el.style.background=c.c+'22';}
    else{el.classList.remove('on');el.style.borderColor='#333';el.style.background='';}
  });
}

function selectInmChip(inm){
  const inp=document.getElementById('g-inm')||document.getElementById('oi-inm');
  if(inp)inp.value=inm;
}

// WhatsApp summary
function renderDailySummaryWA(data){
  const dateStr=data.fecha.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  let out=`*📊 Resumen del día*\n_${dateStr}_\n\n`;
  out+=`*💰 Cobranza*\n`;
  out+=`Total: ${fmt(data.totalCobrado)} (${data.pagos.length} pagos)\n`;
  if(data.pagos.length>0&&data.pagos.length<=15){
    data.pagos.sort((a,b)=>new Date(a.fecha_pago)-new Date(b.fecha_pago)).forEach(p=>{
      const t=DB.inquilinos.find(i=>i.id===p.iid);
      out+=`• ${t?.nombre||'?'} — ${fmt(p.monto)}${p.adelantado?' ✨':''}\n`;
    });
  }else if(data.pagos.length>15){
    out+=`(detalle completo en el correo/app)\n`;
  }
  if(data.gastos.length>0){
    out+=`\n*💸 Gastos*\nTotal: ${fmt(data.totalGastos)}\n`;
    data.gastos.slice(0,10).forEach(g=>{out+=`• ${g.descripcion} — ${fmt(g.monto)}\n`;});
    if(data.gastos.length>10)out+=`(+${data.gastos.length-10} más)\n`;
  }
  if(data.otros.length>0){
    out+=`\n*💵 Otros ingresos*\nTotal: ${fmt(data.totalOtros)}\n`;
    data.otros.forEach(o=>out+=`• ${o.concepto} — ${fmt(o.monto)}\n`);
  }
  if(data.incidentesNuevos.length>0||data.incidentesResueltos.length>0){
    out+=`\n*🚨 Incidentes*\n`;
    if(data.incidentesNuevos.length>0){
      out+=`${data.incidentesNuevos.length} nuevo${data.incidentesNuevos.length===1?'':'s'}: `;
      out+=data.incidentesNuevos.map(i=>`#${i.numero} ${i.lugar}`).join(', ')+'\n';
    }
    if(data.incidentesResueltos.length>0){
      out+=`${data.incidentesResueltos.length} resuelto${data.incidentesResueltos.length===1?'':'s'} hoy\n`;
    }
    out+=`_${data.totalActivos} activos en total_\n`;
  }
  if(data.obras.length>0){
    out+=`\n*🔨 Obras* (${data.obras.length})\n`;
    data.obras.forEach(o=>out+=`• ${o.inmueble||'?'} — ${fmt(o.costo)}\n`);
  }
  if(data.inspecciones.length>0){
    out+=`\n*🏠 Inspecciones*\n`;
    data.inspecciones.forEach(ins=>out+=`• ${ins.inmueble} — ${(ins.porcentaje||0).toFixed(0)}%\n`);
  }
  out+=`\n*📈 Neto: ${fmt(data.neto)}*\n`;
  out+=`_Enviado desde Gestión de Rentas_`;
  return out;
}

function importJSON(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{const d=JSON.parse(ev.target.result);
        if(!confirm(`¿Reemplazar datos actuales?\nInquilinos: ${d.inquilinos?.length||0}\nPagos: ${d.pagos?.length||0}\nGastos: ${d.gastos?.length||0}\nObras: ${d.obras?.length||0}\nIncidentes: ${d.incidentes?.length||0}\nInspecciones: ${d.inspecciones?.length||0}`))return;
        ['inquilinos','pagos','servicios','gastos','obras','incidentes','otros_ingresos','inmuebles','inspecciones','recibos_servicios','pagos_servicios','bitacora'].forEach(k=>{if(d[k])DB[k]=d[k];saveDB(k);});
        snack('✓ Importado');renderRep();
      }catch(err){snack('Error: '+err.message)}
    };r.readAsText(f);
  };inp.click();
}

// ─── PDF GENERATION ──────────────────────────────
function pdfBase(titulo,subtitulo){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  // Línea azul superior
  doc.setFillColor(91,155,213);doc.rect(0,0,210,1.5,'F');
  // Título en gris oscuro sobre blanco (imprime perfecto)
  doc.setTextColor(45,55,72);doc.setFontSize(20);doc.setFont('helvetica','bold');
  doc.text('GESTIÓN DE RENTAS',14,15);
  // Subtítulo en gris medio
  doc.setTextColor(110,118,135);doc.setFontSize(10);doc.setFont('helvetica','normal');
  doc.text(titulo,14,22);
  if(subtitulo){doc.setFontSize(9);doc.text(subtitulo,14,27);}
  doc.setFontSize(8);doc.setTextColor(150,150,150);
  doc.text('Generado: '+new Date().toLocaleString('es-MX'),14,subtitulo?32:28);
  // Línea separadora gris claro
  doc.setDrawColor(220,225,235);doc.setLineWidth(0.3);
  doc.line(14,subtitulo?35:32,196,subtitulo?35:32);
  return doc;
}

function genPDFTenant(id){
  const t=DB.inquilinos.find(i=>i.id===id);if(!t)return;
  const doc=pdfBase('HISTORIAL DE INQUILINO');
  doc.setTextColor(45,55,72);doc.setFontSize(13);doc.setFont('helvetica','bold');
  doc.text(t.nombre.toUpperCase(),14,50);
  doc.setTextColor(80,80,80);doc.setFontSize(9);doc.setFont('helvetica','normal');
  doc.text(t.inmueble+(t.interior?' · INT '+t.interior:''),14,57);
  doc.setDrawColor(200,210,225);doc.setLineWidth(0.3);doc.line(14,60,196,60);
  let y=68;
  const info=[['Renta mensual',fmt(t.renta)],['Día de pago','Día '+t.dia],['Destino',t.destino||'—'],['Servicios',t.servicios||'—'],['Estatus',t.estatus||'—'],['Renovación',t.renovacion||'—'],['Contrato vigente',t.contrato_vigente||'—'],['Comentarios',t.comentarios||'—']];
  info.forEach(([k,v])=>{doc.setFillColor(248,248,248);doc.rect(14,y-4,182,7,'F');
    doc.setFont('helvetica','bold');doc.setTextColor(60,60,60);doc.text(k+':',16,y);
    doc.setFont('helvetica','normal');doc.setTextColor(40,40,40);doc.text(String(v).slice(0,80),65,y);y+=7;});
  y+=4;
  doc.setFillColor(91,155,213);doc.rect(14,y,182,8,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(9);
  doc.text('MES / AÑO',16,y+5.5);doc.text('FECHA Y HORA DE PAGO',75,y+5.5);doc.text('MONTO',183,y+5.5,'right');
  y+=10;
  const pagos=DB.pagos.filter(p=>p.iid===id&&p.pagado).sort((a,b)=>b.anio-a.anio||b.mes-a.mes);
  let total=0;
  pagos.forEach((p,i)=>{
    if(y>275){doc.addPage();y=20;}
    doc.setFillColor(i%2===0?248:255,i%2===0?248:255,i%2===0?248:255);doc.rect(14,y-4,182,8,'F');
    doc.setTextColor(40,40,40);doc.setFont('helvetica','normal');doc.setFontSize(9);
    doc.text(MF[p.mes-1]+' '+p.anio,16,y);
    const fp=p.fecha_pago?new Date(p.fecha_pago).toLocaleString('es-MX'):'—';
    doc.text(fp,75,y);
    doc.setFont('helvetica','bold');doc.setTextColor(40,130,70);
    doc.text(fmt(p.monto),183,y,'right');total+=Number(p.monto);y+=8;
  });
  if(!pagos.length){doc.setTextColor(130,130,130);doc.setFont('helvetica','italic');doc.text('Sin pagos registrados',16,y);}
  y+=6;doc.setDrawColor(200,210,225);doc.setLineWidth(0.3);doc.line(14,y,196,y);y+=7;
  doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(40,40,40);
  doc.text('TOTAL COBRADO:',14,y);doc.setTextColor(40,130,70);doc.text(fmt(total),183,y,'right');
  doc.save('historial_'+t.nombre.replace(/\s+/g,'_')+'.pdf');snack('PDF descargado');
}
